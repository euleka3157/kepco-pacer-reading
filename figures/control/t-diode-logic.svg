<polyline points="780,330 780.0,350.0 770.0,357.5 790.0,365.0 770.0,372.5 790.0,380.0 770.0,387.5 790.0,395.0 770.0,402.5 780.0,410.0 780,430" stroke="#25344A" stroke-width="3" fill="none"/>
