<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
<rect width="100%" height="100%" fill="white"/>
<text x="28" y="38" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="25" fill="#25344A" text-anchor="start" font-weight="700">다이오드 논리: AND는 당겨 올리고 OR는 당겨 내린다</text>
<text x="240" y="100" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#2563EB" text-anchor="middle" font-weight="400">AND: X=A·B</text>
