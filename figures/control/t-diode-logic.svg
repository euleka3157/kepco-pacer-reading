<line x1="775.0" y1="458" x2="785.0" y2="458" stroke="#25344A" stroke-width="3"/>
<text x="40" y="515" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" fill="#25344A" text-anchor="start" font-weight="400">AND: 하나라도 0 → 다이오드 도통, X를 낮춤</text>
<text x="40" y="555" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" fill="#25344A" text-anchor="start" font-weight="400">OR: 하나라도 1 → 다이오드 도통, X를 높임 (이상 다이오드·양논리)</text>
</svg>