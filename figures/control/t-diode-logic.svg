<text x="440" y="260" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" fill="#2563EB" text-anchor="start" font-weight="400">X</text>
<text x="310" y="140" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" fill="#25344A" text-anchor="middle" font-weight="400">+V</text>
<polyline points="310,155 310.0,170.0 300.0,175.625 320.0,181.25 300.0,186.875 320.0,192.5 300.0,198.125 320.0,203.75 300.0,209.375 310.0,215.0 310,230" stroke="#25344A" stroke-width="3" fill="none"/>
