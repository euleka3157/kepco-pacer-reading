<text x="40" y="535" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" fill="#25344A" text-anchor="start" font-weight="400">a/b는 전원 OFF·비동작 상태를 기준으로 표시한다.</text>
<text x="40" y="575" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" fill="#25344A" text-anchor="start" font-weight="400">코일 이름과 같은 보조접점은 그 코일이 여자되면 함께 전환된다.</text>
