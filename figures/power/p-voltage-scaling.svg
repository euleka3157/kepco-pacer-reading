<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">전압을 n배로 높이면 무엇이 바뀌나</text>
<rect x="35.0" y="135" width="200.0" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="135.0" y="184.6" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#2563EB" text-anchor="middle" font-weight="700">같은 P·역률</text>
<rect x="265.0" y="135" width="200.0" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="365.0" y="184.6" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#2563EB" text-anchor="middle" font-weight="700">V → nV</text>
<line x1="237.0" y1="178" x2="262.0" y2="178" stroke="#2563EB" stroke-width="3"/>
<polygon points="262.0,178 251.19463477176788,183.21958640933477 251.19463477176788,172.78041359066523" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<rect x="495.0" y="135" width="200.0" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="595.0" y="184.6" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#2563EB" text-anchor="middle" font-weight="700">I → I/n</text>
<line x1="467.0" y1="178" x2="492.0" y2="178" stroke="#2563EB" stroke-width="3"/>
<polygon points="492.0,178 481.1946347717679,183.21958640933477 481.1946347717679,172.78041359066523" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<rect x="725.0" y="135" width="200.0" height="86" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="825.0" y="184.6" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#2563EB" text-anchor="middle" font-weight="700">I²R → 1/n²</text>
<line x1="697.0" y1="178" x2="722.0" y2="178" stroke="#2563EB" stroke-width="3"/>
<polygon points="722.0,178 711.1946347717678,183.21958640933477 711.1946347717678,172.78041359066523" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<text x="480" y="310" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#2563EB" text-anchor="middle" font-weight="400">같은 전선 저항 R에서 손실 비교</text>
<text x="480" y="370" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" fill="#25344A" text-anchor="middle" font-weight="400">같은 허용 손실로 전선 굵기를 바꾸는 비교와는 조건이 다르다</text>
</svg>