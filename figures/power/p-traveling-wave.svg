<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="38" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">선로 접속점에서 전압파의 반사와 투과</text>
<line x1="45" y1="235" x2="915" y2="235" stroke="#25344A" stroke-width="4"/>
