<text x="480" y="460" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" fill="#25344A" text-anchor="middle" font-weight="400">전압 반사계수 Γ = (Z2 - Z1)/(Z2 + Z1) · Vt = Vi + Vr</text>
