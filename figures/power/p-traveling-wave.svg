<text x="270" y="175" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="400">입사 Vi</text>
<line x1="440" y1="300" x2="120" y2="300" stroke="#DC2626" stroke-width="4"/>
<polygon points="120,300 130.80536522823212,294.78041359066526 130.80536522823212,305.21958640933474" stroke="#DC2626" stroke-width="1" fill="#DC2626"/>
