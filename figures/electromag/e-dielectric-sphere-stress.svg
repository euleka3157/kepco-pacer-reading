<text x="550" y="400" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">경계에서 Et·Dn 조건 적용</text>
<text x="70" y="460" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">균일 외부장 속 구의 내부 전계는 균일하지만 외부장과 크기가 다르다.</text>
<text x="70" y="495" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">경계 응력은 법선·접선 성분을 나누어 계산한다. 높은 유전율 쪽이 끌려 들어가는 구성을 구별한다.</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">구의 비율은 개념도다. 원형 단면의 내부장이 고르다는 결과는 구형·선형·균일 매질 조건에 </text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">한한다.</text>
