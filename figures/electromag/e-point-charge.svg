<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">전계는 벡터, 전위는 스칼라다. 음전하의 전기력은 전계와 반대이며 전위차가 운동에너지로 </text>
