<text x="335" y="125" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">10 V</text>
<line x1="100" y1="240" x2="375" y2="240" stroke="#DC2626" stroke-width="3"/>
<polygon points="375,240 364.1946347717679,245.21958640933477 364.1946347717679,234.78041359066523" stroke="#DC2626" stroke-width="1" fill="#DC2626"/>
<text x="185" y="220" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">E</text>
<text x="58" y="435" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">등전위선과 전계는 수직</text>
<text x="65" y="470" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">E = -dV/dx</text>
<line x1="580" y1="260" x2="860" y2="260" stroke="#64748B" stroke-width="3"/>
<line x1="720" y1="120" x2="720" y2="400" stroke="#64748B" stroke-width="3"/>
