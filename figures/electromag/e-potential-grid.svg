<text x="75" y="125" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">30 V</text>
<line x1="230" y1="140" x2="230" y2="365" stroke="#0D9488" stroke-width="3"/>
<text x="205" y="125" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">20 V</text>
