<text x="695" y="100" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V위</text>
<circle cx="720" cy="400" r="8" fill="#0D9488" stroke="#0D9488" stroke-width="3"/>
<text x="695" y="380" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V아래</text>
<circle cx="580" cy="260" r="8" fill="#0D9488" stroke="#0D9488" stroke-width="3"/>
<text x="555" y="240" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V왼</text>
<circle cx="860" cy="260" r="8" fill="#0D9488" stroke="#0D9488" stroke-width="3"/>
<text x="835" y="240" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V오른</text>
<circle cx="720" cy="260" r="16" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="660" y="315" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V중앙 ≈ 네 값 평균</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">오른쪽 평균식은 전하가 없는 영역의 균일 격자 라플라스 근사다. 전계 0이라도 전위는 0이 </text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">아닐 수 있다.</text>
