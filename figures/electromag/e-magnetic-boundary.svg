<text x="470" y="165" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">법선 n</text>
<line x1="570" y1="245" x2="800" y2="245" stroke="#2563EB" stroke-width="3"/>
