<text x="555" y="110" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">충전 중인 콘덴서</text>
<text x="655" y="425" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">Jd = ∂D/∂t</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">유전체 틈을 자유전자가 건너야만 전류 연속성이 성립하는 것은 아니다. 변위전류는 변하는 </text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">장을 나타낸다.</text>
