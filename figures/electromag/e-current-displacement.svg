<text x="55" y="400" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">J = σE,  이동속도는 드리프트</text>
<text x="55" y="440" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">전하 축적 = 들어옴 - 나감</text>
