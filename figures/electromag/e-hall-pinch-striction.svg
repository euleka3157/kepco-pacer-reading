<text x="680" y="445" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">자화에 따른 길이 변화</text>
<text x="680" y="480" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">재료·자화 상태에 의존</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">핀치 그림의 양옆 화살표는 압축력이다. 홀 전압의 위·아래 부호는 특정 운반자 모형의 예이</text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">며 보편 고정값이 아니다.</text>
