<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="34" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">동심 도체 구: a, b, c와 네 구간의 전위</text>
<circle cx="270" cy="280" r="175" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
<circle cx="270" cy="280" r="120" fill="white" stroke="#64748B" stroke-width="3"/>
<circle cx="270" cy="280" r="55" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<circle cx="270" cy="280" r="5" fill="#25344A" stroke="#25344A" stroke-width="1"/>
<text x="270" y="266" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">O</text>
<line x1="270" y1="280" x2="325" y2="280" stroke="#DC2626" stroke-width="3"/>
<polygon points="325,280 314.1946347717679,285.21958640933474 314.1946347717679,274.78041359066526" stroke="#DC2626" stroke-width="1" fill="#DC2626"/>
<line x1="270" y1="280" x2="270" y2="160" stroke="#2563EB" stroke-width="3"/>
<polygon points="270,160 275.21958640933474,170.80536522823212 264.78041359066526,170.80536522823212" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<line x1="270" y1="280" x2="145" y2="157" stroke="#0D9488" stroke-width="3"/>
<polygon points="145,157 156.36283523677102,160.85823474946702 149.04099254807664,168.29913179082308" stroke="#0D9488" stroke-width="1" fill="#0D9488"/>
<text x="290" y="265" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">a</text>
<text x="280" y="205" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">b</text>
<text x="165" y="190" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">c</text>
<text x="75" y="85" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">중심 구 +Q, 바깥 도체는 총전하 0</text>
<text x="510" y="135" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">r&lt;a: 내부 금속, E=0</text>
<text x="510" y="205" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">a&lt;r&lt;b: 유전체, E∝1/r²</text>
<text x="510" y="275" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">b&lt;r&lt;c: 바깥 금속, E=0</text>
<text x="510" y="345" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">r&gt;c: 총전하 +Q의 외부장</text>
<text x="510" y="440" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">안쪽 표면 -Q / 바깥 표면 +Q</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">바깥 도체를 접지하면 전하와 외부 전계 조건이 달라진다. 두 경우를 같은 공식으로 처리하</text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">지 않는다.</text>
</svg>