<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="34" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">원통형 전하와 동축 구조: 반지름을 어디서 재는가</text>
<line x1="480" y1="60" x2="480" y2="470" stroke="#CBD5E1" stroke-width="1"/>
<circle cx="225" cy="255" r="100" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
