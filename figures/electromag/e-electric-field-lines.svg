<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">선은 전하의 실제 이동 궤적이 아니다. 정전계의 힘선은 교차하지 않으며 도체 표면에는 수</text>
