<line x1="140" y1="270" x2="325" y2="270" stroke="#7C3AED" stroke-width="3"/>
<polygon points="325,270 314.1946347717679,275.21958640933474 314.1946347717679,264.78041359066526" stroke="#7C3AED" stroke-width="1" fill="#7C3AED"/>
<text x="65" y="420" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">바깥 N→S / 자석 내부 S→N</text>
<text x="60" y="455" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">B는 닫힘: 단독 자기 단극자 없음</text>
<circle cx="620" cy="260" r="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
<text x="620" y="268" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" fill="#2563EB" text-anchor="middle" font-weight="700">-</text>
<circle cx="825" cy="260" r="20" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>
<text x="825" y="268" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" fill="#DC2626" text-anchor="middle" font-weight="700">+</text>
<line x1="645" y1="260" x2="800" y2="260" stroke="#7C3AED" stroke-width="3"/>
<polygon points="800,260 789.1946347717678,265.21958640933474 789.1946347717678,254.78041359066523" stroke="#7C3AED" stroke-width="1" fill="#7C3AED"/>
<text x="660" y="240" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">자기모멘트</text>
<text x="550" y="110" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">가상 자극 모형: 자석을 두 극으로</text>
<text x="550" y="420" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">자위·자극 힘의 계산 모형</text>
<text x="550" y="455" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">실제 고립 단극자의 존재 주장이 아님</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">자극 모형의 단위 관례와 전류고리의 자기모멘트 m[A·m²]를 구분한다.</text>
