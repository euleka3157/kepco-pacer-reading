<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="34" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">자극의 모형과 실제 자기력선의 닫힌 경로</text>
<line x1="480" y1="60" x2="480" y2="470" stroke="#CBD5E1" stroke-width="1"/>
<rect x="100" y="225" width="135" height="90" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="235" y="225" width="135" height="90" rx="0" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
