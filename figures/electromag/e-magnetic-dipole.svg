<text x="290" y="280" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" fill="#DC2626" text-anchor="start" font-weight="400">N</text>
<path d="M 340 225 C 420 130 45 130 130 225" stroke="#2563EB" stroke-width="3" fill="none"/>
<line x1="250" y1="153.75" x2="210" y2="153.75" stroke="#2563EB" stroke-width="2"/>
<polygon points="210,153.75 220.80536522823212,148.53041359066523 220.80536522823212,158.96958640933477" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<path d="M 340 225 C 420 85 45 85 130 225" stroke="#2563EB" stroke-width="3" fill="none"/>
<line x1="250" y1="120.0" x2="210" y2="120.0" stroke="#2563EB" stroke-width="2"/>
