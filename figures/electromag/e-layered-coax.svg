<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="34" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">다층 동축: 로그 전압강하를 구간마다 더한다</text>
<circle cx="300" cy="290" r="185" fill="#E2E8F0" stroke="#64748B" stroke-width="3"/>
<circle cx="300" cy="290" r="160" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/>
<circle cx="300" cy="290" r="105" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
<circle cx="300" cy="290" r="45" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
<line x1="300" y1="290" x2="345" y2="290" stroke="#DC2626" stroke-width="3"/>
<polygon points="345,290 334.1946347717679,295.21958640933474 334.1946347717679,284.78041359066526" stroke="#DC2626" stroke-width="1" fill="#DC2626"/>
<line x1="300" y1="290" x2="300" y2="185" stroke="#2563EB" stroke-width="3"/>
<polygon points="300,185 305.21958640933474,195.80536522823212 294.78041359066526,195.80536522823212" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
<line x1="300" y1="290" x2="187" y2="177" stroke="#15803D" stroke-width="3"/>
<polygon points="187,177 198.33135197111002,180.94974208105052 190.94974208105052,188.33135197111002" stroke="#15803D" stroke-width="1" fill="#15803D"/>
<text x="315" y="275" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">a</text>
<text x="315" y="210" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">b</text>
<text x="195" y="165" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">c</text>
<text x="360" y="265" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">ε1</text>
<text x="420" y="335" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">ε2</text>
<text x="560" y="155" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">a&lt;r&lt;b: 첫 유전체 ε1</text>
<text x="560" y="225" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">b&lt;r&lt;c: 둘째 유전체 ε2</text>
<text x="560" y="295" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">D(r)=λ/(2πr)</text>
<text x="560" y="365" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">V = Vab + Vbc</text>
<text x="560" y="435" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">층마다 E=D/ε를 적분</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">c는 바깥 도체의 안쪽 반지름이다. 같은 r=b에서 D는 연속이지만 ε가 다르면 E는 점프한다.</text>
</svg>