<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="34" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#25344A" text-anchor="start" font-weight="700">벡터의 합 · 내적 · 외적</text>
<line x1="55" y1="320" x2="225" y2="320" stroke="#2563EB" stroke-width="3"/>
<polygon points="225,320 214.19463477176788,325.21958640933474 214.19463477176788,314.78041359066526" stroke="#2563EB" stroke-width="1" fill="#2563EB"/>
