<text x="60" y="100" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">머리와 꼬리를 잇는 합</text>
<line x1="375" y1="320" x2="590" y2="320" stroke="#2563EB" stroke-width="3"/>
