<circle cx="710" cy="320" r="4" fill="#7C3AED" stroke="#7C3AED" stroke-width="3"/>
<text x="685" y="100" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">외적: 면의 법선</text>
<text x="700" y="365" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">A×B: 종이 밖 ⊙</text>
<text x="700" y="405" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">B×A: 종이 안 ⊗</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">외적은 오른손 순서 A→B로 정한다. 크기는 두 벡터가 만드는 평행사변형의 넓이다.</text>
