<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">실수 ε,σ의 단순 손실매질에서 전도는 E와 동상, 변위는 90° 앞선다. 복소 유전율의 손실 </text>
