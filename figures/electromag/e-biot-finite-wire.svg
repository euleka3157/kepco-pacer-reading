<text x="540" y="470" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#25344A" text-anchor="start" font-weight="400">H=I(sinβ1+sinβ2)/(4πa)</text>
<text x="30" y="565" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400">β1·β2는 수선에서 양 끝으로 향하는 선까지의 각이다. 관측점이 선분 사이 높이에 있을 때</text>
<text x="30" y="593" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" fill="#64748B" text-anchor="start" font-weight="400"> 표시한 양의 합을 쓴다.</text>
