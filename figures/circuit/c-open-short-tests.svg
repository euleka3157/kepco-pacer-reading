<text x="105" y="505" font-family="Noto, Noto Sans KR, Malgun Gothic, sans-serif" font-size="22" fill="#25344A" text-anchor="start" font-weight="400">반대쪽 시험은 포트 1·2를 교환 → 나머지 Z/Y 정수</text>
