<head>

<title>계측 페이서 리딩</title>

<style>
/* Layout: one-screen reader — book tabs on top, section index left, reading column center, control dock bottom (thumb zone). */
:root {
  --paper: #F3F5F7;
  --card: #FFFFFF;
  --ink: #18212B;
  --sub: #5A6676;
  --line: #DCE2E9;
  --marker: #FFD93D;
  --marker-ink: #18212B;
  --core: #FFF0A6;
  --trap-bg: #FDECEF;
  --trap-ink: #B4234A;
  --ex-bg: #ECF8F0;
  --ex-ink: #157A3E;
  --chk-bg: #F1EEFD;
  --chk-ink: #6B3FD8;
  --acc: #2563EB;
  --acc-soft: rgba(37, 99, 235, .14);
  --marker-soft: #FFF4C2;
  --dock-h: auto;
  --f-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --fs: 21px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161C; --card: #19212A; --ink: #E5EAF0; --sub: #94A1B0; --line: #29323D;
    --marker: #FFD43B; --marker-ink: #11161C; --core: rgba(255, 212, 59, .20); --marker-soft: #3A3420;
    --trap-bg: #2B1820; --trap-ink: #FF8EA6; --ex-bg: #14261C; --ex-ink: #6FDB98;
    --chk-bg: #211B35; --chk-ink: #B9A2FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161C; --card: #19212A; --ink: #E5EAF0; --sub: #94A1B0; --line: #29323D;
  --marker: #FFD43B; --marker-ink: #11161C; --core: rgba(255, 212, 59, .20); --marker-soft: #3A3420;
  --trap-bg: #2B1820; --trap-ink: #FF8EA6; --ex-bg: #14261C; --ex-ink: #6FDB98;
  --chk-bg: #211B35; --chk-ink: #B9A2FF; color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, .w, .mathbox, .toc, .books { touch-action: manipulation; }
.top, .dock, .toc { -webkit-user-select: none; user-select: none; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body);
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

/* top bar */
.top { flex: none; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding: 10px var(--gut-r) 10px var(--gut-l); }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font: 500 11px var(--f-mono); color: var(--sub); letter-spacing: .04em; }
.books { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.books::-webkit-scrollbar { display: none; }
.bk {
  flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 22px; background: transparent; cursor: pointer; font-size: 14px;
}
.bk b { font: 600 13px var(--f-mono); color: var(--bk); }
.bk[aria-pressed="true"] { background: var(--bk); border-color: var(--bk); color: #fff; }
.bk[aria-pressed="true"] b { color: #fff; }
.pdf-link { flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 14px; }
.toc-btn { display: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; }

/* shell */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); }
.toc { overflow-y: auto; border-right: 1px solid var(--line); background: var(--card); padding: 12px 10px 24px 16px; }
.toc h3 { margin: 4px 6px 10px; font: 600 11px var(--f-mono); letter-spacing: .08em; color: var(--sub); text-transform: uppercase; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 3.1em 1fr; gap: 6px; align-items: start;
  padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13.5px; line-height: 1.4;
}
.toc button span:first-child { font: 600 12px/1.6 var(--f-mono); color: var(--acc); }
.toc button.b span:last-child { color: var(--sub); }
.toc button.cur { background: var(--acc-soft); }
.scroller { overflow-y: auto; min-width: 0; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } .w { transition: none !important; } }

/* reading column */
#reader {
  max-width: 40em; margin: 0 auto; padding: 28px var(--gut-r) 45vh var(--gut-l);
  font-size: var(--fs); line-height: 1.85; word-break: keep-all; overflow-wrap: anywhere;
}
.book-head { margin-bottom: 8px; }
.book-head .eyebrow { font: 600 12px var(--f-mono); letter-spacing: .08em; color: var(--acc); }
.book-head h1 { margin: 4px 0 6px; font-size: 1.55em; line-height: 1.25; letter-spacing: -.02em; text-wrap: balance; }
.book-head p { margin: 0; font-size: .72em; color: var(--sub); line-height: 1.6; }
.sec { padding-top: 1.6em; margin-top: 1.4em; border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: .2em; }
.sid { font: 600 .62em var(--f-mono); color: #fff; background: var(--acc); padding: .18em .55em; border-radius: 6px; }
.pr { font-size: .58em; font-weight: 700; padding: .2em .6em; border-radius: 99px; }
.pr-A { color: #fff; background: #D6334A; }
.pr-B { color: var(--sub); border: 1px solid var(--line); }
.meta { font: 500 .56em var(--f-mono); color: var(--sub); }
.sec-title { width: 100%; margin: .15em 0 .5em; font-size: 1.12em; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance; }
.para { margin: 0 0 .9em; }
.sent.core { background: linear-gradient(transparent 60%, var(--core) 60%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.star { font-size: .62em; font-weight: 700; color: #C2410C; margin-right: .35em; vertical-align: .15em; }
.w { border-radius: .22em; transition: background-color .14s ease, color .14s ease, opacity .25s; cursor: pointer; }
.w.on { background: var(--marker); color: var(--marker-ink); box-shadow: 0 0 0 .14em var(--marker); }
.dim .w.read { opacity: .4; }
.mathbox {
  margin: .4em 0 1em; padding: .7em 1em; background: var(--card); border: 1px solid var(--line);
  border-left: 4px solid var(--acc); border-radius: 8px; cursor: pointer; transition: box-shadow .14s, background-color .14s;
}
.mathbox .tex { overflow-x: auto; font-size: 1em; padding: .1em 0; }
.mathbox .tex.raw { font: 500 .7em var(--f-mono); color: var(--sub); }
.mathbox.on { box-shadow: 0 0 0 4px var(--marker); background: var(--marker-soft); }
.dim .mathbox.read { opacity: .45; }
.note { font-size: .74em; line-height: 1.65; color: var(--sub); margin-top: .2em; }
.box { margin: .3em 0 1em; padding: .7em 1em; border-radius: 8px; }
.box .lab { display: block; font-size: .62em; font-weight: 700; letter-spacing: .04em; margin-bottom: .25em; }
.box ul { margin: 0; padding-left: 1.1em; }
.trap { background: var(--trap-bg); }
.trap .lab { color: var(--trap-ink); }
.ex { background: var(--ex-bg); }
.ex .lab, .ex .ans { color: var(--ex-ink); }
.ex .ans { font-weight: 700; }
.chk { background: var(--chk-bg); }
.chk .lab { color: var(--chk-ink); }
.reveal { margin-top: .4em; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--chk-ink); background: transparent; color: var(--chk-ink); font-size: .7em; font-weight: 700; cursor: pointer; }
.chk .answer { font-size: .85em; margin-top: .4em; }
.tbl { overflow-x: auto; margin: .3em 0 1em; }
.tbl table { border-collapse: collapse; font-size: .72em; line-height: 1.5; min-width: 100%; }
.tbl th { text-align: left; background: var(--acc); color: #fff; padding: .45em .7em; font-weight: 600; }
.tbl td { padding: .45em .7em; border-bottom: 1px solid var(--line); vertical-align: top; }
.core-only .sent:not(.core), .core-only .para:not(.has-core), .core-only .ex, .core-only .chk { display: none; }
.endcap { text-align: center; color: var(--sub); font-size: .7em; margin-top: 3em; }
.study-figure { margin:1.2em 0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
.study-figure a { display:block; background:white; }
.study-figure img { display:block; width:100%; height:auto; }
.study-figure figcaption { padding:12px 16px; font-size:.78em; line-height:1.65; }
.study-figure figcaption > strong,.study-figure figcaption > span { display:block; }
.study-figure figcaption strong { margin-bottom:6px; }

/* dock */
.dock { flex: none; background: var(--card); border-top: 1px solid var(--line); }
.prog { height: 4px; background: var(--line); }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
.dock-in { padding: 8px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut-l); display: grid; gap: 8px; }
.status { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--sub); min-width: 0; }
.status #where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.status #eta { font-family: var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.controls { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px 14px; min-width: 0; }
.row.opts { flex-wrap: wrap; justify-content: space-between; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tts-only { display: none; }
body.tts .group.tts-only { display: flex; }
body.tts .tg.tts-only { display: inline-block; }
body.tts .no-tts { display: none; }
#voiceSel { min-height: 44px; max-width: 15rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); padding: 0 10px; font: inherit; font-size: 14px; }
#ttsTg[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.toast { position: fixed; z-index: 30; left: 50%; bottom: 190px; transform: translateX(-50%); max-width: min(34rem, calc(100vw - 32px));
  padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.transport { display: flex; align-items: center; gap: 8px; }
.ib {
  width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
  display: grid; place-items: center; cursor: pointer;
}
.ib svg { width: 22px; height: 22px; fill: currentColor; }
#play { width: 64px; height: 56px; border-radius: 16px; background: var(--acc); border-color: var(--acc); color: #fff; }
#play svg { width: 26px; height: 26px; }
.speed { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.speed label { font-size: 12.5px; color: var(--sub); white-space: nowrap; }
.speed input { flex: 1; min-width: 80px; height: 40px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
.speed input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
.speed input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--acc); border: 3px solid var(--card); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.speed input::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
.speed input::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); border: 3px solid var(--card); }
.speed output { font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: right; }
.speed output small { font: 500 11px var(--f-body); color: var(--sub); }
.group { display: flex; align-items: center; gap: 6px; }
.group > span { font-size: 12.5px; color: var(--sub); margin-right: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { min-width: 44px; min-height: 44px; border: 0; background: transparent; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tg { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 14px; }
.tg[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); font-weight: 700; }

.backdrop { display: none; }
@media (min-width: 1024px) {
  .controls { grid-auto-flow: column; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; }
  .row.opts { flex-wrap: nowrap; }
  body.tts .controls { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  body.tts .row.opts { justify-content: flex-start; }
  #reader { padding-top: 22px; }
}
@media (min-width: 1024px) and (max-height: 720px) {
  .dock-in { padding-top: 6px; gap: 4px; }
  .top-in { padding-top: 6px; padding-bottom: 6px; }
  .bk, .tg, .seg button { min-height: 42px; }
  .ib { width: 44px; height: 44px; }
  #play { height: 48px; }
}
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .backdrop { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .35); }
  .backdrop.show { display: block; }
  .toc {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(20rem, 86vw);
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px));
    transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0, 0, 0, .25);
  }
  .toc.open { transform: none; }
  .toc-btn { display: block; }
  .brand small { display: none; }
}
@media (max-width: 640px) {
  .row.opts { justify-content: flex-start; }
  .group > span { display: none; }
}
@media (max-width: 560px) {
  .brand { display: none; }
  .top-in { flex-wrap: wrap; gap: 8px; }
  .books { order: 1; flex-basis: 100%; }
  .row.main { flex-direction: column; align-items: stretch; }
  .transport { justify-content: center; }
  :root { --fs: 19px; }
}
</style>

<!-- Study notes use native pen pointer input and stay on this device. -->
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">계측 페이서 리딩<small>KEPCO E&amp;C · 10.24</small></div>
    <button class="toc-btn" id="tocBtn" aria-controls="toc" aria-expanded="false">목차</button>
    <nav class="books" id="books" aria-label="과목"></nav>
    <a class="pdf-link" href="questions.html">문제은행</a>
    <a class="pdf-link" href="pdfs.html">PDF 받기</a>
  </div>
</header>
<div class="shell">
  <div class="backdrop" id="backdrop"></div>
  <aside class="toc" id="toc" aria-label="단원 목차">
    <h3 id="tocTitle">단원</h3>
    <ol id="tocList"></ol>
  </aside>
  <main class="scroller" id="scroller">
    <article id="reader" class="dim"></article>
  </main>
</div>
<footer class="dock">
  <div class="prog"><i id="progBar"></i></div>
  <div class="dock-in">
    <div class="status"><span id="where">단어를 누르면 거기서부터 읽습니다</span><span id="eta"></span></div>
    <div class="controls">
      <div class="row main">
      <div class="transport">
        <button class="ib" id="prev" aria-label="이전 문장"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib" id="play" aria-label="재생"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 4v16l13-8z"/></svg></button>
        <button class="ib" id="next" aria-label="다음 문장"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
      <div class="speed">
        <label for="wpm" id="speedLab">속도</label>
        <input type="range" id="wpm" min="60" max="600" step="10" value="220">
        <output id="wpmOut" for="wpm">220 <small>어절/분</small></output>
      </div>
      </div>
      <div class="row opts">
      <div class="group no-tts"><span>묶음</span>
        <div class="seg" id="chunkSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
      </div>
      <div class="group"><span>글자</span>
        <div class="seg"><button id="fsDown" aria-label="글자 작게">A−</button><button id="fsUp" aria-label="글자 크게">A+</button></div>
      </div>
      <div class="group tts-only"><span>목소리</span><select id="voiceSel" aria-label="목소리"></select></div>
      <div class="toggles">
        <button class="tg" id="ttsTg" aria-pressed="false">음성 읽기</button>
        <button class="tg tts-only" id="mathTg" aria-pressed="true">수식 읽기</button>
        <button class="tg" id="coreOnly" aria-pressed="false">핵심만</button>
        <button class="tg" id="dimTg" aria-pressed="true">흐리게</button>
        <button class="tg no-tts" id="pauseTg" aria-pressed="true">문장 쉼</button>
        <button class="tg" id="fsTg" aria-pressed="false" hidden>전체화면</button>
      </div>
      </div>
    </div>
  </div>
