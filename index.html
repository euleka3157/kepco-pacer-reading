},{"s":"전철용 직권전동기에는 직병렬 제어를 쓴다.","core":0}]},{"t":"p","ss":[{"s":"기동할 때는 기동전류를 줄이려고 기동저항을 최대로, 기동토크를 키우려고 계자저항은 최소(계자전류 최대)로 둔다.","core":0}]},{"t":"m","tex":"N=K\\frac{V-I_aR_a}{\\phi}","note":"φ↓ → 속도↑(계자제어), V 조정(전압제어), R 삽입(저항제어)."},{"t":"tb","h":["방식","특성","비고"],"r":[["계자제어","정출력","범위 좁음"],["저항제어","효율 나쁨","손실 큼"],["전압제어","정토크, 광범위·원활","워드레오나드, 일그너"]]},{"t":"trap","items":["기동 시 계자저항을 최대로 두면 자속이 작아 토크가 부족하다. 최소로 둔다."]},{"t":"ex","q":"부하 변동이 심한 압연기용 직류전동기 전압제어 방식은?","steps":["플라이휠로 부하 변동을 흡수."],"a":"일그너 방식."},{"t":"chk","q":"가장 광범위하고 효율 좋은 직류전동기 속도제어는?","a":"전압제어(워드레오나드 등)."}]},{"id":"X27","title":"동기기 특성곡선: 포화곡선·단락곡선·V곡선","pr":"B","min":12,"day":5,"b":[{"t":"p","ss":[{"s":"무부하포화곡선은 계자전류에 대한 무부하 단자전압으로, 철심 포화 때문에 위로 갈수록 휜다.","core":1},{"s":"단락곡선은 계자전류에 대한 3상 단락전류로 거의 직선이다.","core":0},{"s":"단락 시 전류가 크게 뒤져 전기자 반작용이 감자작용이 되므로 철심이 포화되지 않기 때문이다.","core":0},{"s":"단락비는 두 곡선으로 구한다(M14).","core":0}]},{"t":"p","ss":[{"s":"위상특성곡선(V곡선)은 일정 출력에서 계자전류(가로축)에 따른 전기자전류(세로축)다.","core":1,"star":1},{"s":"최저점이 역률 1이고, 오른쪽(과여자)은 진상 전류로 콘덴서처럼, 왼쪽(부족여자)은 지상 전류로 리액터처럼 동작한다.","core":0},{"s":"출력이 클수록 곡선이 위로 올라간다.","core":0},{"s":"동기조상기가 이 성질을 이용한다.","core":0}]},{"t":"tb","h":["여자 상태","전기자전류","작용"],"r":[["부족여자","지상(뒤짐)","리액터"],["적정(최저점)","역률 1","-"],["과여자","진상(앞섬)","콘덴서"]]},{"t":"trap","items":["V곡선 가로축은 계자전류, 세로축은 전기자전류다. 축을 바꾸지 않는다.","과여자는 진상이다. 지상으로 외우는 실수가 많다."]},{"t":"ex","q":"동기조상기를 과여자로 운전하면 계통에서 무엇처럼 보이는가?","steps":["과여자 → 진상전류."],"a":"콘덴서(진상 무효전력 공급)."},{"t":"chk","q":"단락곡선이 직선이 되는 이유는?","a":"단락 시 감자작용으로 자속이 작아 철심이 포화되지 않기 때문."}]},{"id":"X28","title":"변압기 규약효율·전일효율","pr":"B","min":12,"day":5,"b":[{"t":"p","ss":[{"s":"실측효율은 실제로 잰 출력/입력, 규약효율은 출력/(출력+손실)으로 손실을 계산해 구한 효율이다.","core":1},{"s":"부하율 x에서의 효율과 최대효율 조건(철손=동손)은 M03에 있다.","core":0}]},{"t":"p","ss":[{"s":"전일효율은 하루(24 h) 동안의 출력 전력량을 출력 전력량+손실 전력량으로 나눈 값이다.","core":1,"star":1},{"s":"철손은 변압기가 연결된 24시간 내내, 동손은 부하가 걸린 시간에만 생긴다.","core":0},{"s":"배전용처럼 경부하 시간이 긴 변압기는 철손을 작게 설계해야 전일효율이 좋다.","core":0}]},{"t":"m","tex":"\\eta_d=\\frac{\\sum hP}{\\sum hP+24P_i+\\sum hx^2P_c}\\times100","note":"h 부하 시간, P 그 시간의 출력, x 부하율, P_i 철손, P_c 전부하 동손."},{"t":"trap","items":["전일효율에서 철손에 24를 곱하는 것을 빠뜨리지 않는다."]},{"t":"ex","q":"10 kVA, 철손 100 W, 전부하 동손 200 W 변압기를 역률 1 전부하로 하루 8시간, 나머지는 무부하로 쓴다. 전일효율은?","steps":["출력 10×8=80 kWh.","손실 0.1×24+0.2×8=4 kWh, 80/84."],"a":"약 95.2%."},{"t":"chk","q":"경부하 시간이 긴 변압기에서 전일효율을 높이려면 어느 손실을 줄이는가?","a":"철손."}]},{"id":"X29","title":"유도전동기 속도제어·원선도","pr":"B","min":12,"day":5,"b":[{"t":"p","ss":[{"s":"농형 속도제어: 주파수 제어(인버터, V/f 일정), 극수 변환, 전원전압 제어.","core":1},{"s":"권선형 속도제어: 2차 저항 제어(비례추이), 2차 여자 제어(2차에 슬립 주파수 전압 주입: 크레머 방식-정출력, 세르비우스 방식-정토크·전력 회수), 종속법.","core":0}]},{"t":"p","ss":[{"s":"종속법 무부하 속도는 직렬종속 120f/(p1+p2), 차동종속 120f/(p1-p2), 병렬종속 2×120f/(p1+p2)다.","core":1,"star":1}]},{"t":"p","ss":[{"s":"원선도(헤일랜드)는 유도전동기 특성을 원 위의 점으로 나타낸 그림이다.","core":0},{"s":"그리는 데 필요한 시험은 저항 측정, 무부하 시험, 구속(단락) 시험이다.","core":0}]},{"t":"m","tex":"N_{series}=\\frac{120f}{p_1+p_2},\\quad N_{diff}=\\frac{120f}{p_1-p_2},\\quad N_{par}=\\frac{2\\times120f}{p_1+p_2}","note":"종속법 무부하 속도 [rpm]."},{"t":"trap","items":["2차 여자 제어는 권선형 전용이다. 농형에는 2차 단자가 없다.","원선도 시험에 부하 시험은 들어가지 않는다."]},{"t":"ex","q":"60 Hz에서 4극과 8극 유도전동기를 직렬종속하면 무부하 속도는?","steps":["120×60/(4+8)=7200/12."],"a":"600 rpm."},{"t":"chk","q":"원선도 작성에 필요한 시험 세 가지는?","a":"저항 측정, 무부하 시험, 구속 시험."}]},{"id":"X30","title":"정류회로 맥동률·PIV와 전력용 반도체 소자","pr":"B","min":15,"day":5,"b":[{"t":"p","ss":[{"s":"평균 직류전압은 M17에 있다(단상반파 0.45V, 단상전파 0.9V, 3상반파 1.17V, 3상전파 1.35V).","core":1},{"s":"여기에 맥동률과 맥동주파수를 붙여 외운다.","core":0},{"s":"상수와 펄스 수가 많을수록 맥동률이 작아진다.","core":0}]},{"t":"p","ss":[{"s":"최대역전압(PIV, 저항부하)은 단상반파 √2V, 중간탭 전파 2√2V, 브리지 전파 √2V다.","core":1,"star":1},{"s":"중간탭 방식은 다이오드 하나가 변압기 2차 전체 전압을 받아 2배가 된다.","core":0}]},{"t":"p","ss":[{"s":"소자 구별: SCR(단방향 3단자, 게이트로 켜기만 가능), GTO(단방향 3단자, 게이트로 끌 수도 있음), TRIAC(양방향 3단자, SCR 두 개 역병렬), DIAC·SSS(양방향 2단자), SCS(단방향 4단자).","core":0},{"s":"IGBT는 MOSFET 입력과 BJT 출력을 합친 전압구동 소자로 대전류·고속 스위칭(인버터)에 쓰인다.","core":0}]},{"t":"tb","h":["방식","평균 q":"같은 높이 18 m의 지지점, 경간 120 m, 하중 10 N/m, 수평장력 6,000 N이다. 이도와 평균 높이를 구하라.","steps":["D=10×120²/(8×6000)=3 m이다.","평균 높이는 18-2×3/3=16 m, 실제 길이는 120+8×9/(3×120)=120.2 m이다."],"a":"이도 3 m, 평균 높이 16 m, 실제 길이 약 120.2 m"},{"t":"chk","q":"전선 이도·실제 길이·평균 높이·풍압과 착빙 하중에서 혼동하기 쉬운 조건 한 가지를 말하라.","a":"실제 전선 길이 L을 경간 S 자리에 넣지 않는다. 전선 평균 높이는 H-D/2가 아니라 포물선 모델에서 H-2D/3이다."}]},{"id":"P04","title":"지지물·기초·지선의 종류와 장력","pr":"B","min":30,"day":0,"b":[{"t":"p","ss":[{"s":"전선을 받치는 지지물에는 목주·철근콘크리트주·강관주·철탑이 있다.","core":1},{"s":"인접 경간 길이 차이가 크거나 전선을 끝내는 지점은 장력의 불균형을 견디는 내장·인류 구조를 검토한다.","core":0},{"s":"KEC 331.7의 기초 안전율은 원칙적으로 2 이상이며 지정한 이상 시 상정하중을 받는 철탑 기초에는 1.33 이상, 규정된 매입·시설 조건에는 예외가 있다.","core":0},{"s":"모든 지지물의 모든 하중조합에 2라는 단일 수치를 강제하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"매입 깊이의 부등호를 바로잡는다.","core":0},{"s":"원본의 15 m 이하 지지물 설명에 보이는 ‘길이의 1/6 이하’는 최소 매입 깊이라는 취지와 반대다.","core":0},{"s":"2026년 1월 5일 공고 KEC 331.7에서 전체 길이 16 m 이하이고 설계하중 6.8 kN 이하인 강관주·철근콘크리트주 또는 목주의 해당 조건은 길이 15 m 이하면 전체 길이의 1/6 이상, 15 m를 넘으면 2.5 m 이상이다.","core":0},{"s":"연약지반은 버팀대 등 보강 조건을 함께 확인한다.","core":0}]},{"t":"p","ss":[{"s":"지선은 기울어지려는 전주에 인장력으로 저항한다.","core":0},{"s":"보통 지선은 필요한 방향으로 직접 잡고, 수평 지선은 도로·공간 조건에 맞춰 다른 지지점으로 수평 연결하며, 공동 지선은 여러 지선이 지지점을 공유한다.","core":0},{"s":"Y형은 완금 양끝의 불평형을 나누어 받고 궁형은 좁은 장소 등에서 구조를 우회한다.","core":0},{"s":"철탑은 일반 전주의 지선 계산과 구별해 자체 구조를 검토한다.","core":0}]},{"t":"p","ss":[{"s":"KEC 331.11의 지선 안전율은 2.5 이상, 제6항의 고압·특고압 목주·A종 철주·A종 철근콘크리트주의 불평형 장력 등을 받는 지선은 1.5 이상이며 허용 인장하중 최저는 4.31 kN이다.","core":0},{"s":"연선은 3가닥 이상·소선 지름 2.6 mm 이상이 기본이다.","core":0},{"s":"소선 2 mm 이상이고 인장강도 0.68 kN/mm² 이상인 아연도강연선의 예외가 있다.","core":0},{"s":"지중부터 지상 0.3 m까지는 내식성 또는 아연도금 철봉을 쓰되 목주 지선에는 해당 예외가 있고, 도로 횡단은 원칙적으로 5 m 이상이나 규정된 부득이한 조건에서 4.5 m, 보도는 2.5 m 이상을 허용한다.","core":0},{"s":"철탑은 지선으로 강도를 분담하지 않으며 철주·철근콘크리트주는 지선 없이도 풍압하중의 1/2 이상을 견디는 강도 조건이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"철탑 형태는 단면이 정방형인 사각철탑, 직사각형인 방형철탑, 문 모양으로 철도·도로 등을 넘는 문형철탑, 상부가 넓고 중간이 좁은 우두형, 상하 구조의 방향을 돌려 부재 강도를 활용하는 회전형, 콘크리트를 채운 강관 조합의 MC형을 구분한다.","core":0},{"s":"우두형은 원문에서 765 kV 1회선과 산악지대의 예로 제시하며 특정 전압에서 유일하게 쓰이는 구조라는 뜻은 아니다.","core":0}]},{"t":"fig","src":"figures/power/p-pole-guy.svg","title":"지선과 기초의 역할","caption":"지선은 전선 장력에 대응하는 성분을 제공한다. 그림의 각도는 개념도이며 θ의 기준축에 따라 sin·cos가 달라진다. 매입 깊이는 본문의 KEC 적용 조건을 함께 확인한다.","alt":"지선과 기초의 역할 — 지선은 전선 장력에 대응하는 성분을 제공한다. 그림의 각도는 개념도이며 θ의 기준축에 따라 sin·cos가 달라진다. 매입 깊이는 본문의 KEC 적용 조건을 함께 확인한다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/power/p-towers.svg","title":"송전 철탑의 대표 외형","caption":"원본의 여섯 외형 분류를 단순화했다. 철탑 형상과 전선 상 배치를 구별하며 상별 수평 위치를 어긋나게 하는 오프셋은 접촉 위험 저감에 사용한다.","alt":"송전 철탑의 대표 외형 — 원본의 여섯 외형 분류를 단순화했다. 철탑 형상과 전선 상 배치를 구별하며 상별 수평 위치를 어긋나게 하는 오프셋은 접촉 위험 저감에 사용한다.","width":960.0,"height":560.0},{"t":"m","tex":"T=\\frac{F_h}{\\cos\\theta},\\quad n\\geq\\frac{kT}{F_b}","note":"θ: 지선과 수평선의 각도, F_h: 저항해야 할 수평력 N, T: 지선장력 N, k: 안전율, F_b: 소선 1가닥 파단하중 N. n은 올림한 정수이며 별도 최소 가닥 수 조건도 만족해야 한다."},{"t":"trap","items":["지선 각도를 수직선 기준으로 줬다면 수평 성분은 Tsinθ가 된다. 안전율을 곱해야 할 곳에서 나누지 않는다."]},{"t":"ex","q":"수평력 3 kN을 수평과 60°인 지선 하나가 받는다. 안전율 2.5일 때 요구 파단하중은?","steps":["Tcos60°=3 kN이므로 T=6 kN이다.","요구 파단하중은 2.5×6=15 kN 이상이다."],"a":"15 kN 이상"},{"t":"chk","q":"원문의 매입 깊이 1/6 이하를 그대로 암기해도 되는가?","a":"아니다. 확인한 KEC 해당 조건은 최소 깊이이므로 1/6 이상이며 길이·설계하중·지지물 종류 조건을 함께 붙여야 한다."}]},{"id":"P05","title":"애자의 종류·시험전압·전압분담·연효율","pr":"B","min":30,"day":0,"b":[{"t":"p","ss":[{"s":"애자는 전선을 기계적으로 지지하면서 지지물과 전기적으로 절연한다.","core":1},{"s":"핀애자는 비교적 낮은 전압의 직선부에서, 현수애자는 여러 개를 연결하여 송전선에서, 장간애자는 긴 절연체 구조와 내오손 특성을 이용할 때, 라인포스트는 직선·점퍼 지지 등에 사용한다.","core":0},{"s":"염해·분진에서는 표면 누설거리를 길게 하거나 오손 특성을 개선한 형태를 선택한다.","core":0}]},{"t":"p","ss":[{"s":"애자련의 각 애자는 직렬 정전용량뿐 아니라 지지철물과 전선에 대한 분로 정전용량을 갖는다.","core":0},{"s":"따라서 애자 수로 전압을 단순히 나눈 값이 각 애자의 실제 전압은 아니다.","core":0},{"s":"보통 전선 가까운 애자에 전압이 가장 많이 걸리며 구조에 따라 접지단 쪽 분담도 달라진다.","core":0},{"s":"균압환은 전계와 전압 분담을 완화하고 아크혼은 방전 경로를 유도하여 애자 몸체를 보호한다.","core":0}]},{"t":"p","ss":[{"s":"연효율은 전체 애자련 전압을 ‘애자 수×가장 큰 단위 애자 전압’으로 나눈 값이다.","core":0},{"s":"전압이 균일하면 100%이고 불균일할수록 작아진다.","core":0},{"s" ion":"상간 기하평균거리와 복도체 등가반지름에 사용하는 거리는 다르다. 4도체의 대각선 계수를 빠뜨리지 않는다.","alt":"선간거리와 복도체의 구분 — 상간 기하평균거리와 복도체 등가반지름에 사용하는 거리는 다르다. 4도체의 대각선 계수를 빠뜨리지 않는다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/power/p-transposition.svg","title":"3상 전선의 연가","caption":"교차하는 선은 전기적으로 서로 연결하지 않는다. 각 상이 모든 물리적 위치를 같은 길이씩 사용하도록 하여 상별 L·C 불평형을 줄인다.","alt":"3상 전선의 연가 — 교차하는 선은 전기적으로 서로 연결하지 않는다. 각 상이 모든 물리적 위치를 같은 길이씩 사용하도록 하여 상별 L·C 불평형을 줄인다.","width":960.0,"height":470.0},{"t":"m","tex":"D_m=(D_{ab}D_{bc}D_{ca})^{1/3}","note":"D_m와 각 거리: m. 등간격 일렬 배치는 2^(1/3)D, 직각이등변 배치는 2^(1/6)D, 정삼각형 배치는 D."},{"t":"m","tex":"r_b=\\left(r\\prod_{j=2}^{n}d_{1j}\\right)^{1/n},\\quad r_b^{(2)}=\\sqrt{rs},\\quad r_b^{(3)}=(rs^2)^{1/3},\\quad r_b^{(4)}=(\\sqrt{2}rs^3)^{1/4}","note":"대칭 배치·소도체 간격이 반지름보다 충분히 큼. 3가닥은 정삼각형, 4가닥은 정사각형의 변 s. 모든 길이 단위를 맞춘다. L용은 r 대신 r′를 대입."},{"t":"trap","items":["복도체는 한 상 안의 여러 소도체, 다회선은 서로 다른 3상 회선을 여러 벌 설치한 것이다. 둘을 같은 말로 쓰지 않는다."]},{"t":"ex","q":"상간 거리가 4 m, 4 m, 8 m인 연가 3상선의 기하학적 평균거리는?","steps":["Dm=(4×4×8)^(1/3)=128^(1/3) m이다.","4×2^(1/3)으로 정리한다."],"a":"약 5.040 m"},{"t":"chk","q":"기하학적 평균거리·복도체·연가에서 혼동하기 쉬운 조건 한 가지를 말하라.","a":"복도체는 한 상 안의 여러 소도체, 다회선은 서로 다른 3상 회선을 여러 벌 설치한 것이다. 둘을 같은 말로 쓰지 않는다."}]},{"id":"P08","title":"선로정수 R·L·C·G와 온도 보정","pr":"A","min":30,"day":0,"b":[{"t":"p","ss":[{"s":"선로의 직렬 성분은 저항 R과 인덕턴스 L, 분로 성분은 정전용량 C와 누설 컨덕턴스 G다.","core":1},{"s":"길이당 정수와 선로 전체 정수를 구별한다.","core":0},{"s":"R은 도체 발열, L은 자속에너지와 유도 전압강하, C는 전계에너지와 충전전류, G는 절연체의 누설·유전체 손실과 연결된다.","core":0}]},{"t":"p","ss":[{"s":"온도에 따른 저항은 기준 온도에서의 저항과 그 온도의 저항온도계수로 계산한다.","core":0},{"s":"여러 저항을 직렬로 연결한 전체 온도계수는 저항값으로 가중한 평균이다.","core":0},{"s":"단순 산술평균은 저항값이 같을 때만 된다.","core":0}]},{"t":"p","ss":[{"s":"비자성 원형 도체, 충분한 상간 거리, 연가·대칭 정상상태를 가정하면 상당 L과 C를 거리 대 반지름의 로그로 나타낼 수 있다.","core":0},{"s":"로그가 자연로그인지 상용로그인지, H/m인지 mH/km인지에 따라 계수가 달라진다.","core":0},{"s":"원문의 SI식과 실용식 사이 계수 불일치는 표준 원통형 선로식에 맞춰 정리했다.","core":0}]},{"t":"p","ss":[{"s":"상호정전용량과 대지정전용량으로 이루어진 커패시터망에서 작용 정전용량을 구할 때는 다른 상 전압의 위상을 반영한다.", ding}}=S_{\\mathrm{load}}\\frac{e}{E_{\\mathrm{out}}}","note":"단상 또는 동등한 상별 동상 직렬 승압의 자기용량. e=Eout−Ein."},{"t":"m","tex":"|E_2|=\\sqrt{E_1^2+e_2^2+2E_1e_2\\cos\\theta}","note":"두 전압의 위상각 θ인 일반 벡터합. 각 값은 같은 선/상 전압 기준."},{"t":"tb","h":["구성","출력전압 학습식","자기용량 학습식"],"r":[["단상 / 3상 Y","E2=E1(1+k)","S자기=(e2/E2)S"],["3상 V","E2=E1(1+k)","S자기=(2/√3)(e2/E2)S"],["3상 Δ: 원자료 표시식","E2≈E1(1+3k/2), 작은 k의 형태","원자료: S자기=(1/√3)(E2²−E1²)/(E2E1) S. 결선 정의 부족으로 일반 정확식 적용 보류"]]},{"t":"trap","items":["Δ결선의 원자료 표시식은 결선·위상 정의가 빠져 독립적인 정확식으로 확인되지 않았다. E2≈E1(1+3k/2) 형태는 작은 k의 근사이며 자기용량 표현도 결선도 없이 일반화할 수 없다. 이 한정은 원문 수식에 대한 검증 상태로, 내용 누락을 뜻하지 않는다."]},{"t":"ex","q":"1차 전압과 N2를 고정하고 1차 권수를 1000회에서 950회로 낮춘다. E2 변화비는?","steps":["E2는 N1에 반비례.","1000/950≈1.0526."],"a":"약 5.26% 증가."},{"t":"chk","q":"단상 전압을 200 V에서 220 V로 승압하여 22 kVA를 공급한다. 승압 권선의 자기용량은?","a":"22×20/220=2 kVA다."}]},{"id":"P42","title":"플리커·배전선 자동개폐와 각종 현상","pr":"B","min":25,"day":0,"b":[{"t":"p","ss":[{"s":"플리커는 반복적 전압변동으로 조명 밝기가 흔들리는 현상이다.","core":1},{"s":"아크로·대형 변동부하 등에서 전류·무효전력의 변화가 선로 임피던스에 전압변동을 만든다.","core":0},{"s":"전원측에서는 단락용량이 큰 계통에 접속, 전용회선 사용, 공급전압 상승 등이 전압변동을 줄이는 방향이다.","core":0}]},{"t":"p","ss":[{"s":"수용가측에서는 무효전력 변동 보상, 상간 부하 분산, 전류변동 제한이 대책이다.","core":0},{"s":"원자료는 직렬콘덴서·직렬리액터·동기조상기·사이리스터 보상장치 등을 사례로 든다.","core":0},{"s":"어떤 장치를 써도 보상효과가 같은 것이 아니며 부하 특성, 공진, 고조파, 제어속도를 함께 본다.","core":0}]},{"t":"p","ss":[{"s":"재폐로기 RC는 일시고장 후 차단·재투입을 자동 수행한다.","core":0},{"s":"섹셔널라이저는 상위 차단장치 동작을 계수하여 무전압 시간에 고장구간을 분리하는 장치로, 자체 단락전류 차단능력과 혼동하지 않는다.","core":0},{"s":"LBS는 부하 개폐, CB는 정격 고장전류 차단을 맡는다.","core":0},{"s":"이들을 협조시켜 정전 구간을 줄인다.","core":0}]},{"t":"p","ss":[{"s":"원자료의 효과 모음은 앞 단원의 섬락·페란티·코로나·자기여자와 E19/E41의 표피효과를 다시 연결한다.","core":0},{"s":"근접효과는 이웃 도체의 교류 자계 때문에 한 도체 내부 전류분포가 치우치는 현상으로 표피효과와 원인이 구별된다.","core":0},{"s":"두 현상 모두 교류 저항을 증가시킬 수 있다.","core":0}]},{"t":"fig","src":"figures/power/p-recloser.svg","title":"배전 보호의 동작 순서","caption":"섹셔널라이저는 리클로저의 동작과 협조해 정전 구간에서 개방하는 방식이다. 단독으로 큰 고장전류를 차단하는 차단기로 해석하지 않는다.","alt":"배전 보호의 동작 순서 — 섹셔널라이저는 :"m","tex":"P^2+\\left(Q+\\frac{3V^2}{X_s}\\right)^2=\\left(\\frac{3VE}{X_s}\\right)^2","note":"단자전압·계자 기전력 일정의 원. 계자 전류 제한의 단순 모형."},{"t":"ex","q":"동기발전기가 같은 전압에서 6 MW와 8 Mvar를 공급한다. 피상전력과 역률은?","steps":["S=√(6²+8²)=10 MVA.","역률=P/S=0.6."],"a":"10 MVA, 0.6."},{"t":"chk","q":"발전기 정격 피상전력이 10 MVA이고 P=8 MW라면 전기자 전류 원만 고려한 |Q| 한도는?","a":"√(10²−8²)=6 Mvar다. 실제 허용치는 다른 한계로 더 작아질 수 있다."}]},{"id":"P44","title":"수력발전 원리·수두·베르누이·특유속도","pr":"B","min":25,"day":0,"b":[{"t":"p","ss":[{"s":"수력은 물의 위치·압력·운동에너지를 수차의 축동력으로 바꾸고 발전기를 돌린다.","core":1},{"s":"출력 조절이 빠르고 기동·정지가 쉬우며 저수·양수로 에너지 저장 기능을 가질 수 있다.","core":0},{"s":"다목적댐은 용수·홍수조절을 겸하지만 건설비·입지·환경 영향과 수량 변동을 고려한다.","core":0}]},{"t":"p","ss":[{"s":"수두는 물의 단위중량당 에너지를 길이 m로 표현한 것이다.","core":0},{"s":"위치수두 z, 압력수두 p/(ρg), 속도수두 v²/(2g)를 더한다.","core":0},{"s":"원자료의 압력 kg/m² 표기는 kgf/m² 관례가 섞여 있으므로 SI 계산에서는 p를 Pa, ρ를 kg/m³, g를 m/s²로 통일한다.","core":0}]},{"t":"p","ss":[{"s":"베르누이식은 정해진 조건의 유선에서 에너지 보존을 나타낸다.","core":0},{"s":"펌프나 수차가 없고 손실을 무시하면 세 수두의 합이 같다.","core":0},{"s":"실제 수로는 마찰·국부손실을 빼고 펌프가 더한 수두와 수차가 취한 수두를 포함한다.","core":0},{"s":"비압축성 정상흐름의 연속식은 Q=Av로, 지름 절반이면 같은 Q에서 속도 4배다.","core":0}]},{"t":"p","ss":[{"s":"수차 특유속도 Ns=N√P/H^(5/4)는 주어진 낙차 H와 출력 P를 기준으로 수차 형상을 비교하는 관용 지표다.","core":0},{"s":"N rpm·P kW·H m를 쓰는 단위 관례가 고정되어 있으며 무차원 SI 계수와 다르다.","core":0},{"s":"모형의 크기·단위가 달라지면 숫자를 직접 비교하지 않는다.","core":0}]},{"t":"fig","src":"figures/power/p-hydro-head.svg","title":"수로와 수차에 걸리는 낙차","caption":"상·하류 수면 차이가 총낙차다. 손실수두를 빼고 수차에 사용할 수 있는 에너지를 구하며 압력수두·속도수두는 베르누이 식의 같은 기준으로 비교한다.","alt":"수로와 수차에 걸리는 낙차 — 상·하류 수면 차이가 총낙차다. 손실수두를 빼고 수차에 사용할 수 있는 에너지를 구하며 압력수두·속도수두는 베르누이 식의 같은 기준으로 비교한다.","width":960.0,"height":560.0},{"t":"m","tex":"p=\\rho gH,\\quad H_p=\\frac{p}{\\rho g},\\quad H_v=\\frac{v^2}{2g}","note":"물은 대표적으로 ρ≈1000 kg/m³. 실제 밀도는 온도에 따라 변한다."},{"t":"m","tex":"z+\\frac{p}{\\rho g}+\\frac{v^2}{2g}=\\mathrm{constant}","note":"정상·비압축성·비점성 유선, 축일과 열교환을 무시한 단순 베르누이."},{"t":"m","tex":"Q=A_1v_1=A_2v_2,\\quad v=\\sqrt{2gH}","note":"두 번째는 큰 저장조에서 손실 없이 낙차 H :"수요 곡선과 발전 운전 역할","caption":"특정 발전원만 한 역할을 영구적으로 담당한다는 뜻은 아니다. 계통 구성·발전원 특성·운전 여건에 따라 배분한다.","alt":"수요 곡선과 발전 운전 역할 — 특정 발전원만 한 역할을 영구적으로 담당한다는 뜻은 아니다. 계통 구성·발전원 특성·운전 여건에 따라 배분한다.","width":960.0,"height":530.0},{"t":"m","tex":"T_K=t_C+273.15,\\quad t_F=\\frac{9}{5}t_C+32","note":"섭씨/화씨 변환. 0 K는 −273.15 ℃."},{"t":"m","tex":"1\\ \\mathrm{kWh}=3.6\\ \\mathrm{MJ}\\simeq860\\ \\mathrm{kcal}","note":"1 kcal≈4.184 kJ. 원자료 열효율식의 860 변환계수."},{"t":"m","tex":"1\\ \\mathrm{Btu}\\simeq0.252\\ \\mathrm{kcal},\\quad1\\ \\mathrm{atm}=101325\\ \\mathrm{Pa}","note":"열량·압력 단위 환산. 1 atm≈760 mmHg≈1.033 kgf/cm²."},{"t":"m","tex":"Q_{\\mathrm{sensible}}=mc\\Delta T,\\quad Q_{\\mathrm{latent}}=mr","note":"m: kg, c: kJ/(kg·K), r: kJ/kg이면 Q: kJ. 열역학 물성표의 해당 압력·온도를 사용."},{"t":"m","tex":"x=\\frac{m_g}{m_f+m_g},\\quad h=h_f+x(h_g-h_f)","note":"습증기의 건조도. f: 포화액체, g: 건포화증기. 같은 압력의 물성값을 사용하며 엔트로피도 s=sf+x(sg−sf)로 계산한다."},{"t":"ex","q":"물 2 kg을 20 ℃에서 70 ℃까지 가열한다. c=4.2 kJ/(kg·K), 상변화 없음이면 열량은?","steps":["Q=2×4.2×(70−20)."],"a":"420 kJ."},{"t":"chk","q":"열효율의 온도비에 300 ℃와 30 ℃를 그대로 나누어도 되는가?","a":"아니다. 절대온도 573.15 K와 303.15 K로 바꾼다."}]},{"id":"P51","title":"엔탈피·엔트로피·증기선도와 기본 사이클","pr":"B","min":25,"day":0,"b":[{"t":"p","ss":[{"s":"엔탈피 h=u+pv는 유동 장치에서 내부에너지와 밀어내는 일을 묶은 비에너지 kJ/kg다.","core":1},{"s":"엔트로피 s는 가역 열전달에서 ds=δqrev/T로 정의하며 kJ/(kg·K)다.","core":0},{"s":"엔트로피를 단순히 항상 증가하는 열량이라고 정의하지 않는다.","core":0},{"s":"계의 엔트로피는 열 방출로 줄 수 있고 전체 고립계의 생성 엔트로피가 음수가 되지 않는 것이다.","core":0}]},{"t":"p","ss":[{"s":"T-s 선도의 가역 경로 아래 면적은 단위질량당 열량이다.","core":0},{"s":"i-s 선도 또는 h-s 선도는 증기 팽창의 엔탈피 강하를 읽는 데 쓰인다.","core":0},{"s":"이상 단열·가역 팽창은 등엔트로피이고 실제 터빈은 손실 때문에 출구 엔트로피가 증가할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"이상 랭킨 사이클은 펌프 압축, 보일러 등압 가열, 터빈 팽창, 복수기 등압 응축으로 이어진다.","core":0},{"s":"터빈 출력에서 펌프 일을 뺀 것이 순일이다.","core":0},{"s":"보일러에서 공급한 열과 복수기에서 버린 열의 차이가 순일이 되며 폐회로의 에너지 보존을 만족한다.","core":0}]},{"t":"p","ss":[{"s":"카르노 사이클은 두 온도 사이의 가역 열기관 상한을 제시한다.","core":0},{"s":"실제 증기발전의 구성과 그대로 같은 장치가 아니며 고온원·저온원 절대온도로 효율 한계를 계산한다.","core":0},{"s":"랭킨 사이클의 보일러 가열은 일정 온도 하나에서만 이루어지는 것이 아니다.","core":0}]},{"t":"fig","src":"figures/power/p-rankine-loop.svg","title":"랭킨 사이클의 네 기기","caption":"펌프는 액체 상태의 물에 일을 가하고 터빈은 증기의 팽창으로 일을 얻는다. 두 기기의 일 방향과 보일러·복수기의 열 방향을 구별한다.","alt":"랭킨 사이클의 네 기기 — 펌프는 액체 상태의 물에 일을 가하고 터빈은 증기의 팽창으로 일을 얻는다. 두 기기의 일 방향과 보일러·복수기의 열 방향을 구별한다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/power/p-thermodynamic-diagrams.svg","title":"카르노·랭킨의 온도–엔트로피 도식","caption":"과정의 관계를 나타내는 정성 선도다. 랭킨 포화돔과 과정 위치는 물성표에 따른 정량 선도가 아니며 펌프·터빈의 수직선은 이상 등엔트로피 과정이다.","alt":"카르노·랭킨의 온도–엔트로피 도식 — 과정의 관계를 나타내는 정성 선도다. 랭킨 포화돔과 과정 위치는 물성표에 따른 정량 선도가 아니며 펌프·터빈의 수직선은 이상 등엔트로피 과정이다.","width":960.0,"height":590.0},{"t":"fig","src":"figures/power/p-thermal-areas.svg","title":"랭킨 선도에서 세 면적 읽기","caption":"열을 받는 경로 아래 면적, 열을 버리는 경로 아래 면적, 두 경로 사이 면적을 구별한다. 모양은 과정 구분을 위한 도식이고 물성값의 정량 선도가 아니다.","alt":"랭킨 선도에서 세 면적 읽기 — 열을 받는 경로 아래 면적, 열을 버리는 경로 아래 면적, 두 경로 사이 면적을 구별한다. 모양은 과정 구분을 위한 도식이고 물성값의 정량 선도가 아니다.","width":960.0,"height":570.0},{"t":"m","tex":"h=u+pv,\\quad ds=\\frac{\\delta q_{\\mathrm{rev}}}{T}","note":"비체적 v m³/kg, p kPa이면 pv kJ/kg. 엔트로피 관계의 T는 K."},{"t":"m","tex":"w_t=h_1-h_2,\\quad w_p=h_4-h_3","note":"터빈 입출구 1→2, 펌프 입출구 3→4. 정상 단열·운동/위치에너지 무시."},{"t":"m","tex":"\\eta_R=\\frac{(h_1-h_2)-(h_4-h_3)}{h_1-h_4}","note":"이상 기본 랭킨의 순열효율. 분모는 보일러 열입력."},{"t":"m","tex":"\\eta_C=1-\\frac{T_L}{T_H}","note":"가역 카르노 열기관 상한, TH>TL>0 K. 실제 열효율이 이보다 커질 수 없다."},{"t":"ex","q":"기본 사이클에서 터빈 일 1000 kJ/kg, 펌프 일 10 kJ/kg, 보일러 열입력 3000 kJ/kg이면 순열효율은?","steps":["순일=1000−10=990 kJ/kg.","η=990/3000."],"a":"33%."},{"t":"chk","q":"고온원 600 K, 저온원 300 K의 카르노 효율은?","a":"1−300/600=0.5=50%다."}]},{"id":"P52","title":"재열·재생·재열재생과 효율 개선","pr":"B","min":25,"day":0,"b":[{"t":"p","ss":[{"s":"재열은 고압터빈에서 일부 팽창한 증기를 보일러의 재열기로 되돌려 다시 가열한 뒤 저압터빈에서 더 팽창시키는 방식이다.","core":1},{"s":"터빈 후단의 습분을 줄이고 조건에 따라 평균 열공급온도와 출력을 개선한다.","core":0},{"s":"원자료의 터빈출력 증가율·증기소비율 감소율 숫자는 예시적인 성능 범위이며 모든 설비에서 보장되는 비율이 아니다.","core":0}]},{"t":"p","ss":[{"s":"재생은 터빈 중간에서 일부     b.addEventListener('click', () => {
      if (i === st.book) return;
      store.set('pos:' + BOOKS[st.book].num, act[pos]);
      st.book = i; saveSettings(); renderBook();
    });
    $('#books').appendChild(b);
  });

  reader.addEventListener('click', (e) => {
    const w = e.target.closest('.w, .mathbox');
    if (!w || e.target.closest('.reveal')) return;
    const ti = +w.dataset.i, k = act.indexOf(ti);
    if (k >= 0) jump(k);
  });
  $('#play').addEventListener('click', () => (playing ? stop() : play()));
  $('#prev').addEventListener('click', () => sentJump(-1));
  $('#next').addEventListener('click', () => sentJump(1));
  $('#wpm').addEventListener('input', (e) => {
    if (st.tts) { st.rate = Math.round(+e.target.value * 100) / 100; restartSoon(); } else st.wpm = +e.target.value;
    applySettings(); status(); saveSettings();
  });
  $('#ttsTg').addEventListener('click', () => {
    const was = playing; stop();
    st.tts = !st.tts; applySettings(); saveSettings(); paint(false);
    if (st.tts) {
      populateVoices();
      if (!speech || !speech.supported()) toast('이 브라우저는 음성 읽기를 지원하지 않습니다. 크롬에서 열어 주세요.');
      else toast('음성 읽기: ▶를 누르면 읽기 시작합니다. 배속은 아래 막대로 바꿉니다.', 3500);
    }
    if (was) play();
  });
  $('#mathTg').addEventListener('click', () => { st.mathSpeak = !st.mathSpeak; applySettings(); saveSettings(); restartSoon(); });
  $('#voiceSel').addEventListener('change', (e) => { st.voice = e.target.value; if (speech) speech.setVoice(st.voice); saveSettings(); restartSoon(); });
  document.querySelectorAll('#chunkSeg button').forEach((b) => b.addEventListener('click', () => { st.chunk = +b.dataset.v; applySettings(); saveSettings(); paint(false); }));
  $('#fsDown').addEventListener('click', () => { st.fs = Math.max(15, st.fs - 1); applySettings(); saveSettings(); paint(true); });
  $('#fsUp').addEventListener('click', () => { st.fs = Math.min(34, st.fs + 1); applySettings(); saveSettings(); paint(true); });
  $('#coreOnly').addEventListener('click', () => {
    const keep = act[pos] ?? 0; st.coreOnly = !st.coreOnly; applySettings(); saveSettings();
    buildActive(keep); refreshRead(); clearTimeout(timer); paint(true);
    if (playing) { if (st.tts && speech) speech.play(pos); else step(); }
  });
  $('#dimTg').addEventListener('click', () => { st.dim = !st.dim; applySettings(); saveSettings(); });
  $('#pauseTg').addEventListener('click', () => { st.sentPause = !st.sentPause; applySettings(); saveSettings(); });
  function closeToc() { $('#toc').classList.remove('open'); $('#backdrop').classList.remove('show'); $('#tocBtn').setAttribute('aria-expanded', 'false'); }
  $('#tocBtn').addEventListener('click', () => {
    const o = $('#toc').classList.toggle('open'); $('#backdrop').classList.toggle('show', o);
    $('#tocBtn').setAttribute('aria-expanded', o ? 'true' : 'false');
  });
  $('#backdrop').addEventListener('click', closeToc);
  const root = document.documentElement;
  const fsOk = !!(root.requestFullscreen || root.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (fsOk) {
    $('#fsTg').hidden = false;
    $('#fsTg').addEventListener('click', () => {
      const inFs = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        const r = inFs ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                       : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        if (r && r.catch) r.catch(() => {});
      } catch (e) { /* fullscreen refused */ }
    });
    const syncFs = () => $('#fsTg').setAttribute('aria-pressed', !!(document.fullscreenElement || document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);
  }
  let rzT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => { if (window.innerWidth >= 1024) closeToc(); paint(true); }, 180);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
    else if (e.key === 'ArrowRight') sentJump(1);
    else if (e.key === 'ArrowLeft') sentJump(-1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const d = e.key === 'ArrowUp' ? 1 : -1;
      if (st.tts) { st.rate = Math.max(0.5, Math.min(3, Math.round((st.rate + d * 0.1) * 100) / 100)); restartSoon(); }
      else st.wpm = Math.max(60, Math.min(600, st.wpm + d * 10));
      applySettings(); saveSettings();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && playing) lockScreen();
    if (document.visibilityState === 'hidden') {
      store.set('pos:' + BOOKS[st.book].num, act[pos]);
      if (playing && st.tts) stop();
    }
  });
  window.typesetMath = typesetMath;
  document.addEventListener('study-pen-open', stop);

  applySettings();
  renderBook();
  refreshRead();
  if (st.tts) populateVoices();
})();
</script>
