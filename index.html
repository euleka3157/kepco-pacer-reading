<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한국전력기술 계측 필기 대비 페이서 리딩. 노란 형광이 어절 단위로 이동하며 읽기를 이끕니다.">
<meta property="og:title" content="계측 페이서 리딩">
<meta property="og:description" content="회로·제어·전자기·전기기기·디지털 핵심을 페이서로 읽는 비공식 학습 도구">
<title>계측 페이서 리딩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen reader — book tabs on top, section index left, reading column center, control dock bottom (thumb zone). */
:root {
  --paper: #F3F5F7;
  --card: #FFFFFF;
  --ink: #18212B;
  --sub: #5A6676;
  --line: #DCE2E9;
  --marker: #FFD93D;
  --marker-ink: #18212B;
  --core: #FFF0A6;
  --trap-bg: #FDECEF;
  --trap-ink: #B4234A;
  --ex-bg: #ECF8F0;
  --ex-ink: #157A3E;
  --chk-bg: #F1EEFD;
  --chk-ink: #6B3FD8;
  --acc: #2563EB;
  --acc-soft: rgba(37, 99, 235, .14);
  --marker-soft: #FFF4C2;
  --dock-h: auto;
  --f-body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --fs: 21px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161C; --card: #19212A; --ink: #E5EAF0; --sub: #94A1B0; --line: #29323D;
    --marker: #FFD43B; --marker-ink: #11161C; --core: rgba(255, 212, 59, .20); --marker-soft: #3A3420;
    --trap-bg: #2B1820; --trap-ink: #FF8EA6; --ex-bg: #14261C; --ex-ink: #6FDB98;
    --chk-bg: #211B35; --chk-ink: #B9A2FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161C; --card: #19212A; --ink: #E5EAF0; --sub: #94A1B0; --line: #29323D;
  --marker: #FFD43B; --marker-ink: #11161C; --core: rgba(255, 212, 59, .20); --marker-soft: #3A3420;
  --trap-bg: #2B1820; --trap-ink: #FF8EA6; --ex-bg: #14261C; --ex-ink: #6FDB98;
  --chk-bg: #211B35; --chk-ink: #B9A2FF; color-scheme: dark;
}
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, .w, .mathbox, .toc, .books { touch-action: manipulation; }
.top, .dock, .toc { -webkit-user-select: none; user-select: none; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body);
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

/* top bar */
.top { flex: none; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; padding: 10px var(--gut-r) 10px var(--gut-l); }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; font: 500 11px var(--f-mono); color: var(--sub); letter-spacing: .04em; }
.books { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.books::-webkit-scrollbar { display: none; }
.bk {
  flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 22px; background: transparent; cursor: pointer; font-size: 14px;
}
.bk b { font: 600 13px var(--f-mono); color: var(--bk); }
.bk[aria-pressed="true"] { background: var(--bk); border-color: var(--bk); color: #fff; }
.bk[aria-pressed="true"] b { color: #fff; }
.pdf-link { flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 14px; }
.toc-btn { display: none; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; }

/* shell */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); }
.toc { overflow-y: auto; border-right: 1px solid var(--line); background: var(--card); padding: 12px 10px 24px 16px; }
.toc h3 { margin: 4px 6px 10px; font: 600 11px var(--f-mono); letter-spacing: .08em; color: var(--sub); text-transform: uppercase; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 3.1em 1fr; gap: 6px; align-items: start;
  padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 13.5px; line-height: 1.4;
}
.toc button span:first-child { font: 600 12px/1.6 var(--f-mono); color: var(--acc); }
.toc button.b span:last-child { color: var(--sub); }
.toc button.cur { background: var(--acc-soft); }
.scroller { overflow-y: auto; min-width: 0; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .scroller { scroll-behavior: auto; } .w { transition: none !important; } }

/* reading column */
#reader {
  max-width: 40em; margin: 0 auto; padding: 28px var(--gut-r) 45vh var(--gut-l);
  font-size: var(--fs); line-height: 1.85; word-break: keep-all; overflow-wrap: anywhere;
}
.book-head { margin-bottom: 8px; }
.book-head .eyebrow { font: 600 12px var(--f-mono); letter-spacing: .08em; color: var(--acc); }
.book-head h1 { margin: 4px 0 6px; font-size: 1.55em; line-height: 1.25; letter-spacing: -.02em; text-wrap: balance; }
.book-head p { margin: 0; font-size: .72em; color: var(--sub); line-height: 1.6; }
.sec { padding-top: 1.6em; margin-top: 1.4em; border-top: 1px solid var(--line); }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: .2em; }
.sid { font: 600 .62em var(--f-mono); color: #fff; background: var(--acc); padding: .18em .55em; border-radius: 6px; }
.pr { font-size: .58em; font-weight: 700; padding: .2em .6em; border-radius: 99px; }
.pr-A { color: #fff; background: #D6334A; }
.pr-B { color: var(--sub); border: 1px solid var(--line); }
.meta { font: 500 .56em var(--f-mono); color: var(--sub); }
.sec-title { width: 100%; margin: .15em 0 .5em; font-size: 1.12em; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance; }
.para { margin: 0 0 .9em; }
.sent.core { background: linear-gradient(transparent 60%, var(--core) 60%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.star { font-size: .62em; font-weight: 700; color: #C2410C; margin-right: .35em; vertical-align: .15em; }
.w { border-radius: .22em; transition: background-color .14s ease, color .14s ease, opacity .25s; cursor: pointer; }
.w.on { background: var(--marker); color: var(--marker-ink); box-shadow: 0 0 0 .14em var(--marker); }
.dim .w.read { opacity: .4; }
.mathbox {
  margin: .4em 0 1em; padding: .7em 1em; background: var(--card); border: 1px solid var(--line);
  border-left: 4px solid var(--acc); border-radius: 8px; cursor: pointer; transition: box-shadow .14s, background-color .14s;
}
.mathbox .tex { overflow-x: auto; font-size: 1em; padding: .1em 0; }
.mathbox .tex.raw { font: 500 .7em var(--f-mono); color: var(--sub); }
.mathbox.on { box-shadow: 0 0 0 4px var(--marker); background: var(--marker-soft); }
.dim .mathbox.read { opacity: .45; }
.note { font-size: .74em; line-height: 1.65; color: var(--sub); margin-top: .2em; }
.box { margin: .3em 0 1em; padding: .7em 1em; border-radius: 8px; }
.box .lab { display: block; font-size: .62em; font-weight: 700; letter-spacing: .04em; margin-bottom: .25em; }
.box ul { margin: 0; padding-left: 1.1em; }
.trap { background: var(--trap-bg); }
.trap .lab { color: var(--trap-ink); }
.ex { background: var(--ex-bg); }
.ex .lab, .ex .ans { color: var(--ex-ink); }
.ex .ans { font-weight: 700; }
.chk { background: var(--chk-bg); }
.chk .lab { color: var(--chk-ink); }
.reveal { margin-top: .4em; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--chk-ink); background: transparent; color: var(--chk-ink); font-size: .7em; font-weight: 700; cursor: pointer; }
.chk .answer { font-size: .85em; margin-top: .4em; }
.tbl { overflow-x: auto; margin: .3em 0 1em; }
.tbl table { border-collapse: collapse; font-size: .72em; line-height: 1.5; min-width: 100%; }
.tbl th { text-align: left; background: var(--acc); color: #fff; padding: .45em .7em; font-weight: 600; }
.tbl td { padding: .45em .7em; border-bottom: 1px solid var(--line); vertical-align: top; }
.core-only .sent:not(.core), .core-only .para:not(.has-core), .core-only .ex, .core-only .chk { display: none; }
.endcap { text-align: center; color: var(--sub); font-size: .7em; margin-top: 3em; }

/* dock */
.dock { flex: none; background: var(--card); border-top: 1px solid var(--line); }
.prog { height: 4px; background: var(--line); }
.prog i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
.dock-in { padding: 8px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut-l); display: grid; gap: 8px; }
.status { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--sub); min-width: 0; }
.status #where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.status #eta { font-family: var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.controls { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px 14px; min-width: 0; }
.row.opts { flex-wrap: wrap; justify-content: space-between; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.tts-only { display: none; }
body.tts .group.tts-only { display: flex; }
body.tts .tg.tts-only { display: inline-block; }
body.tts .no-tts { display: none; }
#voiceSel { min-height: 44px; max-width: 15rem; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); padding: 0 10px; font: inherit; font-size: 14px; }
#ttsTg[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.toast { position: fixed; z-index: 30; left: 50%; bottom: 190px; transform: translateX(-50%); max-width: min(34rem, calc(100vw - 32px));
  padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 14px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.transport { display: flex; align-items: center; gap: 8px; }
.ib {
  width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
  display: grid; place-items: center; cursor: pointer;
}
.ib svg { width: 22px; height: 22px; fill: currentColor; }
#play { width: 64px; height: 56px; border-radius: 16px; background: var(--acc); border-color: var(--acc); color: #fff; }
#play svg { width: 26px; height: 26px; }
.speed { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.speed label { font-size: 12.5px; color: var(--sub); white-space: nowrap; }
.speed input { flex: 1; min-width: 80px; height: 40px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; }
.speed input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
.speed input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--acc); border: 3px solid var(--card); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.speed input::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
.speed input::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); border: 3px solid var(--card); }
.speed output { font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4.6em; text-align: right; }
.speed output small { font: 500 11px var(--f-body); color: var(--sub); }
.group { display: flex; align-items: center; gap: 6px; }
.group > span { font-size: 12.5px; color: var(--sub); margin-right: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { min-width: 44px; min-height: 44px; border: 0; background: transparent; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tg { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 14px; }
.tg[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); font-weight: 700; }

.backdrop { display: none; }
@media (min-width: 1024px) {
  .controls { grid-auto-flow: column; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; }
  .row.opts { flex-wrap: nowrap; }
  body.tts .controls { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  body.tts .row.opts { justify-content: flex-start; }
  #reader { padding-top: 22px; }
}
@media (min-width: 1024px) and (max-height: 720px) {
  .dock-in { padding-top: 6px; gap: 4px; }
  .top-in { padding-top: 6px; padding-bottom: 6px; }
  .bk, .tg, .seg button { min-height: 42px; }
  .ib { width: 44px; height: 44px; }
  #play { height: 48px; }
}
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .backdrop { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .35); }
  .backdrop.show { display: block; }
  .toc {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; width: min(20rem, 86vw);
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px));
    transform: translateX(-105%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0, 0, 0, .25);
  }
  .toc.open { transform: none; }
  .toc-btn { display: block; }
  .brand small { display: none; }
}
@media (max-width: 640px) {
  .row.opts { justify-content: flex-start; }
  .group > span { display: none; }
}
@media (max-width: 560px) {
  .brand { display: none; }
  .top-in { flex-wrap: wrap; gap: 8px; }
  .books { order: 1; flex-basis: 100%; }
  .row.main { flex-direction: column; align-items: stretch; }
  .transport { justify-content: center; }
  :root { --fs: 19px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">계측 페이서 리딩<small>KEPCO E&amp;C · 10.24</small></div>
    <button class="toc-btn" id="tocBtn" aria-controls="toc" aria-expanded="false">목차</button>
    <nav class="books" id="books" aria-label="과목"></nav>
    <a class="pdf-link" href="questions.html">문제은행</a>
    <a class="pdf-link" href="pdfs.html">PDF 받기</a>
  </div>
</header>
<div class="shell">
  <div class="backdrop" id="backdrop"></div>
  <aside class="toc" id="toc" aria-label="단원 목차">
    <h3 id="tocTitle">단원</h3>
    <ol id="tocList"></ol>
  </aside>
  <main class="scroller" id="scroller">
    <article id="reader" class="dim"></article>
  </main>
</div>
<footer class="dock">
  <div class="prog"><i id="progBar"></i></div>
  <div class="dock-in">
    <div class="status"><span id="where">단어를 누르면 거기서부터 읽습니다</span><span id="eta"></span></div>
    <div class="controls">
      <div class="row main">
      <div class="transport">
        <button class="ib" id="prev" aria-label="이전 문장"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib" id="play" aria-label="재생"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 4v16l13-8z"/></svg></button>
        <button class="ib" id="next" aria-label="다음 문장"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
      <div class="speed">
        <label for="wpm" id="speedLab">속도</label>
        <input type="range" id="wpm" min="60" max="600" step="10" value="220">
        <output id="wpmOut" for="wpm">220 <small>어절/분</small></output>
      </div>
      </div>
      <div class="row opts">
      <div class="group no-tts"><span>묶음</span>
        <div class="seg" id="chunkSeg"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
      </div>
      <div class="group"><span>글자</span>
        <div class="seg"><button id="fsDown" aria-label="글자 작게">A−</button><button id="fsUp" aria-label="글자 크게">A+</button></div>
      </div>
      <div class="group tts-only"><span>목소리</span><select id="voiceSel" aria-label="목소리"></select></div>
      <div class="toggles">
        <button class="tg" id="ttsTg" aria-pressed="false">음성 읽기</button>
        <button class="tg tts-only" id="mathTg" aria-pressed="true">수식 읽기</button>
        <button class="tg" id="coreOnly" aria-pressed="false">핵심만</button>
        <button class="tg" id="dimTg" aria-pressed="true">흐리게</button>
        <button class="tg no-tts" id="pauseTg" aria-pressed="true">문장 쉼</button>
        <button class="tg" id="fsTg" aria-pressed="false" hidden>전체화면</button>
      </div>
      </div>
    </div>
  </div>

<script type="application/json" id="book-data">[{"num":"01","title":"회로이론","acc":"#2563EB","day":1,"secs":[{"id":"C01","title":"전하·전압·전류·전력: 단위로 식을 확인하기","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"전류는 단위 시간에 이동한 전하, 전압은 단위 전하당 에너지, 전력은 단위 시간당 에너지다.","core":1,"star":1},{"s":"전류의 양을 나타내는 A와 전하량을 나타내는 C를 구별한다.","core":0},{"s":"1 A가 1초 동안 흐르면 1 C의 전하가 이동한다.","core":0}]},{"t":"p","ss":[{"s":"저항에 전류가 흐르면 전기에너지가 열로 바뀐다.","core":0},{"s":"저항의 소비전력은 전압과 전류의 곱이며, 옴의 법칙을 넣으면 전류의 제곱에 저항을 곱한 식 또는 전압의 제곱을 저항으로 나눈 식을 얻는다.","core":0},{"s":"어느 식을 사용할지는 문제에서 무엇을 일정하게 유지했는지로 결정한다.","core":0}]},{"t":"p","ss":[{"s":"전압을 일정하게 유지할 때 저항이 커지면 전류와 전력이 감소한다.","core":0},{"s":"반대로 전류가 일정하면 저항이 커질수록 전력이 증가한다.","core":0},{"s":"‘저항이 커지면 발열이 커진다’처럼 조건 없이 외우지 않는다.","core":0},{"s":"교류에서 이 절의 저항 전력식에 넣는 V와 I는 실효값이다.","core":0}]},{"t":"m","tex":"i=\\frac{dq}{dt},\\quad v=\\frac{dw}{dq},\\quad p=\\frac{dw}{dt}=vi","note":"q: 전하 C, t: 시간 s, w: 에너지 J, v: 전압 V, i: 전류 A, p: 순간전력 W. 수동부호규약에서 전류가 +단자로 들어가면 p>0은 흡수."},{"t":"m","tex":"P=VI=I^2R=\\frac{V^2}{R},\\quad W=Pt","note":"일정한 직류 또는 저항의 정현파 정상상태. R: Ω. 에너지는 P[W]×t[s]이면 J, P[kW]×t[h]이면 kWh."},{"t":"m","tex":"1\\ \\mathrm{kWh}=3.6\\times10^6\\ \\mathrm{J}","note":"k=10³, m=10⁻³, μ=10⁻⁶, n=10⁻⁹. 수치 대입 전에 단위를 맞춘다."},{"t":"trap","items":["kW는 전력이고 kWh는 에너지다. kW/h로 쓰지 않는다.","μF를 F로 바꾸지 않고 대입하면 결과가 백만 배 어긋난다."]},{"t":"ex","q":"12 V가 걸린 6 Ω 저항의 전류, 전력, 10초 동안 소비한 에너지를 구하라.","steps":["옴의 법칙에서 I=12/6=2 A.","P=12×2=24 W. W=24×10=240 J."],"a":"2 A, 24 W, 240 J."},{"t":"chk","q":"같은 저항에 걸린 전압을 두 배로 하면 소비전력은 몇 배인가?","a":"4배. R이 일정할 때 P=V²/R이므로 전압의 제곱에 비례한다."}]},{"id":"C02","title":"직렬·병렬과 키르히호프: 회로를 읽는 순서","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"직렬은 같은 전류, 병렬은 같은 전압이다.","core":1,"star":1},{"s":"그림에서 부품이 나란히 놓였다는 모양만으로 병렬을 판단하지 않는다.","core":0},{"s":"부품의 양 끝이 각각 같은 두 마디에 연결되어 있어야 병렬이다.","core":0},{"s":"중간 마디에서 전류가 갈라지면 두 부품은 단순 직렬이 아니다.","core":0}]},{"t":"p","ss":[{"s":"KCL은 전하가 마디에 계속 쌓이지 않는다는 보존법칙이다.","core":0},{"s":"한 마디로 들어온 전류의 합은 나간 전류의 합과 같다.","core":0},{"s":"KVL은 닫힌 경로를 한 바퀴 돌면 전위가 원래대로 돌아온다는 법칙으로, 전압 상승과 강하를 부호 있게 합하면 0이다.","core":0}]},{"t":"p","ss":[{"s":"문제 풀이 순서는 기준 마디와 전류 방향을 임의로 정하고, 직병렬로 줄일 수 있는 부분을 먼저 줄인 뒤, KCL이나 KVL을 쓰는 것이다.","core":0},{"s":"계산 결과가 음수면 처음 정한 방향과 반대라는 뜻이다.","core":0},{"s":"휘스톤 브리지는 가운데 가지 전류가 0인 평형 조건에서만 양쪽 분압 전압이 같다.","core":0}]},{"t":"m","tex":"R_{\\mathrm{s}}=R_1+R_2,\\quad R_{\\mathrm{p}}=\\frac{R_1R_2}{R_1+R_2}","note":"R: 저항 Ω. 직렬 합성저항은 큰 저항보다 크고, 병렬 합성저항은 작은 저항보다 작아야 한다."},{"t":"m","tex":"V_1=V\\frac{R_1}{R_1+R_2},\\quad I_1=I\\frac{R_2}{R_1+R_2}","note":"두 저항 직렬의 분압과 두 저항 병렬의 분류. 분류식의 분자에는 반대편 저항이 온다."},{"t":"m","tex":"\\sum i=0,\\quad \\sum v=0","note":"마디의 KCL과 폐경로의 KVL. 미리 정한 부호를 일관되게 유지한다."},{"t":"trap","items":["전압계가 연결되면 그 내부저항도 회로의 일부가 될 수 있다.","브리지가 평형이 아닌데 가운데 저항을 지우면 안 된다. 평형비는 각 가지를 어떻게 이름 붙였는지 확인한다."]},{"t":"ex","q":"18 V 전원에 3 Ω과 6 Ω이 직렬 연결되어 있다. 6 Ω 저항의 전압을 구하라. 이어 두 저항을 병렬로 바꾸면 전체 전류는 얼마인가?","steps":["직렬일 때 합성저항은 9 Ω, 전류는 2 A이므로 6 Ω 전압은 12 V.","병렬일 때 합성저항은 3×6/(3+6)=2 Ω. 전체 전류는 18/2=9 A."],"a":"직렬 12 V, 병렬 전체 전류 9 A."},{"t":"chk","q":"한 마디로 5 A가 들어오고 두 가지로 2 A와 x A가 나간다. x는?","a":"3 A. 들어온 전류 5 A=나간 전류 2 A+x이다."}]},{"id":"C03","title":"복소수·복소공액·절댓값·위상과 페이저","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"복소수의 절댓값은 크기, 편각은 방향, 복소공액은 허수부의 부호만 바꾼 값이다.","core":1,"star":1},{"s":"전기에서는 전류 기호 i와 구분하기 위해 허수단위를 j로 쓰며 j²=-1이다.","core":0},{"s":"a+jb는 서로 직각인 두 성분을 표현하므로 크기는 a+b가 아니라 제곱합의 제곱근이다.","core":0}]},{"t":"p","ss":[{"s":"덧셈과 뺄셈은 실수부끼리·허수부끼리 계산하는 직교형이 편하다.","core":0},{"s":"곱셈과 나눗셈은 크기를 곱하거나 나누고 위상을 더하거나 빼는 극형이 편하다.","core":0},{"s":"분모가 복소수일 때는 분모의 복소공액을 분자·분모에 함께 곱하면 분모를 실수로 만들 수 있다.","core":0}]},{"t":"p","ss":[{"s":"페이저는 같은 주파수의 정현파에서 공통 시간변화를 생략한 복소수 표현이다.","core":0},{"s":"이 책의 페이저 크기는 실효값이다.","core":0},{"s":"순시값의 앞 계수인 최댓값과 혼동하지 않는다.","core":0},{"s":"위상은 arctan(b/a) 값만 쓰지 말고 a와 b의 부호로 사분면을 확인한다.","core":0},{"s":"실수부가 음수인 경우 특히 주의한다.","core":0}]},{"t":"m","tex":"z=a+jb=|z|e^{j\\theta},\\quad |z|=\\sqrt{a^2+b^2}","note":"a,b: 같은 단위의 실수부·허수부. θ: 편각. a>0일 때 θ=tan⁻¹(b/a); 일반적으로 사분면을 함께 판별."},{"t":"m","tex":"z^*=a-jb,\\quad zz^*=a^2+b^2=|z|^2","note":"별표는 복소공액이다. z* 자체가 |z|나 1/z는 아니다."},{"t":"m","tex":"\\frac{A\\angle\\alpha}{B\\angle\\beta}=\\frac{A}{B}\\angle(\\alpha-\\beta)","note":"A,B는 양의 크기. 위상 단위를 도 또는 rad 중 하나로 통일한다."},{"t":"m","tex":"v(t)=\\sqrt{2}V\\cos(\\omega t+\\theta)\\quad\\longleftrightarrow\\quad \\bar{V}=V\\angle\\theta","note":"V: 실효값 V. ω: rad/s. sin을 기준으로 삼아도 되지만 같은 문제 안에서 sin/cos 기준을 섞지 않는다."},{"t":"trap","items":["|a+jb|를 |a|+|b|로 계산하지 않는다.","서로 다른 주파수의 정현파는 하나의 페이저로 단순 합성하지 않는다."]},{"t":"ex","q":"Z=3+j4 Ω에 실효값 전압 V=10∠0° V를 인가했다. 전류를 구하라.","steps":["|Z|=5 Ω, 위상은 약 53.13°. 따라서 I=10/5∠(-53.13°).","직교형으로는 I=10(3-j4)/25=1.2-j1.6 A. 절댓값은 2 A다."],"a":"I=2∠-53.13° A=1.2-j1.6 A."},{"t":"chk","q":"z=-3+j4의 복소공액과 절댓값은?","a":"z*=-3-j4, |z|=5. 원래 z의 위상은 제2사분면에 있다."}]},{"id":"C04","title":"순시값·평균값·실효값: 파형을 혼동하지 않기","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"실효값은 같은 저항에서 같은 평균 열을 만드는 직류값이다.","core":1,"star":1},{"s":"전류가 음수인 동안에도 저항의 발열은 양수이므로, 실효값은 파형을 제곱하여 평균한 뒤 제곱근을 취한다.","core":0},{"s":"평균값은 단순한 면적의 평균이라 양·음이 상쇄될 수 있다.","core":0}]},{"t":"p","ss":[{"s":"대칭 정현파의 부호 있는 한 주기 평균은 0이다.","core":0},{"s":"그러나 정류형 계기나 전파정류파의 평균을 말할 때는 절댓값을 평균하므로 2Vm/π가 나온다.","core":0},{"s":"‘정현파 평균값’이라는 말만 보고 한 가지 숫자를 외우지 말고 반주기 평균인지, 정류평균인지, 한 주기 평균인지 확인한다.","core":0}]},{"t":"p","ss":[{"s":"0과 일정한 양의 값 사이를 오가는 펄스는 듀티비 D가 켜져 있는 시간의 비율이다.","core":0},{"s":"평균은 최대값에 D를 곱하고, 실효값은 최대값에 √D를 곱한다.","core":0},{"s":"같은 최대값이라도 듀티비가 작으면 평균과 발열 효과가 달라진다.","core":0}]},{"t":"m","tex":"f=\\frac{1}{T},\\quad \\omega=2\\pi f","note":"f: Hz, T: 주기 s, ω: 각주파수 rad/s."},{"t":"m","tex":"x_{\\mathrm{avg}}=\\frac{1}{T}\\int_0^T x(t)\\,dt,\\quad x_{\\mathrm{rms}}=\\sqrt{\\frac{1}{T}\\int_0^T x^2(t)\\,dt}","note":"x는 전압 또는 전류. 적분 구간은 정확히 한 주기를 사용한다."},{"t":"m","tex":"X_{\\mathrm{rms}}=\\frac{X_{\\mathrm{m}}}{\\sqrt{2}},\\quad X_{\\mathrm{rect,avg}}=\\frac{2X_{\\mathrm{m}}}{\\pi}","note":"정현파에만 해당. Xm: 최대값. 부호 있는 한 주기 평균은 0."},{"t":"m","tex":"X_{\\mathrm{avg}}=DX_{\\mathrm{m}},\\quad X_{\\mathrm{rms}}=\\sqrt{D}X_{\\mathrm{m}}","note":"0과 Xm 사이를 오가는 직사각형 펄스. D=Ton/T, 0≤D≤1."},{"t":"trap","items":["모든 파형의 실효값이 최대값/√2는 아니다.","실효값을 구할 때 전압의 제곱을 먼저 평균해야 한다. 평균을 낸 다음 제곱하지 않는다."]},{"t":"ex","q":"한 주기 중 25% 동안 8 A, 나머지 동안 0 A인 전류의 평균과 실효값을 구하라.","steps":["D=0.25이므로 평균은 8×0.25=2 A.","실효값은 8×√0.25=4 A. 평균과 실효값이 다르다."],"a":"평균 2 A, 실효값 4 A."},{"t":"chk","q":"최대값이 100√2 V인 정현파의 실효값과 부호 있는 한 주기 평균은?","a":"실효값 100 V, 한 주기 평균 0 V."}]},{"id":"C05","title":"콘덴서의 접속·전하·에너지","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"콘덴서는 전하와 전압을 연결하고 전기장에 에너지를 저장한다.","core":1,"star":1},{"s":"병렬은 전압이 같아 용량이 더해지고, 직렬은 중간 도체에 처음 순전하가 없는 일반 조건에서 각 콘덴서의 전하 크기가 같아 용량의 역수가 더해진다.","core":0},{"s":"저항의 직병렬 공식과 자리가 반대다.","core":0}]},{"t":"p","ss":[{"s":"정전용량이 크다는 것은 같은 전압을 만들기 위해 더 많은 전하를 저장할 수 있다는 뜻이다.","core":0},{"s":"에너지 식은 Q와 V의 관계를 이용해 세 형태로 바뀐다.","core":0},{"s":"전압이 일정한 상황에서는 에너지가 C에 비례하지만, 전하가 일정하면 에너지는 C에 반비례한다.","core":0},{"s":"무엇이 고정되는지가 결론을 바꾼다.","core":0}]},{"t":"p","ss":[{"s":"충전된 두 콘덴서를 전원에서 분리한 뒤 병렬로 연결하면 전체 전하를 이용해 최종 공통전압을 구한다.","core":0},{"s":"극성을 맞춰 연결했는지 반드시 확인한다.","core":0},{"s":"최종 정전 에너지는 처음 에너지보다 작을 수 있다.","core":0},{"s":"차이는 실제 연결선의 저항·방사 등으로 이동하며, 에너지 보존이 깨진 것이 아니다.","core":0}]},{"t":"m","tex":"Q=CV,\\quad W_C=\\frac{1}{2}CV^2=\\frac{Q^2}{2C}=\\frac{1}{2}QV","note":"C: 정전용량 F, Q: 전하 C, V: 전압 V, WC: 에너지 J. 기호 C가 용량과 쿨롱 단위에 함께 쓰이므로 문맥 구별."},{"t":"m","tex":"C_{\\mathrm{p}}=C_1+C_2,\\quad C_{\\mathrm{s}}=\\frac{C_1C_2}{C_1+C_2}","note":"이상적인 두 콘덴서의 병렬·직렬 등가용량."},{"t":"m","tex":"V_f=\\frac{C_1V_1+C_2V_2}{C_1+C_2}","note":"외부 전원과 분리된 두 콘덴서를 같은 기준 극성으로 병렬 연결한 뒤의 최종값. 반대 극성 전압은 음수로 대입."},{"t":"trap","items":["직렬 콘덴서는 용량이 작은 쪽 전압이 더 크다.","전원에 계속 연결된 경우 전원이 전하를 공급·흡수하므로 콘덴서만의 총전하가 일정하다고 두면 안 된다."]},{"t":"ex","q":"2 μF 콘덴서가 10 V로 충전되고 3 μF 콘덴서는 미충전이다. 전원 없이 같은 극성끼리 연결한 후 최종전압과 최종 에너지는?","steps":["초기 총전하는 2 μF×10 V=20 μC.","합성용량 5 μF이므로 최종전압은 20/5=4 V.","최종 에너지는 0.5×5 μF×4²=40 μJ. 초기 100 μJ와 차이 60 μJ는 연결 과정에서 다른 형태로 이동한다."],"a":"4 V, 40 μJ."},{"t":"chk","q":"2 μF와 3 μF를 100 V 전원에 병렬 연결했다. 전체 저장 에너지는?","a":"0.025 J=25 mJ. 전체 용량 5 μF에 W=CV²/2를 적용한다."}]},{"id":"C06","title":"콘덴서 전류: 미분식과 교류 실효값","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"콘덴서 전류는 전압 그 자체보다 전압이 변하는 속도에 비례한다.","core":1,"star":1},{"s":"전압이 일정하게 유지되는 직류 정상상태에서는 이상적인 콘덴서 전류가 0이다.","core":0},{"s":"반면 교류 전압은 계속 변하므로 충전·방전 전류가 흐른다.","core":0}]},{"t":"p","ss":[{"s":"정현파 전압을 미분하면 같은 주파수에서 위상이 90° 앞선 정현파가 된다.","core":0},{"s":"그래서 콘덴서 전류는 전압보다 90° 앞선다.","core":0},{"s":"주파수가 커질수록 같은 전압에서도 전류가 커지고, 전류 흐름을 방해하는 용량성 리액턴스의 크기는 작아진다.","core":0}]},{"t":"p","ss":[{"s":"교류 실효전류를 구할 때는 전압이 실효값인지 최대값인지부터 읽는다.","core":0},{"s":"전압 최대값에 ωC를 곱하면 전류 최대값이고, 전압 실효값에 곱하면 전류 실효값이다.","core":0},{"s":"서로 다른 종류의 값을 곱한 다음 뒤늦게 √2를 붙이는 실수를 피한다.","core":0}]},{"t":"m","tex":"i_C(t)=C\\frac{dv_C(t)}{dt}","note":"iC: A, C: F, dv/dt: V/s. 콘덴서 +단자로 들어가는 전류 기준."},{"t":"m","tex":"Z_C=\\frac{1}{j\\omega C}=-j\\frac{1}{\\omega C},\\quad I_{\\mathrm{rms}}=\\omega CV_{\\mathrm{rms}}","note":"ZC: Ω, ω=2πf rad/s. 이상적인 정현파 정상상태."},{"t":"m","tex":"v_C(0^+)=v_C(0^-)","note":"유한한 전류만 허용하는 통상적인 스위칭 회로에서는 콘덴서 전압이 연속이다. 이상적인 충격전류가 있으면 별도 해석."},{"t":"trap","items":["직류 연결 직후와 직류 정상상태를 구별한다.","콘덴서 병렬회로에서는 각 가지 전류가 용량에 비례한다. 모든 가지에 전류가 똑같이 흐르는 것이 아니다."]},{"t":"ex","q":"C=50 μF에 각주파수 1000 rad/s, 실효전압 20 V가 걸린다. 실효전류와 위상은?","steps":["I=1000×50×10⁻⁶×20=1 A.","순수 콘덴서 전류는 전압보다 90° 앞선다."],"a":"1 A, 전압보다 90° 진상."},{"t":"chk","q":"2 μF 콘덴서 전압이 1 ms 동안 3 V만큼 일정한 기울기로 증가했다. 전류는?","a":"6 mA. 변화율 3 V/ms=3000 V/s에 2×10⁻⁶ F를 곱한다."}]},{"id":"C07","title":"인덕턴스·상호인덕턴스와 결합 극성","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"인덕터는 전류 변화를 방해하고 자기장에 에너지를 저장한다.","core":1,"star":1},{"s":"전류가 일정하면 이상적인 인덕터 양단 전압은 0이므로 직류 정상상태에서는 단락으로 본다.","core":0},{"s":"그러나 전류가 급격히 바뀌려 하면 큰 전압이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"한 코일의 전류 변화가 다른 코일과 쇄교하는 자속을 변화시키면 상호유도전압이 생긴다.","core":0},{"s":"상호인덕턴스 M은 이 결합의 크기를 나타낸다.","core":0},{"s":"결합계수 k는 모든 자속이 상대 코일과 결합하는 정도를 나타내며 일반적인 수동 두 코일에서 0 이상 1 이하이다.","core":0}]},{"t":"p","ss":[{"s":"직렬 결합의 합성 인덕턴스에는 자기인덕턴스뿐 아니라 상호항 ±2M이 들어간다.","core":0},{"s":"점 표시 단자에 대한 전류 방향을 보고 두 자속이 더해지는 가동인지, 상쇄되는 차동인지 결정한다.","core":0},{"s":"점 표시를 무시하고 무조건 +2M을 쓰지 않는다.","core":0},{"s":"그림이 없으면 문제의 ‘가동·차동’ 조건을 읽는다.","core":0}]},{"t":"p","ss":[{"s":"직렬로 흐르는 한 전류가 두 코일의 점 단자로 모두 들어가거나 모두 나오면 가동이고, 한 코일의 점으로 들어가 다른 코일의 점에서 나오면 차동이다.","core":0},{"s":"도면에서 점끼리를 연결했는지만 보지 말고 실제 전류 화살표를 따라 판단한다.","core":0},{"s":"결합 코일의 전압식을 쓸 때 두 전류를 각각 점으로 들어가는 방향, 두 전압을 점 쪽이 +인 방향으로 정하면 상호항은 +M이다.","core":0},{"s":"한 코일의 전류·전압 기준을 함께 반대로 정하면 상호항은 -M이 된다.","core":0}]},{"t":"m","tex":"v_L=L\\frac{di_L}{dt},\\quad W_L=\\frac{1}{2}Li_L^2","note":"L: H, 전류 A, 전압 V, 저장 에너지 J. 유한한 전압 조건에서 인덕터 전류는 연속."},{"t":"m","tex":"M=k\\sqrt{L_1L_2},\\quad 0\\leq k\\leq1","note":"M,L1,L2는 같은 H 단위. 완전 결합은 k=1, 결합 없음은 k=0."},{"t":"m","tex":"v_1=L_1\\frac{di_1}{dt}+M\\frac{di_2}{dt},\\quad v_2=M\\frac{di_1}{dt}+L_2\\frac{di_2}{dt}","note":"두 전류가 각각 점 단자로 들어가고 두 전압의 +가 점 단자일 때. M은 결합 크기를 나타내는 비음수 값으로 두고 기준 방향에 따라 상호항 부호를 정한다."},{"t":"m","tex":"L_{\\mathrm{aiding}}=L_1+L_2+2M,\\quad L_{\\mathrm{opposing}}=L_1+L_2-2M","note":"두 코일을 직렬 접속한 경우. 병렬 접속 공식으로 사용하지 않는다."},{"t":"trap","items":["같은 전류가 흐른다고 인덕터의 에너지가 LI²가 되는 것은 아니다. 1/2가 필요하다.","패러데이 유도기전력의 부호와 수동부호규약으로 정의한 단자전압의 부호를 구분한다."]},{"t":"ex","q":"L1=9 mH, L2=16 mH, k=0.5인 두 코일의 M과 직렬 가동·차동 합성값을 구하라.","steps":["M=0.5×√(9×16)=6 mH.","가동은 9+16+12=37 mH, 차동은 9+16-12=13 mH."],"a":"M=6 mH, 가동 37 mH, 차동 13 mH."},{"t":"chk","q":"L=0.2 H에 3 A가 흐를 때 저장 에너지는?","a":"0.9 J. WL=0.5×0.2×3²이다."}]},{"id":"C08","title":"RLC 교류회로: 임피던스와 어드미턴스","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"직렬회로는 임피던스를 더하고, 병렬회로는 어드미턴스를 더한다.","core":1,"star":1},{"s":"임피던스 Z는 전압/전류이며 저항 R과 리액턴스 X를 합한 복소수다.","core":0},{"s":"어드미턴스 Y는 1/Z이며 컨덕턴스 G와 서셉턴스 B로 나뉜다.","core":0}]},{"t":"p","ss":[{"s":"순수 저항은 전압과 전류가 같은 위상이다.","core":0},{"s":"인덕터는 전류가 전압보다 90° 늦고, 콘덴서는 90° 빠르다.","core":0},{"s":"직렬 RLC에서는 XL-XC의 부호로 전체 유도성·용량성을 판별한다.","core":0},{"s":"양수면 유도성이므로 전류가 늦고, 음수면 용량성이므로 전류가 앞선다.","core":0}]},{"t":"p","ss":[{"s":"병렬회로는 전압이 공통이므로 각 가지 전류를 더한다.","core":0},{"s":"저항 가지는 실수 전류, L 가지는 음의 허수 전류, C 가지는 양의 허수 전류로 합친다.","core":0},{"s":"전류 크기를 산술적으로 더하면 위상 차이가 사라져 틀린다.","core":0},{"s":"전체 Y의 허수부가 양수면 용량성 전류가 우세하다.","core":0}]},{"t":"m","tex":"Z_R=R,\\quad Z_L=j\\omega L,\\quad Z_C=-\\frac{j}{\\omega C}","note":"정현파 정상상태의 이상소자. 모두 Ω 단위."},{"t":"m","tex":"Z_{\\mathrm{series}}=R+j\\left(\\omega L-\\frac{1}{\\omega C}\\right)","note":"|Z|=√(R²+X²), 실효전류의 크기 I=V/|Z|."},{"t":"m","tex":"Y_{\\mathrm{parallel}}=\\frac{1}{R}+j\\left(\\omega C-\\frac{1}{\\omega L}\\right)","note":"각 R,L,C가 별도 병렬 가지인 경우. Y,G,B의 단위는 S(지멘스)."},{"t":"m","tex":"G=\\frac{R}{R^2+X^2},\\quad B=-\\frac{X}{R^2+X^2}","note":"Z=R+jX를 역수로 만든 결과. 일반적으로 G=1/R이라고 놓을 수 없다."},{"t":"trap","items":["G=1/R은 순수 저항 또는 병렬 가지의 저항을 따로 표현할 때다. 복합 Z의 실수부 R을 그냥 뒤집지 않는다.","서로 다른 주파수의 성분에는 각각 다른 XL, XC를 적용한다."]},{"t":"ex","q":"R=6 Ω, XL=10 Ω, XC=2 Ω이 직렬이고 실효전압은 50 V다. 전류 크기와 진상·지상을 구하라.","steps":["X=10-2=8 Ω, Z=6+j8 Ω, |Z|=10 Ω.","I=50/10=5 A. X>0이므로 전류는 전압보다 늦는다."],"a":"5 A, 지상."},{"t":"chk","q":"순수 R과 C의 병렬에서 저항전류 3 A, 콘덴서 전류 4 A라면 전체 실효전류 크기는?","a":"5 A. 두 전류의 위상차가 90°이므로 √(3²+4²)를 사용한다."}]},{"id":"C09","title":"유효·무효·피상전력과 복소전력","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"유효전력 P는 평균적으로 소비되는 전력, 무효전력 Q는 저장소자와 왕복하는 효과, 피상전력 S는 전체 전압·전류 실효값의 곱이다.","core":1,"star":1},{"s":"정현파에서는 P와 Q를 직각 성분으로 놓고 피상전력 크기를 구한다.","core":0}]},{"t":"p","ss":[{"s":"복소전력은 전압 페이저에 전류 페이저의 복소공액을 곱한다.","core":0},{"s":"전류가 늦는 유도성 부하의 Q는 양수, 전류가 앞서는 용량성 부하의 Q는 음수로 정하는 수동부호규약을 사용한다.","core":0},{"s":"순수 L이나 C는 평균 유효전력을 소비하지 않지만 전류는 흐르므로 피상전력은 0이 아닐 수 있다.","core":0}]},{"t":"p","ss":[{"s":"역률은 P/S이다.","core":0},{"s":"정현파 전압·전류에서는 위상차의 cos와 같지만 파형에 고조파가 있으면 cosφ만으로 전체 역률을 표현할 수 없다.","core":0},{"s":"병렬 부하의 전력은 유효전력끼리, 무효전력끼리 더한 후 마지막에 피상전력을 구한다.","core":0},{"s":"개별 피상전력의 크기를 바로 더하지 않는다.","core":0}]},{"t":"m","tex":"\\mathcal{S}=\\bar{V}\\bar{I}^{*}=P+jQ","note":"V,I는 실효값 페이저. 최대값 페이저를 사용하면 오른쪽 계산에 1/2가 필요하다."},{"t":"m","tex":"P=VI\\cos\\phi,\\quad Q=VI\\sin\\phi,\\quad S=VI=\\sqrt{P^2+Q^2}","note":"정현파 단상. φ=전압 위상-전류 위상. P: W, Q: var, S: VA."},{"t":"m","tex":"\\mathrm{pf}=\\frac{P}{S},\\quad P=I^2R,\\quad Q=I^2X","note":"Z=R+jX의 수동부하. X>0 유도성, X<0 용량성."},{"t":"trap","items":["피상전력 S와 복소전력 P+jQ를 구별한다. S는 음수가 아닌 크기다.","정현파가 아닌 일반 파형에 S²=P²+Q²를 무조건 적용하지 않는다."]},{"t":"ex","q":"실효전압 100 V, 실효전류 5 A이고 전류가 36.87° 늦는다. P,Q,S와 역률은?","steps":["S=100×5=500 VA.","cos36.87°=0.8, sin36.87°=0.6이므로 P=400 W, Q=300 var.","전류가 늦으므로 지상 역률 0.8이다."],"a":"400 W, 300 var, 500 VA, 지상 0.8."},{"t":"chk","q":"P=300 W, Q=-400 var인 부하의 피상전력과 성격은?","a":"500 VA, 용량성. Q가 음수이므로 진상 전류를 갖는다."}]},{"id":"C10","title":"비정현파·왜형률: 다른 주파수는 제곱합","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"서로 다른 정수배 주파수의 정현파들은 한 기본주기에서 서로 직교하므로 실효값은 제곱합의 제곱근으로 합친다.","core":1,"star":1},{"s":"기본파는 가장 낮은 기준 주파수 성분, 고조파는 그 정수배 성분이다.","core":0},{"s":"직류 성분이 있으면 그 값의 제곱도 전체 실효값에 포함한다.","core":0}]},{"t":"p","ss":[{"s":"왜형률 THD는 기본파에 비해 고조파 성분이 얼마나 큰지를 나타낸다.","core":0},{"s":"분자는 2차 이상 고조파 실효값들의 제곱합 제곱근, 분모는 기본파 실효값이다.","core":0},{"s":"전체 실효값을 분모로 쓰지 않는다.","core":0},{"s":"모든 성분이 정현파 최대값으로 주어졌다면 같은 √2가 약분되어 비율만은 최대값끼리 계산할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"비정현파 전력은 같은 차수의 전압과 전류 성분끼리 평균전력을 만들고, 다른 차수 사이의 곱은 한 기본주기 평균에서 0이 된다.","core":0},{"s":"피상전력은 여전히 전체 Vrms×Irms다.","core":0},{"s":"정현파 전압에 고조파 전류가 흐르면 기본파 전류의 위상이 같더라도 전체 역률이 1보다 작아질 수 있다.","core":0}]},{"t":"m","tex":"X_{\\mathrm{rms}}=\\sqrt{X_0^2+X_1^2+X_2^2+\\cdots}","note":"X0: 직류값, Xn: n차 정현파 성분의 실효값. 공통 기본주기에 대해 계산."},{"t":"m","tex":"\\mathrm{THD}=\\frac{\\sqrt{X_2^2+X_3^2+\\cdots}}{X_1}","note":"무차원 비율. 백분율을 묻는 경우 100을 곱한다. 통상 직류 성분은 THD 분자에서 제외."},{"t":"m","tex":"P=V_0I_0+\\sum_{n=1}^{\\infty}V_nI_n\\cos\\phi_n,\\quad S=V_{\\mathrm{rms}}I_{\\mathrm{rms}}","note":"Vn,In: 같은 차수 성분의 실효값, φn: 그 전압·전류의 위상차."},{"t":"trap","items":["고조파 3 A와 4 A를 더해 7 A로 놓지 않는다.","왜형률은 100%를 넘을 수 있다. 1보다 크다는 이유만으로 계산 오류라고 판단하지 않는다."]},{"t":"ex","q":"기본파 전류가 10 A, 3차가 3 A, 5차가 4 A이며 모두 실효값이다. 고조파 합성값, 전체 실효값, THD를 구하라.","steps":["고조파 합성값은 √(3²+4²)=5 A.","전체는 √(10²+3²+4²)=5√5≈11.18 A.","THD=5/10=0.5=50%."],"a":"고조파 5 A, 전체 약 11.18 A, THD 50%."},{"t":"chk","q":"기본파 12 V와 3차 고조파 5 V만 있을 때 전체 실효전압은?","a":"13 V. 두 값이 실효값이므로 √(12²+5²)=13이다."}]},{"id":"C11","title":"테브난·노턴: 부하가 바라보는 등가회로","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"테브난은 전압원과 직렬저항, 노턴은 전류원과 병렬저항으로 같은 두 단자 특성을 표현한다.","core":1,"star":1},{"s":"등가란 내부 부품이 실제로 같다는 뜻이 아니라, 같은 부하를 연결했을 때 단자 전압과 전류가 같다는 뜻이다.","core":0}]},{"t":"p","ss":[{"s":"테브난 전압은 부하를 떼어 낸 개방상태의 단자전압이다.","core":0},{"s":"노턴 전류는 그 두 단자를 단락했을 때 흐르는 전류다.","core":0},{"s":"두 등가회로의 저항은 같다.","core":0},{"s":"독립전원만 있는 저항회로에서는 전원을 0으로 만든 뒤 단자에서 바라본 저항을 구할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"전압원을 0 V로 만들면 양단 전압이 0이므로 단락이고, 전류원을 0 A로 만들면 전류가 0이므로 개방이다.","core":0},{"s":"‘전원을 없앤다’고 해서 모두 끊는 것이 아니다.","core":0},{"s":"종속전원이 있다면 그것은 그대로 두고 시험 전압원·전류원 등을 써야 하며, 단순 전원 제거법을 기계적으로 적용하지 않는다.","core":0}]},{"t":"m","tex":"V_{\\mathrm{th}}=V_{\\mathrm{oc}},\\quad I_{\\mathrm{N}}=I_{\\mathrm{sc}},\\quad R_{\\mathrm{th}}=R_{\\mathrm{N}}","note":"Voc: 개방전압 V, Isc: 단락전류 A. 부호는 정한 단자 극성과 전류 방향에 따른다."},{"t":"m","tex":"V_{\\mathrm{th}}=I_{\\mathrm{N}}R_{\\mathrm{th}},\\quad I_L=\\frac{V_{\\mathrm{th}}}{R_{\\mathrm{th}}+R_L}","note":"선형 직류 저항회로. 교류는 저항 대신 해당 주파수의 임피던스를 사용한다."},{"t":"trap","items":["테브난 전압을 구할 때 부하저항을 남겨두면 개방전압이 아니다.","이상전압원의 내부저항은 0, 이상전류원의 내부저항은 ∞다. 실제 외부저항과 혼동하지 않는다."]},{"t":"ex","q":"두 단자의 개방전압이 12 V이고 단락전류가 3 A이다. 등가저항과 8 Ω 부하를 연결했을 때 부하전류는?","steps":["Rth=12/3=4 Ω.","부하전류는 12/(4+8)=1 A."],"a":"Rth=4 Ω, 부하전류 1 A."},{"t":"chk","q":"독립전압원과 독립전류원을 0으로 만들 때 각각 무엇으로 바꾸는가?","a":"전압원은 단락, 전류원은 개방. 종속전원은 임의로 끄지 않는다."}]},{"id":"C12","title":"중첩·밀만·쌍대관계: 헷갈리는 이름 묶기","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"중첩은 전압·전류를 더하고, 밀만은 병렬 가지의 공통전압을 구하며, 쌍대는 회로 법칙의 대응관계를 말한다.","core":1,"star":1},{"s":"서로 다른 이름의 공식을 한 문제에 모두 적용하려 하지 말고 회로 구조에 맞는 방법 하나를 고른다.","core":0}]},{"t":"p","ss":[{"s":"중첩의 정리는 선형회로에서 독립전원을 하나씩 작용시켜 얻은 전압·전류를 부호 있게 더하는 방법이다.","core":0},{"s":"전력은 전압이나 전류의 제곱이므로 전원별 전력을 그대로 더하지 않는다.","core":0},{"s":"밀만 정리는 전압원과 직렬저항이 한 가지를 이루고 이런 가지들이 병렬로 만날 때 KCL을 한 번에 정리한 식이다.","core":0}]},{"t":"p","ss":[{"s":"밀만 식의 분자는 각 가지의 전압/저항, 분모는 컨덕턴스 합이다.","core":0},{"s":"전원이 없는 저항 가지도 전압원 0 V인 가지로 보아 분모에 포함한다.","core":0},{"s":"쌍대관계에서는 직렬↔병렬, 전압↔전류, 저항↔컨덕턴스, KVL↔KCL, 테브난↔노턴이 대응한다.","core":0},{"s":"쌍대라는 말이 두 물리량의 수치가 항상 같다는 뜻은 아니다.","core":0}]},{"t":"m","tex":"V=\\frac{\\sum_k E_k/R_k}{\\sum_k 1/R_k}","note":"공통 기준점에서 본 각 가지 전압원 Ek[V]와 직렬저항 Rk[Ω]. 반대 극성 전압원은 음수로 대입. 별도 병렬 부하 RL은 E=0 가지로 포함."},{"t":"m","tex":"G=\\frac{1}{R},\\quad I=GV","note":"순수 저항의 컨덕턴스 G[S]. 저항 R[Ω]과의 쌍대관계를 기억한다."},{"t":"tb","h":["대상","쌍대 대상"],"r":[["전압·전압원","전류·전류원"],["저항 R","컨덕턴스 G"],["인덕턴스 L","정전용량 C"],["직렬·KVL","병렬·KCL"],["개방","단락"],["테브난 정리","노턴 정리"]]},{"t":"trap","items":["밀만 식에서 전원이 없는 부하 가지를 분모에서 빼먹지 않는다.","중첩을 쓸 때 종속전원은 유지한다. 다른 독립전원만 0으로 만든다."]},{"t":"ex","q":"공통 마디와 접지 사이에 (12 V 전원+6 Ω), (6 V 전원+3 Ω), (전원 없는 6 Ω) 세 가지가 병렬이다. 전원들의 +방향은 마디를 향한다. 공통전압은?","steps":["분자는 12/6+6/3+0/6=4 A.","분모는 1/6+1/3+1/6=2/3 S.","V=4/(2/3)=6 V."],"a":"6 V."},{"t":"chk","q":"노턴 정리와 저항 R의 쌍대 대상을 각각 말하라.","a":"노턴↔테브난, 저항 R↔컨덕턴스 G. 노턴은 전류원 병렬형, 테브난은 전압원 직렬형이다."}]},{"id":"C13","title":"배율기·분류기와 측정기의 연결","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"전압계는 대상에 병렬, 전류계는 대상에 직렬이다.","core":1,"star":1},{"s":"전압계의 측정 범위를 넓히는 배율기는 전압계에 직렬, 전류계의 측정 범위를 넓히는 분류기는 전류계에 병렬이다.","core":0},{"s":"‘계기와 대상의 연결’과 ‘범위 확장 저항과 계기의 연결’을 따로 기억한다.","core":0}]},{"t":"p","ss":[{"s":"전압계는 내부에 정해진 최대 전류만 흘러야 하므로, 더 큰 외부 전압을 측정하려면 남는 전압을 직렬 저항에 나누어 걸어야 한다.","core":0},{"s":"전류계는 전체 전류 중 일부만 계기로 보내고 나머지는 저항이 작은 병렬 우회로로 흘려야 한다.","core":0}]},{"t":"p","ss":[{"s":"이상전압계는 회로에서 전류를 거의 빼앗지 않도록 내부저항이 무한대이고, 이상전류계는 회로에 전압강하를 거의 만들지 않도록 내부저항이 0이다.","core":0},{"s":"실제 계기는 유한한 내부저항 때문에 측정 대상 회로를 변화시킨다.","core":0},{"s":"이 부하효과는 계기의 단순 오차와 구별되는 개념이다.","core":0}]},{"t":"m","tex":"R_m=(m-1)R_v,\\quad m=\\frac{V_{\\mathrm{new}}}{V_{\\mathrm{old}}}","note":"배율기 Rm[Ω]는 내부저항 Rv인 전압계에 직렬. m>1."},{"t":"m","tex":"R_s=\\frac{R_a}{m-1},\\quad m=\\frac{I_{\\mathrm{new}}}{I_{\\mathrm{old}}}","note":"분류기 Rs[Ω]는 내부저항 Ra인 전류계에 병렬. 계기 자체의 최대전류는 유지."},{"t":"trap","items":["배율기에 R/(m-1)을 쓰면 분류기 공식과 바뀐 것이다.","전류계를 전원 양단에 병렬로 연결하는 것은 올바른 전류 측정법이 아니다."]},{"t":"ex","q":"최대 10 V, 내부저항 2 kΩ인 전압계로 50 V까지 측정하려 한다. 배율기 저항은?","steps":["확장배율 m=50/10=5.","Rm=(5-1)×2 kΩ=8 kΩ. 계기와 직렬로 연결한다."],"a":"8 kΩ, 직렬."},{"t":"chk","q":"내부저항 1 Ω인 전류계의 범위를 5배로 넓히는 분류기 저항은?","a":"0.25 Ω. Rs=1/(5-1)이며 계기에 병렬 연결한다."}]},{"id":"C14","title":"평형 3상과 영상분: 크기 합과 벡터 합","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"평형 3상은 같은 크기의 정현파 세 개가 120°씩 어긋난 상태다.","core":1,"star":1},{"s":"따라서 세 상의 크기를 산술적으로 더하는 것이 아니라 페이저를 합해야 한다.","core":0},{"s":"완전한 평형 3상 정상분의 페이저 합은 0이다.","core":0}]},{"t":"p","ss":[{"s":"Y결선은 선전류와 상전류가 같고 선간전압 크기가 상전압의 √3배다.","core":0},{"s":"Δ결선은 선간전압과 상전압이 같고 선전류 크기가 상전류의 √3배다.","core":0},{"s":"부하 임피던스는 한 상에 걸린 전압을 그 상의 전류로 나눠 구한다.","core":0},{"s":"선간전압을 상임피던스로 바로 나누면 결선에 따라 틀린다.","core":0}]},{"t":"p","ss":[{"s":"대칭좌표법은 불평형 3상을 정상분·역상분·영상분으로 나누는 방법이다.","core":0},{"s":"영상분은 세 상에 동일 위상·동일 크기로 존재하는 성분으로, 세 상의 페이저 합을 3으로 나누어 구한다.","core":0},{"s":"중성선 전류는 전류 방향 기준에 따라 부호가 달라지지만 크기는 3I0에 대응한다.","core":0},{"s":"접지나 중성선 경로가 없으면 영상전류의 경로가 제한된다.","core":0}]},{"t":"m","tex":"V_L=\\sqrt{3}V_{\\mathrm{ph}},\\ I_L=I_{\\mathrm{ph}}\\quad (Y)","note":"평형 Y결선의 크기 관계. 선간전압과 상전압 사이에는 위상차도 있다."},{"t":"m","tex":"V_L=V_{\\mathrm{ph}},\\ I_L=\\sqrt{3}I_{\\mathrm{ph}}\\quad (\\Delta)","note":"평형 Δ결선의 크기 관계."},{"t":"m","tex":"P=\\sqrt{3}V_LI_L\\cos\\phi","note":"평형 정현파 3상 총 유효전력 W. VL,IL은 실효값."},{"t":"m","tex":"\\bar{V}_0=\\frac{\\bar{V}_a+\\bar{V}_b+\\bar{V}_c}{3},\\quad \\bar{I}_0=\\frac{\\bar{I}_a+\\bar{I}_b+\\bar{I}_c}{3}","note":"모든 항은 같은 기준의 페이저. 0은 영상분 첨자다."},{"t":"trap","items":["100 V씩 3상이라고 V0=100 V가 되는 것이 아니다. 위상을 합쳐야 한다.","정상분·역상분·영상분의 이름과 정상상태·과도상태는 전혀 다른 분류다."]},{"t":"ex","q":"세 상 전압이 100∠0°, 100∠-120°, 100∠120° V이다. 영상전압은? 여기에 각 상에 동일한 6 V 직류가 아닌 같은 주파수의 6∠0° 성분이 추가되면?","steps":["원래 세 페이저 합은 0이므로 영상전압은 0 V.","공통 성분의 합은 18∠0° V이므로 3으로 나누면 6∠0° V다."],"a":"처음 0 V, 공통 정현파 성분 추가 후 6∠0° V."},{"t":"chk","q":"세 상 전류의 페이저 합이 12∠0° A이다. 영상전류 I0는?","a":"4∠0° A. 세 상의 합을 3으로 나눈다."}]},{"id":"C15","title":"RC·RL 과도현상: 초기값·최종값·시정수","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"유한한 전압·전류 조건에서 콘덴서 전압과 인덕터 전류는 갑자기 바뀌지 않는다.","core":1,"star":1},{"s":"스위치가 바뀌기 직전의 저장상태를 먼저 구한 뒤 직후에 넘겨야 한다.","core":0},{"s":"미충전 콘덴서가 처음에는 단락처럼 보인다는 말은 초기전압이 0인 특정 조건을 줄여 말한 것이다.","core":0}]},{"t":"p","ss":[{"s":"직류가 충분히 오래 유지된 최종상태에서는 이상적인 C는 개방, L은 단락이다.","core":0},{"s":"직후 회로와 최종 회로를 별도로 그려 초기값과 최종값을 구한다.","core":0},{"s":"시정수는 변화가 얼마나 빠른지 나타내며, 1τ 뒤에는 전체 변화량의 약 63.2%만큼 진행하고 남은 차이는 약 36.8%다.","core":0}]},{"t":"p","ss":[{"s":"시정수의 저항은 에너지 저장소자가 바라본 등가저항이다.","core":0},{"s":"실제 회로의 모든 저항을 단순 합한 값이 아니다.","core":0},{"s":"독립전원은 0으로 만들고 C나 L의 단자에서 저항을 구한다.","core":0},{"s":"RC는 저항이 커지면 느려지지만 RL은 저항이 커지면 저장전류가 더 빨리 소멸하여 τ가 작아진다.","core":0}]},{"t":"m","tex":"x(t)=x_f+(x_i-x_f)e^{-t/\\tau}","note":"1차 안정회로의 상태값 x. RC에서는 vC, RL에서는 iL. xi=0+ 값, xf=충분히 지난 값."},{"t":"m","tex":"\\tau_{RC}=R_{\\mathrm{eq}}C,\\quad \\tau_{RL}=\\frac{L}{R_{\\mathrm{eq}}}","note":"τ: s, Req: 저장소자에서 본 Ω. 종속전원이 있으면 등가저항 계산에 주의."},{"t":"m","tex":"e^{-1}\\simeq0.368,\\quad 1-e^{-1}\\simeq0.632","note":"초깃값이 0인 충전 응답은 τ에서 최종값의 63.2%. 일반 응답은 전체 변화량 기준."},{"t":"trap","items":["C를 모든 순간 개방, L을 모든 순간 단락으로 놓지 않는다.","5τ는 약 99.3% 도달이라는 근사다. 지수응답이 유한시간에 정확히 최종값이 되는 것은 아니다."]},{"t":"ex","q":"미충전 10 μF 콘덴서를 10 kΩ을 통해 12 V 직류에 연결한다. 시정수, 초기 충전전류, τ 뒤 전압은?","steps":["τ=10⁴×10×10⁻⁶=0.1 s.","처음 C 전압은 0이므로 초기전류는 12/10000=1.2 mA.","τ 뒤 전압은 12×0.632≈7.58 V."],"a":"0.1 s, 1.2 mA, 약 7.58 V."},{"t":"chk","q":"L=0.2 H가 10 Ω을 통해 방전한다. 시정수는?","a":"0.02 s=20 ms. τ=L/R이다."}]},{"id":"C16","title":"RLC 공진과 감쇠: 물리적 의미부터","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"공진은 L과 C의 반대 부호 리액턴스 또는 서셉턴스가 서로 상쇄되는 상태다.","core":1,"star":1},{"s":"이상적인 직렬 RLC에서는 전체 임피던스가 R만 남아 전원전류가 가장 커진다.","core":0},{"s":"각 소자가 따로 병렬인 이상 RLC에서는 전체 서셉턴스가 0이 되어 전원에서 본 전류가 가장 작아진다.","core":0}]},{"t":"p","ss":[{"s":"직렬 공진에서 L과 C 양단전압은 각각 day":2,"b":[{"t":"p","ss":[{"s":"라플라스 변환은 시간함수를 s의 함수로 바꾸어 미분·적분 관계를 대수식처럼 계산하게 해준다.","core":1,"star":1},{"s":"s는 단순한 실수 주파수가 아니라 실수부와 허수부를 가진 복소변수다.","core":0},{"s":"주파수응답을 구할 때 s=jω로 놓는 것과 일반적인 라플라스 영역을 구별한다.","core":0}]},{"t":"p","ss":[{"s":"필수 변환은 단위계단 1/s, 단위램프 1/s², 감쇠지수 1/(s+a), 임펄스 1이다.","core":0},{"s":"입력이 갑자기 일정값으로 바뀌면 계단, 일정한 기울기로 커지면 램프다.","core":0},{"s":"같은 시스템이어도 입력이 달라지면 출력과 정상편차가 달라지므로 입력의 이름을 먼저 확인한다.","core":0}]},{"t":"p","ss":[{"s":"초기조건이 0일 때 미분은 s를 곱하는 연산이 되어 편리하다.","core":0},{"s":"그러나 초기값이 존재하면 그 항을 빼야 한다.","core":0},{"s":"전달함수에서 초기조건을 0으로 두는 이유가 여기에 있다.","core":0},{"s":"표를 외울 때 시간함수와 변환함수를 거꾸로 적지 말고, 지수의 부호도 함께 묶는다.","core":0},{"s":"e^(-at)는 s+a와 연결된다.","core":0}]},{"t":"m","tex":"\\mathcal{L}\\{1\\}=\\frac{1}{s},\\quad \\mathcal{L}\\{t\\}=\\frac{1}{s^2},\\quad \\mathcal{L}\\{\\delta(t)\\}=1","note":"t≥0에서 단위계단·단위램프·단위임펄스. 실제 물리 입력의 진폭이 A이면 변환에도 A를 곱한다."},{"t":"m","tex":"\\mathcal{L}\\{e^{-at}\\}=\\frac{1}{s+a},\\quad \\mathcal{L}\\{\\sin\\omega t\\}=\\frac{\\omega}{s^2+\\omega^2}","note":"a>0이면 감쇠지수. a와 ω의 단위는 s⁻¹ 또는 rad/s에 해당한다."},{"t":"m","tex":"\\mathcal{L}\\left\\{\\frac{df}{dt}\\right\\}=sF(s)-f(0^-),\\quad \\mathcal{L}\\{\\cos\\omega t\\}=\\frac{s}{s^2+\\omega^2}","note":"단측 라플라스의 통상 초기조건 표기. 교재에 따라 0 또는 0-로 쓴다."},{"t":"trap","items":["상수 1의 변환과 임펄스의 변환을 바꾸지 않는다.","1/(s+a)의 역변환을 e^(+at)로 쓰지 않는다."]},{"t":"ex","q":"F(s)=3/s-3/(s+2)의 시간함수와 t=0, 충분히 지난 값은?","steps":["1/s는 1, 1/(s+2)는 e^(-2t)로 바꾼다.","f(t)=3(1-e^(-2t)). t=0에서 0, t→∞에서 3이다."],"a":"f(t)=3(1-e^(-2t)), 초기값 0, 최종값 3."},{"t":"chk","q":"크기 4의 계단입력과 기울기 4의 램프입력의 변환은?","a":"각각 4/s와 4/s². 계단은 일정값, 램프는 4t로 계속 증가한다."}]},{"id":"T02","title":"전달함수·극점·영점: 정의부터 정리","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"전달함수는 초기조건이 0인 선형 시불변 시스템에서 출력의 라플라스 변환을 입력의 라플라스 변환으로 나눈 비다.","core":1,"star":1},{"s":"시간함수 y(t)/r(t)를 그대로 나눈 것이 아니며, 입력/출력이 아니라 출력/입력이다.","core":0},{"s":"시불변은 입력을 늦추면 출력도 같은 만큼 늦춰지는 성질이다.","core":0}]},{"t":"p","ss":[{"s":"전달함수는 입력의 특정 파형이 아니라 시스템의 입출력 관계를 나타낸다.","core":0},{"s":"실제 출력은 전달함수에 입력 변환을 곱해 구한다.","core":0},{"s":"전압 입력·전압 출력이면 무차원일 수 있지만, 전압 입력·속도 출력처럼 종류가 다르면 단위가 있다.","core":0},{"s":"전달함수가 항상 무차원이라고 외우지 않는다.","core":0}]},{"t":"p","ss":[{"s":"약분한 유리 전달함수의 분모를 0으로 만드는 값이 극점, 분자를 0으로 만드는 값이 영점이다.","core":0},{"s":"극점은 시스템의 자연응답에 강하게 연결되고, 영점은 출력의 모양과 전달 특성에 영향을 준다.","core":0},{"s":"분모 계수 자체가 극점은 아니므로 s+3의 극점은 +3이 아니라 -3이다.","core":0}]},{"t":"m","tex":"G(s)=\\frac{Y(s)}{R(s)},\\quad Y(s)=G(s)R(s)","note":"초기조건 0인 선형 시불변계. G의 단위는 출력 단위/입력 단위."},{"t":"m","tex":"G(s)=\\frac{N(s)}{D(s)}","note":"약분 후 N(s)=0의 근은 영점, D(s)=0의 근은 입출력 전달함수의 극점. 내부모드 문제는 T17 참조."},{"t":"trap","items":["전달함수가 주어졌는지 개루프 전달함수가 주어졌는지 먼저 읽는다.","s²+5s+6의 극점은 계수 5와 6이 아니라 -2와 -3이다."]},{"t":"ex","q":"2dy/dt+4y=6r이고 초기값이 0이다. 전달함수와 극점은?","steps":["라플라스 변환하면 (2s+4)Y=6R.","G=Y/R=6/(2s+4)=3/(s+2). 분모가 0일 때 s=-2."],"a":"G(s)=3/(s+2), 극점 -2."},{"t":"chk","q":"G(s)=(s+4)/[(s+1)(s+3)]의 영점과 극점은?","a":"영점 -4, 극점 -1과 -3. 공통인자가 없으므로 그대로 읽는다."}]},{"id":"T03","title":"블록선도 간략화와 폐루프 전달함수","pr":"A","min":30,"day":2,"b":[{"t":"p","ss":[{"s":"직렬 블록은 곱하고, 같은 입력을 받는 병렬 블록은 출력의 부호에 따라 더하거나 뺀다.","core":1,"star":1},{"s":"음의 피드백은 G/(1+GH), 양의 피드백은 G/(1-GH)다.","core":0},{"s":"분모의 부호는 암기만 하지 말고 합산점의 부호를 따라 확인한다.","core":0}]},{"t":"p","ss":[{"s":"음의 피드백에서는 목표값에서 검출된 출력 HY를 빼서 편차 E를 만든다.","core":0},{"s":"출력 Y는 전향 경로 G에 편차를 통과시킨 값이다.","core":0},{"s":"두 식을 결합하면 Y=G(R-HY)가 되고, 출력이 포함된 항을 한쪽으로 모으면 폐루프 식이 나온다.","core":0},{"s":"이 짧은 유도는 부호를 잊었을 때 복구하는 방법이다.","core":0}]},{"t":"p","ss":[{"s":"중첩 피드백은 가장 안쪽 루프부터 하나의 블록으로 줄인다.","core":0},{"s":"임의로 블록을 이동할 때 분기점·합산점의 신호가 변할 수 있으므로 초보 단계에서는 각 마디의 신호식을 쓰는 것이 안전하다.","core":0},{"s":"단위피드백은 H=1이라는 뜻이며 모든 피드백이 자동으로 단위피드백인 것은 아니다.","core":0}]},{"t":"m","tex":"G_{\\mathrm{series}}=G_1G_2,\\quad G_{\\mathrm{parallel}}=G_1\\pm G_2","note":"병렬은 두 경로의 입력·출력 마디가 같은 경우. 합산점 부호를 반영."},{"t":"m","tex":"T(s)=\\frac{Y(s)}{R(s)}=\\frac{G(s)}{1+G(s)H(s)}","note":"음의 피드백. G: 전향 경로, H: 피드백 경로, L=GH: 루프 전달함수."},{"t":"m","tex":"\\frac{E(s)}{R(s)}=\\frac{1}{1+G(s)H(s)}","note":"E=R-HY인 비교점 편차. H≠1이면 이것은 일반적으로 R-Y와 같지 않다."},{"t":"trap","items":["폐루프 분모를 구할 때 1+G가 아니라 1+GH인지 확인한다.","직렬 블록의 이득을 더하거나 병렬 블록의 이득을 곱하지 않는다."]},{"t":"ex","q":"G(s)=4/(s+2), H(s)=0.5인 음의 피드백계의 폐루프 전달함수는?","steps":["GH=2/(s+2).","T=[4/(s+2)]/[1+2/(s+2)]=4/(s+4)."],"a":"T(s)=4/(s+4)."},{"t":"chk","q":"전향이득 3, 피드백이득 2인 음의 피드백의 전체 이득은?","a":"3/7. G/(1+GH)=3/(1+6)."}]},{"id":"T04","title":"신호흐름선도와 Mason 공식의 최소 이해","pr":"B","min":15,"day":2,"b":[{"t":"p","ss":[{"s":"신호흐름선도는 신호를 마디로, 전달관계를 방향 있는 가지로 나타낸다.","core":1,"star":1},{"s":"입력에서 출력까지 같은 마디를 다시 지나지 않고 가는 길이 전향경로이고, 출발 마디로 돌아오는 닫힌 길이 루프다.","core":0},{"s":"루프이득에는 가지에 표시된 음수도 포함한다.","core":0}]},{"t":"p","ss":[{"s":"Mason 공식은 여러 전향경로와 루프를 묶어 전체 전달함수를 계산한다.","core":0},{"s":"서로 접촉하지 않는 루프란 공통 마디가 하나도 없는 루프다.","core":0},{"s":"그림에서 선이 교차해 보여도 그곳이 마디가 아니면 접촉 여부가 달라질 수 있다.","core":0},{"s":"실제 연결 관계를 읽어야 한다.","core":0}]},{"t":"p","ss":[{"s":"5일 과정에서는 복잡한 비접촉 루프를 여러 개 곱하는 계산까지 늘리지 않는다.","core":0},{"s":"단일 전향경로와 단일 음의 피드백에서 공식이 G/(1+GH)로 돌아오는지 확인하는 정도를 먼저 확보한다.","core":0},{"s":"루프에 이미 -H가 들어갔다면 분모에서 다시 빼면서 부호가 두 번 반영됨을 본다.","core":0}]},{"t":"m","tex":"T=\\frac{\\sum_k P_k\\Delta_k}{\\Delta}","note":"Pk: k번째 전향경로 이득, Δk: 그 경로와 접촉하는 루프를 제외한 여인수."},{"t":"m","tex":"\\Delta=1-\\sum L_i+\\sum L_iL_j-\\cdots","note":"곱 항은 서로 접촉하지 않는 루프만 포함. 단일 루프에서는 Δ=1-L1."},{"t":"trap","items":["음의 피드백 루프이득은 GH가 아니라 -GH다. 단순 블록식의 L=GH 표기와 구분한다.","서로 접촉하는 루프를 비접촉 루프 곱 항에 넣지 않는다."]},{"t":"ex","q":"전향경로 이득이 5이고, 그 경로와 접촉하는 유일한 루프이득이 -2이다. 전체 전달이득은?","steps":["Δ=1-(-2)=3.","전향경로와 접촉하는 루프를 지우면 Δ1=1.","T=5×1/3."],"a":"5/3."},{"t":"chk","q":"루프이득이 -ab 하나뿐이면 Mason 분모는?","a":"1+ab. 1-(-ab)로 계산한다."}]},{"id":"T05","title":"1차계 응답: 최종값과 속도를 따로 읽기","pr":"A","min":20,"day":2,"b":[{"t":"p","ss":[{"s":"1차계 K/(τs+1)에서 K는 최종 크기, τ는 응답 속도를 정한다.","core":1,"star":1},{"s":"τ가 작을수록 빨리 반응하고, K가 커진다고 같은 형태의 응답이 반드시 빨라지는 것은 아니다.","core":0},{"s":"분모를 τs+1 형태로 정규화한 뒤 두 값을 읽는다.","core":0}]},{"t":"p","ss":[{"s":"초기값 0에서 크기 A의 계단입력을 넣으면 출력은 최종값 AK를 향해 지수적으로 접근한다.","core":0},{"s":"τ 뒤에는 변화량의 약 63.2%를 진행한다.","core":0},{"s":"여기서 63.2%는 입력의 크기 자체가 아니라 출력의 전체 변화량에 대한 비율이다.","core":0},{"s":"이득이 2라면 단위계단 최종 출력은 2다.","core":0}]},{"t":"p","ss":[{"s":"계단응답은 G(s)/s의 역변환이고 임펄스응답은 G(s) 자체의 역변환이다.","core":0},{"s":"전달함수만 보고 곧바로 계단응답이라고 읽지 않는다.","core":0},{"s":"RC·RL 회로의 같은 지수식은 회로이론에서 이미 배웠으므로 여기서는 시스템 이득과 시정수 해석에 집중한다.","core":0}]},{"t":"m","tex":"G(s)=\\frac{K}{\\tau s+1},\\quad y(t)=AK\\left(1-e^{-t/\\tau}\\right)","note":"τ>0, 초기값 0, 입력 r(t)=A인 계단. K: 출력/입력 이득, τ: s."},{"t":"m","tex":"p=-\\frac{1}{\\tau},\\quad y(\\tau)\\simeq0.632AK","note":"p는 1차계 극점. τ가 작으면 극점이 실수축에서 더 왼쪽에 위치."},{"t":"trap","items":["G=6/(2s+3)에서 K를 6, τ를 2로 읽지 않는다. 상수항 3으로 나눈다.","출력이 63.2%에 도달하는 기준은 초기값에서 최종값까지의 변화량이다."]},{"t":"ex","q":"G(s)=6/(2s+3)에 단위계단을 인가한다. K, τ, 최종값은?","steps":["분자·분모를 3으로 나누면 G=2/[(2/3)s+1].","K=2, τ=2/3 s, 최종 출력=2.","τ 뒤 출력은 2×0.632≈1.264."],"a":"K=2, τ=2/3 s, 최종값 2."},{"t":"chk","q":"G(s)=1/(0.2s+1)의 극점은 어디인가?","a":"s=-5. 극점은 -1/τ이다."}]},{"id":"T06","title":"2차계 감쇠비와 고유주파수","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"2차 분모의 최고차항을 1로 만든 뒤 상수항에서 고유주파수, s항에서 감쇠비를 읽는다.","core":1,"star":1},{"s":"표준형은 s²+2ζωn s+ωn²다.","core":0},{"s":"상수항은 ωn이 아니라 ωn²이므로 먼저 제곱근을 취해야 한다.","core":0}]},{"t":"p","ss":[{"s":"ζ는 무차원인 감쇠비다.","core":0},{"s":"0<ζ<1이면 감쇠진동, ζ=1이면 임계감쇠, ζ>1이면 과감쇠다.","core":0},{"s":"ζ=0이면 감쇠가 없는 이상적인 지속진동이며, ζ<0에서는 진폭이 커지는 불안정 응답이 생긴다.","core":0},{"s":"양의 감쇠비에서 부족감쇠라는 말은 안정성이 부족하다는 뜻이 아니다.","core":0}]},{"t":"p","ss":[{"s":"ωn은 비감쇠 고유각주파수이며 실제 감쇠진동의 각주파수는 ωd다.","core":0},{"s":"제어기나 영점이 추가된 일반적인 고차 시스템에 표준 2차 공식이 정확히 성립하는 것은 아니다.","core":0},{"s":"시험에서 표준 2차계 또는 우세한 두 극점 근사라는 조건이 있을 때 응답지표 공식을 사용한다.","core":0}]},{"t":"m","tex":"T(s)=\\frac{\\omega_n^2}{s^2+2\\zeta\\omega_ns+\\omega_n^2}","note":"정상상태 이득 1인 표준 2차계. ζ 무차원, ωn rad/s."},{"t":"m","tex":"\\omega_d=\\omega_n\\sqrt{1-\\zeta^2}","note":"0<ζ<1인 부족감쇠에서 실제 감쇠진동 각주파수."},{"t":"m","tex":"s_{1,2}=-\\zeta\\omega_n\\pm j\\omega_d","note":"부족감쇠 극점. 실수부가 음수면 진폭이 시간에 따라 감소."},{"t":"trap","items":["감쇠비 ζ를 마찰·감쇠계수 그 자체와 같은 단위량으로 외우지 않는다.","계수가 모두 양수라는 이유만으로 임의의 고차 시스템 안정성을 단정하지 않는다."]},{"t":"ex","q":"특성다항식이 2s²+8s+8이다. ωn과 ζ, 제동상태는?","steps":["2로 나누면 s²+4s+4.","ωn²=4에서 ωn=2 rad/s. 2ζωn=4에서 ζ=1.","임계감쇠이다."],"a":"ωn=2 rad/s, ζ=1, 임계감쇠."},{"t":"chk","q":"분모가 s²+4s+16이면 감쇠비는?","a":"ωn=4, 2ζ×4=4이므로 ζ=0.5. 부족감쇠다."}]},{"id":"T07","title":"상승·지연·정정·최대오버슈트","pr":"A","min":20,"day":2,"b":[{"t":"p","ss":[{"s":"지연시간은 최종값의 50%에 처음 도달하는 시간, 정정시간은 정해진 오차띠 안에 들어가 계속 머무는 시간이다.","core":1,"star":1},{"s":"상승시간은 문항이 정한 두 수준 사이를 지나는 시간이다.","core":0},{"s":"10~90% 정의와 부족감쇠계의 첫 0~100% 정의가 함께 쓰이므로 제시 조건을 따른다.","core":0}]},{"t":"p","ss":[{"s":"최대오버슈트는 최종값을 얼마나 초과하는지 나타낸다.","core":0},{"s":"최고점의 출력값 자체와 초과량, 초과 비율을 구별한다.","core":0},{"s":"최종값이 10이고 최고점이 12라면 최고 출력은 12, 초과량은 2, 백분율 오버슈트는 20%다.","core":0},{"s":"최종값 0처럼 비율 정의가 곤란한 경우에는 다른 지표가 필요하다.","core":0}]},{"t":"p","ss":[{"s":"표준 부족감쇠 2차계에서는 ζ가 커지면 오버슈트가 줄고, ζωn이 커지면 대체로 정정시간이 짧아진다.","core":0},{"s":"그러나 ζ가 1을 넘어가는 과감쇠 영역까지 이 근사식을 무작정 연장하거나, 영점이 큰 영향을 주는 시스템에 그대로 적용하지 않는다.","core":0}]},{"t":"m","tex":"M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}","note":"표준 2차계 단위계단의 오버슈트 비율. 백분율은 100Mp. 0<ζ<1."},{"t":"m","tex":"t_p=\\frac{\\pi}{\\omega_d},\\quad t_s\\simeq\\frac{4}{\\zeta\\omega_n}","note":"tp: 첫 최대값 시간 s. ts: 2% 정정시간의 통상 근사. 표준 부족감쇠 2차계 조건."},{"t":"m","tex":"M_p(\\%)=\\frac{y_{\\max}-y_\\infty}{y_\\infty}\\times100","note":"양의 비영 최종값에 대한 통상 정의. 실제 그래프 문제에서는 제시 기준을 우선."},{"t":"trap","items":["2%와 5% 정정시간을 같은 숫자로 계산하지 않는다. 5%에는 흔히 3/(ζωn) 근사를 쓴다.","정정시간은 오차띠에 처음 스치고 나오는 시간이 아니다."]},{"t":"ex","q":"표준 2차계의 ζ=0.5, ωn=4 rad/s이다. 2% 정정시간 근삿값은? 별도의 그래프에서 최종값 5, 최고점 6이면 오버슈트는?","steps":["ts≈4/(0.5×4)=2 s.","그래프의 오버슈트는 (6-5)/5×100=20%."],"a":"정정시간 약 2 s, 그래프 오버슈트 20%."},{"t":"chk","q":"응답이 최종값 10의 9.8~10.2 범위에 들어가 계속 머무르게 되는 시간을 무엇이라 하는가?","a":"2% 정정시간. ±0.2가 최종값 10의 ±2%다."}]},{"id":"T08","title":"초기값·최종값 정리와 적용 불가 사례","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"최종값 정리는 역라플라스 없이 충분히 지난 값을 구하지만, 먼저 실제로 수렴할 조건을 확인해야 한다.","core":1,"star":1},{"s":"유리함수에서는 약분한 sF(s)의 모든 극점이 열린 좌반평면에 있으면 최종값 정리를 적용할 수 있다.","core":0},{"s":"F(s) 자체는 원점에 단순극을 가질 수 있다.","core":0}]},{"t":"p","ss":[{"s":"공식에 s=0을 대입해 숫자가 나왔다고 실제 최종값이 존재하는 것은 아니다.","core":0},{"s":"f(t)=sin t는 계속 진동하여 최종값이 없지만 s/(s²+1)에 s→0을 넣으면 0처럼 보인다.","core":0},{"s":"허수축 극점 때문에 정리의 조건이 성립하지 않는 것이다.","core":0}]},{"t":"p","ss":[{"s":"전달함수 G(s)만 주어졌다면 원하는 출력 F(s) 또는 Y(s)를 먼저 만들어야 한다.","core":0},{"s":"단위계단 출력은 G(s)/s다.","core":0},{"s":"초기값 정리는 보통 유한한 초기값을 갖고 원점에서 충격성 성분이 없는 응답에 적용한다.","core":0},{"s":"직접 전달항이나 이상 미분 때문에 임펄스가 생기는 경우에는 단순한 초기값 해석에 주의한다.","core":0}]},{"t":"m","tex":"f(\\infty)=\\lim_{s\\to0}sF(s)","note":"약분한 sF(s)의 극점이 모두 Re(s)<0인 등 수렴 조건이 만족되는 유리함수에 적용."},{"t":"m","tex":"f(0^+)=\\lim_{s\\to\\infty}sF(s)","note":"초기값이 유한하고 0 부근에서 통상 초기값 정리의 조건이 성립할 때. 충격성 응답은 별도 처리."},{"t":"trap","items":["원점극이 하나 있다는 이유만으로 최종값 정리를 무조건 금지하지 않는다. sF(s)를 검사한다.","우반평면·허수축 극점이 남아 있는데 대입한 숫자를 최종값이라고 쓰지 않는다."]},{"t":"ex","q":"F(s)=10/[s(s+2)]의 초기값과 최종값을 구하라.","steps":["sF=10/(s+2)의 극점은 -2이므로 최종값 정리 사용 가능.","최종값은 10/2=5.","초기값은 s→∞에서 10/(s+2)→0."],"a":"초기값 0, 최종값 5."},{"t":"chk","q":"F(s)=1/(s²+4)에 최종값 정리를 적용해 0이라고 해도 되는가?","a":"안 된다. sF(s)에 ±j2 극점이 남고 시간응답은 지속진동하므로 최종값이 없다."}]},{"id":"T09","title":"정상위치편차: 단위계단 문제의 한 줄 계산","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"정상위치편차는 계단입력에 대한 충분히 지난 오차다.","core":1,"star":1},{"s":"단위 음의 피드백에서는 E=R-Y이며 E(s)=R(s)/(1+G(s))다.","core":0},{"s":"이 식에 입력의 변환을 넣고 최종값 정리를 적용하는 것이 출발점이다.","core":0},{"s":"입력이 단위계단인지 크기 A의 계단인지 확인한다.","core":0}]},{"t":"p","ss":[{"s":"정상위치편차 계수는 개루프 G(s)의 저주파 한계값이다.","core":0},{"s":"이를 Kpos라고 쓰면 단위계단 정상편차는 1/(1+Kpos)다.","core":0},{"s":"교재에서 이 계수를 Kp로 쓰기도 하지만 PID 제어기의 비례이득 Kp와는 의미가 다르다.","core":0},{"s":"아래첨자가 같다는 이유로 같은 숫자라고 생각하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"계수가 매우 크면 오차가 작아지고, 적분기가 남아 저주파 이득이 무한대로 가면 계단 오차가 0이 될 수 있다.","core":0},{"s":"단, 폐루프가 안정하고 최종값이 존재해야 한다.","core":0},{"s":"H≠1이면 비교점 편차 R-HY와 실제 추종오차 R-Y가 달라지므로 문제에서 요구한 오차의 정의를 먼저 확인한다.","core":0}]},{"t":"m","tex":"E(s)=\\frac{R(s)}{1+G(s)},\\quad K_{\\mathrm{pos}}=\\lim_{s\\to0}G(s)","note":"H=1인 음의 피드백. G는 전향 경로 전체를 포함한 개루프 전달함수."},{"t":"m","tex":"e_{\\mathrm{ss}}=\\frac{A}{1+K_{\\mathrm{pos}}}","note":"입력이 크기 A의 계단이고 폐루프가 안정할 때. 단위계단은 A=1."},{"t":"trap","items":["정상위치편차를 구하면서 폐루프 T(s)의 s=0 값을 Kpos로 쓰지 않는다.","비례이득을 크게 하면 오차가 줄 수 있지만 안정성이 악화될 수 있다."]},{"t":"ex","q":"단위 음의 피드백에서 G(s)=6/(s+2)이다. 단위계단 정상위치편차를 구하라.","steps":["폐루프 분모는 s+2+6=s+8로 안정이다.","Kpos=6/2=3.","ess=1/(1+3)=1/4."],"a":"0.25."},{"t":"chk","q":"같은 시스템에 크기 4의 계단을 넣으면 정상위치편차는?","a":"1. 계단 크기에 비례하여 4/(1+3)=1이다."}]},{"id":"T10","title":"시스템 형과 속도·가속도 편차","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"시스템의 형은 약분 후 개루프 전달함수에 남는 원점극의 개수다.","core":1,"star":1},{"s":"전체 차수가 아니라 원점에 있는 적분기의 수를 센다.","core":0},{"s":"예를 들어 1/[s(s+2)]는 분모가 2차지만 1형이다.","core":0},{"s":"원점극이 하나도 없으면 0형이다.","core":0}]},{"t":"p","ss":[{"s":"계단을 오차 없이 따라가는 것보다 계속 커지는 램프를 오차 없이 따라가는 것이 더 어렵다.","core":0},{"s":"적분기 하나는 계단의 정상오차를 없애는 데 기여하지만 램프에는 유한 오차가 남을 수 있다.","core":0},{"s":"적분기 두 개면 안정한 조건에서 램프 오차도 0이 될 수 있다.","core":0}]},{"t":"p","ss":[{"s":"단위 램프는 r(t)=t이며 정상속도편차는 1/Kvel이다.","core":0},{"s":"단위 포물선은 r(t)=t²/2로 정의해야 변환이 1/s³가 된다.","core":0},{"s":"t²를 그대로 주면 입력 크기가 두 배이므로 오차도 두 배다.","core":0},{"s":"형별 표는 단위 음의 피드백과 폐루프 안정 조건이 전제다.","core":0},{"s":"표가 안정성을 대신 판정하지는 않는다.","core":0}]},{"t":"m","tex":"K_{\\mathrm{vel}}=\\lim_{s\\to0}sG(s),\\quad K_{\\mathrm{acc}}=\\lim_{s\\to0}s^2G(s)","note":"속도·가속도 편차 계수. 입력·출력의 물리 단위와 시간 기준에 따라 계수의 단위를 해석."},{"t":"m","tex":"e_{\\mathrm{ramp}}=\\frac{1}{K_{\\mathrm{vel}}},\\quad e_{\\mathrm{parabola}}=\\frac{1}{K_{\\mathrm{acc}}}","note":"단위 램프 t, 단위 포물선 t²/2. H=1, 폐루프 안정, 최종값 조건 만족."},{"t":"tb","h":["형","단위계단","단위램프","단위포물선"],"r":[["0형","유한","∞","∞"],["1형","0","유한","∞"],["2형","0","0","유한"]]},{"t":"trap","items":["전체 극점이 3개라고 3형이 아니다. 원점극만 센다.","적분기가 많을수록 무조건 좋은 제어계는 아니다. 안정도와 과도응답을 함께 고려해야 한다."]},{"t":"ex","q":"G(s)=8/[s(s+4)]인 단위피드백계의 형과 단위 램프 정상편차는?","steps":["원점극이 하나이므로 1형.","폐루프 분모 s²+4s+8은 극점 실수부가 음수이므로 안정이다.","Kvel=lim 8/(s+4)=2. 램프 정상편차는 1/2."],"a": °·180°·300°."},{"t":"chk","q":"개루프 극점 4개, 유한 영점 1개이면 무한대로 가는 가지와 점근선 수는?","a":"3개. n-m=4-1=3이다."}]},{"id":"T15","title":"주파수응답과 Bode 선도","pr":"B","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"주파수응답은 정현파 입력의 주파수를 바꿔가며 출력 크기와 위상이 어떻게 달라지는지 보는 방법이다.","core":1,"star":1},{"s":"전달함수에 s=jω를 대입한다.","core":0},{"s":"안정한 시스템의 정상상태에서는 같은 주파수의 출력이 나오고, 크기는 |G(jω)|배, 위상은 argG(jω)만큼 변한다.","core":0}]},{"t":"p","ss":[{"s":"Bode 선도는 가로축을 주파수의 로그, 세로축을 이득 dB와 위상으로 나누어 그린다.","core":0},{"s":"진폭 이득은 20log10|G|다.","core":0},{"s":"크기가 10배이면 +20 dB, 0.1배이면 -20 dB다.","core":0},{"s":"전력비의 10log와 혼동하지 않는다.","core":0},{"s":"같은 dB 덧셈이 실제 이득의 곱셈을 표현한다.","core":0}]},{"t":"p","ss":[{"s":"1차 극점은 절점주파수 이후 근사 기울기를 -20 dB/dec씩 바꾸고, 1차 영점은 +20 dB/dec씩 바꾼다.","core":0},{"s":"원점 적분기는 처음부터 -20 dB/dec와 -90° 위상을 가진다.","core":0},{"s":"절점에서 정확한 크기는 직선 근사와 다르며 1차 지연의 정규화 이득은 약 -3 dB다.","core":0}]},{"t":"m","tex":"G(j\\omega)=G(s)|_{s=j\\omega},\\quad A_{\\mathrm{dB}}=20\\log_{10}|G(j\\omega)|","note":"ω: rad/s, 이득 dB는 무차원 비를 로그로 표현. 복소수 크기·위상은 01권 C03 참조."},{"t":"m","tex":"G(s)=\\frac{1}{1+\\tau s},\\quad \\omega_b=\\frac{1}{\\tau}","note":"1차 지연의 절점각주파수. 주파수 Hz로 묻으면 2π로 나눈다."},{"t":"m","tex":"|G(j\\omega)|=\\frac{1}{\\sqrt{1+(\\omega\\tau)^2}},\\quad \\phi=-\\tan^{-1}(\\omega\\tau)","note":"양의 τ를 가진 1차 지연. ωτ=1이면 크기 1/√2, 위상 -45°."},{"t":"trap","items":["주파수 10배 증가가 1 decade다. 1 Hz 증가와 다르다.","고주파에서 위상 -90°라는 것은 시간 지연이 항상 같은 초라는 뜻이 아니다."]},{"t":"ex","q":"G(s)=1/(1+0.5s)의 절점각주파수와 그때 이득·위상은?","steps":["ωb=1/0.5=2 rad/s.","ωτ=1이므로 |G|=1/√2, 이득 약 -3 dB, 위상 -45°."],"a":"2 rad/s, 약 -3 dB, -45°."},{"t":"chk","q":"진폭이득이 10이면 dB 이득은?","a":"20 dB. 20log10(10)=20."}]},{"id":"T16","title":"Nyquist와 이득·위상여유: -1점을 보는 이유","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"Nyquist 안정판별은 개루프 주파수응답이 -1+j0점을 어떻게 감싸는지와 개루프의 불안정 극점 수를 함께 사용해 폐루프 안정성을 판단한다.","core":1,"star":1},{"s":"음의 피드백 특성식이 1+L=0이기 때문에 기준점이 -1이다.","core":0},{"s":"표본화 주파수를 말하는 Nyquist 샘플링 정리와는 다른 내용이다.","core":0}]},{"t":"p","ss":[{"s":"이 책에서는 -1점의 반시계방향 순감쌈 횟수를 N으로 정의한다.","core":0},{"s":"개루프 우반평면 극점 수를 P, 폐루프 우반평면 극점 수를 Z라 하면 N=P-Z다.","core":0},{"s":"다른 교재가 시계방향을 양수로 정의하면 식의 부호가 바뀌므로 회전 규약을 먼저 읽는다.","core":0},{"s":"양의 주파수 가지 하나만 보고 전체 감쌈 횟수를 세지 않는다.","core":0}]},{"t":"p","ss":[{"s":"개루프에 우반평면 극점이 없고 경로 위의 특이점도 없는 통상 사례에서는 -1점을 감싸지 않으면 폐루프가 안정이다.","core":0},{"s":"개루프가 불안정하면 ‘안 감싸면 안정’이 성립하지 않는다.","core":0},{"s":"이득여유는 위상이 -180°인 주파수에서 크기가 1까지 얼마나 남는지, 위상여유는 크기가 1인 주파수에서 위상이 -180°까지 얼마나 남는지다.","core":0}]},{"t":"m","tex":"N=P-Z,\\quad Z=P-N","note":"N은 -1점 반시계방향 순감쌈 수라는 이 책의 규약. 폐루프 안정에는 Z=0과 허수축 특이점 배제가 필요."},{"t":"m","tex":"\\mathrm{GM}=\\frac{1}{|L(j\\omega_{pc})|},\\quad \\mathrm{GM}_{\\mathrm{dB}}=-20\\log_{10}|L(j\\omega_{pc})|","note":"위상교차주파수 ωpc에서 ∠L=-180°. 단순한 통상 교차를 가정."},{"t":"m","tex":"\\mathrm{PM}=180^\\circ+\\angle L(j\\omega_{gc})","note":"이득교차주파수 ωgc에서 |L|=1. 위상은 -180° 부근의 연속 위상 기준."},{"t":"trap","items":["개루프 불안정 극점이 있는데 P=0 공식을 적용하지 않는다.","이득여유·위상여유가 양수라는 간단 판정은 통상적인 단일 교차계에서 사용한다. 다중 교차·특이한 궤적은 전체 Nyquist로 판단한다."]},{"t":"ex","q":"개루프 우반평면 극점이 0개인 통상 시스템에서 전체 Nyquist 궤적이 -1점을 감싸지 않는다. 폐루프 우반평면 극점 수는? 크기 교차점 위상이 -140°라면 위상여유는?","steps":["P=0,N=0이므로 Z=0.","PM=180-140=40°."],"a":"Z=0, 위상여유 40°."},{"t":"chk","q":"위상교차주파수에서 |L|=0.5이면 이득여유는 몇 배인가?","a":"2배, 약 6.02 dB. GM=1/0.5이다."}]},{"id":"T17","title":"상태공간 고유값과 s·z 안정영역","pr":"A","min":30,"day":2,"b":[{"t":"p","ss":[{"s":"상태공간은 내부 상태 x가 어떻게 변하는지 나타내며, 연속시간 선형 시불변계의 점근안정은 A의 모든 고유값 실수부가 음수인지로 판단한다.","core":1,"star":1},{"s":"A의 원소가 전부 음수라는 조건이 아니다.","core":0},{"s":"대각 또는 삼각행렬이면 고유값은 대각 원소이므로 간단히 읽을 수 있다.","core":0}]},{"t":"p","ss":[{"s":"특성방정식은 det(sI-A)=0이다.","core":0},{"s":"여기서 I는 단위행렬이지 전류가 아니다.","core":0},{"s":"상태방정식은 입력과 내부 상태의 변화를, 출력방정식은 상태와 입력으로부터 측정 출력이 나오는 관계를 설명한다.","core":0},{"s":"전달함수만 약분해서 보면 내부의 불안정 모드가 숨는 경우가 있으므로 내부안정은 A를 기준으로 확인한다.","core":0}]},{"t":"p","ss":[{"s":"이산시간에서는 한 단계마다 상태가 A_d배 되므로 고유값의 절댓값이 1보다 작아야 반복할수록 줄어든다.","core":0},{"s":"z평면의 안정영역은 단위원 내부, s평면은 열린 좌반평면이다.","core":0},{"s":"샘플링 주기 Ts>0에서 z=e^(sTs)로 대응시키면 실수부가 음수일 때 |z|<1이 된다.","core":0},{"s":"단위원 위는 엄격한 점근안정 영역에 포함하지 않는다.","core":0}]},{"t":"m","tex":"\\dot{x}=Ax+Bu,\\quad y=Cx+Du","note":"x: 상태벡터, u: 입력, y: 출력. A는 상태, B는 입력, C는 출력, D는 직접 전달 행렬. 상태마다 단위가 다를 수 있다."},{"t":"m","tex":"\\det(sI-A)=0,\\quad \\mathrm{Re}(\\lambda_i)<0","note":"연속시간 선형 시불변계의 모든 고유값에 대한 점근안정 조건."},{"t":"m","tex":"x[k+1]=A_dx[k]+B_du[k],\\quad |\\lambda_i(A_d)|<1","note":"이산시간 선형 시불변계의 점근안정 조건."},{"t":"m","tex":"z=e^{sT_s},\\quad |z|=e^{\\mathrm{Re}(s)T_s}","note":"Ts: 양의 샘플링 주기 s. 연속시간 모드의 샘플링 대응."},{"t":"trap","items":["고유값 -2와 -3은 안정이지만 행렬 원소가 -1,-2로만 구성되었다는 사실만으로는 판단할 수 없다.","z=-0.8은 음수라는 이유가 아니라 절댓값 0.8<1이어서 안정 모드다. z=-1.2는 불안정하다."]},{"t":"ex","q":"A가 대각 원소 -2,-5이고 나머지가 0인 2×2 행렬이다. 연속시간 점근안정인가? 별도의 이산시간 계의 고유값이 0.6,-0.8이면?","steps":["대각행렬 고유값은 -2,-5이며 실수부가 모두 음수이므로 연속시간 점근안정.","이산시간 고유값의 크기는 0.6,0.8로 모두 1보다 작으므로 점근안정."],"a":"두 시스템 모두 점근안정."},{"t":"chk","q":"연속시간 고유값이 -1+j2, -1-j2인 경우와 이산시간 고유값이 1.1인 경우를 판정하라.","a":"연속시간은 감쇠진동하며 점근안정. 이산시간은 |1.1|>1이므로 불안정."}]}]},{"num":"03","title":"전자기학","acc":"#0D9488","day":3,"secs":[{"id":"E01","title":"네 가지 장과 단위: E·D·H·B부터 분리하기","pr":"A","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"전계 E는 그 지점에 양의 시험전하 1 C를 놓았을 때 받는 힘을 나타낸다.","core":1},{"s":"그래서 단위는 N/C이고, 전위차를 길이로 나눈 V/m와 같다.","core":0},{"s":"전속밀도 D는 면을 통과하는 전기적 흐름을 전하량 기준으로 나타내는 양이며 단위는 C/m²이다.","core":0},{"s":"E와 D는 같은 기호의 다른 표현이 아니다.","core":0},{"s":"매질이 선형·등방성일 때 D=εE로 연결된다.","core":0}]},{"t":"p","ss":[{"s":"자계 H의 단위는 A/m이고, 자속밀도 B의 단위는 T 또는 Wb/m²이다.","core":0},{"s":"B=μH라는 식에서 μ는 투자율이다.","core":0},{"s":"원형 코일 문제에서 H를 요구하면 NI/(2r)를 쓰고, B를 요구하면 여기에 μ를 곱한다.","core":0},{"s":"단위가 A/m인지 T인지 확인하는 습관만으로도 두 식을 혼동하는 실수를 크게 줄일 수 있다.","core":0}]},{"t":"p","ss":[{"s":"ε=εrε0, μ=μrμ0에서 εr와 μr는 비유전율과 비투자율로 단위가 없다.","core":0},{"s":"진공 유전율 ε0는 약 8.85×10⁻¹² F/m, 진공 투자율 μ0는 기사 수준 계산에서 약 4π×10⁻⁷ H/m로 사용한다.","core":0},{"s":"공기 문제에서 별도 조건이 없다면 진공값으로 근사하는 경우가 많다.","core":0},{"s":"유전율의 단위를 정전용량 단위인 F만으로 쓰면 안 된다.","core":0}]},{"t":"p","ss":[{"s":"전계·자계·힘은 크기와 방향이 함께 있는 벡터다.","core":0},{"s":"내적은 두 벡터의 나란한 성분을 곱해 스칼라를 만들고 cosθ가 붙는다.","core":0},{"s":"외적은 두 벡터에 수직인 새 벡터를 만들고 크기에 sinθ가 붙는다.","core":0},{"s":"자속은 B와 면의 법선 사이 내적, 로렌츠 자기력과 포인팅 벡터는 외적이다.","core":0},{"s":"외적 순서를 바꾸면 부호가 반대가 된다.","core":0}]},{"t":"m","tex":"\\mathbf{D}=\\varepsilon\\mathbf{E},\\qquad \\mathbf{B}=\\mu\\mathbf{H}","note":"선형·등방성 매질. ε: 유전율 F/m, μ: 투자율 H/m. E: V/m, D: C/m², H: A/m, B: T."},{"t":"m","tex":"\\mathbf{A}\\cdot\\mathbf{B}=AB\\cos\\theta,\\qquad |\\mathbf{A}\\times\\mathbf{B}|=AB\\sin\\theta","note":"θ는 두 벡터 사이 각. 내적은 스칼라, 외적은 벡터다. 같은 방향이면 외적은 0, 서로 수직이면 내적은 0."},{"t":"tb","h":["물리량","기호","단위","연결"],"r":[["전계","E","V/m = N/C","전하에 작용하는 힘"],["전속밀도","D","C/m²","D=εE"],["자계","H","A/m","전류·기자력과 연결"],["자속밀도","B","T = Wb/m²","B=μH"]]},{"t":"trap","items":["문제에서 H를 주었는데 qvH를 바로 자기력으로 쓰지 않는다. 자기력 식은 B를 사용한다.","εr=4라는 말은 ε=4 F/m라는 뜻이 아니다. ε=4ε0이다.","도체의 도전율 σ는 S/m이며, 표면전하밀도와 기호가 겹칠 수 있다. 이 권에서는 표면전하밀도를 ρs로 표시한다."]},{"t":"ex","q":"선형 매질의 투자율이 2μ0이고 H=100 A/m이다. 같은 H에서 진공의 B에 비해 이 매질의 B는 몇 배인가?","steps":["B=μH에서 H가 같으므로 B는 μ에 비례한다.","투자율 비가 2이므로 B의 비도 2다."],"a":"2배. H 자체가 2배가 되는 것은 아니다."},{"t":"chk","q":"자속밀도의 단위와 자계의 단위를 각각 쓰고, 둘을 연결하는 물성을 적어라.","a":"자속밀도 B는 T 또는 Wb/m², 자계 H는 A/m이다. 선형·등방성 매질에서 B=μH이며 μ는 투자율 H/m이다."}]},{"id":"E02","title":"쿨롱 법칙과 점전하 전계: 거리의 제곱을 기억하기","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"쿨롱 법칙은 정지한 두 점전하 사이의 힘을 설명한다.","core":1},{"s":"같은 부호끼리는 밀어내고 다른 부호끼리는 끌어당긴다.","core":0},{"s":"두 전하의 크기가 커질수록 힘이 커지며 거리가 2배가 되면 힘은 1/4이 된다.","core":0},{"s":"전하가 놓인 균일한 매질의 유전율이 커지면 같은 전하·거리에서 힘은 작아진다.","core":0}]},{"t":"p","ss":[{"s":"점전하 Q가 만드는 전계는 시험전하 q가 받는 힘을 q로 나눈 것이다.","core":0},{"s":"따라서 전계 식에는 원인 전하 Q 하나만 남는다.","core":0},{"s":"Q가 양수면 Q에서 바깥쪽, 음수면 Q를 향한 안쪽이다.","core":0},{"s":"시험전하가 음수일 때 받는 힘은 전계 방향과 반대다.","core":0},{"s":"장을 만드는 전하의 부호와 그 장 안에서 움직이는 전하의 부호를 분리해 읽는다.","core":0}]},{"t":"p","ss":[{"s":"여러 점전하가 있으면 각 전계의 벡터합으로 전체 전계를 구한다.","core":0},{"s":"같은 크기의 양전하 두 개의 정확한 중점에서는 서로 반대 방향의 전계가 상쇄된다.","core":0},{"s":"크기가 같은 양전하와 음전하의 중점에서는 전계가 같은 방향이므로 더해진다.","core":0},{"s":"전계가 0인 곳과 전위가 0인 곳은 다르므로 중점이라는 말만으로 두 양을 함께 0으로 두면 안 된다.","core":0}]},{"t":"p","ss":[{"s":"처음에는 큰 지수 계산보다 배수 문제를 먼저 푼다.","core":0},{"s":"원인 전하를 3배로 하고 거리를 2배로 하면 전계는 3/4배다.","core":0},{"s":"비유전율을 2배로 하면 전계는 1/2배다.","core":0},{"s":"수치를 넣어야 할 때에는 cm를 m로, μC를 C로 바꾼 뒤 제곱한다.","core":0},{"s":"10 cm를 0.1 m로 바꾸는 것과 그 제곱을 0.01 m²로 바꾸는 과정은 별개다.","core":0}]},{"t":"m","tex":"F=\\frac{|Qq|}{4\\pi\\varepsilon r^2},\\qquad E=\\frac{|Q|}{4\\pi\\varepsilon r^2}","note":"힘의 크기 F: N, 전계 크기 E: V/m, Q·q: C, 거리 r: m. 균일하고 등방성인 매질의 점전하 모델이다."},{"t":"m","tex":"\\mathbf{F}=q\\mathbf{E},\\qquad \\frac{1}{4\\pi\\varepsilon_0}\\simeq9\\times10^9","note":"벡터식의 q에는 부호를 포함한다. 진공의 쿨롱 상수 단위는 N·m²/C²이다."},{"t":"trap","items":["전계 E의 분자에는 Q 하나, 두 전하 사이 힘 F의 분자에는 Qq가 들어간다.","거리 2배는 E가 1/2배가 아니라 1/4배다. 전위의 거리 법칙과 섞지 않는다.","절댓값 공식은 힘의 크기만 준다. 방향은 전하 부호나 벡터 방향으로 따로 정한다."]},{"t":"ex","q":"진공에서 +2 nC 점전하로부터 3 m 떨어진 지점의 전계 크기와 방향은? 쿨롱 상수는 9×10⁹로 한다.","steps":["2 nC=2×10⁻⁹ C, 거리 제곱은 9 m²이다.","E=(9×10⁹)(2×10⁻⁹)/9=2 V/m이다.","원인 전하가 양수이므로 바깥 방향이다."],"a":"2 V/m, 점전하에서 멀어지는 방향."},{"t":"chk","q":"같은 점전하에서 거리를 3배로 하면 전계 크기는 몇 배인가?","a":"1/9배다. 점전하의 전계는 거리의 제곱에 반비례한다."}]},{"id":"E03","title":"전위와 정전계: 전계 0과 전위 0은 다르다","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"전위 V는 단위 양전하가 가지는 위치에너지다.","core":1},{"s":"높이에 비유하면 전위는 높이 자체이고 전계는 높이가 가장 가파르게 낮아지는 방향에 해당한다.","core":0},{"s":"특정 지점을 0 V로 정하는 기준은 선택할 수 있으므로 전위 0이라는 사실만으로 전계 0을 결론 내릴 수 없다.","core":0},{"s":"반대로 공간에서 전위가 일정하면 그곳의 기울기가 0이므로 전계가 0이다.","core":0}]},{"t":"p","ss":[{"s":"점전하의 전위는 거리 r에 반비례한다.","core":0},{"s":"전계가 거리의 제곱에 반비례하는 것과 구별한다.","core":0},{"s":"전위는 스칼라이므로 여러 전하의 전위를 부호와 함께 그냥 더한다.","core":0},{"s":"크기가 같은 +Q와 -Q의 중점은 전위가 0이지만, 전계는 +Q에서 -Q로 향하며 0이 아니다.","core":0},{"s":"같은 부호의 같은 전하 두 개의 중점은 반대로 전계가 0이어도 전위가 일반적으로 0이 아니다.","core":0}]},{"t":"p","ss":[{"s":"정전계는 시간에 따라 변하는 자기장으로 유도된 전계가 없는 정적인 전기장이다.","core":0},{"s":"한 바퀴 돌아 원래 위치로 오면 전계가 한 일은 0이며, 두 지점 사이 전위차는 이동 경로와 무관하다.","core":0},{"s":"수식으로는 폐곡선 적분이 0, 회전 curl E가 0이라고 표현한다.","core":0},{"s":"정전계의 힘선은 서로 교차하지 않고, 양전하에서 시작해 음전하에서 끝나거나 무한대로 이어진다.","core":0}]},{"t":"p","ss":[{"s":"정전평형 도체에는 자유전하가 더 이동하지 않는 배치가 형성된다.","core":0},{"s":"도체 물질 내부의 전계는 0이고 도체 전체는 등전위다.","core":0},{"s":"정전상태에서 도체 표면 바깥의 전계는 표면에 수직이다.","core":0},{"s":"표면을 따라 전계가 있으면 자유전하가 다시 움직여 정전평형이 깨지기 때문이다.","core":0},{"s":"도체 내부의 전위는 0으로 정해지는 것이 아니라 표면과 같은 일정값이다.","core":0}]},{"t":"p","ss":[{"s":"균일 전계의 크기를 구할 때는 전압차의 크기를 전극 사이 거리로 나눠 E=|ΔV|/d를 쓴다.","core":0},{"s":"이 식을 아무 점전하 문제에 V/r 형태로 무조건 적용하지 않는다.","core":0},{"s":"일반 관계는 E=-grad V이며, 특정 구조에서만 간단한 나눗셈으로 바뀐다.","core":0},{"s":"자유전하가 없는 도체의 빈 공동도 외부 정전장으로부터 차폐될 수 있지만, 공동 안에 별도 전하가 있으면 공동 내부 전계까지 0이라고 할 수 없다.","core":0}]},{"t":"m","tex":"V=\\frac{Q}{4\\pi\\varepsilon r},\\qquad \\mathbf{E}=-\\nabla V","note":"첫 식은 무한대 전위를 0으로 정한 점전하 전위. V: V, r: m. 두 번째는 정전계에서의 일반 관계다."},{"t":"m","tex":"V_B-V_A=-\\int_A^B\\mathbf{E}\\cdot d\\mathbf{l},\\qquad \\oint\\mathbf{E}\\cdot d\\mathbf{l}=0","note":"정전계의 전위차와 보존성. 전계 방향으로 이동할수록 전위가 감소한다."},{"t":"m","tex":"\\nabla\\times\\mathbf{E}=0,\\qquad E=\\frac{|\\Delta V|}{d}","note":"앞 식은 정전계. 뒤 식은 두 평행 전극 사이 등 균일 전계의 크기이며, 가장자리 효과를 무시한다."},{"t":"trap","items":["도체 내부 E=0을 V=0으로 바꾸지 않는다. V는 일정하다.","정전계에서는 폐곡선 적분 0이지만, 시간변화 자속으로 생긴 유도전계에는 이를 일반화하지 않는다.","전기력선의 방향은 양의 시험전하 기준이다. 전자는 반대 방향의 전기력을 받는다."]},{"t":"ex","q":"서로 평행한 두 전극 사이가 2 cm이고 전위가 30 V와 10 V이다. 가장자리 효과를 무시할 때 전계 크기와 방향은?","steps":["전위차의 크기는 20 V, 거리는 0.02 m이다.","E=20/0.02=1000 V/m이다.","전계는 높은 전위에서 낮은 전위로 향한다."],"a":"1000 V/m, 30 V 전극에서 10 V 전극 쪽."},{"t":"chk","q":"정전평형 도체의 표면전위가 50 V라면 도체 물질 내부의 E와 V는?","a":"E=0, V=50 V다. 내부가 등전위라는 뜻이며 반드시 0 V라는 뜻은 아니다."}]},{"id":"E04","title":"가우스 법칙: 닫힌 면을 통과하는 전속","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"가우스 법칙은 닫힌 면을 바깥쪽으로 통과하는 D의 총량이 그 면 내부의 자유전하량과 같다는 뜻이다.","core":1},{"s":"구 표면이나 닫힌 상자처럼 내부와 외부가 나뉘는 면이어야 한다.","core":0},{"s":"표면을 관통하는 흐름은 방향을 가지므로 들어오는 부분은 음수, 나가는 부분은 양수로 합한다.","core":0},{"s":"내부에 양전하와 음전하가 함께 있으면 대수적 합을 사용한다.","core":0}]},{"t":"p","ss":[{"s":"가우스 법칙은 항상 성립하지만 E를 손쉽게 계산하려면 대칭성이 필요하다.","core":0},{"s":"점전하를 중심으로 한 구면에서는 모든 점에서 E의 크기가 같고 E가 면의 법선과 나란하다.","core":0},{"s":"그래서 E와 ε를 적분 밖으로 꺼낼 수 있고 면적 4πr²가 남는다.","core":0},{"s":"대칭성이 없는 임의의 문제에서도 E×면적=Q/ε라고 쓰는 것은 잘못이다.","core":0}]},{"t":"p","ss":[{"s":"무한히 긴 선전하는 원통형 가우스 면을 쓰므로 옆면 넓이 2πrℓ가 등장한다.","core":0},{"s":"따라서 전계가 1/r에 비례한다.","core":0},{"s":"무한히 넓은 단일 전하 시트는 양쪽으로 동일한 전계가 생겨 E=ρs/(2ε)다.","core":0},{"s":"반면 정전평형 도체 표면 바로 밖에서는 내부 E=0이므로 E=ρs/ε다.","core":0},{"s":"분모의 2 차이는 같은 현상의 오타가 아니라 서로 다른 경계 조건이다.","core":0}]},{"t":"p","ss":[{"s":"가우스 면 안의 총전하가 0이면 총 전속은 0이다.","core":0},{"s":"그러나 면 위의 각 지점에서 전계까지 모두 0이라는 뜻은 아니다.","core":0},{"s":"외부 전하의 전계가 한쪽으로 들어와 다른 쪽으로 나오면 총합은 0이어도 국소 전계는 존재한다.","core":0},{"s":"‘전체 합 0’과 ‘모든 점 0’을 구별하는 문제는 계산 없이도 풀 수 있다.","core":0}]},{"t":"m","tex":"\\oint_S\\mathbf{D}\\cdot d\\mathbf{S}=Q_{\\mathrm{free}},\\qquad \\nabla\\cdot\\mathbf{D}=\\rho_v","note":"S는 폐곡면, ρv는 자유 체적전하밀도 C/m³. 균일 선형 매질에서는 D=εE를 대입할 수 있다."},{"t":"m","tex":"E_{\\mathrm{line}}=\\frac{|\\lambda|}{2\\pi\\varepsilon r},\\qquad E_{\\mathrm{sheet}}=\\frac{|\\rho_s|}{2\\varepsilon}","note":"λ: 선전하밀도 C/m. 단일 무한 시트는 양쪽 같은 매질인 조건. r: 선전하로부터 거리 m."},{"t":"m","tex":"E_{\\mathrm{conductor}}=\\frac{|\\rho_s|}{\\varepsilon}","note":"정전평형 도체 표면 바로 밖의 전계 크기. ρs: 자유 표면전하밀도 C/m²."},{"t":"tb","h":["전하 배치","전계의 거리 의존","거리 2배","조건"],"r":[["점전하","1/r²","1/4배","균일 매질"],["무한 선전하","1/r","1/2배","끝 효과 무시"],["무한 평면 시트","거리와 무관","변화 없음","양쪽 같은 매질"]]},{"t":"trap","items":["D를 적분하면 Q, E를 적분하면 균일 매질에서 Q/ε다.","총 전속이 0이라고 그 면의 E가 모두 0인 것은 아니다.","고립된 비도체 시트와 도체 표면의 분모 2 유무를 구별한다."]},{"t":"ex","q":"닫힌 면 안에 +8 nC와 -3 nC가 있고 면 밖에 +20 nC가 있다. 그 면의 D 총전속은?","steps":["포함된 자유전하만 합한다.","8-3=5 nC이며 외부 +20 nC는 총전속 합에 기여하지 않는다."],"a":"5 nC. 외부 전하는 면 위의 전계 분포에는 영향을 줄 수 있다."},{"t":"chk","q":"무한 선전하로부터 거리가 4배가 되면 전계 크기는 몇 배인가?","a":"1/4배다. 선전하의 전계는 거리 r에 반비례하며 점전하의 1/r²과 다르다."}]},{"id":"E05","title":"정전용량의 물리적 의미와 유전체 삽입","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"정전용량 C는 두 도체 사이에 전압을 걸었을 때 전하를 얼마나 저장할 수 있는지를 나타낸다.","core":1},{"s":"같은 전압에서 더 많은 전하가 저장 서로 다른 유전체가 맞닿으면 전계 전체가 무조건 같아지는 것이 아니다.","core":1},{"s":"면을 따라 나란한 성분을 접선성분 t, 면에 수직으로 뚫고 나가는 성분을 법선성분 n이라 한다.","core":0},{"s":"경계 문제에서는 먼저 각 벡터를 이 두 성분으로 나누고, 각각에 맞는 연속조건을 적용한다.","core":0},{"s":"경계면을 종이에 그린 뒤 법선 화살표를 하나 세우는 것이 출발점이다.","core":0}]},{"t":"p","ss":[{"s":"정전계에서 접선 전계는 연속이므로 E1t=E2t다.","core":0},{"s":"경계를 가로지르는 아주 작은 폐회로를 생각하면 양쪽 접선 전계가 다를 때 한 바퀴 전압 합이 0이 되지 않기 때문이다.","core":0},{"s":"반면 법선 전속밀도의 차이는 자유 표면전하밀도다.","core":0},{"s":"경계에 자유전하가 없을 때에만 D1n=D2n이 된다.","core":0},{"s":"유전체라는 단어만 보고 자유 표면전하가 무조건 없다고 가정하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"D=εE를 결합하면 자유 표면전하가 없는 경계에서 ε1E1n=ε2E2n이다.","core":0},{"s":"따라서 전계가 법선방향으로만 들어오는 경우에는 유전율이 큰 쪽의 E가 작다.","core":0},{"s":"전계가 경계면에 평행하게만 놓이면 E는 양쪽이 같고 D는 유전율에 비례해 달라진다.","core":0},{"s":"‘E 연속, D 불연속’ 같은 문장을 성분 없이 외우면 이 두 경우를 혼동한다.","core":0}]},{"t":"p","ss":[{"s":"각도 θ를 법선에서 재면 접선성분은 E sinθ, 법선성분은 E cosθ다.","core":0},{"s":"이 정의를 사용하면 tanθ1/tanθ2=ε1/ε2가 된다.","core":0},{"s":"각도를 경계면에서 잰 그림에서는 sin과 cos 역할이 바뀌므로 같은 식을 바로 대입하지 않는다.","core":0},{"s":"긴 각도 계산보다 어느 쪽이 법선에 더 가까운지, 유전율의 비와 tan의 비가 어떻게 연결되는지를 먼저 연습한다.","core":0}]},{"t":"p","ss":[{"s":"유전체의 분극은 재료 내부의 양·음전하 중심이 조금 어긋나는 반응이다.","core":0},{"s":"자유전하가 도체처럼 장거리로 흘러가는 현상과 다르다.","core":0},{"s":"선형 유전체에서 P=D-ε0E이며 P의 단위도 C/m²다.","core":0},{"s":"분극 때문에 유전체 경계에 결합전하가 나타날 수 있어도 D의 경계식 오른쪽은 자유 표면전하를 사용한다.","core":0}]},{"t":"m","tex":"E_{1t}=E_{2t},\\qquad D_{2n}-D_{1n}=\\rho_{s,\\mathrm{free}}","note":"법선 방향을 매질 1에서 2로 정한다. 정전계 경계조건. ρs,free 단위는 C/m²이다."},{"t":"m","tex":"\\varepsilon_1E_{1n}=\\varepsilon_2E_{2n},\\qquad \\frac{\\tan\\theta_1}{\\tan\\theta_2}=\\frac{\\varepsilon_1}{\\varepsilon_2}","note":"자유 표면전하가 0인 두 선형·등방성 유전체. θ는 경계면의 법선과 E가 이루는 각이다."},{"t":"m","tex":"\\mathbf{P}=\\mathbf{D}-\\varepsilon_0\\mathbf{E}=\\varepsilon_0(\\varepsilon_r-1)\\mathbf{E}","note":"P: 분극 C/m². 마지막 등호는 선형·등방성 유전체 모델이다."},{"t":"trap","items":["법선 D 연속에는 자유 표면전하 0이라는 조건이 필요하다.","접선 E 연속과 법선 E 연속을 혼동하지 않는다.","그림의 각도가 면 기준인지 법선 기준인지부터 표시한다."]},{"t":"ex","q":"자유 표면전하가 없는 경계에서 ε1=2ε0, ε2=6ε0이다. E1이 법선방향이고 크기가 90 V/m일 때 E2는?","steps":["법선 D가 같으므로 ε1E1=ε2E2다.","E2=(2/6)×90=30 V/m이다."],"a":"30 V/m. 유전율이 3배인 쪽의 법선 전계는 1/3이다."},{"t":"chk","q":"전계가 두 유전체 경계면에 평행하다. E와 D 중 어느 양의 해당 성분이 같고, 무엇이 달라질 수 있는가?","a":"접선 E는 같다. D=εE이므로 유전율이 다르면 접선 D는 달라질 수 있다."}]},{"id":"E07","title":"전도전류와 변위전류: 절연체 사이에서도 장은 변한다","pr":"A","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"전도전류는 자유전하가 이동해서 생긴다.","core":1},{"s":"도체에 전계가 작용하면 전하가 이동하며, 선형 옴성 매질에서는 전류밀도 Jc=σE다.","core":0},{"s":"σ는 도전율로 S/m 단위다.","core":0},{"s":"σ가 크면 같은 전계에서 더 많은 전류가 흐른다.","core":0},{"s":"전류밀도는 단위 면적을 지나는 전류이므로 A/m²이고 전류 자체의 단위 A와 다르다.","core":0}]},{"t":"p","ss":[{"s":"콘덴서를 충전할 때 금속선에는 전도전류가 흐르지만 이상적인 절연층을 자유전하가 그대로 관통하지는 않는다.","core":0},{"s":"그런데 판 사이의 D가 시간에 따라 변하므로 자기장을 설명할 때 그 변화도 전류와 같은 역할로 포함해야 한다.","core":0},{"s":"이것이 변위전류다.","core":0},{"s":"진공에서도 시간에 따라 전기장이 변하면 변위전류밀도가 존재하므로 ‘유전체 분자가 있어야만 변위전류가 생긴다’는 설명은 불충분하다.","core":0}]},{"t":"p","ss":[{"s":"변위전류밀도는 D의 시간미분이다.","core":0},{"s":"ε가 일정하면 ε와 E의 시간미분으로 쓸 수 있다.","core":0},{"s":"전계가 시간에 따라 일정한 직류 정전상태라면 변위전류는 0이다.","core":0},{"s":"전계의 값이 큰지 작은지보다 변하는지가 핵심이다.","core":0},{"s":"같은 진폭의 정현파라면 주파수가 높을수록 변화가 빨라져 변위전류 진폭이 커진다.","core":0}]},{"t":"p","ss":[{"s":"교류에서 전도전류 크기는 σE에, 변위전류 크기는 ωεE에 비례한다.","core":0},{"s":"따라서 σ/(ωε)가 크면 전도전류가 우세하고, 작으면 변위전류가 우세하다.","core":0},{"s":"이것은 손실성 매질의 성격을 판단하는 데 쓰지만, 복잡한 복소 고유임피던스 계산까지는 후순위다.","core":0},{"s":"5일 동안은 ‘전도는 σE, 변위는 D의 시간미분’이라는 대조를 확실히 쓴다.","core":0}]},{"t":"m","tex":"\\mathbf{J}_c=\\sigma\\mathbf{E},\\qquad \\mathbf{J}_d=\\frac{\\partial\\mathbf{D}}{\\partial t}=\\varepsilon\\frac{\\partial\\mathbf{E}}{\\partial t}","note":"Jc·Jd: A/m². σ: S/m, ε: F/m. 마지막 등호는 ε가 시간에 따라 일정한 선형 매질이다."},{"t":"m","tex":"I=\\int_S\\mathbf{J}\\cdot d\\mathbf{S},\\qquad \\frac{|J_c|}{|J_d|}=\\frac{\\sigma}{\\omega\\varepsilon}","note":"균일하고 면에 수직인 J라면 I=JA. 오른쪽은 정현파 정상상태의 크기 비이며 ω=2πf다."},{"t":"trap","items":["변위전류가 있다고 절연체가 반드시 도체처럼 새는 것은 아니다.","시간에 따라 변하지 않는 E에서는 변위전류가 0이지만 도전율이 있으면 전도전류는 존재할 수 있다.","J에 면적을 곱해야 I가 된다. 부피를 곱하지 않는다."]},{"t":"ex","q":"단면적 0.02 m²인 면에 수직으로 균일한 변위전류밀도 3 A/m²가 작용한다. 변위전류는?","steps":["균일하고 수직이므로 I=JA를 사용한다.","3×0.02=0.06 A다."],"a":"0.06 A = 60 mA."},{"t":"chk","q":"진공 속 전계가 시간에 따라 변한다. 전도전류가 0이면 변위전류도 반드시 0인가?","a":"아니다. 진공에서도 ∂D/∂t가 0이 아니면 변위전류밀도가 존재한다."}]},{"id":"E08","title":"자속과 자속밀도: 면의 각도와 자기력선","pr":"A","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"자속 Φ는 어떤 면을 통과하는 자기장의 총량으로 단위는 Wb다.","core":1},{"s":"자속밀도 B는 단위 면적당 자속에 해당하며 T=Wb/m²다.","core":0},{"s":"균일한 B가 면에 수직으로 통과하면 Φ=BA가 된다.","core":0},{"s":"같은 자속이 좁은 단면으로 모이면 B가 커진다.","core":0},{"s":"이 관계는 자기회로와 변압기에서 단면적이 바뀌는 문제를 이해하는 기초다.","core":0}]},{"t":"p","ss":[{"s":"면에는 화살표 방향이 없기 때문에 면에 수직인 법선벡터를 정해 방향을 나타낸다.","core":0},{"s":"Φ=BA cosθ의 θ는 B와 법선 사이 각이다.","core":0},{"s":"B가 면을 정면으로 뚫을 때 θ=0이어서 자속이 최대이고, B가 면을 따라 흐를 때 θ=90°이어서 관통 자속은 0이다.","core":0},{"s":"문제에서 코일 평면과 자기장이 이루는 각을 주면 sin으로 나타낼 수 있으므로 각도 정의를 먼저 읽는다.","core":0}]},{"t":"p","ss":[{"s":"자기장에서는 고립된 자기 단극자를 가정하지 않는 기본 전자기학 모델을 사용한다.","core":0},{"s":"따라서 닫힌 면으로 들어오는 총자속과 나가는 총자속이 같고, 순자속은 0이다.","core":0},{"s":"자석 밖에서 자기력선이 N극에서 S극으로 향한다고 해서 S극에서 자속선이 사라지는 것은 아니다.","core":0},{"s":"내부를 포함하면 닫힌 고리를 이룬다.","core":0}]},{"t":"p","ss":[{"s":"H와 B가 같은 방향인 선형·등방성 물질에서는 B=μH다.","core":0},{"s":"그러나 강자성체는 자화 상태에 따라 B-H 관계가 달라지고 포화·이력이 생긴다.","core":0},{"s":"5일 계산에서는 문제에서 μ를 일정하게 주면 선형식을 사용하되, 모든 철심에서 μ가 항상 같은 상수라고 일반화하지 않는다.","core":0},{"s":"자세한 기기 손실과 운전특성은 전기기기 권에서 연결한다.","core":0}]},{"t":"m","tex":"\\Phi=\\int_S\\mathbf{B}\\cdot d\\mathbf{S},\\qquad \\Phi=BA\\cos\\theta","note":"Φ: Wb, B: T, A: m². 오른쪽은 균일 B·평면. θ는 B와 면의 법선 사이 각이다."},{"t":"m","tex":"\\oint_S\\mathbf{B}\\cdot d\\mathbf{S}=0,\\qquad \\nabla\\cdot\\mathbf{B}=0","note":"자기장의 가우스 법칙. S는 폐곡면이며, 자기 단극자가 없다는 기본 모델을 표현한다."},{"t":"trap","items":["자속 Wb와 자속밀도 T를 바꿔 적지 않는다.","B가 면에 평행하면 자속은 최대가 아니라 0이다.","닫힌 면의 순자속 0은 각 지점의 B=0을 뜻하지 않는다."]},{"t":"ex","q":"균일한 B=0.5 T가 면적 0.04 m²인 면에 수직으로 통과한다. 자속은? 그 면을 B와 평행하게 돌리면?","steps":["처음에는 θ=0이므로 Φ=0.5×0.04=0.02 Wb다.","면이 B와 평행하면 법선과 B는 수직이므로 cosθ=0이다."],"a":"처음 0.02 Wb, 회전 후 0 Wb."},{"t":"chk","q":"같은 자속이 단면적 절반인 철심 부분을 통과하면 그 부분의 B는 몇 배인가? 누설은 무시한다.","a":"2배다. Φ=BA에서 Φ가 같으므로 B는 단면적 A에 반비례한다."}]},{"id":"E09","title":"앙페르 법칙과 직선·솔레노이드·환상 코일","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"정자계에서 닫힌 경로를 따라 H의 접선성분을 더하면 그 경로가 둘러싼 순전류가 된다.","core":1},{"s":"이것이 앙페르 주회적분 법칙이다.","core":0},{"s":"전류가 여러 번 면을 통과하면 권수 N만큼 더해져 NI가 된다.","core":0},{"s":"적분 경로의 방향과 전류 부호는 오른손 규칙으로 연결되므로 반대 방향 전류는 대수적으로 빼야 한다.","core":0}]},{"t":"p","ss":[{"s":"무한히 긴 직선도선에서는 자계가 도선을 중심으로 원을 그리며 돈다.","core":0},{"s":"반지름 r인 원 위에서는 H가 일정하므로 H×2πr=I가 되어 H=I/(2πr)다.","core":0},{"s":"엄지를 관습적 전류 방향으로 향하면 나머지 손가락이 감기는 방향이 자계 방향이다.","core":0},{"s":"전자의 이동 방향을 전류 방향으로 잘못 사용하면 자계 방향도 뒤집힌다.","core":0}]},{"t":"p","ss":[{"s":"매우 긴 솔레노이드의 내부에서는 H가 대략 NI/ℓ이고 외부 자계는 이상적 무한 길이 모델에서 0이다.","core":0},{"s":"실제 유한 코일은 끝 부근의 누설자계가 있으므로 외부가 어디서나 정확히 0이라고 말하지 않는다.","core":0},{"s":"권수를 같은 길이에 더 촘촘히 감으면 내부 자계가 커진다.","core":0},{"s":"여기서 ℓ은 전선의 전체 길이가 아니라 솔레노이드의 축방향 길이다.","core":0}]},{"t":"p","ss":[{"s":"환상 솔레노이드는 도넛 모양으로 감은 코일이다.","core":0},{"s":"내부에서 반지름 r인 원형 경로를 잡으면 H=NI/(2πr)다.","core":0},{"s":"좁은 단면의 환상 철심을 간단히 계산할 때 평균 반지름 또는 평균 자로 길이를 사용한다.","core":0},{"s":"원형 한 바퀴 코일 중심의 NI/(2r)와 다르다.","core":0},{"s":"두 모양 모두 둥글다고 해서 분모의 π를 마음대로 붙이거나 없애지 않는다.","core":0}]},{"t":"m","tex":"\\oint\\mathbf{H}\\cdot d\\mathbf{l}=I_{\\mathrm{enc}}","note":"정자계의 앙페르 법칙. H: A/m, dl: m, 오른쪽 순포함 전류: A. N회 관통하는 코일이면 NI."},{"t":"m","tex":"H_{\\mathrm{wire}}=\\frac{I}{2\\pi r},\\quad H_{\\mathrm{solenoid}}\\simeq\\frac{NI}{\\ell},\\quad H_{\\mathrm{toroid}}=\\frac{NI}{2\\pi r}","note":"직선도선은 도체 외부, 솔레노이드는 충분히 긴 코일 내부, 환상은 이상적인 코일 내부이다. 모든 길이는 m."},{"t":"trap","items":["긴 솔레노이드 식의 ℓ에 감은 전선 총길이를 넣지 않는다.","시간변화 전기장이 중요한 문제에서는 앙페르-맥스웰식의 변위전류 항을 포함한다.","원형 코일 중심의 분모 2r와 환상 코일 내부의 2πr는 다른 식이다."]},{"t":"ex","q":"길이 0.5 m에 200회 감은 충분히 긴 솔레노이드에 2 A가 흐른다. 내부 H는?","steps":["내부 H=NI/ℓ를 쓴다.","200×2/0.5=800 A/m이다."],"a":"800 A/m. B를 구하라고 하면 매질의 μ를 추가로 곱한다."},{"t":"chk","q":"무한 직선도선의 전류를 2배로 하고 관측 거리도 2배로 하면 H는?","a":"변하지 않는다. H=I/(2πr)에서 전류와 거리의 변화가 상쇄된다."}]},{"id":"E10","title":"원형 코일 중심 자계와 권수비: 무엇을 고정했나","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"비오-사바르 법칙은 작은 전류 조각이 만드는 자계를 더하는 방법이다.","core":1},{"s":"원형 코일 중심에서는 모든 전류 조각이 만드는 자계가 같은 축방향으로 향한다.","core":0},{"s":"한 바퀴 둘레 2πr를 따라 적분하면 분모의 4πr²와 정리되어 H=I/(2r)가 된다.","core":0},{"s":"원형 코일 중심 공식에 π가 없다는 점을 따로 암기할 가치가 있다.","core":0}]},{"t":"p","ss":[{"s":"같은 반지름 r인 코일을 N회 감고 각 회에 같은 전류 I가 흐르면 중심 자계는 N배가 된다.","core":0},{"s":"그래서 H=NI/(2r), B=μNI/(2r)이다.","core":0},{"s":"얇게 모인 원형 권선으로 각 회의 반지름과 중심이 같다고 보는 근사다.","core":0},{"s":"코일 중심에서 떨어진 축상점이나 두꺼운 권선 전체의 장을 묻는 경우에는 다른 식 또는 합성이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"권수비 문제는 고정한 조건을 확인해야 한다.","core":0},{"s":"반지름과 전류가 그대로이면 권수 2배에 H도 2배다.","core":0},{"s":"그러나 같은 길이의 전선을 풀어 더 많이 감는다면 한 바퀴 둘레가 줄어 반지름도 줄어든다.","core":0},{"s":"얇은 원형 권선·리드선 무시 조건에서 전선 길이 Lwire=2πrN이므로 r는 N에 반비례하고, 전류를 일정하게 유지하면 H는 N²에 비례한다.","core":0}]},{"t":"p","ss":[{"s":"같은 전선을 다시 감는 문제에서 ‘전압 일정’이 주어지면 저항 변화 여부도 확인해야 한다.","core":0},{"s":"같은 재료·단면·총길이를 유지하면 저항이 같아 전류도 같은 것으로 볼 수 있다.","core":0},{"s":"하지만 전선 길이가 늘어나거나 전원 내부저항·교류 리액턴스가 중요하면 권수만으로 결론 내릴 수 없다.","core":0},{"s":"5일 학습에서는 문제의 일정 조건을 공식 옆에 꼭 적는다.","core":0}]},{"t":"p","ss":[{"s":"두 코일 자계가 같은 방향인지 반대 방향인지도 중요하다.","core":0},{"s":"같은 축에 놓인 두 코일의 중심이 같고 방향이 같으면 크기를 더하고, 반대면 뺀다.","core":0},{"s":"힘처럼 자계도 벡터이므로 권수의 숫자만 더하지 않는다.","core":0},{"s":"관측하는 면에서 전류가 반시계 방향이면 중심 자계는 관측자 쪽, 시계 방향이면 종이 안쪽이다.","core":0}]},{"t":"m","tex":"d\\mathbf{H}=\\frac{I\\,d\\mathbf{l}\\times\\hat{\\mathbf{r}}}{4\\pi r^2},\\qquad H_{\\mathrm{center}}=\\frac{NI}{2r}","note":"첫 식은 비오-사바르 법칙. 오른쪽 r는 원형 코일 반지름 m, N은 권수, I는 A, H는 A/m이다."},{"t":"m","tex":"B_{\\mathrm{center}}=\\frac{\\mu NI}{2r},\\qquad \\frac{H_2}{H_1}=\\frac{N_2I_2r_1}{N_1I_1r_2}","note":"동일 중심의 얇은 원형 권선. B의 비를 비교할 때 매질이 바뀌면 μ 비도 포함한다."},{"t":"m","tex":"L_{\\mathrm{wire}}=2\\pi rN,\\qquad H=\\frac{\\pi I N^2}{L_{\\mathrm{wire}}}","note":"리드선 길이와 권선 두께를 무시한 같은 길이 전선 모델. H∝N²는 총길이와 전류가 일정할 때만 성립한다."},{"t":"trap","items":["원형 코일 중심 H=NI/(
