<script type="application/json" id="book-data">[{"num":"01","title":"회로이론","acc":"#2563EB","day":1,"secs":[{"id":"C01","title":"전하·전압·전류·전력: 단위로 식을 확인하기","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"전류는 단위 시간에 이동한 전하, 전압은 단위 전하당 에너지, 전력은 단위 시간당 에너지다.","core":1,"star":1},{"s":"전류의 양을 나타내는 A와 전하량을 나타내는 C를 구별한다.","core":0},{"s":"1 A가 1초 동안 흐르면 1 C의 전하가 이동한다.","core":0}]},{"t":"p","ss":[{"s":"저항에 전류가 흐르면 전기에너지가 열로 바뀐다.","core":0},{"s":"저항의 소비전력은 전압과 전류의 곱이며, 옴의 법칙을 넣으면 전류의 제곱에 저항을 곱한 식 또는 전압의 제곱을 저항으로 나눈 식을 얻는다.","core":0},{"s":"어느 식을 사용할지는 문제에서 무엇을 일정하게 유지했는지로 결정한다.","core":0}]},{"t":"p","ss":[{"s":"전압을 일정하게 유지할 때 저항이 커지면 전류와 전력이 감소한다.","core":0},{"s":"반대로 전류가 일정하면 저항이 커질수록 전력이 증가한다.","core":0},{"s":"‘저항이 커지면 발열이 커진다’처럼 조건 없이 외우지 않는다.","core":0},{"s":"교류에서 이 절의 저항 전력식에 넣는 V와 I는 실효값이다.","core":0}]},{"t":"p","ss":[{"s":"양성자는 +e, 전자는 -e의 전하를 갖고 중성자는 전하가 0이다.","core":0},{"s":"e=1.602176634×10⁻¹⁹ C이므로 전자 약 6.242×10¹⁸개의 전하 크기가 1 C이다.","core":0},{"s":"질량은 전자 약 9.109×10⁻³¹ kg, 양성자 1.673×10⁻²⁷ kg, 중성자 1.675×10⁻²⁷ kg이다.","core":0},{"s":"전류의 기준 방향은 양전하 이동 방향이어서 금속 속 전자의 이동 방향과 반대다.","core":0},{"s":"시간에 따라 변하면 전하는 전류의 적분, 에너지는 전력의 적분으로 구한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-passive-sign.svg","title":"전류·전압·에너지 기준","caption":"저항에 들어가는 전류와 +단자를 함께 표시한 수동부호규약, 전하-에너지 그래프에서 전압을 읽는 도식.","alt":"저항에 들어가는 전류와 +단자를 함께 표시한 수동부호규약, 전하-에너지 그래프에서 전압을 읽는 도식.","width":960.0,"height":480.0},{"t":"m","tex":"i=\\frac{dq}{dt},\\quad v=\\frac{dw}{dq},\\quad p=\\frac{dw}{dt}=vi","note":"q: 전하 C, t: 시간 s, w: 에너지 J, v: 전압 V, i: 전류 A, p: 순간전력 W. 수동부호규약에서 전류가 +단자로 들어가면 p>0은 흡수."},{"t":"m","tex":"P=VI=I^2R=\\frac{V^2}{R},\\quad W=Pt","note":"일정한 직류 또는 저항의 정현파 정상상태. R: Ω. 에너지는 P[W]×t[s]이면 J, P[kW]×t[h]이면 kWh."},{"t":"m","tex":"1\\ \\mathrm{kWh}=3.6\\times10^6\\ \\mathrm{J}","note":"k=10³, m=10⁻³, μ=10⁻⁶, n=10⁻⁹. 수치 대입 전에 단위를 맞춘다."},{"t":"m","tex":"q(t)-q(0)=\\int_0^t i(u)\\,du,\\quad w(t)-w(0)=\\int_0^t v(u)i(u)\\,du","note":"전류 A를 시간 s에 대해 적분하면 C, 전력 W를 적분하면 J. 일정하지 않은 파형에 단순 Q=It를 쓸 수 없을 때의 일반식."},{"t":"trap","items":["kW는 전력이고 kWh는 에너지다. kW/h로 쓰지 않는다.","μF를 F로 바꾸지 않고 대입하면 결과가 백만 배 어긋난다."]},{"t":"ex","q":"12 V가 걸린 6 Ω 저항의 전류, 전력, 10초 동안 소비한 에너지를 구하라.","steps":["옴의 법칙에서 I=12/6=2 A.","P=12×2=24 W. W=24×10=240 J."],"a":"2 A, 24 W, 240 J."},{"t":"chk","q":"같은 저항에 걸린 전압을 두 배로 하면 소비전력은 몇 배인가?","a":"4배. R이 일정할 때 P=V²/R이므로 전압의 제곱에 비례한다."}]},{"id":"C02","title":"직렬·병렬과 키르히호프: 회로를 읽는 순서","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"직렬은 같은 전류, 병렬은 같은 전압이다.","core":1,"star":1},{"s":"그림에서 부품이 나란히 놓였다는 모양만으로 병렬을 판단하지 않는다.","core":0},{"s":"부품의 양 끝이 각각 같은 두 마디에 연결되어 있어야 병렬이다.","core":0},{"s":"중간 마디에서 전류가 갈라지면 두 부품은 단순 직렬이 아니다.","core":0}]},{"t":"p","ss":[{"s":"KCL은 전하가 마디에 계속 쌓이지 않는다는 보존법칙이다.","core":0},{"s":"한 마디로 들어온 전류의 합은 나간 전류의 합과 같다.","core":0},{"s":"KVL은 닫힌 경로를 한 바퀴 돌면 전위가 원래대로 돌아온다는 법칙으로, 전압 상승과 강하를 부호 있게 합하면 0이다.","core":0}]},{"t":"p","ss":[{"s":"문제 풀이 순서는 기준 마디와 전류 방향을 임의로 정하고, 직병렬로 줄일 수 있는 부분을 먼저 줄인 뒤, KCL이나 KVL을 쓰는 것이다.","core":0},{"s":"계산 결과가 음수면 처음 정한 방향과 반대라는 뜻이다.","core":0},{"s":"휘스톤 브리지는 가운데 가지 전류가 0인 평형 조건에서만 양쪽 분압 전압이 같다.","core":0}]},{"t":"p","ss":[{"s":"휘스톤 접속은 전원 위 마디 A와 아래 마디 D 사이에 A-R1-B-R2-D, A-R3-C-R4-D 두 가지를 두고 검류계를 B-C 사이에 연결한 구조다.","core":0},{"s":"B와 C의 전위가 같으면 검류계 전류가 0이고 R1R4=R2R3이다.","core":0},{"s":"평형에서만 가운데 가지를 지우고 두 직렬 가지의 병렬로 계산할 수 있다.","core":0},{"s":"예를 들어 R1=2 Ω, R2=3 Ω, R3=4 Ω이면 평형 R4=6 Ω이다.","core":0},{"s":"전원 10 V일 때 두 중간 마디는 모두 D 기준 6 V이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-series-parallel.svg","title":"직렬·병렬 기본 결선","caption":"직렬에서는 소자를 지나는 전류가 같고 병렬에서는 양단 마디가 같다. KVL의 전압합과 KCL의 전류합을 결선에서 읽는다.","alt":"직렬에서는 소자를 지나는 전류가 같고 병렬에서는 양단 마디가 같다. KVL의 전압합과 KCL의 전류합을 결선에서 읽는다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-wheatstone.svg","title":"휘스톤 브리지","caption":"전원은 위와 아래 마디 사이, 검류계는 두 분압점 사이에 연결된다. 표시한 R1~R4 위치에서 평형식은 R1R4=R2R3이다.","alt":"전원은 위와 아래 마디 사이, 검류계는 두 분압점 사이에 연결된다. 표시한 R1~R4 위치에서 평형식은 R1R4=R2R3이다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-wire-resistance.svg","title":"원통 도체 저항의 기하","caption":"같은 재료에서 길이가 길면 저항이 커지고 단면적이 크면 작아진다. 전류 흐름에 수직인 단면적과 도체 길이를 구별한다.","alt":"같은 재료에서 길이가 길면 저항이 커지고 단면적이 크면 작아진다. 전류 흐름에 수직인 단면적과 도체 길이를 구별한다.","width":960.0,"height":500.0},{"t":"m","tex":"R_{\\mathrm{s}}=R_1+R_2,\\quad R_{\\mathrm{p}}=\\frac{R_1R_2}{R_1+R_2}","note":"R: 저항 Ω. 직렬 합성저항은 큰 저항보다 크고, 병렬 합성저항은 작은 저항보다 작아야 한다."},{"t":"m","tex":"V_1=V\\frac{R_1}{R_1+R_2},\\quad I_1=I\\frac{R_2}{R_1+R_2}","note":"두 저항 직렬의 분압과 두 저항 병렬의 분류. 분류식의 분자에는 반대편 저항이 온다."},{"t":"m","tex":"\\sum i=0,\\quad \\sum v=0","note":"마디의 KCL과 폐경로의 KVL. 미리 정한 부호를 일관되게 유지한다."},{"t":"trap","items":["전압계가 연결되면 그 내부저항도 회로의 일부가 될 수 있다.","브리지가 평형이 아닌데 가운데 저항을 지우면 안 된다. 평형비는 각 가지를 어떻게 이름 붙였는지 확인한다."]},{"t":"ex","q":"18 V 전원에 3 Ω과 6 Ω이 직렬 연결되어 있다. 6 Ω 저항의 전압을 구하라. 이어 두 저항을 병렬로 바꾸면 전체 전류는 얼마인가?","steps":["직렬일 때 합성저항은 9 Ω, 전류는 2 A이므로 6 Ω 전압은 12 V.","병렬일 때 합성저항은 3×6/(3+6)=2 Ω. 전체 전류는 18/2=9 A."],"a":"직렬 12 V, 병렬 전체 전류 9 A."},{"t":"chk","q":"한 마디로 5 A가 들어오고 두 가지로 2 A와 x A가 나간다. x는?","a":"3 A. 들어온 전류 5 A=나간 전류 2 A+x이다."}]},{"id":"C03","title":"복소수·복소공액·절댓값·위상과 페이저","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"복소수의 절댓값은 크기, 편각은 방향, 복소공액은 허수부의 부호만 바꾼 값이다.","core":1,"star":1},{"s":"전기에서는 전류 기호 i와 구분하기 위해 허수단위를 j로 쓰며 j²=-1이다.","core":0},{"s":"a+jb는 서로 직각인 두 성분을 표현하므로 크기는 a+b가 아니라 제곱합의 제곱근이다.","core":0}]},{"t":"p","ss":[{"s":"덧셈과 뺄셈은 실수부끼리·허수부끼리 계산하는 직교형이 편하다.","core":0},{"s":"곱셈과 나눗셈은 크기를 곱하거나 나누고 위상을 더하거나 빼는 극형이 편하다.","core":0},{"s":"분모가 복소수일 때는 분모의 복소공액을 분자·분모에 함께 곱하면 분모를 실수로 만들 수 있다.","core":0}]},{"t":"p","ss":[{"s":"페이저는 같은 주파수의 정현파에서 공통 시간변화를 생략한 복소수 표현이다.","core":0},{"s":"이 책의 페이저 크기는 실효값이다.","core":0},{"s":"순시값의 앞 계수인 최댓값과 혼동하지 않는다.","core":0},{"s":"위상은 arctan(b/a) 값만 쓰지 말고 a와 b의 부호로 사분면을 확인한다.","core":0},{"s":"실수부가 음수인 경우 특히 주의한다.","core":0}]},{"t":"p","ss":[{"s":"오일러 관계 eʲθ=cosθ+j sinθ가 직교형·삼각함수형·지수형을 연결한다.","core":0},{"s":"곱셈은 크기를 곱하고 편각을 더한다.","core":0},{"s":"합성 정현파는 먼저 같은 sin 또는 cos 기준으로 맞춘 후 페이저의 실수부와 허수부를 더하고, 마지막에 실효값 크기와 위상으로 되돌린다.","core":0},{"s":"예를 들어 3∠0° V와 4∠90° V의 합은 5∠53.13° V이며, 최대값은 5√2 V이다.","core":0},{"s":"임피던스 위상은 전압 위상에서 전류 위상을 뺀 값이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-complex-plane.svg","title":"복소수와 페이저 합성","caption":"실수·허수 성분과 크기·위상, 복소공액의 반사, 페이저의 머리-꼬리 합성을 한 그림에서 비교한다.","alt":"실수·허수 성분과 크기·위상, 복소공액의 반사, 페이저의 머리-꼬리 합성을 한 그림에서 비교한다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/control/t-frequency-phasor.svg","title":"주파수 전달함수의 복소수 표현","caption":"정현파의 크기비는 복소수의 길이, 위상차는 복소수의 각도이다. atan(Im/Re)만으로는 사분면을 구별할 수 없다.","alt":"주파수 전달함수의 복소수 표현. 정현파의 크기비는 복소수의 길이, 위상차는 복소수의 각도이다. atan(Im/Re)만으로는 사분면을 구별할 수 없다.","width":960.0,"height":500.0},{"t":"m","tex":"z=a+jb=|z|e^{j\\theta},\\quad |z|=\\sqrt{a^2+b^2}","note":"a,b: 같은 단위의 실수부·허수부. θ: 편각. a>0일 때 θ=tan⁻¹(b/a); 일반적으로 사분면을 함께 판별."},{"t":"m","tex":"z^*=a-jb,\\quad zz^*=a^2+b^2=|z|^2","note":"별표는 복소공액이다. z* 자체가 |z|나 1/z는 아니다."},{"t":"m","tex":"\\frac{A\\angle\\alpha}{B\\angle\\beta}=\\frac{A}{B}\\angle(\\alpha-\\beta)","note":"A,B는 양의 크기. 위상 단위를 도 또는 rad 중 하나로 통일한다."},{"t":"m","tex":"v(t)=\\sqrt{2}V\\cos(\\omega t+\\theta)\\quad\\longleftrightarrow\\quad \\bar{V}=V\\angle\\theta","note":"V: 실효값 V. ω: rad/s. sin을 기준으로 삼아도 되지만 같은 문제 안에서 sin/cos 기준을 섞지 않는다."},{"t":"trap","items":["|a+jb|를 |a|+|b|로 계산하지 않는다.","서로 다른 주파수의 정현파는 하나의 페이저로 단순 합성하지 않는다."]},{"t":"ex","q":"Z=3+j4 Ω에 실효값 전압 V=10∠0° V를 인가했다. 전류를 구하라.","steps":["|Z|=5 Ω, 위상은 약 53.13°. 따라서 I=10/5∠(-53.13°).","직교형으로는 I=10(3-j4)/25=1.2-j1.6 A. 절댓값은 2 A다."],"a":"I=2∠-53.13° A=1.2-j1.6 A."},{"t":"chk","q":"z=-3+j4의 복소공액과 절댓값은?","a":"z*=-3-j4, |z|=5. 원래 z의 위상은 제2사분면에 있다."}]},{"id":"C04","title":"순시값·평균값·실효값: 파형을 혼동하지 않기","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"실효값은 같은 저항에서 같은 평균 열을 만드는 직류값이다.","core":1,"star":1},{"s":"전류가 음수인 동안에도 저항의 발열은 양수이므로, 실효값은 파형을 제곱하여 평균한 뒤 제곱근을 취한다.","core":0},{"s":"평균값은 단순한 면적의 평균이라 양·음이 상쇄될 수 있다.","core":0}]},{"t":"p","ss":[{"s":"대칭 정현파의 부호 있는 한 주기 평균은 0이다.","core":0},{"s":"그러나 정류형 계기나 전파정류파의 평균을 말할 때는 절댓값을 평균하므로 2Vm/π가 나온다.","core":0},{"s":"‘정현파 평균값’이라는 말만 보고 한 가지 숫자를 외우지 말고 반주기 평균인지, 정류평균인지, 한 주기 평균인지 확인한다.","core":0}]},{"t":"p","ss":[{"s":"0과 일정한 양의 값 사이를 오가는 펄스는 듀티비 D가 켜져 있는 시간의 비율이다.","core":0},{"s":"평균은 최대값에 D를 곱하고, 실효값은 최대값에 √D를 곱한다.","core":0},{"s":"같은 최대값이라도 듀티비가 작으면 평균과 발열 효과가 달라진다.","core":0}]},{"t":"p","ss":[{"s":"호도법에서 θ=호 길이/반지름이다.","core":0},{"s":"180°=π rad이고 360°=2π rad이다.","core":0},{"s":"시간 차 Δt에 해당하는 위상차는 ωΔt이다.","core":0},{"s":"sin(ωt+θ)는 기준보다 앞서고 sin(ωt-θ)는 뒤진다.","core":0},{"s":"아래 파형별 표는 Xm에 곱하는 계수이며 평균은 절댓값 한 주기 평균이다.","core":0},{"s":"파고율·파형률의 정의는 X04에 모았다.","core":0},{"s":"평균값에 비례하는 정류형 계기의 눈금을 정현파 실효값으로 보정한 경우 비정현파에서는 오차가 생기며, 열선형·실효값 계기의 측정 원리와 구별한다.","core":0}]},{"t":"p","ss":[{"s":"정현파 유도기전력은 균일 자계 속 코일의 쇄교자속이 회전으로 변하면서 생긴다.","core":0},{"s":"자속과 유도전압은 90° 위상이 다르다.","core":0},{"s":"앙페르 오른손 법칙은 전류와 자기장, 플레밍 오른손 법칙은 발전기에서 운동·자계·유도전류, 왼손 법칙은 전동기에서 자계·전류·힘을 정한다.","core":0},{"s":"렌츠 법칙의 부호는 원인인 자속변화를 방해하는 방향을 뜻하며 소자 수동부호규약의 전압강하 부호와 구별한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-magnetic-directions.svg","title":"자기·운동·유도 방향","caption":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","alt":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-rotation-sine.svg","title":"호도법·회전 벡터·정현파","caption":"회전벡터의 세로 투영이 사인파다. 원 위 각도 θ와 시간 ωt를 연결하고 라디안의 정의를 표시한다.","alt":"회전벡터의 세로 투영이 사인파다. 원 위 각도 θ와 시간 ωt를 연결하고 라디안의 정의를 표시한다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-phase-waves.svg","title":"진상·지상 파형","caption":"시간축에서 먼저 같은 위상을 지나는 파형이 진상이다. 검정 기준에 대해 파랑은 +45도, 빨강은 -45도이며 주기 T는 같다.","alt":"시간축에서 먼저 같은 위상을 지나는 파형이 진상이다. 검정 기준에 대해 파랑은 +45도, 빨강은 -45도이며 주기 T는 같다.","width":960.0,"height":500.0},{"t":"fig","src":"figures/circuit/c-wave-families.svg","title":"정현·정류·구형·삼각 파형","caption":"각 파형의 최대값을 1로 맞춰 비교했다. 원본 표의 실효값·정류평균·파고율·파형률은 서로 다른 연산이며 절댓값 평균과 한 주기 부호 있는 평균을 구별한다.","alt":"각 파형의 최대값을 1로 맞춰 비교했다. 원본 표의 실효값·정류평균·파고율·파형률은 서로 다른 연산이며 절댓값 평균과 한 주기 부호 있는 평균을 구별한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-generator-motor.svg","title":"발전기·전동기 방향 비교","caption":"두 그림의 자기장은 모두 화면 안쪽이다. 도체가 오른쪽으로 움직이면 양전하가 위로 밀려 위쪽이 +극성이 되고, 위로 흐르는 도체 전류는 왼쪽 힘을 받는다.","alt":"두 그림의 자기장은 모두 화면 안쪽이다. 도체가 오른쪽으로 움직이면 양전하가 위로 밀려 위쪽이 +극성이 되고, 위로 흐르는 도체 전류는 왼쪽 힘을 받는다.","width":960.0,"height":560.0},{"t":"m","tex":"f=\\frac{1}{T},\\quad \\omega=2\\pi f","note":"f: Hz, T: 주기 s, ω: 각주파수 rad/s."},{"t":"m","tex":"\\Phi=BA\\cos(\\omega t),\\quad e=-N\\frac{d\\Phi}{dt}=NBA\\omega\\sin(\\omega t)","note":"균일 자계 B[T], 코일 면적 A[m²], 권수 N, 각속도 ω[rad/s]. 코일 면의 법선과 자계 사이 각도가 ωt이고, Φ는 1회전당 자속 Wb. 최대 유도기전력 NBAω[V]."},{"t":"m","tex":"e=Blv\\sin\\theta,\\quad \\Delta\\theta=\\omega\\Delta t","note":"길이 l[m]의 직선 도체가 자계 B[T]를 속도 v[m/s]로 가로지르는 적절한 직교 기하. θ는 운동과 자계 사이 각. 위상차 Δθ는 rad. 일반 운동기전력은 (v×B)의 도체방향 선적분."},{"t":"m","tex":"x_{\\mathrm{avg}}=\\frac{1}{T}\\int_0^T x(t)\\,dt,\\quad x_{\\mathrm{rms}}=\\sqrt{\\frac{1}{T}\\int_0^T x^2(t)\\,dt}","note":"x는 전압 또는 전류. 적분 구간은 정확히 한 주기를 사용한다."},{"t":"m","tex":"X_{\\mathrm{rms}}=\\frac{X_{\\mathrm{m}}}{\\sqrt{2}},\\quad X_{\\mathrm{rect,avg}}=\\frac{2X_{\\mathrm{m}}}{\\pi}","note":"정현파에만 해당. Xm: 최대값. 부호 있는 한 주기 평균은 0."},{"t":"m","tex":"X_{\\mathrm{avg}}=DX_{\\mathrm{m}},\\quad X_{\\mathrm{rms}}=\\sqrt{D}X_{\\mathrm{m}}","note":"0과 Xm 사이를 오가는 직사각형 펄스. D=Ton/T, 0≤D≤1."},{"t":"tb","h":["파형 Xm기준","실효값/Xm","정류평균/Xm","파고율 / 파형률"],"r":[["정현파·전파정류","1/√2","2/π","√2 / π/(2√2)"],["정현 반파정류","1/2","1/π","2 / π/2"],["절댓값 일정 구형파","1","1","1 / 1"],["0↔Xm,듀티 50% 구형","1/√2","1/2","√2 / √2"],["대칭 삼각·선형 톱니","1/√3","1/2","√3 / 2/√3"]]},{"t":"trap","items":["모든 파형의 실효값이 최대값/√2는 아니다.","실효값을 구할 때 전압의 제곱을 먼저 평균해야 한다. 평균을 낸 다음 제곱하지 않는다."]},{"t":"ex","q":"한 주기 중 25% 동안 8 A, 나머지 동안 0 A인 전류의 평균과 실효값을 구하라.","steps":["D=0.25이므로 평균은 8×0.25=2 A.","실효값은 8×√0.25=4 A. 평균과 실효값이 다르다."],"a":"평균 2 A, 실효값 4 A."},{"t":"chk","q":"최대값이 100√2 V인 정현파의 실효값과 부호 있는 한 주기 평균은?","a":"실효값 100 V, 한 주기 평균 0 V."}]},{"id":"C05","title":"콘덴서의 접속·전하·에너지","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"콘덴서는 전하와 전압을 연결하고 전기장에 에너지를 저장한다.","core":1,"star":1},{"s":"병렬은 전압이 같아 용량이 더해지고, 직렬은 중간 도체에 처음 순전하가 없는 일반 조건에서 각 콘덴서의 전하 크기가 같아 용량의 역수가 더해진다.","core":0},{"s":"저항의 직병렬 공식과 자리가 반대다.","core":0}]},{"t":"p","ss":[{"s":"정전용량이 크다는 것은 같은 전압을 만들기 위해 더 많은 전하를 저장할 수 있다는 뜻이다.","core":0},{"s":"에너지 식은 Q와 V의 관계를 이용해 세 형태로 바뀐다.","core":0},{"s":"전압이 일정한 상황에서는 에너지가 C에 비례하지만, 전하가 일정하면 에너지는 C에 반비례한다.","core":0},{"s":"무엇이 고정되는지가 결론을 바꾼다.","core":0}]},{"t":"p","ss":[{"s":"충전된 두 콘덴서를 전원에서 분리한 뒤 병렬로 연결하면 전체 전하를 이용해 최종 공통전압을 구한다.","core":0},{"s":"극성을 맞춰 연결했는지 반드시 확인한다.","core":0},{"s":"최종 정전 에너지는 처음 에너지보다 작을 수 있다.","core":0},{"s":"차이는 실제 연결선의 저항·방사 등으로 이동하며, 에너지 보존이 깨진 것이 아니다.","core":0}]},{"t":"fig","src":"figures/circuit/c-elements-dc.svg","title":"수동소자와 직류 극한","caption":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","alt":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","width":960.0,"height":530.0},{"t":"fig","src":"figures/circuit/c-capacitor-sharing.svg","title":"전하 재분배 보충도","caption":"원문에 없는 학습 보충 도식이다. 같은 극성끼리 고립된 커패시터를 병렬 접속할 때 전하는 보존되지만 저장에너지는 일반적으로 보존되지 않는다.","alt":"원문에 없는 학습 보충 도식이다. 같은 극성끼리 고립된 커패시터를 병렬 접속할 때 전하는 보존되지만 저장에너지는 일반적으로 보존되지 않는다.","width":960.0,"height":500.0},{"t":"m","tex":"Q=CV,\\quad W_C=\\frac{1}{2}CV^2=\\frac{Q^2}{2C}=\\frac{1}{2}QV","note":"C: 정전용량 F, Q: 전하 C, V: 전압 V, WC: 에너지 J. 기호 C가 용량과 쿨롱 단위에 함께 쓰이므로 문맥 구별."},{"t":"m","tex":"C_{\\mathrm{p}}=C_1+C_2,\\quad C_{\\mathrm{s}}=\\frac{C_1C_2}{C_1+C_2}","note":"이상적인 두 콘덴서의 병렬·직렬 등가용량."},{"t":"m","tex":"V_f=\\frac{C_1V_1+C_2V_2}{C_1+C_2}","note":"외부 전원과 분리된 두 콘덴서를 같은 기준 극성으로 병렬 연결한 뒤의 최종값. 반대 극성 전압은 음수로 대입."},{"t":"trap","items":["직렬 콘덴서는 용량이 작은 쪽 전압이 더 크다.","전원에 계속 연결된 경우 전원이 전하를 공급·흡수하므로 콘덴서만의 총전하가 일정하다고 두면 안 된다."]},{"t":"ex","q":"2 μF 콘덴서가 10 V로 충전되고 3 μF 콘덴서는 미충전이다. 전원 없이 같은 극성끼리 연결한 후 최종전압과 최종 에너지는?","steps":["초기 총전하는 2 μF×10 V=20 μC.","합성용량 5 μF이므로 최종전압은 20/5=4 V.","최종 에너지는 0.5×5 μF×4²=40 μJ. 초기 100 μJ와 차이 60 μJ는 연결 과정에서 다른 형태로 이동한다."],"a":"4 V, 40 μJ."},{"t":"chk","q":"2 μF와 3 μF를 100 V 전원에 병렬 연결했다. 전체 저장 에너지는?","a":"0.025 J=25 mJ. 전체 용량 5 μF에 W=CV²/2를 적용한다."}]},{"id":"C06","title":"콘덴서 전류: 미분식과 교류 실효값","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"콘덴서 전류는 전압 그 자체보다 전압이 변하는 속도에 비례한다.","core":1,"star":1},{"s":"전압이 일정하게 유지되는 직류 정상상태에서는 이상적인 콘덴서 전류가 0이다.","core":0},{"s":"반면 교류 전압은 계속 변하므로 충전·방전 전류가 흐른다.","core":0}]},{"t":"p","ss":[{"s":"정현파 전압을 미분하면 같은 주파수에서 위상이 90° 앞선 정현파가 된다.","core":0},{"s":"그래서 콘덴서 전류는 전압보다 90° 앞선다.","core":0},{"s":"주파수가 커질수록 같은 전압에서도 전류가 커지고, 전류 흐름을 방해하는 용량성 리액턴스의 크기는 작아진다.","core":0}]},{"t":"p","ss":[{"s":"교류 실효전류를 구할 때는 전압이 실효값인지 최대값인지부터 읽는다.","core":0},{"s":"전압 최대값에 ωC를 곱하면 전류 최대값이고, 전압 실효값에 곱하면 전류 실효값이다.","core":0},{"s":"서로 다른 종류의 값을 곱한 다음 뒤늦게 √2를 붙이는 실수를 피한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-elements-dc.svg","title":"수동소자와 직류 극한","caption":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","alt":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","width":960.0,"height":530.0},{"t":"fig","src":"figures/circuit/c-element-phases.svg","title":"R·L·C 파형과 페이저","caption":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","alt":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","width":960.0,"height":620.0},{"t":"m","tex":"i_C(t)=C\\frac{dv_C(t)}{dt}","note":"iC: A, C: F, dv/dt: V/s. 콘덴서 +단자로 들어가는 전류 기준."},{"t":"m","tex":"Z_C=\\frac{1}{j\\omega C}=-j\\frac{1}{\\omega C},\\quad I_{\\mathrm{rms}}=\\omega CV_{\\mathrm{rms}}","note":"ZC: Ω, ω=2πf rad/s. 이상적인 정현파 정상상태."},{"t":"m","tex":"v_C(0^+)=v_C(0^-)","note":"유한한 전류만 허용하는 통상적인 스위칭 회로에서는 콘덴서 전압이 연속이다. 이상적인 충격전류가 있으면 별도 해석."},{"t":"trap","items":["직류 연결 직후와 직류 정상상태를 구별한다.","콘덴서 병렬회로에서는 각 가지 전류가 용량에 비례한다. 모든 가지에 전류가 똑같이 흐르는 것이 아니다."]},{"t":"ex","q":"C=50 μF에 각주파수 1000 rad/s, 실효전압 20 V가 걸린다. 실효전류와 위상은?","steps":["I=1000×50×10⁻⁶×20=1 A.","순수 콘덴서 전류는 전압보다 90° 앞선다."],"a":"1 A, 전압보다 90° 진상."},{"t":"chk","q":"2 μF 콘덴서 전압이 1 ms 동안 3 V만큼 일정한 기울기로 증가했다. 전류는?","a":"6 mA. 변화율 3 V/ms=3000 V/s에 2×10⁻⁶ F를 곱한다."}]},{"id":"C07","title":"인덕턴스·상호인덕턴스와 결합 극성","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"인덕터는 전류 변화를 방해하고 자기장에 에너지를 저장한다.","core":1,"star":1},{"s":"전류가 일정하면 이상적인 인덕터 양단 전압은 0이므로 직류 정상상태에서는 단락으로 본다.","core":0},{"s":"그러나 전류가 급격히 바뀌려 하면 큰 전압이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"한 코일의 전류 변화가 다른 코일과 쇄교하는 자속을 변화시키면 상호유도전압이 생긴다.","core":0},{"s":"상호인덕턴스 M은 이 결합의 크기를 나타낸다.","core":0},{"s":"결합계수 k는 모든 자속이 상대 코일과 결합하는 정도를 나타내며 일반적인 수동 두 코일에서 0 이상 1 이하이다.","core":0}]},{"t":"p","ss":[{"s":"직렬 결합의 합성 인덕턴스에는 자기인덕턴스뿐 아니라 상호항 ±2M이 들어간다.","core":0},{"s":"점 표시 단자에 대한 전류 방향을 보고 두 자속이 더해지는 가동인지, 상쇄되는 차동인지 결정한다.","core":0},{"s":"점 표시를 무시하고 무조건 +2M을 쓰지 않는다.","core":0},{"s":"그림이 없으면 문제의 ‘가동·차동’ 조건을 읽는다.","core":0}]},{"t":"p","ss":[{"s":"직렬로 흐르는 한 전류가 두 코일의 점 단자로 모두 들어가거나 모두 나오면 가동이고, 한 코일의 점으로 들어가 다른 코일의 점에서 나오면 차동이다.","core":0},{"s":"도면에서 점끼리를 연결했는지만 보지 말고 실제 전류 화살표를 따라 판단한다.","core":0},{"s":"결합 코일의 전압식을 쓸 때 두 전류를 각각 점으로 들어가는 방향, 두 전압을 점 쪽이 +인 방향으로 정하면 상호항은 +M이다.","core":0},{"s":"한 코일의 전류·전압 기준을 함께 반대로 정하면 상호항은 -M이 된다.","core":0}]},{"t":"fig","src":"figures/circuit/c-elements-dc.svg","title":"수동소자와 직류 극한","caption":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","alt":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","width":960.0,"height":530.0},{"t":"fig","src":"figures/circuit/c-element-phases.svg","title":"R·L·C 파형과 페이저","caption":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","alt":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/circuit/c-coupling-series.svg","title":"직렬 결합과 점 극성","caption":"점은 같은 유도전압 극성을 뜻한다. 같은 직렬 전류가 두 점 단자로 들어오면 +2M, 한쪽만 점으로 들어오면 -2M이 합성 인덕턴스에 더해진다.","alt":"점은 같은 유도전압 극성을 뜻한다. 같은 직렬 전류가 두 점 단자로 들어오면 +2M, 한쪽만 점으로 들어오면 -2M이 합성 인덕턴스에 더해진다.","width":960.0,"height":520.0},{"t":"m","tex":"v_L=L\\frac{di_L}{dt},\\quad W_L=\\frac{1}{2}Li_L^2","note":"L: H, 전류 A, 전압 V, 저장 에너지 J. 유한한 전압 조건에서 인덕터 전류는 연속."},{"t":"m","tex":"M=k\\sqrt{L_1L_2},\\quad 0\\leq k\\leq1","note":"M,L1,L2는 같은 H 단위. 완전 결합은 k=1, 결합 없음은 k=0."},{"t":"m","tex":"v_1=L_1\\frac{di_1}{dt}+M\\frac{di_2}{dt},\\quad v_2=M\\frac{di_1}{dt}+L_2\\frac{di_2}{dt}","note":"두 전류가 각각 점 단자로 들어가고 두 전압의 +가 점 단자일 때. M은 결합 크기를 나타내는 비음수 값으로 두고 기준 방향에 따라 상호항 부호를 정한다."},{"t":"m","tex":"L_{\\mathrm{aiding}}=L_1+L_2+2M,\\quad L_{\\mathrm{opposing}}=L_1+L_2-2M","note":"두 코일을 직렬 접속한 경우. 병렬 접속 공식으로 사용하지 않는다."},{"t":"trap","items":["같은 전류가 흐른다고 인덕터의 에너지가 LI²가 되는 것은 아니다. 1/2가 필요하다.","패러데이 유도기전력의 부호와 수동부호규약으로 정의한 단자전압의 부호를 구분한다."]},{"t":"ex","q":"L1=9 mH, L2=16 mH, k=0.5인 두 코일의 M과 직렬 가동·차동 합성값을 구하라.","steps":["M=0.5×√(9×16)=6 mH.","가동은 9+16+12=37 mH, 차동은 9+16-12=13 mH."],"a":"M=6 mH, 가동 37 mH, 차동 13 mH."},{"t":"chk","q":"L=0.2 H에 3 A가 흐를 때 저장 에너지는?","a":"0.9 J. WL=0.5×0.2×3²이다."}]},{"id":"C08","title":"RLC 교류회로: 임피던스와 어드미턴스","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"직렬회로는 임피던스를 더하고, 병렬회로는 어드미턴스를 더한다.","core":1,"star":1},{"s":"임피던스 Z는 전압/전류이며 저항 R과 리액턴스 X를 합한 복소수다.","core":0},{"s":"어드미턴스 Y는 1/Z이며 컨덕턴스 G와 서셉턴스 B로 나뉜다.","core":0}]},{"t":"p","ss":[{"s":"순수 저항은 전압과 전류가 같은 위상이다.","core":0},{"s":"인덕터는 전류가 전압보다 90° 늦고, 콘덴서는 90° 빠르다.","core":0},{"s":"직렬 RLC에서는 XL-XC의 부호로 전체 유도성·용량성을 판별한다.","core":0},{"s":"양수면 유도성이므로 전류가 늦고, 음수면 용량성이므로 전류가 앞선다.","core":0}]},{"t":"p","ss":[{"s":"병렬회로는 전압이 공통이므로 각 가지 전류를 더한다.","core":0},{"s":"저항 가지는 실수 전류, L 가지는 음의 허수 전류, C 가지는 양의 허수 전류로 합친다.","core":0},{"s":"전류 크기를 산술적으로 더하면 위상 차이가 사라져 틀린다.","core":0},{"s":"전체 Y의 허수부가 양수면 용량성 전류가 우세하다.","core":0}]},{"t":"p","ss":[{"s":"RL 직렬은 X=ωL, RC 직렬은 X=-1/(ωC)로 놓는다.","core":0},{"s":"전류 기준으로 VR=IR, VL=jωLI, VC=-jI/(ωC)이므로 전체 전압은 VR+j(VL 크기-VC 크기)다.","core":0},{"s":"반대로 RL 병렬은 B=-1/(ωL), RC 병렬은 B=ωC, RLC 병렬은 B=ωC-1/(ωL)이다.","core":0},{"s":"전압 기준 전체 전류는 V(G+jB)이고, 역률은 G/√(G²+B²)다.","core":0},{"s":"XL<XC이면 병렬 L 전류가 C 전류보다 크므로 지상이다.","core":0},{"s":"직렬의 XL-XC 판별식을 병렬에 그대로 적용하면 부호가 뒤집힌다.","core":0}]},{"t":"fig","src":"figures/circuit/c-complex-plane.svg","title":"복소수와 페이저 합성","caption":"실수·허수 성분과 크기·위상, 복소공액의 반사, 페이저의 머리-꼬리 합성을 한 그림에서 비교한다.","alt":"실수·허수 성분과 크기·위상, 복소공액의 반사, 페이저의 머리-꼬리 합성을 한 그림에서 비교한다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-elements-dc.svg","title":"수동소자와 직류 극한","caption":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","alt":"L은 자속쇄교 λ, C는 전하 q를 저장한다. 충분히 오래 지난 직류 정상상태의 이상 L은 단락, 이상 C는 개방이다. 스위칭 순간에는 별도 초기조건을 적용한다.","width":960.0,"height":530.0},{"t":"fig","src":"figures/circuit/c-element-phases.svg","title":"R·L·C 파형과 페이저","caption":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","alt":"R에서는 동상, L의 전류는 전압보다 90도 늦고 C의 전류는 90도 빠르다. 파형과 회전방향이 같은 규약을 사용한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/circuit/c-series-rlc.svg","title":"RL·RC·RLC 직렬 벡터","caption":"직렬회로는 I를 기준으로 VR가 수평, VL은 +90도, VC는 -90도다. L이나 C 한 소자를 생략하면 각각 RC 또는 RL 직렬도가 된다.","alt":"직렬회로는 I를 기준으로 VR가 수평, VL은 +90도, VC는 -90도다. L이나 C 한 소자를 생략하면 각각 RC 또는 RL 직렬도가 된다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-parallel-rlc.svg","title":"RL·RC·RLC 병렬 벡터","caption":"V를 기준으로 저항전류는 수평, 인덕터 전류는 아래, 콘덴서 전류는 위다. Y의 허수부는 IC-IL이므로 원본의 혼동된 부호를 교정한 그림이다.","alt":"V를 기준으로 저항전류는 수평, 인덕터 전류는 아래, 콘덴서 전류는 위다. Y의 허수부는 IC-IL이므로 원본의 혼동된 부호를 교정한 그림이다.","width":960.0,"height":600.0},{"t":"m","tex":"Z_R=R,\\quad Z_L=j\\omega L,\\quad Z_C=-\\frac{j}{\\omega C}","note":"정현파 정상상태의 이상소자. 모두 Ω 단위."},{"t":"m","tex":"Z_{\\mathrm{series}}=R+j\\left(\\omega L-\\frac{1}{\\omega C}\\right)","note":"|Z|=√(R²+X²), 실효전류의 크기 I=V/|Z|."},{"t":"m","tex":"Y_{\\mathrm{parallel}}=\\frac{1}{R}+j\\left(\\omega C-\\frac{1}{\\omega L}\\right)","note":"각 R,L,C가 별도 병렬 가지인 경우. Y,G,B의 단위는 S(지멘스)."},{"t":"m","tex":"G=\\frac{R}{R^2+X^2},\\quad B=-\\frac{X}{R^2+X^2}","note":"Z=R+jX를 역수로 만든 결과. 일반적으로 G=1/R이라고 놓을 수 없다."},{"t":"m","tex":"R=\\rho\\frac{l}{A},\\quad G=\\sigma\\frac{A}{l},\\quad \\sigma=\\frac{1}{\\rho}","note":"길이 l[m], 단면적 A[m²]가 일정한 도체. ρ: 저항률 Ω·m, σ: 도전율 S/m. 여기의 G는 순수 저항 도체의 컨덕턴스. 온도와 재료 조건이 일정하다고 가정한다."},{"t":"m","tex":"\\cos\\phi_{Z}=\\frac{R}{\\sqrt{R^2+X^2}},\\quad \\cos\\phi_Y=\\frac{G}{\\sqrt{G^2+B^2}}","note":"정현파 수동부하의 역률 크기. 위상 부호는 Z의 허수부 X 또는 Y의 허수부 B로 별도 판정."},{"t":"trap","items":["G=1/R은 순수 저항 또는 병렬 가지의 저항을 따로 표현할 때다. 복합 Z의 실수부 R을 그냥 뒤집지 않는다.","서로 다른 주파수의 성분에는 각각 다른 XL, XC를 적용한다."]},{"t":"ex","q":"R=6 Ω, XL=10 Ω, XC=2 Ω이 직렬이고 실효전압은 50 V다. 전류 크기와 진상·지상을 구하라.","steps":["X=10-2=8 Ω, Z=6+j8 Ω, |Z|=10 Ω.","I=50/10=5 A. X>0이므로 전류는 전압보다 늦는다."],"a":"5 A, 지상."},{"t":"chk","q":"순수 R과 C의 병렬에서 저항전류 3 A, 콘덴서 전류 4 A라면 전체 실효전류 크기는?","a":"5 A. 두 전류의 위상차가 90°이므로 √(3²+4²)를 사용한다."}]},{"id":"C09","title":"유효·무효·피상전력과 복소전력","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"유효전력 P는 평균적으로 소비되는 전력, 무효전력 Q는 저장소자와 왕복하는 효과, 피상전력 S는 전체 전압·전류 실효값의 곱이다.","core":1,"star":1},{"s":"정현파에서는 P와 Q를 직각 성분으로 놓고 피상전력 크기를 구한다.","core":0}]},{"t":"p","ss":[{"s":"복소전력은 전압 페이저에 전류 페이저의 복소공액을 곱한다.","core":0},{"s":"전류가 늦는 유도성 부하의 Q는 양수, 전류가 앞서는 용량성 부하의 Q는 음수로 정하는 수동부호규약을 사용한다.","core":0},{"s":"순수 L이나 C는 평균 유효전력을 소비하지 않지만 전류는 흐르므로 피상전력은 0이 아닐 수 있다.","core":0}]},{"t":"p","ss":[{"s":"역률은 P/S이다.","core":0},{"s":"정현파 전압·전류에서는 위상차의 cos와 같지만 파형에 고조파가 있으면 cosφ만으로 전체 역률을 표현할 수 없다.","core":0},{"s":"병렬 부하의 전력은 유효전력끼리, 무효전력끼리 더한 후 마지막에 피상전력을 구한다.","core":0},{"s":"개별 피상전력의 크기를 바로 더하지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-power-triangle.svg","title":"유효·무효·피상전력","caption":"전압 실효값 페이저와 전류 켤레의 곱이 복소전력이다. 그림은 유도성 부하이며 용량성이면 Q 방향이 아래로 바뀐다.","alt":"전압 실효값 페이저와 전류 켤레의 곱이 복소전력이다. 그림은 유도성 부하이며 용량성이면 Q 방향이 아래로 바뀐다.","width":960.0,"height":510.0},{"t":"m","tex":"\\mathcal{S}=\\bar{V}\\bar{I}^{*}=P+jQ","note":"V,I는 실효값 페이저. 최대값 페이저를 사용하면 오른쪽 계산에 1/2가 필요하다."},{"t":"m","tex":"P=VI\\cos\\phi,\\quad Q=VI\\sin\\phi,\\quad S=VI=\\sqrt{P^2+Q^2}","note":"정현파 단상. φ=전압 위상-전류 위상. P: W, Q: var, S: VA."},{"t":"m","tex":"\\mathrm{pf}=\\frac{P}{S},\\quad P=I^2R,\\quad Q=I^2X","note":"Z=R+jX의 수동부하. X>0 유도성, X<0 용량성."},{"t":"trap","items":["피상전력 S와 복소전력 P+jQ를 구별한다. S는 음수가 아닌 크기다.","정현파가 아닌 일반 파형에 S²=P²+Q²를 무조건 적용하지 않는다."]},{"t":"ex","q":"실효전압 100 V, 실효전류 5 A이고 전류가 36.87° 늦는다. P,Q,S와 역률은?","steps":["S=100×5=500 VA.","cos36.87°=0.8, sin36.87°=0.6이므로 P=400 W, Q=300 var.","전류가 늦으므로 지상 역률 0.8이다."],"a":"400 W, 300 var, 500 VA, 지상 0.8."},{"t":"chk","q":"P=300 W, Q=-400 var인 부하의 피상전력과 성격은?","a":"500 VA, 용량성. Q가 음수이므로 진상 전류를 갖는다."}]},{"id":"C10","title":"비정현파·왜형률: 다른 주파수는 제곱합","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"서로 다른 정수배 주파수의 정현파들은 한 기본주기에서 서로 직교하므로 실효값은 제곱합의 제곱근으로 합친다.","core":1,"star":1},{"s":"기본파는 가장 낮은 기준 주파수 성분, 고조파는 그 정수배 성분이다.","core":0},{"s":"직류 성분이 있으면 그 값의 제곱도 전체 실효값에 포함한다.","core":0}]},{"t":"p","ss":[{"s":"왜형률 THD는 기본파에 비해 고조파 성분이 얼마나 큰지를 나타낸다.","core":0},{"s":"분자는 2차 이상 고조파 실효값들의 제곱합 제곱근, 분모는 기본파 실효값이다.","core":0},{"s":"전체 실효값을 분모로 쓰지 않는다.","core":0},{"s":"모든 성분이 정현파 최대값으로 주어졌다면 같은 √2가 약분되어 비율만은 최대값끼리 계산할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"비정현파 전력은 같은 차수의 전압과 전류 성분끼리 평균전력을 만들고, 다른 차수 사이의 곱은 한 기본주기 평균에서 0이 된다.","core":0},{"s":"피상전력은 여전히 전체 Vrms×Irms다.","core":0},{"s":"정현파 전압에 고조파 전류가 흐르면 기본파 전류의 위상이 같더라도 전체 역률이 1보다 작아질 수 있다.","core":0}]},{"t":"fig","src":"figures/circuit/c-fourier-synthesis.svg","title":"푸리에 파형 합성","caption":"정현 기본파와 3차 성분을 같은 시간축에서 더했다. 서로 다른 주파수의 RMS는 크기합이 아니라 제곱합으로 계산하며 합성파의 순간값은 시간별로 더한다.","alt":"정현 기본파와 3차 성분을 같은 시간축에서 더했다. 서로 다른 주파수의 RMS는 크기합이 아니라 제곱합으로 계산하며 합성파의 순간값은 시간별로 더한다.","width":960.0,"height":620.0},{"t":"m","tex":"X_{\\mathrm{rms}}=\\sqrt{X_0^2+X_1^2+X_2^2+\\cdots}","note":"X0: 직류값, Xn: n차 정현파 성분의 실효값. 공통 기본주기에 대해 계산."},{"t":"m","tex":"\\mathrm{THD}=\\frac{\\sqrt{X_2^2+X_3^2+\\cdots}}{X_1}","note":"무차원 비율. 백분율을 묻는 경우 100을 곱한다. 통상 직류 성분은 THD 분자에서 제외."},{"t":"m","tex":"P=V_0I_0+\\sum_{n=1}^{\\infty}V_nI_n\\cos\\phi_n,\\quad S=V_{\\mathrm{rms}}I_{\\mathrm{rms}}","note":"Vn,In: 같은 차수 성분의 실효값, φn: 그 전압·전류의 위상차."},{"t":"trap","items":["고조파 3 A와 4 A를 더해 7 A로 놓지 않는다.","왜형률은 100%를 넘을 수 있다. 1보다 크다는 이유만으로 계산 오류라고 판단하지 않는다."]},{"t":"ex","q":"기본파 전류가 10 A, 3차가 3 A, 5차가 4 A이며 모두 실효값이다. 고조파 합성값, 전체 실효값, THD를 구하라.","steps":["고조파 합성값은 √(3²+4²)=5 A.","전체는 √(10²+3²+4²)=5√5≈11.18 A.","THD=5/10=0.5=50%."],"a":"고조파 5 A, 전체 약 11.18 A, THD 50%."},{"t":"chk","q":"기본파 12 V와 3차 고조파 5 V만 있을 때 전체 실효전압은?","a":"13 V. 두 값이 실효값이므로 √(12²+5²)=13이다."}]},{"id":"C11","title":"테브난·노턴: 부하가 바라보는 등가회로","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"테브난은 전압원과 직렬저항, 노턴은 전류원과 병렬저항으로 같은 두 단자 특성을 표현한다.","core":1,"star":1},{"s":"등가란 내부 부품이 실제로 같다는 뜻이 아니라, 같은 부하를 연결했을 때 단자 전압과 전류가 같다는 뜻이다.","core":0}]},{"t":"p","ss":[{"s":"테브난 전압은 부하를 떼어 낸 개방상태의 단자전압이다.","core":0},{"s":"노턴 전류는 그 두 단자를 단락했을 때 흐르는 전류다.","core":0},{"s":"두 등가회로의 저항은 같다.","core":0},{"s":"독립전원만 있는 저항회로에서는 전원을 0으로 만든 뒤 단자에서 바라본 저항을 구할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"전압원을 0 V로 만들면 양단 전압이 0이므로 단락이고, 전류원을 0 A로 만들면 전류가 0이므로 개방이다.","core":0},{"s":"‘전원을 없앤다’고 해서 모두 끊는 것이 아니다.","core":0},{"s":"종속전원이 있다면 그것은 그대로 두고 시험 전압원·전류원 등을 써야 하며, 단순 전원 제거법을 기계적으로 적용하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"선형은 비례성과 가산성이 성립한다는 뜻이다.","core":0},{"s":"R,L,C가 일정한 선형 소자라도 전원 때문에 단자 특성이 v=E-ri처럼 절편을 가질 수 있다.","core":0},{"s":"이상전압원의 내부 임피던스는 0, 이상전류원의 내부 임피던스는 무한대다.","core":0},{"s":"실제 전압원 E와 직렬 r의 출력 특성은 v=E-ri이므로 v-i 그래프의 절편 E, 기울기 -r을 읽으면 등가회로를 알 수 있다.","core":0},{"s":"전압원 E와 직렬 Z를 전류원 E/Z와 병렬 Z로 바꾸는 전원변환은 그 두 단자의 전압·전류 관계만 보존한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-sources-characteristics.svg","title":"전원의 출력특성과 제거 규칙","caption":"전압원의 내부저항은 직렬, 전류원의 내부저항은 병렬이다. 중첩이나 등가저항 계산에서 독립 전압원을 끌 때는 단락, 독립 전류원을 끌 때는 개방한다. 종속원에는 이 규칙을 적용하지 않는다.","alt":"전압원의 내부저항은 직렬, 전류원의 내부저항은 병렬이다. 중첩이나 등가저항 계산에서 독립 전압원을 끌 때는 단락, 독립 전류원을 끌 때는 개방한다. 종속원에는 이 규칙을 적용하지 않는다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-thevenin-norton.svg","title":"테브난·노턴 등가원","caption":"같은 외부 단자 a,b에서 전압-전류 관계가 일치한다. 직렬 저항을 전류원 뒤에도 직렬로 두는 오류를 피하도록 병렬 배치를 분명히 표시했다.","alt":"같은 외부 단자 a,b에서 전압-전류 관계가 일치한다. 직렬 저항을 전류원 뒤에도 직렬로 두는 오류를 피하도록 병렬 배치를 분명히 표시했다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-dependent-source.svg","title":"종속원 기호와 보존 규칙","caption":"원본 혼합 전원 예제에 나타나는 종속 전원의 마름모와 제어 관계를 독자 회로로 표시했다. 중첩·등가저항 계산에서 독립원 제거 규칙을 종속원에 그대로 적용하지 않는다.","alt":"원본 혼합 전원 예제에 나타나는 종속 전원의 마름모와 제어 관계를 독자 회로로 표시했다. 중첩·등가저항 계산에서 독립원 제거 규칙을 종속원에 그대로 적용하지 않는다.","width":960.0,"height":540.0},{"t":"m","tex":"V_{\\mathrm{th}}=V_{\\mathrm{oc}},\\quad I_{\\mathrm{N}}=I_{\\mathrm{sc}},\\quad R_{\\mathrm{th}}=R_{\\mathrm{N}}","note":"Voc: 개방전압 V, Isc: 단락전류 A. 부호는 정한 단자 극성과 전류 방향에 따른다."},{"t":"m","tex":"V_{\\mathrm{th}}=I_{\\mathrm{N}}R_{\\mathrm{th}},\\quad I_L=\\frac{V_{\\mathrm{th}}}{R_{\\mathrm{th}}+R_L}","note":"선형 직류 저항회로. 교류는 저항 대신 해당 주파수의 임피던스를 사용한다."},{"t":"trap","items":["테브난 전압을 구할 때 부하저항을 남겨두면 개방전압이 아니다.","이상전압원의 내부저항은 0, 이상전류원의 내부저항은 ∞다. 실제 외부저항과 혼동하지 않는다."]},{"t":"ex","q":"두 단자의 개방전압이 12 V이고 단락전류가 3 A이다. 등가저항과 8 Ω 부하를 연결했을 때 부하전류는?","steps":["Rth=12/3=4 Ω.","부하전류는 12/(4+8)=1 A."],"a":"Rth=4 Ω, 부하전류 1 A."},{"t":"chk","q":"독립전압원과 독립전류원을 0으로 만들 때 각각 무엇으로 바꾸는가?","a":"전압원은 단락, 전류원은 개방. 종속전원은 임의로 끄지 않는다."}]},{"id":"C12","title":"중첩·밀만·쌍대관계: 헷갈리는 이름 묶기","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"중첩은 전압·전류를 더하고, 밀만은 병렬 가지의 공통전압을 구하며, 쌍대는 회로 법칙의 대응관계를 말한다.","core":1,"star":1},{"s":"서로 다른 이름의 공식을 한 문제에 모두 적용하려 하지 말고 회로 구조에 맞는 방법 하나를 고른다.","core":0}]},{"t":"p","ss":[{"s":"중첩의 정리는 선형회로에서 독립전원을 하나씩 작용시켜 얻은 전압·전류를 부호 있게 더하는 방법이다.","core":0},{"s":"전력은 전압이나 전류의 제곱이므로 전원별 전력을 그대로 더하지 않는다.","core":0},{"s":"밀만 정리는 전압원과 직렬저항이 한 가지를 이루고 이런 가지들이 병렬로 만날 때 KCL을 한 번에 정리한 식이다.","core":0}]},{"t":"p","ss":[{"s":"밀만 식의 분자는 각 가지의 전압/저항, 분모는 컨덕턴스 합이다.","core":0},{"s":"전원이 없는 저항 가지도 전압원 0 V인 가지로 보아 분모에 포함한다.","core":0},{"s":"쌍대관계에서는 직렬↔병렬, 전압↔전류, 저항↔컨덕턴스, KVL↔KCL, 테브난↔노턴이 대응한다.","core":0},{"s":"쌍대라는 말이 두 물리량의 수치가 항상 같다는 뜻은 아니다.","core":0}]},{"t":"p","ss":[{"s":"교류 밀만은 각 R을 같은 주파수의 복소 임피던스 Z로 바꾼다.","core":0},{"s":"이상전류원이 추가로 병렬 접속되면 기준 마디로 주입하는 전류를 분자에 더한다.","core":0},{"s":"예를 들어 12 V-3 Ω 가지, 6 V-6 Ω 가지, 전원 없는 6 Ω 부하가 병렬이면 V=(12/3+6/6)/(1/3+1/6+1/6)=7.5 V이다.","core":0},{"s":"전류원 1 A가 위 마디로 추가 주입되면 V=9 V이다.","core":0},{"s":"독립 전류원을 끄고 개방할 때 그와 병렬인 저항까지 제거하지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-sources-characteristics.svg","title":"전원의 출력특성과 제거 규칙","caption":"전압원의 내부저항은 직렬, 전류원의 내부저항은 병렬이다. 중첩이나 등가저항 계산에서 독립 전압원을 끌 때는 단락, 독립 전류원을 끌 때는 개방한다. 종속원에는 이 규칙을 적용하지 않는다.","alt":"전압원의 내부저항은 직렬, 전류원의 내부저항은 병렬이다. 중첩이나 등가저항 계산에서 독립 전압원을 끌 때는 단락, 독립 전류원을 끌 때는 개방한다. 종속원에는 이 규칙을 적용하지 않는다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-superposition.svg","title":"중첩정리 단계별 회로","caption":"같은 두 독립원 회로에서 전류원을 개방한 회로와 전압원을 단락한 회로를 각각 푼 뒤 같은 기준의 전류를 합한다.","alt":"같은 두 독립원 회로에서 전류원을 개방한 회로와 전압원을 단락한 회로를 각각 푼 뒤 같은 기준의 전류를 합한다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/circuit/c-millman.svg","title":"밀만 회로의 극성과 마디","caption":"모든 전압원의 +극이 위인 표시된 회로에서 V=Σ(Ek/Rk)/Σ(1/Rk)다. 전압원의 극성이 뒤집히면 해당 Ek에 음의 부호를 넣는다.","alt":"모든 전압원의 +극이 위인 표시된 회로에서 V=Σ(Ek/Rk)/Σ(1/Rk)다. 전압원의 극성이 뒤집히면 해당 Ek에 음의 부호를 넣는다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-dependent-source.svg","title":"종속원 기호와 보존 규칙","caption":"원본 혼합 전원 예제에 나타나는 종속 전원의 마름모와 제어 관계를 독자 회로로 표시했다. 중첩·등가저항 계산에서 독립원 제거 규칙을 종속원에 그대로 적용하지 않는다.","alt":"원본 혼합 전원 예제에 나타나는 종속 전원의 마름모와 제어 관계를 독자 회로로 표시했다. 중첩·등가저항 계산에서 독립원 제거 규칙을 종속원에 그대로 적용하지 않는다.","width":960.0,"height":540.0},{"t":"m","tex":"V=\\frac{\\sum_k E_k/R_k}{\\sum_k 1/R_k}","note":"공통 기준점에서 본 각 가지 전압원 Ek[V]와 직렬저항 Rk[Ω]. 반대 극성 전압원은 음수로 대입. 별도 병렬 부하 RL은 E=0 가지로 포함."},{"t":"m","tex":"G=\\frac{1}{R},\\quad I=GV","note":"순수 저항의 컨덕턴스 G[S]. 저항 R[Ω]과의 쌍대관계를 기억한다."},{"t":"tb","h":["대상","쌍대 대상"],"r":[["전압·전압원","전류·전류원"],["저항 R","컨덕턴스 G"],["인덕턴스 L","정전용량 C"],["직렬·KVL","병렬·KCL"],["개방","단락"],["테브난 정리","노턴 정리"]]},{"t":"trap","items":["밀만 식에서 전원이 없는 부하 가지를 분모에서 빼먹지 않는다.","중첩을 쓸 때 종속전원은 유지한다. 다른 독립전원만 0으로 만든다."]},{"t":"ex","q":"공통 마디와 접지 사이에 (12 V 전원+6 Ω), (6 V 전원+3 Ω), (전원 없는 6 Ω) 세 가지가 병렬이다. 전원들의 +방향은 마디를 향한다. 공통전압은?","steps":["분자는 12/6+6/3+0/6=4 A.","분모는 1/6+1/3+1/6=2/3 S.","V=4/(2/3)=6 V."],"a":"6 V."},{"t":"chk","q":"노턴 정리와 저항 R의 쌍대 대상을 각각 말하라.","a":"노턴↔테브난, 저항 R↔컨덕턴스 G. 노턴은 전류원 병렬형, 테브난은 전압원 직렬형이다."}]},{"id":"C13","title":"배율기·분류기와 측정기의 연결","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"전압계는 대상에 병렬, 전류계는 대상에 직렬이다.","core":1,"star":1},{"s":"전압계의 측정 범위를 넓히는 배율기는 전압계에 직렬, 전류계의 측정 범위를 넓히는 분류기는 전류계에 병렬이다.","core":0},{"s":"‘계기와 대상의 연결’과 ‘범위 확장 저항과 계기의 연결’을 따로 기억한다.","core":0}]},{"t":"p","ss":[{"s":"전압계는 내부에 정해진 최대 전류만 흘러야 하므로, 더 큰 외부 전압을 측정하려면 남는 전압을 직렬 저항에 나누어 걸어야 한다.","core":0},{"s":"전류계는 전체 전류 중 일부만 계기로 보내고 나머지는 저항이 작은 병렬 우회로로 흘려야 한다.","core":0}]},{"t":"p","ss":[{"s":"이상전압계는 회로에서 전류를 거의 빼앗지 않도록 내부저항이 무한대이고, 이상전류계는 회로에 전압강하를 거의 만들지 않도록 내부저항이 0이다.","core":0},{"s":"실제 계기는 유한한 내부저항 때문에 측정 대상 회로를 변화시킨다.","core":0},{"s":"이 부하효과는 계기의 단순 오차와 구별되는 개념이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-meter-range.svg","title":"배율기·분류기 결선","caption":"전압계에는 큰 저항을 직렬, 전류계에는 작은 저항을 병렬로 연결한다. 전류계 본체와 분류기는 같은 두 마디에 연결된다.","alt":"전압계에는 큰 저항을 직렬, 전류계에는 작은 저항을 병렬로 연결한다. 전류계 본체와 분류기는 같은 두 마디에 연결된다.","width":960.0,"height":500.0},{"t":"m","tex":"R_m=(m-1)R_v,\\quad m=\\frac{V_{\\mathrm{new}}}{V_{\\mathrm{old}}}","note":"배율기 Rm[Ω]는 내부저항 Rv인 전압계에 직렬. m>1."},{"t":"m","tex":"R_s=\\frac{R_a}{m-1},\\quad m=\\frac{I_{\\mathrm{new}}}{I_{\\mathrm{old}}}","note":"분류기 Rs[Ω]는 내부저항 Ra인 전류계에 병렬. 계기 자체의 최대전류는 유지."},{"t":"trap","items":["배율기에 R/(m-1)을 쓰면 분류기 공식과 바뀐 것이다.","전류계를 전원 양단에 병렬로 연결하는 것은 올바른 전류 측정법이 아니다."]},{"t":"ex","q":"최대 10 V, 내부저항 2 kΩ인 전압계로 50 V까지 측정하려 한다. 배율기 저항은?","steps":["확장배율 m=50/10=5.","Rm=(5-1)×2 kΩ=8 kΩ. 계기와 직렬로 연결한다."],"a":"8 kΩ, 직렬."},{"t":"chk","q":"내부저항 1 Ω인 전류계의 범위를 5배로 넓히는 분류기 저항은?","a":"0.25 Ω. Rs=1/(5-1)이며 계기에 병렬 연결한다."}]},{"id":"C14","title":"평형 3상과 영상분: 크기 합과 벡터 합","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"평형 3상은 같은 크기의 정현파 세 개가 120°씩 어긋난 상태다.","core":1,"star":1},{"s":"따라서 세 상의 크기를 산술적으로 더하는 것이 아니라 페이저를 합해야 한다.","core":0},{"s":"완전한 평형 3상 정상분의 페이저 합은 0이다.","core":0}]},{"t":"p","ss":[{"s":"Y결선은 선전류와 상전류가 같고 선간전압 크기가 상전압의 √3배다.","core":0},{"s":"Δ결선은 선간전압과 상전압이 같고 선전류 크기가 상전류의 √3배다.","core":0},{"s":"부하 임피던스는 한 상에 걸린 전압을 그 상의 전류로 나눠 구한다.","core":0},{"s":"선간전압을 상임피던스로 바로 나누면 결선에 따라 틀린다.","core":0}]},{"t":"p","ss":[{"s":"대칭좌표법은 불평형 3상을 정상분·역상분·영상분으로 나누는 방법이다.","core":0},{"s":"영상분은 세 상에 동일 위상·동일 크기로 존재하는 성분으로, 세 상의 페이저 합을 3으로 나누어 구한다.","core":0},{"s":"중성선 전류는 전류 방향 기준에 따라 부호가 달라지지만 크기는 3I0에 대응한다.","core":0},{"s":"접지나 중성선 경로가 없으면 영상전류의 경로가 제한된다.","core":0}]},{"t":"fig","src":"figures/circuit/c-three-phase.svg","title":"정상 상순서와 평형 파형","caption":"a-b-c 정상 상순서를 Va=0도, Vb=-120도, Vc=+120도로 정했다. 각 상 실효값 크기의 합과 복소전압 합이 다름을 보여준다.","alt":"a-b-c 정상 상순서를 Va=0도, Vb=-120도, Vc=+120도로 정했다. 각 상 실효값 크기의 합과 복소전압 합이 다름을 보여준다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/circuit/c-y-delta-connections.svg","title":"Y·Δ의 실제 마디와 전류","caption":"Y는 세 임피던스가 중성점에 모이고 Δ는 세 임피던스가 고리를 이룬다. Δ 선전류는 해당 마디로 나가는 상전류의 차이며 방향까지 지정해야 30도 관계가 맞는다.","alt":"Y는 세 임피던스가 중성점에 모이고 Δ는 세 임피던스가 고리를 이룬다. Δ 선전류는 해당 마디로 나가는 상전류의 차이며 방향까지 지정해야 30도 관계가 맞는다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-sequence-phasors.svg","title":"대칭분의 벡터 방향","caption":"정상과 역상은 세 벡터의 상회전 순서가 반대이고 합은 0이다. 영상분은 같은 위상이라 세 상 합이 3I0다.","alt":"정상과 역상은 세 벡터의 상회전 순서가 반대이고 합은 0이다. 영상분은 같은 위상이라 세 상 합이 3I0다.","width":960.0,"height":520.0},{"t":"m","tex":"V_L=\\sqrt{3}V_{\\mathrm{ph}},\\ I_L=I_{\\mathrm{ph}}\\quad (Y)","note":"평형 Y결선의 크기 관계. 선간전압과 상전압 사이에는 위상차도 있다."},{"t":"m","tex":"V_L=V_{\\mathrm{ph}},\\ I_L=\\sqrt{3}I_{\\mathrm{ph}}\\quad (\\Delta)","note":"평형 Δ결선의 크기 관계."},{"t":"m","tex":"P=\\sqrt{3}V_LI_L\\cos\\phi","note":"평형 정현파 3상 총 유효전력 W. VL,IL은 실효값."},{"t":"m","tex":"\\bar{V}_0=\\frac{\\bar{V}_a+\\bar{V}_b+\\bar{V}_c}{3},\\quad \\bar{I}_0=\\frac{\\bar{I}_a+\\bar{I}_b+\\bar{I}_c}{3}","note":"모든 항은 같은 기준의 페이저. 0은 영상분 첨자다."},{"t":"trap","items":["100 V씩 3상이라고 V0=100 V가 되는 것이 아니다. 위상을 합쳐야 한다.","정상분·역상분·영상분의 이름과 정상상태·과도상태는 전혀 다른 분류다."]},{"t":"ex","q":"세 상 전압이 100∠0°, 100∠-120°, 100∠120° V이다. 영상전압은? 여기에 각 상에 동일한 6 V 직류가 아닌 같은 주파수의 6∠0° 성분이 추가되면?","steps":["원래 세 페이저 합은 0이므로 영상전압은 0 V.","공통 성분의 합은 18∠0° V이므로 3으로 나누면 6∠0° V다."],"a":"처음 0 V, 공통 정현파 성분 추가 후 6∠0° V."},{"t":"chk","q":"세 상 전류의 페이저 합이 12∠0° A이다. 영상전류 I0는?","a":"4∠0° A. 세 상의 합을 3으로 나눈다."}]},{"id":"C15","title":"RC·RL 과도현상: 초기값·최종값·시정수","pr":"A","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"유한한 전압·전류 조건에서 콘덴서 전압과 인덕터 전류는 갑자기 바뀌지 않는다.","core":1,"star":1},{"s":"스위치가 바뀌기 직전의 저장상태를 먼저 구한 뒤 직후에 넘겨야 한다.","core":0},{"s":"미충전 콘덴서가 처음에는 단락처럼 보인다는 말은 초기전압이 0인 특정 조건을 줄여 말한 것이다.","core":0}]},{"t":"p","ss":[{"s":"직류가 충분히 오래 유지된 최종상태에서는 이상적인 C는 개방, L은 단락이다.","core":0},{"s":"직후 회로와 최종 회로를 별도로 그려 초기값과 최종값을 구한다.","core":0},{"s":"시정수는 변화가 얼마나 빠른지 나타내며, 1τ 뒤에는 전체 변화량의 약 63.2%만큼 진행하고 남은 차이는 약 36.8%다.","core":0}]},{"t":"p","ss":[{"s":"시정수의 저항은 에너지 저장소자가 바라본 등가저항이다.","core":0},{"s":"실제 회로의 모든 저항을 단순 합한 값이 아니다.","core":0},{"s":"독립전원은 0으로 만들고 C나 L의 단자에서 저항을 구한다.","core":0},{"s":"RC는 저항이 커지면 느려지지만 RL은 저항이 커지면 저장전류가 더 빨리 소멸하여 τ가 작아진다.","core":0}]},{"t":"fig","src":"figures/circuit/c-rl-switching.svg","title":"RL 스위칭 회로·전류","caption":"왼쪽 위 스위치를 닫아 RL에 직류를 인가한다. 아래는 전원을 분리한 뒤 R-L 폐회로로 재접속한 방전 상태를 표시하며 실제 스위치의 절체를 개념화했다. 차단 때도 전류가 흐를 폐회로가 있어야 이 지수감쇠식이 적용된다.","alt":"왼쪽 위 스위치를 닫아 RL에 직류를 인가한다. 아래는 전원을 분리한 뒤 R-L 폐회로로 재접속한 방전 상태를 표시하며 실제 스위치의 절체를 개념화했다. 차단 때도 전류가 흐를 폐회로가 있어야 이 지수감쇠식이 적용된다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-rc-switching.svg","title":"RC 스위칭 회로·전압","caption":"충전에서는 콘덴서 전압이 올라가는 동안 전류는 감소한다. 아래는 전원을 분리하고 R-C 폐회로로 재접속한 방전 상태이며 전압의 극성과 전류 기준에 따라 방전 전류 부호가 달라진다.","alt":"충전에서는 콘덴서 전압이 올라가는 동안 전류는 감소한다. 아래는 전원을 분리하고 R-C 폐회로로 재접속한 방전 상태이며 전압의 극성과 전류 기준에 따라 방전 전류 부호가 달라진다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-initial-final.svg","title":"영 초기상태의 순간·최종 등가","caption":"무전류 L은 투입 직후 전류가 0이라 개방처럼, 무충전 C는 전압이 0이라 단락처럼 보인다. 초기 에너지가 있으면 독립적인 전류/전압 초기조건을 포함해야 하며 이 단순 치환을 그대로 쓰지 않는다.","alt":"무전류 L은 투입 직후 전류가 0이라 개방처럼, 무충전 C는 전압이 0이라 단락처럼 보인다. 초기 에너지가 있으면 독립적인 전류/전압 초기조건을 포함해야 하며 이 단순 치환을 그대로 쓰지 않는다.","width":960.0,"height":560.0},{"t":"m","tex":"x(t)=x_f+(x_i-x_f)e^{-t/\\tau}","note":"1차 안정회로의 상태값 x. RC에서는 vC, RL에서는 iL. xi=0+ 값, xf=충분히 지난 값."},{"t":"m","tex":"\\tau_{RC}=R_{\\mathrm{eq}}C,\\quad \\tau_{RL}=\\frac{L}{R_{\\mathrm{eq}}}","note":"τ: s, Req: 저장소자에서 본 Ω. 종속전원이 있으면 등가저항 계산에 주의."},{"t":"m","tex":"e^{-1}\\simeq0.368,\\quad 1-e^{-1}\\simeq0.632","note":"초깃값이 0인 충전 응답은 τ에서 최종값의 63.2%. 일반 응답은 전체 변화량 기준."},{"t":"trap","items":["C를 모든 순간 개방, L을 모든 순간 단락으로 놓지 않는다.","5τ는 약 99.3% 도달이라는 근사다. 지수응답이 유한시간에 정확히 최종값이 되는 것은 아니다."]},{"t":"ex","q":"미충전 10 μF 콘덴서를 10 kΩ을 통해 12 V 직류에 연결한다. 시정수, 초기 충전전류, τ 뒤 전압은?","steps":["τ=10⁴×10×10⁻⁶=0.1 s.","처음 C 전압은 0이므로 초기전류는 12/10000=1.2 mA.","τ 뒤 전압은 12×0.632≈7.58 V."],"a":"0.1 s, 1.2 mA, 약 7.58 V."},{"t":"chk","q":"L=0.2 H가 10 Ω을 통해 방전한다. 시정수는?","a":"0.02 s=20 ms. τ=L/R이다."}]},{"id":"C16","title":"RLC 공진과 감쇠: 물리적 의미부터","pr":"A","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"공진은 L과 C의 반대 부호 리액턴스 또는 서셉턴스가 서로 상쇄되는 상태다.","core":1,"star":1},{"s":"이상적인 직렬 RLC에서는 전체 임피던스가 R만 남아 전원전류가 가장 커진다.","core":0},{"s":"각 소자가 따로 병렬인 이상 RLC에서는 전체 서셉턴스가 0이 되어 전원에서 본 전류가 가장 작아진다.","core":0}]},{"t":"p","ss":[{"s":"직렬 공진에서 L과 C 양단전압은 각각 클 수 있지만 서로 위상이 반대라 합에서 상쇄된다.","core":0},{"s":"따라서 전원전압보다 큰 소자전압이 생긴다는 사실이 KVL 위반은 아니다.","core":0},{"s":"공진 주파수 공식은 여기서 다루는 이상적인 구성에 적용하며, 코일저항이 포함된 다른 병렬 공진회로에는 보정이 필요할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"과도현상에서는 L과 C가 에너지를 서로 주고받고 R이 에너지를 소모한다.","core":0},{"s":"R이 작으면 진동하면서 줄어드는 부족제동, 경계면 임계제동, R이 크면 진동하지 않는 과제동이다.","core":0},{"s":"R>0,L>0,C>0인 수동 직렬회로의 부족제동은 불안정이 아니다.","core":0},{"s":"제어공학의 감쇠비와 응답지표는 02권에서 다룬다.","core":0}]},{"t":"fig","src":"figures/circuit/c-resonance.svg","title":"직렬·병렬 공진 특성","caption":"왼쪽은 직렬 RLC의 일정 전압 주파수 응답, 오른쪽은 이상 병렬 RLC의 임피던스다. 정규화한 도식이며 직렬 Z 최소·병렬 Y 최소라는 반대 극값을 읽는다.","alt":"왼쪽은 직렬 RLC의 일정 전압 주파수 응답, 오른쪽은 이상 병렬 RLC의 임피던스다. 정규화한 도식이며 직렬 Z 최소·병렬 Y 최소라는 반대 극값을 읽는다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-rlc-damping.svg","title":"세 감쇠의 RLC 실제 응답","caption":"영 초기조건의 직렬 RLC에 전압계단을 인가한 정확한 정규화 해를 그렸다. 왼쪽 콘덴서 전압은 최종 1, 오른쪽 전류는 최종 0이며 원문의 전류 최종값 혼동을 교정한다.","alt":"영 초기조건의 직렬 RLC에 전압계단을 인가한 정확한 정규화 해를 그렸다. 왼쪽 콘덴서 전압은 최종 1, 오른쪽 전류는 최종 0이며 원문의 전류 최종값 혼동을 교정한다.","width":960.0,"height":640.0},{"t":"m","tex":"\\omega_0=\\frac{1}{\\sqrt{LC}},\\quad f_0=\\frac{1}{2\\pi\\sqrt{LC}}","note":"ω0: rad/s, f0: Hz. 이상적인 직렬 또는 각 소자 분리 병렬 RLC 공진."},{"t":"m","tex":"R_{\\mathrm{crit}}=2\\sqrt{\\frac{L}{C}}","note":"직렬 RLC 자연응답의 임계저항 Ω. 0<R<Rcrit 부족제동, R=Rcrit 임계, R>Rcrit 과제동."},{"t":"m","tex":"Q_{\\mathrm{series}}=\\frac{\\omega_0L}{R}=\\frac{1}{\\omega_0CR}","note":"직렬회로의 품질계수. 무효전력 Q[var]와 다른 기호이며 무차원이다."},{"t":"m","tex":"Q_{\\mathrm{parallel}}=\\frac{R}{\\omega_0L}=\\omega_0CR=R\\sqrt{\\frac{C}{L}}","note":"R,L,C가 각각 독립 병렬 가지인 이상 병렬공진 회로. 공진 시 |IL|/|전원 I|=|IC|/|전원 I|=Q. 직렬코일 손실저항을 R로 넣는 식이 아니다."},{"t":"m","tex":"\\Delta\\omega_{\\mathrm{s}}=\\frac{R}{L},\\quad \\Delta\\omega_{\\mathrm{p}}=\\frac{1}{RC},\\quad Q=\\frac{\\omega_0}{\\Delta\\omega}","note":"보완 설명. 전류 응답(직렬) 또는 정전류 구동 전압 응답(병렬)의 반전력 대역폭 rad/s. f 대역폭은 2π로 나눈다. 이상 RLC에 해당."},{"t":"trap","items":["공진이면 모든 전류가 0이라는 뜻이 아니다.","부족제동은 감쇠진동이다. 지속진동은 이상적으로 R=0인 경우와 구별한다."]},{"t":"ex","q":"L=1 H, C=0.01 F인 직렬 RLC의 공진 각주파수와 임계저항을 구하라. R=10 Ω일 때 제동상태는?","steps":["ω0=1/√0.01=10 rad/s.","Rcrit=2√(1/0.01)=20 Ω.","0<10<20이므로 부족제동이며 진동이 줄어드는 안정 응답이다."],"a":"10 rad/s, 20 Ω, 부족제동."},{"t":"chk","q":"직렬 RLC 공진에서 전체 역률과 임피던스는?","a":"이상적인 양의 저항 R이 있으면 역률 1, 임피던스 R이다."}]},{"id":"C17","title":"최대전력 전달: 최대 출력과 효율의 차이","pr":"B","min":15,"day":1,"b":[{"t":"p","ss":[{"s":"직류 저항회로에서 부하가 받는 전력을 최대로 하려면 부하저항을 전원 측 테브난 저항과 같게 한다.","core":1,"star":1},{"s":"부하를 너무 작게 하면 전류는 커져도 부하 양단전압이 작아지고, 너무 크게 하면 전압은 커져도 전류가 작아진다.","core":0},{"s":"두 효과 사이에 최대점이 있다.","core":0}]},{"t":"p","ss":[{"s":"교류에서 부하의 저항과 리액턴스를 모두 자유롭게 바꿀 수 있다면 전원 임피던스의 복소공액으로 맞춘다.","core":0},{"s":"저항은 같게, 리액턴스는 반대 부호로 두어 무효성분을 상쇄하는 것이다.","core":0},{"s":"부하가 순수 저항으로만 제한되면 조건이 달라지므로 ‘복소공액 정합’을 무조건 적용하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"직류 최대전력점에서는 내부저항과 부하저항이 같아 같은 전력을 소모한다.","core":0},{"s":"이 단순 모델의 효율은 50%다.","core":0},{"s":"전력 전달을 최대화한다는 목표와 손실을 최소화한다는 목표는 다르다.","core":0},{"s":"큰 전력 설비를 항상 최대전력 정합으로 운영하는 것은 아니다.","core":0}]},{"t":"fig","src":"figures/circuit/c-max-power.svg","title":"최대전력 전달 곡선","caption":"독립 전압원과 내부 임피던스가 부하를 구동한다. 오른쪽은 직류 또는 리액턴스 보상 후 RL만 변할 때의 정규화 곡선으로 RL=Rs에서 최대다. 효율 최대와 다르다.","alt":"독립 전압원과 내부 임피던스가 부하를 구동한다. 오른쪽은 직류 또는 리액턴스 보상 후 RL만 변할 때의 정규화 곡선으로 RL=Rs에서 최대다. 효율 최대와 다르다.","width":960.0,"height":560.0},{"t":"m","tex":"R_L=R_{\\mathrm{th}},\\quad P_{L,\\max}=\\frac{V_{\\mathrm{th}}^2}{4R_{\\mathrm{th}}}","note":"직류 저항 부하, Vth와 양의 Rth가 고정된 경우."},{"t":"m","tex":"Z_L=Z_{\\mathrm{th}}^*","note":"정현파에서 복소 부하를 자유롭게 조절할 수 있을 때의 최대 평균전력 조건."},{"t":"m","tex":"R_L=|Z_{\\mathrm{th}}|=\\sqrt{R_{\\mathrm{th}}^2+X_{\\mathrm{th}}^2}","note":"보완 조건. 부하가 리액턴스 없는 순수 저항으로 제한되고 전원 임피던스 Rth+jXth는 고정인 경우. 복소부하를 모두 조정하는 공액 정합과 구별."},{"t":"trap","items":["전원 전압을 부하 양단전압으로 착각하지 않는다.","부하저항을 0으로 하면 부하전력은 0이다. 전류 최대와 부하전력 최대는 다르다."]},{"t":"ex","q":"테브난 전압 20 V, 저항 5 Ω인 회로에서 부하저항을 조절한다. 최대전력과 그때 부하전압은?","steps":["RL=5 Ω일 때 최대.","PL,max=20²/(4×5)=20 W.","같은 저항 두 개의 분압이므로 부하전압은 10 V."],"a":"20 W, 10 V."},{"t":"chk","q":"전원 임피던스가 4+j3 Ω이고 복소부하 조정이 가능하다. 최대전력 부하 임피던스는?","a":"4-j3 Ω. 전원 임피던스의 복소공액이다."}]},{"id":"C18","title":"필터와 4단자망의 기본 구별","pr":"B","min":15,"day":1,"b":[{"t":"p","ss":[{"s":"필터는 주파수에 따라 전달하는 정도가 다른 회로다.","core":1,"star":1},{"s":"저역통과는 낮은 주파수, 고역통과는 높은 주파수, 대역통과는 특정 구간, 대역저지는 특정 구간을 약하게 만든다.","core":0},{"s":"‘고역통과’가 모든 주파수에서 증폭한다는 뜻은 아니다.","core":0}]},{"t":"p","ss":[{"s":"R과 C가 직렬이고 C 양단을 출력으로 잡으면 고주파에서 C의 임피던스가 작아져 출력이 줄어드는 저역통과다.","core":0},{"s":"같은 회로에서 R 양단을 출력으로 잡으면 저주파 출력이 작아지는 고역통과가 된다.","core":0},{"s":"같은 소자라도 출력 위치가 전달특성을 바꾼다.","core":0}]},{"t":"p","ss":[{"s":"4단자망은 두 단자의 입력 포트와 두 단자의 출력 포트 관계를 표현한다.","core":0},{"s":"ABCD 정수에서는 출력전류 방향을 정의한 방식에 따라 부호가 달라질 수 있다.","core":0},{"s":"이 절에서는 출력 포트에서 부하로 나가는 I2를 사용한다.","core":0},{"s":"A,D는 무차원, B는 Ω, C는 S로 단위부터 확인하면 혼동을 줄일 수 있다.","core":0}]},{"t":"fig","src":"figures/circuit/c-filter-bands.svg","title":"저역·고역·대역통과·대역저지","caption":"주파수에 대한 전달크기의 개념 곡선이며 실제 차수·리플·차단주파수는 해당 회로에 따라 정한다.","alt":"주파수에 대한 전달크기의 개념 곡선이며 실제 차수·리플·차단주파수는 해당 회로에 따라 정한다.","width":960.0,"height":580.0},{"t":"m","tex":"\\frac{V_o}{V_i}=\\frac{1}{1+sRC}","note":"RC 직렬, C 양단 출력, 초기조건 0. 전달함수의 s와 라플라스는 02권 T01~T02에서 설명."},{"t":"m","tex":"V_1=AV_2+BI_2,\\quad I_1=CV_2+DI_2","note":"I1은 입력으로 들어가고 I2는 출력에서 나가는 방향. A,D 무차원, B Ω, C S."},{"t":"trap","items":["B와 C가 모두 저항 단위인 것은 아니다.","AD-BC=1은 상호성 조건을 가진 망의 성질이다. 임의의 모든 능동 4단자망에 보장되지 않는다."]},{"t":"ex","q":"RC 직렬회로에서 C 양단을 출력으로 잡았다. 주파수가 매우 낮을 때와 매우 높을 때 출력의 경향을 설명하라.","steps":["낮은 주파수에서 C 임피던스가 커 대부분의 전압이 C에 걸린다.","높은 주파수에서 C 임피던스가 작아 출력전압이 작아진다."],"a":"저역통과 특성."},{"t":"chk","q":"ABCD 식의 B와 C의 단위는?","a":"B는 Ω, C는 S. B×전류는 전압, C×전압은 전류가 되어야 한다."}]},{"id":"C19","title":"전기열·효율·같은 부하전력 조건","pr":"B","min":25,"day":1,"b":[{"t":"p","ss":[{"s":"전기 입력이 열로 바뀌어도 단위가 달라질 뿐 에너지 보존은 같다.","core":1},{"s":"1 cal=4.184 J를 쓰면 1 J≈0.239 cal이고, 계산 편의의 0.24는 근삿값이다.","core":0},{"s":"1 kWh는 약 860 kcal이다.","core":0},{"s":"물을 가열하는 유효 출력은 질량×비열×온도 상승량이며, 전기보일러 효율은 이 유효열량을 투입 전기에너지로 나눈 값이다.","core":0}]},{"t":"p","ss":[{"s":"화력발전은 반대로 연료의 열에너지가 입력이고 전기에너지가 출력이다.","core":0},{"s":"석탄 질량 m과 발열량 H의 곱을 입력열량으로 사용한다.","core":0},{"s":"전력 P[kW]와 시간 t[h]로 계산할 때 860Pt는 kcal이다.","core":0},{"s":"mH와 같은 단위로 맞춘 다음 비율을 구한다.","core":0},{"s":"열손실을 무시한다는 문장이 없으면 효율 100%를 가정하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"기전력 E와 양의 내부저항 r가 고정된 전원에 서로 다른 부하 R1,R2를 각각 달아 같은 전력을 얻는 경우가 있다.","core":0},{"s":"부하전력 E²R/(r+R)²를 두 부하에 대해 같게 두면 r²=R1R2이다.","core":0},{"s":"R1=R2이면 식 자체가 항상 같으므로 이 결론을 추론할 수 없다.","core":0},{"s":"두 부하는 최대전력점 R=r의 양쪽에 놓인다.","core":0}]},{"t":"fig","src":"figures/circuit/c-energy-flow.svg","title":"전기열과 효율의 흐름","caption":"전기 입력이 유용한 열과 손실로 나뉜다. 원본의 전기열·효율 식을 에너지 보존 흐름으로 보충했다.","alt":"전기 입력이 유용한 열과 손실로 나뉜다. 원본의 전기열·효율 식을 에너지 보존 흐름으로 보충했다.","width":960.0,"height":450.0},{"t":"fig","src":"figures/circuit/c-max-power.svg","title":"최대전력 전달 곡선","caption":"독립 전압원과 내부 임피던스가 부하를 구동한다. 오른쪽은 직류 또는 리액턴스 보상 후 RL만 변할 때의 정규화 곡선으로 RL=Rs에서 최대다. 효율 최대와 다르다.","alt":"독립 전압원과 내부 임피던스가 부하를 구동한다. 오른쪽은 직류 또는 리액턴스 보상 후 RL만 변할 때의 정규화 곡선으로 RL=Rs에서 최대다. 효율 최대와 다르다.","width":960.0,"height":560.0},{"t":"m","tex":"H=\\frac{W}{4.184}\\simeq0.239W,\\quad 1\\ \\mathrm{kWh}\\simeq860\\ \\mathrm{kcal}","note":"W는 에너지 J이고 H는 cal. 기호 W를 전력 단위 W와 혼동하지 않는다."},{"t":"m","tex":"\\eta_{\\mathrm{heat}}=\\frac{cm\\Delta T}{860Pt},\\quad \\eta_{\\mathrm{gen}}=\\frac{860Pt}{mH}","note":"P[kW], t[h], c[kcal/(kg·°C)], m[kg], ΔT[°C], 연료 H[kcal/kg]. 효율 η는 무차원; %이면 ×100."},{"t":"m","tex":"P_L=\\frac{E^2R_L}{(r+R_L)^2},\\quad P(R_1)=P(R_2)\\Rightarrow r=\\sqrt{R_1R_2}","note":"E[V], r,R1,R2[Ω], r>0, R1≠R2. 직류 또는 순수 저항 회로."},{"t":"trap","items":["가열 효율과 발전 효율은 에너지 변환 방향이 반대다.","초 단위 시간을 860Pt 식에 그대로 넣지 않는다.","전력 최대 조건 R=r와 두 부하의 동일전력 조건 r²=R1R2를 구분한다."]},{"t":"ex","q":"2 kW 히터로 물 10 kg을 0.5시간 가열하여 50 °C 올렸다. 물의 비열은 1 kcal/(kg·°C)이다. 효율은?","steps":["물의 유효열량은 1×10×50=500 kcal.","입력은 860×2×0.5=860 kcal.","η=500/860≈0.581."],"a":"약 58.1%."},{"t":"ex","q":"같은 전원에서 부하 2 Ω과 18 Ω의 소비전력이 같다. 양의 내부저항은?","steps":["두 부하가 다르므로 r²=2×18.","r=√36=6 Ω."],"a":"6 Ω."},{"t":"chk","q":"연료 열입력 1000 kcal로 전기 0.5 kWh를 만들었다. 효율은?","a":"약 43%. 전기출력 0.5×860=430 kcal를 열입력 1000 kcal로 나눈다."}]},{"id":"C20","title":"결합 코일의 병렬접속·에너지·캠벨 측정회로","pr":"B","min":35,"day":1,"b":[{"t":"p","ss":[{"s":"C07의 자기인덕턴스는 쇄교자속 λ=NΦ를 전류로 나눈 L=λ/I이다.","core":1},{"s":"자속 Φ를 권수 없이 LI와 같다고 쓰면 N회 권선에서 틀린다.","core":0},{"s":"결합 코일의 저장에너지는 두 자기항과 상호항의 합이다.","core":0},{"s":"두 전류가 모두 점으로 들어가는 기준이면 상호항은 +Mi1i2이며, 반대 기준이면 -Mi1i2이다.","core":0},{"s":"기전력의 렌츠 부호 e=-L di/dt와 수동부호규약 단자전압 v=+L di/dt는 기준이 달라 모순이 아니다.","core":0}]},{"t":"p","ss":[{"s":"두 코일을 병렬로 둘 때 각 가지 전압을 위→아래, 전류를 위→아래로 정한다.","core":0},{"s":"위쪽 단자가 모두 점이면 가동 병렬이고 상호항은 +M이다.","core":0},{"s":"한쪽만 위가 점이면 차동 병렬이고 상호항은 -M이다.","core":0},{"s":"공통전압 식 두 개를 풀고 전체 전류 i1+i2로 나누면 합성 인덕턴스를 얻는다.","core":0},{"s":"완전 결합에서 분모와 분자가 동시에 0인 특이한 경우는 일반식에 0/0을 대입하지 말고 회로의 전압·권수 제약부터 확인한다.","core":0}]},{"t":"p","ss":[{"s":"캠벨 측정회로의 마디를 입력 A, 공통 B, 기준 0으로 정한다.","core":0},{"s":"L1은 A-B, C는 B-0, L2도 B-0에 연결하고 L1과 L2를 자기 결합한다.","core":0},{"s":"L1의 점은 A, L2의 점은 0에 둔다.","core":0},{"s":"i1은 A에서 B로, i2는 L2를 통해 B에서 0으로 흐르는 기준이다.","core":0},{"s":"따라서 콘덴서 전류는 i1-i2다.","core":0},{"s":"C 또는 주파수를 조절하여 L2 가지 검출전류 i2=0으로 만들면 상호유도전압과 콘덴서 전압이 상쇄된다.","core":0},{"s":"이때 M=1/(ω²C)로 상호인덕턴스를 측정한다.","core":0},{"s":"실제 코일저항과 검출기 손실을 무시한 이상 평형식이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-coupling-series.svg","title":"직렬 결합과 점 극성","caption":"점은 같은 유도전압 극성을 뜻한다. 같은 직렬 전류가 두 점 단자로 들어오면 +2M, 한쪽만 점으로 들어오면 -2M이 합성 인덕턴스에 더해진다.","alt":"점은 같은 유도전압 극성을 뜻한다. 같은 직렬 전류가 두 점 단자로 들어오면 +2M, 한쪽만 점으로 들어오면 -2M이 합성 인덕턴스에 더해진다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-coupling-parallel.svg","title":"병렬 결합 극성","caption":"위쪽을 공통 +전압, 가지전류를 아래 방향으로 정했다. 한 코일의 점을 아래로 바꾸면 상호항 부호와 합성식 분모의 부호가 바뀐다.","alt":"위쪽을 공통 +전압, 가지전류를 아래 방향으로 정했다. 한 코일의 점을 아래로 바꾸면 상호항 부호와 합성식 분모의 부호가 바뀐다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-campbell.svg","title":"캠벨 상호인덕턴스 측정 결선","caption":"L1은 A-B, C와 L2-검류계 가지는 B-0이다. L1의 점은 A측, L2의 점은 0측이다. 이 극성에서 이상 평형 i2=0이 M=1/(ω²C)를 준다.","alt":"L1은 A-B, C와 L2-검류계 가지는 B-0이다. L1의 점은 A측, L2의 점은 0측이다. 이 극성에서 이상 평형 i2=0이 M=1/(ω²C)를 준다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-coupling-flux.svg","title":"공통 자속·누설·결합계수","caption":"철심을 따라 두 코일이 공유하는 자속과 1차 권선만 쇄교하는 누설 성분을 분리한 개념도다. 결합계수는 공통 쇄교 정도를 나타내며 점 표시와 회로의 전류 방향을 함께 해석한다.","alt":"철심을 따라 두 코일이 공유하는 자속과 1차 권선만 쇄교하는 누설 성분을 분리한 개념도다. 결합계수는 공통 쇄교 정도를 나타내며 점 표시와 회로의 전류 방향을 함께 해석한다.","width":960.0,"height":540.0},{"t":"m","tex":"L=\\frac{N\\Phi}{I},\\quad W=\\frac{1}{2}L_1i_1^2+\\frac{1}{2}L_2i_2^2\\pm Mi_1i_2","note":"L,M[H], Φ[Wb], i[A], W[J]. 선형 자계 및 일정한 기하. ±는 점 표시와 전류 기준에 따라 선택."},{"t":"m","tex":"L_{p,+}=\\frac{L_1L_2-M^2}{L_1+L_2-2M},\\quad L_{p,-}=\\frac{L_1L_2-M^2}{L_1+L_2+2M}","note":"병렬 가동(+)·차동(-). L,M 모두 H, |M|≤√(L1L2). 분모가 0인 이상 특이결합은 별도 해석."},{"t":"m","tex":"I_1\\left(\\frac{1}{\\omega C}-\\omega M\\right)+I_2\\left(\\omega L_2-\\frac{1}{\\omega C}\\right)=0","note":"위 본문의 캠벨 접속·전류 방향. ω=2πf[rad/s]. 첫 항의 계수를 0으로 맞추어 I2=0인 평형을 찾는다."},{"t":"m","tex":"M=\\frac{1}{\\omega^2C},\\quad C=\\frac{1}{\\omega^2M}","note":"캠벨 평형 I2=0, I1≠0 및 이상소자 조건. M[H], C[F]."},{"t":"tb","h":["접속","합성식의 핵심","점·전류 기준"],"r":[["직렬 가동","L1+L2+2M","두 전류 모두 점으로 유입"],["직렬 차동","L1+L2-2M","한 전류만 점으로 유입"],["병렬 가동","분모 L1+L2-2M","공통 위 단자가 둘 다 점"],["병렬 차동","분모 L1+L2+2M","공통 위 단자 중 하나만 점"]]},{"t":"trap","items":["병렬 식은 직렬 식의 단순 역수 합이 아니다.","캠벨 공식은 임의의 LC회로에 적용되는 자기인덕턴스 공식이 아니다.","점 표시는 코일의 위치가 아니라 상대 권선 극성을 나타낸다."]},{"t":"ex","q":"L1=L2=10 mH, M=6 mH인 두 코일을 가동 병렬·차동 병렬로 연결한다. 각각의 합성값은?","steps":["분자는 10×10-6²=64 mH².","가동 분모 20-12=8 mH이므로 8 mH.","차동 분모 20+12=32 mH이므로 2 mH."],"a":"가동 8 mH, 차동 2 mH."},{"t":"ex","q":"캠벨 이상 평형에서 ω=1000 rad/s, C=10 μF였다. M은?","steps":["M=1/(1000²×10×10⁻⁶)."],"a":"0.1 H."},{"t":"chk","q":"결합이 전혀 없을 때 병렬 합성식은 어떤 식이 되는가?","a":"M=0을 대입하면 L1L2/(L1+L2)로, 보통의 비결합 인덕터 병렬식이 된다."}]},{"id":"C21","title":"임피던스·어드미턴스 벡터궤적 읽기","pr":"B","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"벡터궤적은 ω 또는 R 같은 매개변수 하나가 바뀔 때 복소수 Z나 Y의 끝점이 그리는 자취이다.","core":1},{"s":"가로축은 실수부, 세로축은 허수부다.","core":0},{"s":"회로도만 보고 외우기보다 ①변화시키는 양과 고정값 ②ω=0 극한 ③ω→∞ 극한 ④허수부 부호를 적는다.","core":0},{"s":"이 절은 R,L,C>0을 일정하게 두고 ω를 0부터 무한대로 변화시키는 경우다.","core":0}]},{"t":"p","ss":[{"s":"RL 직렬의 Z는 실수부 R가 일정하고 허수부 ωL가 증가하여 R점에서 위로 뻗는다.","core":0},{"s":"역수 Y는 1/R에서 시작해 아래 반원을 따라 원점으로 간다.","core":0},{"s":"RC 직렬 Z는 R-j∞에서 시작해 R에 접근하고 Y는 원점에서 위 반원을 따라 1/R에 접근한다.","core":0},{"s":"따라서 직렬 회로의 Z는 직선, Y는 반원이다.","core":0}]},{"t":"p","ss":[{"s":"RL 병렬 Y는 1/R-j/(ωL)이므로 아래쪽 무한대에서 1/R로 접근한다.","core":0},{"s":"Z는 원점에서 위 반원을 거쳐 R로 간다.","core":0},{"s":"RC 병렬 Y는 1/R+jωC로 1/R에서 위로 뻗으며, Z는 R에서 아래 반원을 따라 원점으로 간다.","core":0},{"s":"전류 궤적은 전압을 고정하면 I=VY로 스케일만 바뀐다.","core":0},{"s":"R 자체를 가변하면 위 표의 궤적과 다를 수 있으므로 원문제의 가변 조건을 읽는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-vector-loci.svg","title":"직렬 RL·RC 임피던스·어드미턴스 궤적","caption":"직렬 RL의 Z는 +허수 직선, Y는 아래 반원이며 ω 증가 시 Y는 1/R에서 0으로 간다. 직렬 RC의 Z는 음허수에서 실축으로, Y는 위 반원에서 0에서 1/R로 이동한다.","alt":"직렬 RL의 Z는 +허수 직선, Y는 아래 반원이며 ω 증가 시 Y는 1/R에서 0으로 간다. 직렬 RC의 Z는 음허수에서 실축으로, Y는 위 반원에서 0에서 1/R로 이동한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-parallel-loci.svg","title":"병렬 RL·RC 궤적","caption":"병렬 RL은 Y가 음허수 직선에서 실축으로 접근하고 Z가 위 반원으로 0에서 R까지 간다. 병렬 RC는 Y가 양허수로 커지며 Z가 아래 반원으로 R에서 0으로 간다.","alt":"병렬 RL은 Y가 음허수 직선에서 실축으로 접근하고 Z가 위 반원으로 0에서 R까지 간다. 병렬 RC는 Y가 양허수로 커지며 Z가 아래 반원으로 R에서 0으로 간다.","width":960.0,"height":640.0},{"t":"m","tex":"\\left(G-\\frac{1}{2R}\\right)^2+B^2=\\left(\\frac{1}{2R}\\right)^2","note":"고정 R의 직렬 RL·RC에서 Y=G+jB가 그리는 원. RL은 B<0 아래 반원, RC는 B>0 위 반원. G,B[S]."},{"t":"m","tex":"\\left(R_Z-\\frac{R}{2}\\right)^2+X_Z^2=\\left(\\frac{R}{2}\\right)^2","note":"고정 병렬저항 R의 RL·RC 병렬에서 Z=RZ+jXZ가 그리는 원. RL은 위 반원, RC는 아래 반원. RZ,XZ,R[Ω]."},{"t":"tb","h":["회로","Z 궤적","Y 궤적","ω 증가 방향"],"r":[["RL 직렬","실수부 R의 위 반직선","아래 반원","Y: 1/R→0"],["RC 직렬","실수부 R의 아래 반직선","위 반원","Y: 0→1/R"],["RL 병렬","위 반원","실수부 1/R의 아래 반직선","Z: 0→R"],["RC 병렬","아래 반원","실수부 1/R의 위 반직선","Z: R→0"]]},{"t":"trap","items":["1/Z에서 허수부 부호가 바뀐다.","원 전체가 아니라 양의 주파수에 해당하는 반원만 그린다.","ω=0에서 무한대인 점은 유한 좌표처럼 표시하지 않는다."]},{"t":"ex","q":"R=4 Ω인 RL 직렬에서 ωL=4 Ω일 때 Y의 점과 궤적의 원 중심을 구하라.","steps":["Y=1/(4+j4)=(4-j4)/32=0.125-j0.125 S.","원 중심은 실수축 1/(2R)=0.125 S, 반지름도 0.125 S."],"a":"아래 반원의 가장 낮은 점 0.125-j0.125 S."},{"t":"chk","q":"RC 병렬의 주파수를 높이면 Z는 위 반원으로 가는가?","a":"아니다. Y의 허수부가 양수이므로 역수 Z의 허수부는 음수다. R에서 원점으로 아래 반원을 따라간다."}]},{"id":"C22","title":"상순서·대칭 n상·결선과 전력 측정 연결","pr":"B","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"정상 상순서 a-b-c를 기준으로 Va=Vp∠0°, Vb=Vp∠-120°, Vc=Vp∠120°다.","core":1},{"s":"회전연산자 a=eʲ¹²⁰°를 쓰면 Vb=a²Va, Vc=aVa이고 1+a+a²=0이다.","core":0},{"s":"Y 선간전압 Vab=Va-Vb는 Va보다 30° 앞선다.","core":0},{"s":"Δ 선전류 Ia=Iab-Ica는 해당 상전류 Iab보다 30° 뒤진다.","core":0},{"s":"위상차 부호는 상순서와 뺄셈 방향에 종속된다.","core":0}]},{"t":"p","ss":[{"s":"대칭 n상에서 이웃 상의 위상 간격은 2π/n이다.","core":0},{"s":"n상 성형의 이웃 선간전압 크기는 2sin(π/n)Vp이고 첫 상전압에 대해 π/2-π/n만큼 앞선다.","core":0},{"s":"n상 환상에서는 이웃 가지 전류의 차인 선전류 크기가 2sin(π/n)Ip이며 대응 가지 전류보다 같은 각만큼 뒤진다.","core":0},{"s":"n=3이면 √3와 30°, n=4이면 √2와 45°, n=6이면 1과 60°를 얻는다.","core":0},{"s":"6상에서 모든 선 쌍의 전압이 같은 것은 아니며 여기서는 이웃 상을 말한다.","core":0}]},{"t":"p","ss":[{"s":"평형 n상 총전력은 상당 유효전력의 n배다.","core":0},{"s":"3상의 Q=√3VLILsinφ, S=√3VLIL도 같은 원리다.","core":0},{"s":"평형 부하의 Y↔Δ 등가 변환은 X01의 마디 정의와 일반식을 따른다.","core":0},{"s":"같은 선간전압에 같은 각 상 임피던스를 Y 또는 Δ로 바꾸어 연결하면 Δ의 선전류와 총전력은 Y의 3배다.","core":0},{"s":"등가변환처럼 임피던스 자체를 바꾸는 상황과 구별한다.","core":0}]},{"t":"p","ss":[{"s":"V결선은 단상변압기 두 대로 3상 부하를 공급한다.","core":0},{"s":"각 기기 정격 S0에서 허용 3상 용량은 √3S0이고, 세 대 Δ의 3S0 대비 57.7%, 두 대 설치용량 2S0 대비 이용률 86.6%다.","core":0},{"s":"상세 결선은 M06으로 연결한다.","core":0},{"s":"두 전력계법과 3전압계·3전류계법의 측정 접속 및 식은 X02에 모았다.","core":0},{"s":"두 전력계 지시를 더하면 3선식 총 유효전력이지만, 차로 무효전력·역률을 구하는 간단식은 평형 정현파 조건이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-three-meter.svg","title":"3전압계·3전류계 결선","caption":"화살표는 전압을 재는 두 점 또는 전류 기준방향이다. 전압계법은 직렬 R-부하, 전류계법은 병렬 R-부하이며 세 크기로 위상차를 복원한다.","alt":"화살표는 전압을 재는 두 점 또는 전류 기준방향이다. 전압계법은 직렬 R-부하, 전류계법은 병렬 R-부하이며 세 크기로 위상차를 복원한다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-three-phase.svg","title":"정상 상순서와 평형 파형","caption":"a-b-c 정상 상순서를 Va=0도, Vb=-120도, Vc=+120도로 정했다. 각 상 실효값 크기의 합과 복소전압 합이 다름을 보여준다.","alt":"a-b-c 정상 상순서를 Va=0도, Vb=-120도, Vc=+120도로 정했다. 각 상 실효값 크기의 합과 복소전압 합이 다름을 보여준다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/circuit/c-y-delta-connections.svg","title":"Y·Δ의 실제 마디와 전류","caption":"Y는 세 임피던스가 중성점에 모이고 Δ는 세 임피던스가 고리를 이룬다. Δ 선전류는 해당 마디로 나가는 상전류의 차이며 방향까지 지정해야 30도 관계가 맞는다.","alt":"Y는 세 임피던스가 중성점에 모이고 Δ는 세 임피던스가 고리를 이룬다. Δ 선전류는 해당 마디로 나가는 상전류의 차이며 방향까지 지정해야 30도 관계가 맞는다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-line-phase-phasor.svg","title":"3상 30도와 n상 현","caption":"3상 선간전압은 두 상전압 페이저의 차다. 일반 n상에서는 같은 길이 두 벡터가 만드는 현의 길이 2V상sin(π/n)로 확장된다.","alt":"3상 선간전압은 두 상전압 페이저의 차다. 일반 n상에서는 같은 길이 두 벡터가 만드는 현의 길이 2V상sin(π/n)로 확장된다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/circuit/c-delta-y-open-delta.svg","title":"임피던스 변환과 V결선","caption":"왼쪽 점선 Y와 실선 Δ는 같은 외부 단자 관계를 갖도록 소자값을 바꾸는 변환이다. 오른쪽은 세 변압기 중 한 대를 뺀 V결선으로 같은 변환과는 다른 개념이다.","alt":"왼쪽 점선 Y와 실선 Δ는 같은 외부 단자 관계를 갖도록 소자값을 바꾸는 변환이다. 오른쪽은 세 변압기 중 한 대를 뺀 V결선으로 같은 변환과는 다른 개념이다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-two-wattmeters.svg","title":"2전력계법 연결","caption":"a선 전류와 Vab를 재는 전력계를 W2, c선 전류와 Vcb를 재는 전력계를 W1으로 정했다. a-b-c 상순서의 평형 지상 부하에서는 Q=√3(W1-W2)다. 전력 합은 불평형 3상 3선에도 적용된다.","alt":"a선 전류와 Vab를 재는 전력계를 W2, c선 전류와 Vcb를 재는 전력계를 W1으로 정했다. a-b-c 상순서의 평형 지상 부하에서는 Q=√3(W1-W2)다. 전력 합은 불평형 3상 3선에도 적용된다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-meter-phasors.svg","title":"3전압계·3전류계의 삼각형","caption":"3전압계는 VR+VL, 3전류계는 IR+IL 벡터합을 이룬다. 부하의 유도성 위상차를 표시한 예이며 세 길이에 코사인 법칙을 적용한다.","alt":"3전압계는 VR+VL, 3전류계는 IR+IL 벡터합을 이룬다. 부하의 유도성 위상차를 표시한 예이며 세 길이에 코사인 법칙을 적용한다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-wattmeter-phasors.svg","title":"2전력계의 두 위상각","caption":"c-two-wattmeters의 b상 공통 전압코일 결선을 사용한다. W1은 Vcb와 Ic, W2는 Vab와 Ia를 측정한다. 정상 상순서에서 Va를 0도로 잡으면 Vab=30도, Vcb=90도이고 Ia=-φ, Ic=120도-φ다.","alt":"c-two-wattmeters의 b상 공통 전압코일 결선을 사용한다. W1은 Vcb와 Ic, W2는 Vab와 Ia를 측정한다. 정상 상순서에서 Va를 0도로 잡으면 Vab=30도, Vcb=90도이고 Ia=-φ, Ic=120도-φ다.","width":960.0,"height":580.0},{"t":"fig","src":"figures/power_extra/px-capacitor-bank-y-delta.svg","title":"전력용 콘덴서 Y·Δ 뱅크","caption":"동일한 선간 실효전압에서 같은 정전용량 C를 세 개씩 연결한 두 뱅크를 비교한다. Δ의 총 무효전력 크기는 Y의 3배이며 같은 무효전력 설계일 때는 Y의 각 소자 용량이 Δ의 3배다.","alt":"동일한 선간 실효전압에서 같은 정전용량 C를 세 개씩 연결한 두 뱅크를 비교한다. Δ의 총 무효전력 크기는 Y의 3배이며 같은 무효전력 설계일 때는 Y의 각 소자 용량이 Δ의 3배다.","width":960.0,"height":600.0},{"t":"m","tex":"a=e^{j2\\pi/3}=-\\frac{1}{2}+j\\frac{\\sqrt{3}}{2},\\quad 1+a+a^2=0,\\quad a^3=1","note":"a는 120° 회전 연산자이고 전류 단위 A와 무관하다."},{"t":"m","tex":"V_L=2V_{\\mathrm{ph}}\\sin\\frac{\\pi}{n},\\quad I_L=I_{\\mathrm{ph}}\\quad (Y)","note":"대칭 n상 성형, 이웃 선간전압 크기. 위상 앞섬 π/2-π/n. V[V], I[A]."},{"t":"m","tex":"I_L=2I_{\\mathrm{ph}}\\sin\\frac{\\pi}{n},\\quad V_L=V_{\\mathrm{ph}}\\quad (\\mathrm{ring})","note":"대칭 n상 환상, 각 가지가 이웃 선 사이에 있는 경우. 선전류는 해당 상전류보다 π/2-π/n 뒤짐."},{"t":"m","tex":"P=nV_{\\mathrm{ph}}I_{\\mathrm{ph}}\\cos\\phi=\\frac{nV_LI_L\\cos\\phi}{2\\sin(\\pi/n)}","note":"평형 정현파 n상. P[W], φ는 각 부하의 전압·전류 위상차. n≥3의 성형·환상 이웃 선 정의에 적용."},{"t":"m","tex":"W_1=V_LI_L\\cos(\\pi/6-\\phi),\\quad W_2=V_LI_L\\cos(\\pi/6+\\phi)","note":"평형 정현파 두 전력계의 한 가지 명명 기준. 이때 Q=√3(W1-W2). 전력계 이름을 반대로 붙이면 차의 부호도 반대. 각 전력계 전류코일은 서로 다른 두 선, 전압코일의 공통단자는 나머지 한 선."},{"t":"m","tex":"S=\\sqrt{P^2+Q^2}=2\\sqrt{W_1^2+W_2^2-W_1W_2},\\quad \\tan\\phi=\\sqrt{3}\\frac{W_1-W_2}{W_1+W_2}","note":"평형 정현파 3상. S[VA], W1,W2[W]. P=W1+W2이며 P=0일 때 tan식 대신 전력삼각형으로 판단."},{"t":"trap","items":["√3만 외우고 n상에도 그대로 적용하지 않는다.","두 전력계에서 역률 0.5 미만이면 하나가 음수일 수 있다. 음수를 절댓값으로 더하지 않는다.","V결선 출력비와 이용률의 분모는 다르다."]},{"t":"ex","q":"대칭 4상 Y에서 상전압은 100 V이다. 이웃 선간전압과 해당 상전압 대비 위상은?","steps":["2sin(π/4)=√2.","위상은 π/2-π/4=π/4."],"a":"100√2≈141.4 V, 45° 앞섬."},{"t":"chk","q":"동일한 세 상 임피던스를 같은 선간전압에서 Y→Δ로 재접속하면 총전력은?","a":"3배. Δ의 상전압이 Y의 √3배이고 동일 임피던스의 전력은 전압 제곱에 비례한다. 등가 Y↔Δ 변환과 다른 조건이다."}]},{"id":"C23","title":"대칭분으로 발전기 고장 계산하기","pr":"B","min":40,"day":1,"b":[{"t":"p","ss":[{"s":"X07의 변환은 임의의 3상 페이저를 영상 0, 정상 1, 역상 2로 나눈다.","core":1},{"s":"정상은 a-b-c 방향, 역상은 반대 방향, 영상은 세 상이 동상이다.","core":0},{"s":"전압 불평형률은 보통 |V2|/|V1|×100%로 정의하며, 각 상 크기의 최대·최소 차를 이 식에 대신 넣지 않는다.","core":0},{"s":"회전연산자를 포함한 복소수로 정상·역상을 먼저 구해야 한다.","core":0}]},{"t":"p","ss":[{"s":"고장 전 발전기가 대칭이면 내부기전력은 정상분 E1=E만 있고 E0=E2=0이다.","core":0},{"s":"단자전압은 V1=E-Z1I1, V2=-Z2I2, V0=-Z0I0이다.","core":0},{"s":"Z0,Z1,Z2는 해당 고장점에서 바라본 대칭분 임피던스다.","core":0},{"s":"중성점 접지 임피던스 Zn은 영상망에 3Zn으로 들어간다.","core":0},{"s":"이미 Z0에 포함된 항을 다시 더하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"a상 완전 지락에서는 Ib=Ic=0, Va=0이다.","core":0},{"s":"따라서 I0=I1=I2이고 정상·역상·영상망이 직렬로 연결된다.","core":0},{"s":"a상 전류는 세 분전류의 합 3I0다.","core":0},{"s":"b-c 선간 완전 단락에서는 Ia=0, Ib=-Ic, Vb=Vc이므로 I0=0, I2=-I1, V1=V2이다.","core":0},{"s":"영상망은 필요 없다.","core":0},{"s":"대칭 3상 완전 단락은 정상망만 필요하다.","core":0}]},{"t":"p","ss":[{"s":"b,c 두 상이 동시에 완전 지락하면 Vb=Vc=0, Ia=0이므로 V0=V1=V2이고 I0+I1+I2=0이다.","core":0},{"s":"정상망에서 본 역상망과 영상망이 병렬인 구조다.","core":0},{"s":"고장 저항이 있으면 연결과 분모가 달라진다.","core":0},{"s":"아래 식은 고장점의 완전 단락, 고장 전 부하전류 무시, 상호간 결합을 대칭분 등가망에 반영한 표준 조건이다.","core":0}]},{"t":"fig","src":"figures/circuit/c-sequence-phasors.svg","title":"대칭분의 벡터 방향","caption":"정상과 역상은 세 벡터의 상회전 순서가 반대이고 합은 0이다. 영상분은 같은 위상이라 세 상 합이 3I0다.","alt":"정상과 역상은 세 벡터의 상회전 순서가 반대이고 합은 0이다. 영상분은 같은 위상이라 세 상 합이 3I0다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-fault-networks.svg","title":"사고별 대칭분 등가망","caption":"3상은 정상망, 1선 지락은 정상·역상·영상 직렬, 선간은 정상·역상, 2선 지락은 정상망과 역상·영상 병렬이다. 1선 지락의 같은 망전류 I0와 실제 사고상 3I0를 구분한다.","alt":"3상은 정상망, 1선 지락은 정상·역상·영상 직렬, 선간은 정상·역상, 2선 지락은 정상망과 역상·영상 병렬이다. 1선 지락의 같은 망전류 I0와 실제 사고상 3I0를 구분한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-ground-fault-return.svg","title":"1선지락 귀로와 3Zn","caption":"a상 고장이 대지와 중성점 접지임피던스 Zn을 통해 귀환한다. 중성점에는 세 상 전류합 3I0가 흐르므로 영상 1상망에는 3Zn을 놓는다.","alt":"a상 고장이 대지와 중성점 접지임피던스 Zn을 통해 귀환한다. 중성점에는 세 상 전류합 3I0가 흐르므로 영상 1상망에는 3Zn을 놓는다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-sequence-reconstruction.svg","title":"대칭분의 재합성","caption":"같은 영상벡터에 정상·역상 벡터를 머리-꼬리로 더해 실제 불평형 상전압을 만든다. 임의의 수치 예이며 정상은 a,b,c가 0,-120,+120도, 역상은 반대 상순서다.","alt":"같은 영상벡터에 정상·역상 벡터를 머리-꼬리로 더해 실제 불평형 상전압을 만든다. 임의의 수치 예이며 정상은 a,b,c가 0,-120,+120도, 역상은 반대 상순서다.","width":960.0,"height":620.0},{"t":"m","tex":"V_a=V_0+V_1+V_2,\\quad V_b=V_0+a^2V_1+aV_2,\\quad V_c=V_0+aV_1+a^2V_2","note":"X07의 대칭분 변환을 거꾸로 사용해 각 상을 복원. 전류에도 같은 식 적용. a=eʲ¹²⁰°."},{"t":"m","tex":"U=\\frac{|V_2|}{|V_1|}\\times100\\%,\\quad V_1=E-Z_1I_1,\\quad V_2=-Z_2I_2,\\quad V_0=-Z_0I_0","note":"V,E[V], I[A], Z[Ω]. U는 전압 역상 불평형률. V1≠0. 대칭 내부기전력 조건."},{"t":"m","tex":"I_0=I_1=I_2=\\frac{E}{Z_0+Z_1+Z_2},\\quad I_a=3I_0","note":"a상 1선 완전 지락. 고장임피던스 Zf가 있으면 분모에 3Zf를 더한다. 중성점 접지 임피던스는 Z0 정의 확인."},{"t":"m","tex":"I_1=\\frac{E}{Z_1+Z_2},\\quad I_2=-I_1,\\quad I_0=0","note":"b-c 선간 완전 단락. Ib=(a²-a)I1=-j√3 I1, Ic=-Ib."},{"t":"m","tex":"I_1=\\frac{E}{Z_1+Z_2Z_0/(Z_2+Z_0)}","note":"b,c 두 상 완전 지락. 모든 임피던스는 같은 기준으로 변환하며 Z2+Z0≠0인 일반 경우."},{"t":"m","tex":"I_2=-\\frac{Z_0}{Z_2+Z_0}I_1,\\quad I_0=-\\frac{Z_2}{Z_2+Z_0}I_1","note":"위 2선 지락 조건. Ia=I0+I1+I2=0을 검산한다."},{"t":"m","tex":"I_1=\\frac{E}{Z_1},\\quad I_0=I_2=0","note":"대칭 3상 완전 단락. 실제 기기 계산은 초기·과도·정상 시점에 맞는 정상분 리액턴스를 선택한다."},{"t":"tb","h":["고장","필요 대칭분","핵심 경계조건"],"r":[["1선 지락","정상·역상·영상","I0=I1=I2"],["선간 단락","정상·역상","I0=0, I2=-I1"],["2선 지락","정상·역상·영상","V0=V1=V2"],["3상 단락","정상만","I0=I2=0"]]},{"t":"trap","items":["고장 상전류와 대칭분 전류는 같지 않을 수 있다. 1선 지락은 3배다.","지락이 없는 선간 단락에 Z0를 넣지 않는다.","상전압 기준 E에 선간 정격전압을 그대로 대입하지 않는다."]},{"t":"ex","q":"고장 전 상전압 E=100 V, Z1=j2 Ω, Z2=j2 Ω, Z0=j1 Ω이다. a상 완전 지락 전류는?","steps":["분전류 I0=100/(j5)=-j20 A.","Ia=3I0=-j60 A."],"a":"-j60 A, 실효 크기 60 A."},{"t":"chk","q":"b-c 선간 단락에서 영상분 전류가 0인 이유는?","a":"Ia=0이고 Ib=-Ic이므로 Ia+Ib+Ic=0이다. I0=(Ia+Ib+Ic)/3=0이며 접지로 돌아갈 전류도 없다."}]},{"id":"C24","title":"푸리에 급수: 계수 적분과 파형의 대칭성","pr":"B","min":35,"day":1,"b":[{"t":"p","ss":[{"s":"주기적인 비정현파는 직류 성분과 기본주파수 정수배의 사인·코사인 합으로 나타낼 수 있다.","core":1},{"s":"발전기 파형의 비정현성, 정류·스위칭 같은 비선형 작용이 고조파를 만든다.","core":0},{"s":"한 주기의 파형을 알면 각 성분과 곱해 적분하여 계수를 구한다.","core":0},{"s":"주파수가 다른 정현파가 한 주기 평균에서 직교한다는 성질이 계수를 분리해 준다.","core":0}]},{"t":"p","ss":[{"s":"이 절은 상수항을 a0로 쓰며 a0/2로 쓰는 교재와 정의가 다르다.","core":0},{"s":"따라서 a0는 한 주기 평균이다.","core":0},{"s":"an,bn은 최대값 계수이고 n차 성분의 최대값은 √(an²+bn²), 실효값은 이 값을 √2로 나눈 것이다.","core":0},{"s":"같은 파형을 an cos(nθ)+bn sin(nθ)으로 쓰거나 위상을 가진 사인 하나로 쓰는 것은 표현의 차이다.","core":0}]},{"t":"p","ss":[{"s":"기함수 f(-θ)=-f(θ)는 원점 대칭이라 직류와 코사인 성분이 사라진다.","core":0},{"s":"우함수 f(-θ)=f(θ)는 좌우 대칭이라 사인 성분이 사라진다.","core":0},{"s":"반파대칭 f(θ+π)=-f(θ)는 직류와 짝수 고조파가 사라진다.","core":0},{"s":"반파대칭이면서 기함수인 파형은 홀수 사인항만 남고, 반파대칭이면서 우함수이면 홀수 코사인항만 남는다.","core":0},{"s":"반파대칭과 단순 정류 반파를 이름이 비슷하다고 혼동하지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-fourier-synthesis.svg","title":"푸리에 파형 합성","caption":"정현 기본파와 3차 성분을 같은 시간축에서 더했다. 서로 다른 주파수의 RMS는 크기합이 아니라 제곱합으로 계산하며 합성파의 순간값은 시간별로 더한다.","alt":"정현 기본파와 3차 성분을 같은 시간축에서 더했다. 서로 다른 주파수의 RMS는 크기합이 아니라 제곱합으로 계산하며 합성파의 순간값은 시간별로 더한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/circuit/c-fourier-symmetry.svg","title":"기·우·반파대칭","caption":"가운데 기준선은 t=0이다. 기함수의 원점대칭, 우함수의 좌우대칭, 반주기 이동 부호반전을 비교한다. 반파대칭은 기함수나 우함수와 별개의 조건이다.","alt":"가운데 기준선은 t=0이다. 기함수의 원점대칭, 우함수의 좌우대칭, 반주기 이동 부호반전을 비교한다. 반파대칭은 기함수나 우함수와 별개의 조건이다.","width":960.0,"height":600.0},{"t":"m","tex":"f(\\theta)=a_0+\\sum_{n=1}^{\\infty}\\left(a_n\\cos n\\theta+b_n\\sin n\\theta\\right)","note":"θ=ωt, 주기 2π. f가 전압이면 모든 계수는 V, 전류면 A. 구간별 연속인 통상 파형; 불연속점에서는 좌우 극한 평균으로 수렴."},{"t":"m","tex":"a_0=\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}f(\\theta)\\,d\\theta","note":"직류 성분. 같은 길이 2π의 다른 시작 구간도 가능. 다른 교재가 a0/2 convention이면 계수 정의가 2배 다름."},{"t":"m","tex":"a_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(\\theta)\\cos n\\theta\\,d\\theta,\\quad b_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(\\theta)\\sin n\\theta\\,d\\theta","note":"n=1,2,3,… . 서로 다른 정수차 사인·코사인 곱의 적분은 0, 같은 차의 제곱 적분은 π."},{"t":"m","tex":"F_{n,\\mathrm{rms}}=\\frac{\\sqrt{a_n^2+b_n^2}}{\\sqrt{2}},\\quad F_{\\mathrm{rms}}^2=a_0^2+\\frac{1}{2}\\sum_{n=1}^{\\infty}(a_n^2+b_n^2)","note":"직교성과 실효값 정의를 연결한 파르세발 관계. 주어진 계수를 최대값인지 실효값인지 먼저 구별."},{"t":"tb","h":["파형 성질","반드시 0인 계수","남을 수 있는 성분"],"r":[["기함수","a0, 모든 an","사인항"],["우함수","모든 bn","직류·코사인항"],["반파대칭","a0, 짝수차 an,bn","홀수차"],["원점에 대해 기함수인 ±A 구형파","a0, 모든 an, 짝수차 bn","홀수 사인항"]]},{"t":"trap","items":["시간 원점을 옮기면 기함수/우함수 판정이 달라질 수 있다.","계수 최대값을 C10의 실효값 제곱합에 바로 넣지 않는다.","정류로 절댓값을 취한 파형은 원래 교류와 주기가 달라질 수 있다."]},{"t":"ex","q":"0<θ<π에서 +A, -π<θ<0에서 -A인 주기 구형파의 b1과 b3을 구하라.","steps":["기함수·반파대칭이므로 홀수 사인항만 남는다.","bn=(2A/π)∫0^π sin(nθ)dθ=2A(1-(-1)ⁿ)/(nπ).","홀수차에서는 bn=4A/(nπ)."],"a":"b1=4A/π, b3=4A/(3π)."},{"t":"chk","q":"우함수이면서 반파대칭이면 어떤 성분만 남는가?","a":"홀수차 코사인 성분만 남는다. 우함수이므로 사인항이 0이고 반파대칭이므로 직류·짝수차가 0이다."}]},{"id":"C25","title":"고조파별 임피던스·공진·3상 상분","pr":"B","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"C10에서 전체 실효값과 평균전력을 합하기 전에 각 고조파의 전류를 구해야 한다.","core":1},{"s":"n차 주파수는 nω이므로 인덕터 리액턴스는 n배, 콘덴서 리액턴스 크기는 1/n배다.","core":0},{"s":"저항 R은 주파수에 무관한 이상모델로 둔다.","core":0},{"s":"실제 고주파의 표피효과 등은 별도 조건이다.","core":0},{"s":"복소 임피던스 Z와 그 크기 |Z|를 등호로 같은 물리량처럼 쓰지 않는다.","core":0}]},{"t":"p","ss":[{"s":"3상 파형이 서로 정확히 기본주기 1/3씩 시간 이동한 같은 모양이면 n차의 상간 위상차는 n×120°이다.","core":0},{"s":"3k차는 동상인 영상분, 3k+1차는 정상분, 3k-1차는 역상분이다.","core":0},{"s":"따라서 3차는 영상, 5차는 역상, 7차는 정상이다.","core":0},{"s":"임의로 주입된 불평형 고조파는 이 표 하나로 완전히 분류되지 않고 각 차수별 대칭분 변환이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"Δ 내부의 동상 3배수 기전력은 순환전류를 만들 수 있지만 선전류에서는 두 가지 전류의 차로 상쇄된다.","core":0},{"s":"Y에서는 동상 영상전압이 선간전압의 뺄셈에서 상쇄된다.","core":0},{"s":"Y 중성선이 연결되면 3배수 영상전류는 중성선에서 3배로 합쳐질 수 있다.","core":0},{"s":"중성선 없는 Y의 영상전류 경로와 상전압 왜곡을 구분한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-triplen-paths.svg","title":"Δ·Y의 3차 고조파 경로","caption":"세 상에 동상인 3의 배수 고조파는 Δ 내부 순환경로를 만들고 외부 선전류에서는 차로 상쇄된다. 중성선이 연결된 Y에서는 영상전류가 중성선에 합쳐진다.","alt":"세 상에 동상인 3의 배수 고조파는 Δ 내부 순환경로를 만들고 외부 선전류에서는 차로 상쇄된다. 중성선이 연결된 Y에서는 영상전류가 중성선에 합쳐진다.","width":960.0,"height":540.0},{"t":"m","tex":"Z_n=R+j\\left(n\\omega L-\\frac{1}{n\\omega C}\\right),\\quad I_n=\\frac{V_n}{|Z_n|}","note":"직렬 RLC의 n차 정현파. Vn,In은 해당 차수 실효값 크기, R[Ω], L[H], C[F]. RL이면 C항, RC이면 L항을 생략."},{"t":"m","tex":"n\\omega L=\\frac{1}{n\\omega C}\\quad\\Longleftrightarrow\\quad n^2\\omega^2LC=1","note":"n차 성분의 직렬공진 조건. 기본파에서 공진하지 않아도 어떤 고조파에서 공진할 수 있다."},{"t":"m","tex":"\\mathrm{pf}=\\frac{V_0I_0+\\sum_n V_nI_n\\cos\\phi_n}{V_{\\mathrm{rms}}I_{\\mathrm{rms}}}","note":"전체 역률. 분자는 같은 차수의 평균전력 합이며 단일 기본파 위상차 cosφ1만으로 대체하지 않는다."},{"t":"tb","h":["고조파 차수","상분","평형 시간 이동 파형의 특성"],"r":[["3,6,9,…","영상","세 상 동상"],["1,4,7,…", g","src":"figures/circuit/c-inverse-nested.svg","title":"복합 접속의 역회로","caption":"원래 임피던스 L1 직렬 (L2 병렬 C3)을 단계적으로 뒤집으면 C1 병렬 (C2 직렬 L3)가 된다. 각 소자의 수치는 K²에 맞추어 변환하며 단순 기호 교환만으로 끝내지 않는다.","alt":"원래 임피던스 L1 직렬 (L2 병렬 C3)을 단계적으로 뒤집으면 C1 병렬 (C2 직렬 L3)가 된다. 각 소자의 수치는 K²에 맞추어 변환하며 단순 기호 교환만으로 끝내지 않는다.","width":960.0,"height":590.0},{"t":"m","tex":"Z_R=R,\\quad Z_L=sL,\\quad Z_C=\\frac{1}{sC}","note":"영 초기조건의 라플라스 임피던스. s 단위 s⁻¹, 각 Z[Ω]."},{"t":"m","tex":"Z_s=R+sL+\\frac{1}{sC},\\quad Z_p=\\frac{1}{1/R+1/(sL)+sC}","note":"각각 직렬 RLC와 개별 가지 병렬 RLC. 병렬의 분모는 어드미턴스 S."},{"t":"m","tex":"Z_1(s)Z_2(s)=K^2,\\quad C_2=\\frac{L_1}{K^2},\\quad L_2=K^2C_1","note":"역회로의 기준 임피던스 K[Ω]. L[H], C[F]. 단위 L/C=Ω²임을 검산."},{"t":"trap","items":["같은 인자를 소거하기 전의 분자·분모 근을 독립 영점·극점으로 세지 않는다.","전달함수의 영점과 구동점 임피던스 영점의 물리적 의미를 섞지 않는다.","역회로의 정수 K²는 무차원이 아니다."]},{"t":"ex","q":"Z(s)=4+2/s Ω를 이상 수동소자로 구성하라.","steps":["두 항의 합이므로 직렬로 해석한다.","R=4 Ω, 1/(sC)=2/s에서 C=0.5 F."],"a":"4 Ω 저항과 0.5 F 콘덴서의 직렬."},{"t":"ex","q":"Z(s)=2s/(s²+8) Ω의 병렬 LC를 찾으라.","steps":["Y=(s²+8)/(2s)=s/2+4/s.","sC=s/2이므로 C=0.5 F, 1/(sL)=4/s이므로 L=0.25 H."],"a":"0.5 F와 0.25 H의 병렬."},{"t":"chk","q":"L=0.2 H의 역회로가 K=10 Ω 기준일 때 대응 소자는?","a":"C=L/K²=0.2/100=0.002 F인 콘덴서. sL×1/(sC)=100 Ω²이다."}]},{"id":"C27","title":"ABCD 전송정수 산출·소자망·종속접속","pr":"B","min":40,"day":1,"b":[{"t":"p","ss":[{"s":"C18과 같이 I1은 입력망으로 들어가고 I2는 출력망에서 부하로 나가는 방향이다.","core":1},{"s":"V1=AV2+BI2, I1=CV2+DI2 두 식에서 출력을 개방하면 I2=0이므로 A와 C를, 출력을 단락하면 V2=0이므로 B와 D를 구할 수 있다.","core":0},{"s":"정수라는 이름과 달리 교류망에서는 주파수에 따른 복소 함수다.","core":0}]},{"t":"p","ss":[{"s":"단일 직렬 Z는 V1=V2+ZI2, I1=I2이다.","core":0},{"s":"단일 병렬 Y는 V1=V2, I1=YV2+I2이다.","core":0},{"s":"이상변압기 권수비 a=N1/N2이고 같은 극성 전압을 쓰면 V1=aV2, I1=I2/a이다.","core":0},{"s":"전송정수에서 부하로 나가는 I2와 Z/Y 파라미터에서 포트로 들어가는 I2는 반대 방향이다.","core":0}]},{"t":"p","ss":[{"s":"종속접속은 첫 망의 출력에 다음 망의 입력을 연결하는 것이다.","core":0},{"s":"전송행렬은 전원에서 부하로 만나는 순서대로 곱한다.","core":0},{"s":"행렬 곱은 일반적으로 순서를 바꾸면 다른 결과다.","core":0},{"s":"상호성 망에서는 AD-BC=1이고, 입력·출력의 구조가 대칭이면 A=D이다.","co
