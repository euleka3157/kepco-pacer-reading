자유 표면전류가 0일 때의 접선 자계 연속. B 접선성분이 같다는 식은 아니다."},{"t":"m","tex":"E_t=0,\\qquad D_n=\\rho_{s,\\mathrm{free}}","note":"정전평형 도체에서 바깥쪽 법선을 택한 표면 바로 밖의 전기 경계. 도체 물질 내부 E=0인 조건이다."},{"t":"trap","items":["자유전류 없음은 접선 H 연속 조건이다. 법선 H가 아니라는 점을 확인한다.","자기장의 법선 연속량은 H가 아니라 B다.","도체 내부 정전계 E=0을 정자계 B=0으로 일반화하지 않는다."]},{"t":"ex","q":"자유 표면전류가 없는 경계의 두 매질 투자율이 μ1과 3μ1이다. 자계가 경계에 평행하다. H2/H1과 B2/B1은?","steps":["표면전류가 없어 접선 H는 같으므로 H2/H1=1이다.","B=μH이므로 B2/B1=3이다."],"a":"H의 비는 1, B의 비는 3."},{"t":"chk","q":"경계를 수직으로 지나는 자계에서 μ가 달라도 항상 연속인 자기량의 성분은?","a":"법선 자속밀도 Bn이다. Hn은 μ에 따라 달라질 수 있다."}]},{"id":"E17","title":"평면파와 고유임피던스: 377Ω의 의미","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"전자파에서는 시간에 따라 변하는 전기장과 자기장이 서로 연결되어 공간을 진행한다.","core":1},{"s":"균일한 무손실 매질의 진행 평면파에서는 E와 H가 서로 수직이고 둘 다 진행방향과 수직이다.","core":0},{"s":"이러한 장의 배열을 횡전자파라고 부른다.","core":0},{"s":"E와 H는 같은 위상이며 진행방향은 E×H 방향이다.","core":0},{"s":"손실성 매질이나 여러 파가 겹친 임의의 장에 이 조건을 무조건 적용하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"고유임피던스 η는 평면파의 전계 크기와 자계 크기의 비다.","core":0},{"s":"회로의 V/I와 비슷한 비율이지만 여기서는 V/m를 A/m로 나누므로 단위가 Ω가 된다.","core":0},{"s":"무손실 매질에서는 η=√(μ/ε)이고 자유공간에서는 약 377 Ω=120π Ω다.","core":0},{"s":"377은 전계 자체의 크기나 전파속도가 아니라 E/H 비라는 점이 핵심이다.","core":0}]},{"t":"p","ss":[{"s":"전파속도는 v=1/√(με)다.","core":0},{"s":"자유공간에서 약 3×10⁸ m/s이다.","core":0},{"s":"같은 μ에서 ε가 4배가 되면 η는 1/2, 전파속도도 1/2이 된다.","core":0},{"s":"같은 ε에서 μ가 4배이면 η는 2배이지만 속도는 1/2이 된다.","core":0},{"s":"η는 μ/ε의 비, 속도는 με의 곱이라는 차이를 이용하면 외울 양이 줄어든다.","core":0}]},{"t":"p","ss":[{"s":"파장 λ와 주파수 f는 v=λf로 연결된다.","core":0},{"s":"파가 다른 매질로 넘어갈 때 경계가 시간에 따라 움직이지 않는 기본 문제에서는 주파수는 유지되고 속도 변화에 맞춰 파장이 변한다.","core":0},{"s":"비유전율 4, 비투자율 1인 무손실 매질에서는 속도와 파장이 자유공간의 절반이다.","core":0},{"s":"위상정수·파동방정식과 손실매질로의 연결은 E42에서 다룬다.","core":0}]},{"t":"fig","src":"figures/electromag/e-plane-wave.svg","title":"평면파와 포인팅 방향","caption":"같은 위상의 E,H와 E×H 방향을 삼차원 축의 투영으로 표시한다.","alt":"같은 위상의 E,H와 E×H 방향을 삼차원 축의 투영으로 표시한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-wave-propagation.svg","title":"손실 없는 진행파와 감쇠파","caption":"시간·공간 부호와 감쇠 포락선의 역할을 비교하는 보충 그림이다.","alt":"시간·공간 부호와 감쇠 포락선의 역할을 비교하는 보충 그림이다.","width":960.0,"height":620.0},{"t":"m","tex":"\\eta=\\frac{E}{H}=\\sqrt{\\frac{\\mu}{\\varepsilon}},\\qquad \\eta_0\\simeq120\\pi\\simeq377\\ \\Omega","note":"무손실 균일 매질의 단일 진행 평면파. E와 H는 동일한 진폭 기준(둘 다 RMS 또는 둘 다 peak)으로 비교한다."},{"t":"m","tex":"v=\\frac{1}{\\sqrt{\\mu\\varepsilon}}=\\frac{c}{\\sqrt{\\mu_r\\varepsilon_r}},\\qquad \\lambda=\\frac{v}{f}","note":"v: m/s, c≈3×10⁸ m/s, λ: m, f: Hz. 무손실 균일 매질의 기본 모델이다."},{"t":"trap","items":["377 Ω는 자유공간의 E/H 비다. 어떤 매질에도 377을 넣지 않는다.","E는 peak, H는 RMS를 섞으면 √2 오차가 난다.","고유임피던스는 √(μ/ε), 속도는 1/√(με)다."]},{"t":"ex","q":"자유공간 진행 평면파의 E 실효값이 75.4 V/m이다. H 실효값은? η0=377 Ω로 한다.","steps":["E/H=377이므로 H=E/377이다.","75.4/377=0.2 A/m이다."],"a":"0.2 A/m."},{"t":"chk","q":"μr=1, εr=9인 무손실 매질의 전파속도는 자유공간의 몇 배인가?","a":"1/3배다. v/c=1/√(1×9)=1/3이다."}]},{"id":"E18","title":"포인팅 벡터: 전력밀도와 RMS·최댓값 구별","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"포인팅 벡터 S는 전자기 에너지가 어느 방향으로 얼마나 흐르는지 나타내는 전력밀도다.","core":1},{"s":"순간 전계와 순간 자계의 외적으로 정의되며 단위는 W/m²다.","core":0},{"s":"총전력 W가 아니라 단위 면적당 전력이다.","core":0},{"s":"균일한 파가 면에 수직으로 들어오면 평균 전력밀도에 면적을 곱해 그 면을 통과하는 평균 전력을 구한다.","core":0}]},{"t":"p","ss":[{"s":"무손실 진행 평면파에서 E와 H는 수직·동위상이므로 순간 크기는 EH다.","core":0},{"s":"전계가 Epeak cosωt, 자계가 Hpeak cosωt라면 곱에 cos²ωt가 생긴다.","core":0},{"s":"한 주기 평균 cos²는 1/2이어서 평균 전력밀도는 EpeakHpeak/2가 된다.","core":0},{"s":"이 1/2는 외적 때문에 생기는 것이 아니라 시간평균 때문에 생긴다.","core":0}]},{"t":"p","ss":[{"s":"실효값은 이미 정현파 진폭을 √2로 나눈 값이므로 두 실효값의 곱에는 1/2를 다시 붙이지 않는다.","core":0},{"s":"자유공간에서 평균 전력밀도는 Erms²/377=377Hrms²이다.","core":0},{"s":"peak 값을 주었다면 Epeak²/(2×377)=377Hpeak²/2다.","core":0},{"s":"복기에 적힌 E²/377은 평균값을 구할 때 E를 실효값으로 해석해야 정확하다.","core":0}]},{"t":"p","ss":[{"s":"순간값을 대입하는 S(t)=E(t)×H(t)와 시간평균을 구하는 식을 구별한다.","core":0},{"s":"전계식이 E=10cosωt V/m처럼 주어지면 10은 보통 최댓값이다.","core":0},{"s":"‘전계 실효값 10 V/m’이라고 명시하면 실효값이다.","core":0},{"s":"단순히 E라고만 쓴 문제는 원문의 정의와 선택지 맥락을 읽되, 학습자료에는 기준을 생략하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"진행방향은 외적 순서 E×H다.","core":0},{"s":"E가 +x, H가 +y이면 진행은 +z다.","core":0},{"s":"순서를 H×E로 바꾸면 -z가 된다.","core":0},{"s":"전계 진폭을 2배로 하면 같은 매질의 H도 2배가 되고 평균 전력밀도는 4배가 된다.","core":0},{"s":"전력밀도는 장의 진폭에 선형이 아니라 제곱으로 비례한다.","core":0}]},{"t":"fig","src":"figures/electromag/e-plane-wave.svg","title":"평면파와 포인팅 방향","caption":"같은 위상의 E,H와 E×H 방향을 삼차원 축의 투영으로 표시한다.","alt":"같은 위상의 E,H와 E×H 방향을 삼차원 축의 투영으로 표시한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\mathbf{S}(t)=\\mathbf{E}(t)\\times\\mathbf{H}(t)","note":"순간 포인팅 벡터: W/m². 전자기 에너지 흐름의 방향은 외적 방향이다."},{"t":"m","tex":"S_{\\mathrm{avg}}=E_{\\mathrm{rms}}H_{\\mathrm{rms}}=\\frac{E_{\\mathrm{rms}}^2}{\\eta}=\\eta H_{\\mathrm{rms}}^2","note":"무손실 매질의 정현파 진행 평면파. RMS끼리이면 추가 1/2가 없다."},{"t":"m","tex":"S_{\\mathrm{avg}}=\\frac{E_{\\mathrm{peak}}H_{\\mathrm{peak}}}{2}=\\frac{E_{\\mathrm{peak}}^2}{2\\eta}","note":"같은 조건에서 최댓값을 사용한 평균 전력밀도. 자유공간에서는 η≈377 Ω이다."},{"t":"trap","items":["단위는 W/m²다. W만 쓰면 총전력과 혼동한다.","RMS 식에 1/2를 또 곱하거나 peak 식에서 1/2를 빼먹지 않는다.","항상 EH로 스칼라화할 수 있는 것은 아니다. 일반 정의는 E×H이며 각도·방향을 고려한다."]},{"t":"ex","q":"자유공간 정현파의 전계 최댓값이 37.7 V/m이다. 평균 전력밀도는? η0=377 Ω로 한다.","steps":["최댓값이므로 Epeak²/(2η)를 사용한다.","37.7²/(2×377)=1.885 W/m²다."],"a":"1.885 W/m². 같은 숫자를 RMS로 주었다면 3.77 W/m²다."},{"t":"chk","q":"같은 매질에서 평면파 전계 실효값이 3배이면 평균 전력밀도는 몇 배인가?","a":"9배다. 평균 전력밀도는 Erms²/η에 비례한다."}]},{"id":"E19","title":"표피효과와 침투깊이: 주파수가 커지면 얕아진다","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"직류 정상상태의 균일 도체에서는 전류가 단면 전체에 비교적 고르게 분포한다.","core":1},{"s":"교류에서는 시간변화 자기장과 유도 작용 때문에 도체 내부로 깊이 들어갈수록 전류밀도 진폭이 작아질 수 있다.","core":0},{"s":"이 때문에 전류가 표면 가까이에 더 집중되는 현상을 표피효과라고 한다.","core":0},{"s":"표면에만 전류가 있고 중심은 항상 정확히 0이라는 뜻은 아니다.","core":0}]},{"t":"p","ss":[{"s":"좋은 도체의 평면 근사에서 전류밀도나 장의 진폭은 깊이 x에 따라 대략 exp(-x/δ)로 줄어든다.","core":0},{"s":"δ는 표면 진폭의 1/e, 약 36.8%가 되는 깊이다.","core":0},{"s":"전력밀도는 진폭의 제곱에 비례하므로 같은 깊이에서 1/e² 수준이 된다.","core":0},{"s":"‘37%’가 장·전류의 진폭 기준인지 전력 기준인지 구별한다.","core":0}]},{"t":"p","ss":[{"s":"침투깊이는 주파수 f, 투자율 μ, 도전율 σ가 커질수록 작아진다.","core":0},{"s":"이 세 값이 분모의 제곱근 안에 있기 때문이다.","core":0},{"s":"주파수가 4배이면 δ는 절반, 9배이면 1/3이다.","core":0},{"s":"δ가 작아지면 실제로 전류가 잘 흐르는 단면이 줄어 교류 저항이 커질 수 있다.","core":0},{"s":"굵은 도체는 반지름에 비해 δ가 작을 때 효과가 두드러진다.","core":0}]},{"t":"p","ss":[{"s":"표피효과가 강한지 판단할 때 δ 자체와 도선 반지름을 비교한다.","core":0},{"s":"δ가 반지름보다 훨씬 크면 단면 전체에 비교적 고르게 흐르고, 훨씬 작으면 표면 근처로 집중된다.","core":0},{"s":"도선이 굵다고 해서 재료의 δ 공식에 반지름이 직접 들어가는 것은 아니다.","core":0},{"s":"재료·주파수로 정해지는 침투깊이와 형상에 따른 저항 증가를 분리한다.","core":0}]},{"t":"p","ss":[{"s":"와전류는 도체 내부에 폐회로 형태로 생기는 유도전류다.","core":0},{"s":"유도 가열에서는 이를 이용하지만 철심에서는 손실을 만든다.","core":0},{"s":"판을 얇게 나누고 절연해 큰 전류 고리를 끊으면 와전류 손실을 줄일 수 있다.","core":0},{"s":"기기의 철손 비교는 전기기기 권을 보고, 여기서는 전자유도와 표피효과가 같은 시간변화 장과 연결된다는 점만 기억한다.","core":0}]},{"t":"fig","src":"figures/electromag/e-eddy-skin.svg","title":"와전류·적층·침투깊이","caption":"도체 내부 순환 손실과 표면 전류 집중의 원인을 구별한다.","alt":"도체 내부 순환 손실과 표면 전류 집중의 원인을 구별한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/power/p-skin-hardware.svg","title":"표피효과·댐퍼·스페이서","caption":"댐퍼는 진동 에너지를 줄이고 스페이서는 복도체 간격을 유지한다. 오프셋은 상간 접촉 위험을 줄이는 배치 요소로서 표피효과와 다른 문제다.","alt":"표피효과·댐퍼·스페이서 — 댐퍼는 진동 에너지를 줄이고 스페이서는 복도체 간격을 유지한다. 오프셋은 상간 접촉 위험을 줄이는 배치 요소로서 표피효과와 다른 문제다.","width":960.0,"height":560.0},{"t":"m","tex":"\\delta=\\sqrt{\\frac{2}{\\omega\\mu\\sigma}}=\\frac{1}{\\sqrt{\\pi f\\mu\\sigma}}","note":"좋은 도체 조건 σ≫ωε에서의 침투깊이 δ: m. f: Hz, ω=2πf: rad/s, μ: H/m, σ: S/m."},{"t":"m","tex":"\\frac{\\delta_2}{\\delta_1}=\\sqrt{\\frac{f_1\\mu_1\\sigma_1}{f_2\\mu_2\\sigma_2}},\\qquad \\frac{J(x)}{J(0)}\\simeq e^{-x/\\delta}","note":"J 비는 진폭의 감쇠 비. 평면·좋은 도체 근사이며 실제 도선 내부의 정밀 분포는 형상에 따라 달라진다."},{"t":"trap","items":["표피효과 증가와 표피깊이 증가는 반대다.","도전율이 커지면 직류 저항은 작아지지만 표피깊이도 작아진다. 두 질문을 구별한다.","깊이 δ에서 약 37%는 장 또는 전류밀도 진폭 기준이다."]},{"t":"ex","q":"같은 도체에서 주파수를 100 Hz에서 400 Hz로 올린다. 침투깊이는 처음의 몇 배인가?","steps":["재료가 같으므로 μ와 σ는 고정이다.","δ 비는 √(100/400)=1/2이다."],"a":"1/2배. 전류는 표면에 더 집중되는 경향을 보인다."},{"t":"chk","q":"좋은 도체에서 μ만 9배가 되고 f·σ는 같다면 δ는?","a":"1/3배다. δ는 μ의 제곱근에 반비례한다."}]},{"id":"E20","title":"전위 함수·발산·포아송과 라플라스 방정식","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"전위 V가 x, y, z의 식으로 주어지면 좌표별로 한 번 미분한 뒤 음수를 붙이면 E의 각 성분을 구할 수 있다.","core":1},{"s":"x로 미분할 때 y와 z는 상수처럼 둔다.","core":0},{"s":"예를 들어 V=2x²+3y라면 x 성분은 -4x, y 성분은 -3, z 성분은 0이다.","core":0},{"s":"좌표값은 미분을 먼저 끝낸 뒤 대입한다.","core":0}]},{"t":"p","ss":[{"s":"D가 벡터 함수로 주어지면 발산을 구해 자유 체적전하밀도를 얻는다.","core":0},{"s":"Dx는 x로, Dy는 y로, Dz는 z로 각각 미분한 뒤 더한다.","core":0},{"s":"서로 다른 성분을 엉뚱한 좌표로 미분하는 교차항은 발산식에 들어가지 않는다.","core":0},{"s":"결과는 방향이 없는 스칼라 C/m³다.","core":0},{"s":"E가 주어졌다면 균일한 선형 매질에서 ρv=ε div E로 연결한다.","core":0}]},{"t":"p","ss":[{"s":"전위를 두 번 미분한 라플라시안과 전하밀도의 관계가 포아송 방정식이다.","core":0},{"s":"균일한 ε인 정전계에서는 ∇²V=-ρv/ε다.","core":0},{"s":"전하가 없는 영역이면 오른쪽이 0이 되어 라플라스 방정식이 된다.","core":0},{"s":"라플라스 방정식이 성립한다고 전위나 전계 자체가 0인 것은 아니다.","core":0},{"s":"균일한 전계가 있는 전하 없는 공간에서도 성립할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"미분기호를 모두 암기하기 어려우면 입력과 출력을 먼저 외운다.","core":0},{"s":"V에서 E는 1회 미분·음수·벡터, D에서 ρv는 발산·스칼라, V에서 ρv는 2회 미분 후 -ε를 곱한다.","core":0},{"s":"E22에서 연산 항등식과 방사대칭 원통·구좌표의 미분식을 연결한다.","core":0},{"s":"전하분포에 따른 내부·외부 해와 전위 기준은 E24에서 비교한다.","core":0}]},{"t":"p","ss":[{"s":"전하밀도 기호 ρv는 전기저항률과 같은 그리스 문자로 쓰일 수 있지만 단위가 다르다.","core":0},{"s":"전하밀도는 C/m³, 저항률은 Ω·m다.","core":0},{"s":"문제를 읽을 때 기호만 보고 기억을 가져오지 말고 단위와 문맥으로 의미를 확인한다.","core":0},{"s":"이 단원은 빠른 계산보다 공식 선택을 정확하게 하는 데 목적이 있다.","core":0}]},{"t":"fig","src":"figures/electromag/e-differential-operators.svg","title":"기울기·발산·회전의 기하","caption":"등위선에 수직인 기울기, 순유출을 나타내는 발산, 순환의 축인 회전을 비교한다.","alt":"등위선에 수직인 기울기, 순유출을 나타내는 발산, 순환의 축인 회전을 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-potential-grid.svg","title":"등전위선과 라플라스 격자","caption":"전위 경사의 부호와 균일 격자의 네 이웃 평균 근사를 함께 시각화한다.","alt":"전위 경사의 부호와 균일 격자의 네 이웃 평균 근사를 함께 시각화한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\mathbf{E}=-\\frac{\\partial V}{\\partial x}\\hat{\\mathbf{x}}-\\frac{\\partial V}{\\partial y}\\hat{\\mathbf{y}}-\\frac{\\partial V}{\\partial z}\\hat{\\mathbf{z}}","note":"직교좌표의 정전계. 좌표는 m, V는 V로 주어졌을 때 결과 단위는 V/m이다."},{"t":"m","tex":"\\rho_v=\\nabla\\cdot\\mathbf{D}=\\frac{\\partial D_x}{\\partial x}+\\frac{\\partial D_y}{\\partial y}+\\frac{\\partial D_z}{\\partial z}","note":"ρv: 자유 체적전하밀도 C/m³. 결과는 스칼라다."},{"t":"m","tex":"\\nabla^2V=-\\frac{\\rho_v}{\\varepsilon},\\qquad \\rho_v=0\\ \\Rightarrow\\ \\nabla^2V=0","note":"균일한 선형·등방성 유전체의 정전계. 앞은 포아송, 뒤는 전하 없는 영역의 라플라스 방정식이다."},{"t":"trap","items":["V에서 E를 구할 때 앞의 음수를 빠뜨리지 않는다.","좌표 숫자를 먼저 넣어 V를 상수로 만든 뒤 미분하면 안 된다.","전하 없는 영역의 ∇²V=0은 V=0이나 E=0을 뜻하지 않는다."]},{"t":"ex","q":"전위가 V=2x²+3y V이다. 좌표 단위는 m다. x=1인 점에서 전계의 x·y·z 성분은?","steps":["x 편미분은 4x, y 편미분은 3, z 편미분은 0이다.","음수를 붙인 뒤 x=1을 넣는다."],"a":"Ex=-4 V/m, Ey=-3 V/m, Ez=0."},{"t":"chk","q":"D=(2x, 3y, -z) C/m²로 주어지고 좌표는 m다. 자유 체적전하밀도는?","a":"2+3-1=4 C/m³다. 각 성분을 해당 좌표로 미분해 더한다."}]},{"id":"E21","title":"벡터의 성분·단위벡터·좌표 변환","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"스칼라는 질량·에너지·온도·전위처럼 크기만으로 나타내고, 벡터는 힘·전계·자계·변위처럼 방향도 필요하다.","core":1},{"s":"단위벡터는 크기 1인 방향표시다.","core":0},{"s":"벡터의 크기로 각 성분을 나누면 그 벡터 방향의 단위벡터가 된다.","core":0},{"s":"방향코사인은 각 좌표축과 이루는 각의 코사인이며 제곱합이 1이다.","core":0}]},{"t":"p","ss":[{"s":"직교좌표에서는 각 성분끼리 더하고 뺀다.","core":0},{"s":"내적은 같은 축의 성분곱을 더하고, 외적은 오른손 방향을 따른다.","core":0},{"s":"i×j=k, j×k=i, k×i=j이고 순서를 바꾸면 부호가 반대다.","core":0},{"s":"같은 축끼리 외적은 0, 내적은 1이다.","core":0},{"s":"두 벡터가 수직이면 내적 0이고 평행이면 외적 0이다.","core":0}]},{"t":"p","ss":[{"s":"원통좌표는 축으로부터 거리 s, xy평면 방위각 φ, 높이 z로 위치를 나타낸다.","core":0},{"s":"구좌표는 원점거리 r, +z축에서 잰 극각 θ, xy평면 방위각 φ로 정한다.","core":0},{"s":"원자료에서 각도 기호 순서가 다르게 쓰일 수 있으므로 기호 이름보다 어디서 재는지 확인한다.","core":0},{"s":"원통·구좌표의 단위벡터는 위치에 따라 방향이 달라진다.","core":0}]},{"t":"fig","src":"figures/electromag/e-coordinates.svg","title":"직교·원통·구좌표","caption":"직교성분과 두 종류의 반지름, 극각과 방위각의 기준을 비교한다.","alt":"직교성분과 두 종류의 반지름, 극각과 방위각의 기준을 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-vector-products.svg","title":"벡터 합과 내적·외적","caption":"방향이 있는 합, 투영을 나타내는 내적, 면 법선 방향의 외적을 한눈에 비교한다.","alt":"방향이 있는 합, 투영을 나타내는 내적, 면 법선 방향의 외적을 한눈에 비교한다.","width":960.0,"height":620.0},{"t":"m","tex":"|\\mathbf{A}|=\\sqrt{A_x^2+A_y^2+A_z^2},\\qquad \\hat{\\mathbf{a}}=\\frac{\\mathbf{A}}{|\\mathbf{A}|}","note":"A≠0. 단위벡터 자체는 무차원이다."},{"t":"m","tex":"\\cos\\alpha=\\frac{A_x}{|\\mathbf{A}|},\\quad\\cos\\beta=\\frac{A_y}{|\\mathbf{A}|},\\quad\\cos\\gamma=\\frac{A_z}{|\\mathbf{A}|}","note":"α·β·γ는 벡터와 +x·+y·+z축 사이 각. cos²α+cos²β+cos²γ=1."},{"t":"m","tex":"\\mathbf{A}\\cdot\\mathbf{B}=A_xB_x+A_yB_y+A_zB_z","note":"내적 결과는 스칼라. 각도는 cosθ=(A·B)/(|A||B|)로 구한다."},{"t":"m","tex":"(\\mathbf{A}\\times\\mathbf{B})_x=A_yB_z-A_zB_y","note":"y성분은 AzBx−AxBz, z성분은 AxBy−AyBx. 외적 결과는 벡터다."},{"t":"m","tex":"x=s\\cos\\phi,\\quad y=s\\sin\\phi,\\quad z=z","note":"원통좌표 s≥0. 직교성분에서 As=Ax cosφ+Ay sinφ, Aφ=−Ax sinφ+Ay cosφ, Az=Az."},{"t":"m","tex":"\\hat{\\mathbf{s}}=\\cos\\phi\\,\\hat{\\mathbf{x}}+\\sin\\phi\\,\\hat{\\mathbf{y}},\\quad \\hat{\\boldsymbol{\\phi}}=-\\sin\\phi\\,\\hat{\\mathbf{x}}+\\cos\\phi\\,\\hat{\\mathbf{y}}","note":"원통좌표 기저의 회전. 좌표변환과 성분변환을 혼동하지 않는다."},{"t":"m","tex":"x=r\\sin\\theta\\cos\\phi,\\quad y=r\\sin\\theta\\sin\\phi,\\quad z=r\\cos\\theta","note":"구좌표 θ: +z축 극각, φ: +x축에서 잰 방위각."},{"t":"ex","q":"A=(1,2,0), B=(0,1,3)일 때 A·B와 A×B는?","steps":["내적은 1×0+2×1+0×3=2.","외적은 (2×3−0×1,0×0−1×3,1×1−2×0)이다."],"a":"내적 2, 외적 (6,−3,1)."},{"t":"chk","q":"A=(2,−3,6)의 크기와 방향 단위벡터는?","a":"크기 7, 단위벡터 (2/7,−3/7,6/7)이다. 성분제곱합은 1이다."}]},{"id":"E22","title":"미분 연산·벡터 항등식과 적분의 연결","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"나블라 ∇는 직교좌표에서 각 축의 편미분을 묶은 연산자다.","core":1},{"s":"스칼라 f에 작용하는 grad f는 가장 빠르게 증가하는 방향의 벡터, 벡터 A에 작용하는 div A는 점에서 나오는 순흐름의 스칼라, curl A는 국소 순환의 벡터다.","core":0},{"s":"연산 전에 입력이 스칼라인지 벡터인지 먼저 구분한다.","core":0}]},{"t":"p","ss":[{"s":"E20의 전위 미분·포아송과 E15의 발산정리·스토크스 정리는 같은 구조다.","core":0},{"s":"작은 부피에 대한 전하 보존을 합하면 폐곡면의 흐름식이 되고, 작은 면의 회전을 합하면 가장자리의 선적분이 된다.","core":0},{"s":"내부 경계가 상쇄되므로 마지막에 바깥 경계만 남는다.","core":0}]},{"t":"p","ss":[{"s":"매끄러운 장에서는 혼합편미분 순서를 바꿀 수 있어 grad의 curl과 curl의 div가 0이다.","core":0},{"s":"다만 curl A=0이라는 국소 조건으로 모든 닫힌 경로 적분이 0이라고 결론내리려면 특이점이 없는 단순연결 영역이라는 조건도 필요하다.","core":0},{"s":"원자료의 항등식은 이런 정상적인 미분 가능 조건에서 적용한다.","core":0}]},{"t":"p","ss":[{"s":"좌표에 따라 단위벡터 방향이 달라지므로 원통·구좌표에서 직교좌표 미분식을 성분 이름만 바꾸어 쓰지 않는다.","core":0},{"s":"방사대칭 전위는 원통·구좌표 라플라시안을 쓰면 간단해진다.","core":0},{"s":"무한 선전하에서는 로그형, 점전하·구 외부에서는 1/r형 전위가 전하 없는 영역의 라플라스식을 만족한다.","core":0}]},{"t":"fig","src":"figures/electromag/e-differential-operators.svg","title":"기울기·발산·회전의 기하","caption":"등위선에 수직인 기울기, 순유출을 나타내는 발산, 순환의 축인 회전을 비교한다.","alt":"등위선에 수직인 기울기, 순유출을 나타내는 발산, 순환의 축인 회전을 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-integral-theorems.svg","title":"닫힌 면·열린 면과 적분정리","caption":"가우스는 부피와 닫힌 표면, 스토크스는 열린 면과 그 경계를 연결한다.","alt":"가우스는 부피와 닫힌 표면, 스토크스는 열린 면과 그 경계를 연결한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\nabla f=\\frac{\\partial f}{\\partial x}\\hat{\\mathbf{x}}+\\frac{\\partial f}{\\partial y}\\hat{\\mathbf{y}}+\\frac{\\partial f}{\\partial z}\\hat{\\mathbf{z}}","note":"grad는 스칼라→벡터."},{"t":"m","tex":"(\\nabla\\times\\mathbf{A})_x=\\frac{\\partial A_z}{\\partial y}-\\frac{\\partial A_y}{\\partial z}","note":"나머지는 x→y→z를 순환한다. div A는 ∂Ax/∂x+∂Ay/∂y+∂Az/∂z."},{"t":"m","tex":"\\nabla^2f=\\frac{\\partial^2 f}{\\partial x^2}+\\frac{\\partial^2 f}{\\partial y^2}+\\frac{\\partial^2 f}{\\partial z^2}","note":"라플라시안: 스칼라→스칼라. 벡터 라플라시안은 직교좌표의 각 성분에 적용한다."},{"t":"m","tex":"\\nabla\\times(\\nabla f)=0,\\quad\\nabla\\cdot(\\nabla\\times\\mathbf{A})=0","note":"연속인 2차 편미분 등 항등식이 성립하는 정칙 영역."},{"t":"m","tex":"\\nabla\\cdot(f\\mathbf{A})=f\\nabla\\cdot\\mathbf{A}+\\mathbf{A}\\cdot\\nabla f","note":"스칼라와 벡터 곱의 발산."},{"t":"m","tex":"\\nabla\\times(f\\mathbf{A})=f\\nabla\\times\\mathbf{A}+(\\nabla f)\\times\\mathbf{A}","note":"외적의 순서 때문에 A×grad f로 바꾸면 음수가 필요하다."},{"t":"m","tex":"\\nabla\\cdot(\\mathbf{A}\\times\\mathbf{B})=\\mathbf{B}\\cdot(\\nabla\\times\\mathbf{A})-\\mathbf{A}\\cdot(\\nabla\\times\\mathbf{B})","note":"포인팅 에너지식 등을 얻는 데 쓰이는 항등식."},{"t":"m","tex":"\\nabla\\times(\\nabla\\times\\mathbf{A})=\\nabla(\\nabla\\cdot\\mathbf{A})-\\nabla^2\\mathbf{A}","note":"curl curl A를 단순히 −∇²A로 쓸 때에는 div A=0 조건을 확인한다."},{"t":"m","tex":"\\nabla^2 V=\\frac{1}{s}\\frac{d}{ds}\\left(s\\frac{dV}{ds}\\right)","note":"원통 방사대칭이며 φ·z에 무관할 때만 이 축약형이다."},{"t":"m","tex":"\\nabla^2 V=\\frac{1}{r^2}\\frac{d}{dr}\\left(r^2\\frac{dV}{dr}\\right)","note":"구 방사대칭이며 θ·φ에 무관할 때만 이 축약형이다."},{"t":"ex","q":"f=x²+y², A=(x,y,0)일 때 ∇·(fA)를 원점 외 임의 위치에서 구하라.","steps":["div A=2, grad f=(2x,2y,0).","f div A+A·grad f=2(x²+y²)+2x²+2y²."],"a":"4(x²+y²)."},{"t":"chk","q":"벡터 A=(−y,x,0)의 div A와 curl A는?","a":"div A=0, curl A=(0,0,2)다. 발산이 0이라고 회전도 0인 것은 아니다."}]},{"id":"E23","title":"전하·전기력선·전계 영점과 전위의 평균 성질","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"전하량의 기본 크기는 e≈1.602×10⁻¹⁹ C다.","core":1},{"s":"전자는 −e, 양성자는 +e이고 전자 질량은 약 9.109×10⁻³¹ kg이다.","core":0},{"s":"양성자 질량은 약 1.673×10⁻²⁷ kg이며 중성자는 전하가 0이다.","core":0},{"s":"여러 입자의 총전하는 부호를 포함해 더한다.","core":0},{"s":"정지 상태에서 전위차로 가속되는 입자는 전기 위치에너지 감소분만큼 운동에너지를 얻는다.","core":0}]},{"t":"p","ss":[{"s":"정전계의 전기력선은 각 점에서 전계에 접하고 밀도가 전계 크기를 나타낸다.","core":0},{"s":"양전하에서 나와 음전하로 들어가며, 유한 영역에서는 무한대로 이어질 수 있다.","core":0},{"s":"서로 교차하지 않고 정전평형 도체 표면에는 수직이다.","core":0},{"s":"전하가 없는 영역에서 갑자기 시작하거나 끝나지 않는다.","core":0},{"s":"정전계에서는 닫힌 순환 고리가 아니지만 시간변화 자기장에 의한 유도전계는 닫힌 고리를 만들 수 있다.","core":0}]},{"t":"p","ss":[{"s":"일직선의 두 점전하에서 E=0 위치는 방향부터 판단한다.","core":0},{"s":"같은 부호이면 두 전하 사이, 반대 부호이면서 크기가 다르면 작은 전하 바깥쪽에서 서로 반대인 전계가 상쇄된다.","core":0},{"s":"같은 크기 반대 부호의 쌍은 유한한 축상 영점이 없다.","core":0},{"s":"거리비는 전하 크기비의 제곱근이다.","core":0},{"s":"전위 영점은 부호를 가진 1/r 항을 더하여 따로 찾는다.","core":0}]},{"t":"p","ss":[{"s":"자유전하가 없고 유전율이 균일한 영역의 전위는 라플라스식을 만족한다.","core":0},{"s":"정확한 평균값 성질은 내부 점의 전위가 그 점을 중심으로 한 구면의 평균과 같다는 것이다.","core":0},{"s":"격자에서 네 이웃의 산술평균은 2차원·동일 간격·라플라스 조건의 유한차분 근사이며, 임의 네 점이면 항상 성립하는 공식은 아니다.","core":0}]},{"t":"fig","src":"figures/electromag/e-point-charge.svg","title":"점전하에서 힘과 전계 구별","caption":"같은 부호의 반발력과 양전하의 방사형 전계, 거리 의존성을 나타낸다.","alt":"같은 부호의 반발력과 양전하의 방사형 전계, 거리 의존성을 나타낸다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-potential-grid.svg","title":"등전위선과 라플라스 격자","caption":"전위 경사의 부호와 균일 격자의 네 이웃 평균 근사를 함께 시각화한다.","alt":"전위 경사의 부호와 균일 격자의 네 이웃 평균 근사를 함께 시각화한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-conductor-shielding.svg","title":"도체 공동·유도전하와 차폐","caption":"금속 내부와 공동을 구분하고 공동 안 전하의 유무에 따른 차이를 보충한다.","alt":"금속 내부와 공동을 구분하고 공동 안 전하의 유무에 따른 차이를 보충한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-charge-motion-zero.svg","title":"전자 가속과 전계 영점","caption":"전자가 전계 반대로 가속되는 이유와 두 전하 전계의 상쇄 위치를 그린다.","alt":"전자가 전계 반대로 가속되는 이유와 두 전하 전계의 상쇄 위치를 그린다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-electric-field-lines.svg","title":"양·음전하의 전기력선","caption":"부호에 따른 출발·도착과 대칭적인 전기력선의 방향을 개념도로 보여 준다.","alt":"부호에 따른 출발·도착과 대칭적인 전기력선의 방향을 개념도로 보여 준다.","width":960.0,"height":620.0},{"t":"m","tex":"\\frac{1}{2}mv^2=|q|\\,|\\Delta V|,\\quad v=\\sqrt{\\frac{2|q|\\,|\\Delta V|}{m}}","note":"입자가 전기력에 의해 정지에서 가속되고 다른 힘·상대론 효과를 무시. |ΔV|를 V로 넣으면 v는 m/s."},{"t":"m","tex":"v_e\\simeq5.93\\times10^5\\sqrt{|\\Delta V|}\\quad\\mathrm{m/s}","note":"전자 비상대론 근사. 원자료의 반올림값 5.9×10⁵와 같은 의미다."},{"t":"m","tex":"\\frac{dx}{E_x}=\\frac{dy}{E_y}=\\frac{dz}{E_z}","note":"전기력선의 미분방정식. 0인 성분에서 분모로 나누는 대신 그 좌표가 일정한지 따로 판단한다."},{"t":"m","tex":"\\frac{r_1}{r_2}=\\sqrt{\\frac{|Q_1|}{|Q_2|}}","note":"전계가 서로 반대 방향인 선상에서 E1=E2일 때. 위치 영역은 부호에 따라 결정."},{"t":"m","tex":"V_P\\simeq\\frac{V_E+V_W+V_N+V_S}{4}","note":"2차원 전하 없는 균일 매질, 동일 격자간격에서의 라플라스 유한차분 근사."},{"t":"ex","q":"E=(2x,2y,0)인 영역에서 점 (2,1,0)을 지나는 전기력선은?","steps":["dx/(2x)=dy/(2y)를 적분하면 ln|x|−ln|y|가 일정하다.","따라서 y=kx. 주어진 점을 넣으면 k=1/2."],"a":"y=x/2, z=0인 선의 해당 방향."},{"t":"chk","q":"+Q와 +9Q를 1 m 간격으로 놓으면 두 전하 사이 E=0 점은 +Q에서 얼마나 떨어지는가?","a":"x/(1−x)=√(1/9)=1/3이므로 x=0.25 m다. 전위는 두 양전하의 합이므로 그곳에서 0이 아니다."}]},{"id":"E24","title":"분포 전하의 전계와 전위: 구·원통·평면의 안과 밖","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"총전하는 선·면·체적 전하밀도를 해당 길이·면적·체적으로 적분한 값이다.","core":1},{"s":"균일한 경우 Q=λℓ, Q=ρsA, Q=ρvV다.","core":0},{"s":"가우스면에 들어가는 전하량은 전체 전하량과 다를 수 있다.","core":0},{"s":"도체 내부에는 평형상태에서 자유 체적전하가 없지만, 절연 구·원통의 체적에 균일한 전하를 분포시킨 모델은 내부에서도 전계가 존재한다.","core":0}]},{"t":"p","ss":[{"s":"반지름 a의 고립 도체구는 내부 전계 0, 내부 전위는 표면값과 같은 일정값이다.","core":0},{"s":"균일 체적전하 구는 내부 E가 r에 비례하여 중심에서 0이고 표면까지 증가한다.","core":0},{"s":"외부는 두 모델 모두 총전하 Q를 중심에 놓은 점전하와 같다.","core":0},{"s":"이 두 내부 해를 서로 바꾸어 암기하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"무한히 긴 선전하와 원통 대칭 전하는 E가 외부에서 1/r로 감소한다.","core":0},{"s":"균일 체적전하 원통은 내부에서 r에 비례한다.","core":0},{"s":"무한 선이나 무한 평면의 전위는 무한대를 0으로 잡는 적분이 수렴하지 않는다.","core":0},{"s":"전위가 물리적으로 항상 무한이라는 뜻이 아니라 유한한 기준점 사이 전위차를 사용해야 한다는 뜻이다.","core":0}]},{"t":"p","ss":[{"s":"전하를 띤 비도체 무한 평면은 양쪽으로 전계가 퍼져 각 면에서 |ρs|/(2ε)이다.","core":0},{"s":"평행한 두 면에 ±ρs가 놓이면 내부는 |ρs|/ε, 외부는 상쇄된다.","core":0},{"s":"정전평형 도체 표면 바로 밖의 |ρs|/ε와 비도체 한 장의 1/2를 구별한다.","core":0},{"s":"가우스 법칙의 전속은 D를 적분하면 Q, E를 적분하면 균일 ε에서 Q/ε다.","core":0}]},{"t":"fig","src":"figures/electromag/e-charged-planes.svg","title":"도체 표면·한 장·두 장의 전계","caption":"동일한 σ라도 기하와 경계조건에 따라 전계가 σ/ε 또는 σ/(2ε)가 된다.","alt":"동일한 σ라도 기하와 경계조건에 따라 전계가 σ/ε 또는 σ/(2ε)가 된다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-cylinder-coax.svg","title":"원통 전하와 동축 케이블","caption":"균일 전하 원통의 내부·외부와 동축 유전체 영역의 반지름 정의를 분리한다.","alt":"균일 전하 원통의 내부·외부와 동축 유전체 영역의 반지름 정의를 분리한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-sphere-fields.svg","title":"도체 구와 균일 전하 구의 전계 그래프","caption":"표면전하 구와 체적전하 구의 내부 전계 및 외부 역제곱 감소를 비교한다.","alt":"표면전하 구와 체적전하 구의 내부 전계 및 외부 역제곱 감소를 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-concentric-spheres.svg","title":"동심구의 세 반지름과 전하 분포","caption":"원자료 동심구 단면의 내부 도체·유전체·외부 도체 영역을 독립 구성한다.","alt":"원자료 동심구 단면의 내부 도체·유전체·외부 도체 영역을 독립 구성한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-layered-coax.svg","title":"두 유전체를 가진 동축 콘덴서","caption":"내부 반지름 a, 매질 경계 b, 외부 전극 반지름 c와 반경 방향 직렬 관계를 그린다.","alt":"내부 반지름 a, 매질 경계 b, 외부 전극 반지름 c와 반경 방향 직렬 관계를 그린다.","width":960.0,"height":620.0},{"t":"m","tex":"E_{\\mathrm{sphere,in}}=\\frac{Qr}{4\\pi\\varepsilon a^3},\\quad V_{\\mathrm{sphere,in}}=\\frac{Q}{8\\pi\\varepsilon a}\\left(3-\\frac{r^2}{a^2}\\right)","note":"반지름 a, 총전하 Q의 균일 체적전하 절연 구, 0≤r≤a. 무한대 전위 0. E 방향은 Q 부호에 따른 방사방향."},{"t":"m","tex":"E_{\\mathrm{sphere,out}}=\\frac{Q}{4\\pi\\varepsilon r^2},\\quad V_{\\mathrm{sphere,out}}=\\frac{Q}{4\\pi\\varepsilon r}","note":"r≥a. 전계 식은 부호를 포함한 방사성분이다."},{"t":"m","tex":"E_{\\mathrm{conductor,in}}=0,\\quad V_{\\mathrm{conductor,in}}=\\frac{Q}{4\\pi\\varepsilon a}","note":"고립 도체구 r<a. 도체 내부 전위가 0이라는 뜻이 아니다."},{"t":"m","tex":"E_{\\mathrm{cylinder,in}}=\\frac{\\lambda r}{2\\pi\\varepsilon a^2},\\quad E_{\\mathrm{cylinder,out}}=\\frac{\\lambda}{2\\pi\\varepsilon r}","note":"반지름 a의 무한 원통에 균일 체적전하. λ는 전체 단위길이 전하 C/m. 도체 원통 내부에는 첫 식을 적용하지 않는다."},{"t":"m","tex":"V(a)-V(b)=\\frac{\\lambda}{2\\pi\\varepsilon}\\ln\\frac{b}{a}","note":"a<b인 무한 선전하 외부 두 반지름 또는 동축 케이블 전극 사이의 전위차."},{"t":"m","tex":"E_{\\mathrm{sheet}}=\\frac{|\\rho_s|}{2\\varepsilon},\\quad E_{\\mathrm{plates}}=\\frac{|\\rho_s|}{\\varepsilon}","note":"첫 식은 무한 비도체 전하평면 한 장, 둘째는 크기가 같고 부호가 반대인 두 평행 전하평면 사이."},{"t":"m","tex":"V_a=\\frac{Q}{4\\pi\\varepsilon}\\left(\\frac{1}{a}-\\frac{1}{b}+\\frac{1}{c}\\right)","note":"내구 a에 Q, 외도체 구껍질 내반지름 b·외반지름 c에 순전하 0, 무한대 0 V. 외도체 내부 표면 −Q·외표면 +Q가 유도된다. Vb=Vc=Q/(4πεc)."},{"t":"ex","q":"총전하 8 nC, 반지름 2 m의 균일 절연 구가 진공에 있다. r=1 m에서 E와 V는?","steps":["E=(9×10⁹)(8×10⁻⁹)×1/2³=9 V/m.","V=(9×10⁹)(8×10⁻⁹)/(2×2)×(3−1/4)=49.5 V."],"a":"E=9 V/m, V=49.5 V."},{"t":"chk","q":"반지름 a의 균일 체적전하 구에서 중심 전위는 표면 전위의 몇 배인가?","a":"3/2배다. 중심 E=0이어도 중심 전위는 0이 아니다. 도체구라면 중심과 표면 전위가 같다."}]},{"id":"E25","title":"도체계 계수·에너지와 전기쌍극자의 성분","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"X16은 전위계수·용량계수의 부호와 쌍극자 거리법칙을 다룬다.","core":1},{"s":"여기서는 여러 도체의 계산식을 연결한다.","core":0},{"s":"전위를 전하의 함수로 쓰면 p계  있을 때 관이 시작·끝날 수 있으며 +1 C에서 나오는 단위 관 수를 1개로 센다.","core":0},{"s":"전기력선의 관습적 개수 Q/ε와 전속 Q를 혼동하지 않는다.","core":0}]},{"t":"fig","src":"figures/electromag/e-flux-polarization.svg","title":"가우스 면과 유전체 분극","caption":"전속의 자유전하 원천과 유전체 내부 쌍극자·표면 결합전하를 비교한다.","alt":"전속의 자유전하 원천과 유전체 내부 쌍극자·표면 결합전하를 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-dielectric-sphere-stress.svg","title":"유전체 구·구형 공동과 경계 응력","caption":"유전체 구와 공기 공동을 혼동하지 않도록 매질을 바꿔 표시하고 내부장을 나타낸다.","alt":"유전체 구와 공기 공동을 혼동하지 않도록 매질을 바꿔 표시하고 내부장을 나타낸다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-special-polarization.svg","title":"접촉·압전·초전 효과","caption":"분극을 일으키는 서로 다른 자극과 나타나는 전하를 개념적으로 비교한다.","alt":"분극을 일으키는 서로 다른 자극과 나타나는 전하를 개념적으로 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-current-phasor.svg","title":"전도·변위전류의 페이저","caption":"손실각과 두 전류 성분의 위상 관계를 새 도식으로 보충한다.","alt":"손실각과 두 전류 성분의 위상 관계를 새 도식으로 보충한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\mathbf{P}=\\frac{\\sum\\mathbf{p}}{\\Delta v},\\quad\\rho_b=-\\nabla\\cdot\\mathbf{P},\\quad\\rho_{s,b}=\\mathbf{P}\\cdot\\hat{\\mathbf{n}}","note":"P: C/m², 결합 체적전하 ρb: C/m³, 결합 표면전하 ρs,b: C/m². n은 유전체 바깥 법선."},{"t":"m","tex":"\\varepsilon^*=\\varepsilon'-j\\varepsilon'',\\quad\\tan\\delta_d=\\frac{\\varepsilon''}{\\varepsilon'}","note":"e^{jωt} 시간 관례, ε″≥0인 수동 손실 유전체. δd는 유전 손실각이며 표피깊이 δ와 다르다."},{"t":"m","tex":"E_{\\mathrm{sphere}}=\\frac{3\\varepsilon_{\\mathrm{out}}}{\\varepsilon_{\\mathrm{in}}+2\\varepsilon_{\\mathrm{out}}}E_0","note":"균일 외부장, 선형 등방성 구와 무한 외부매질, 구 표면 자유전하 없음. 내부장은 균일하다."},{"t":"m","tex":"E_{\\mathrm{cavity}}=\\frac{3\\varepsilon_r}{1+2\\varepsilon_r}E_0,\\qquad E_{\\mathrm{dielectric}}=\\frac{3}{\\varepsilon_r+2}E_0","note":"첫 식: εr 매질 속 진공 구형 공동. 둘째: 진공 속 εr 유전체 구. 두 E0는 각각 구가 없을 때 외부매질의 장."},{"t":"ex","q":"E0=120 V/m인 비유전율 2 유전체 속 작은 구형 공기 공동의 내부장은?","steps":["공동 내부는 ε0, 외부는 2ε0.","E=3×2/(1+4)×120."],"a":"144 V/m."},{"t":"chk","q":"진공 속 비유전율 4의 유전체 구 내부장은 원래 균일 외부장의 몇 배인가?","a":"3/(4+2)=1/2배다. 평행판 전체를 유전체로 채운 고정 전하 조건의 1/4배와 다르다."}]},{"id":"E28","title":"복합 유전체 콘덴서와 경계면 힘","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"전극 사이를 전계 진행방향으로 여러 층이 채우면 각 층을 순서대로 통과하므로 직렬이다.","core":1},{"s":"층 사이에 자유전하가 없으면 법선 D가 같고, 유전율이 작은 층에 더 큰 E가 걸린다.","core":0},{"s":"층별 전압 Ei di를 더해 전체 전압을 얻는다.","core":0},{"s":"두 재료가 극판 면적을 나누어 나란히 채우면 같은 전압을 받으므로 병렬이다.","core":0}]},{"t":"p","ss":[{"s":"동축 케이블에 반경 방향으로 유전체를 나누어 넣으면 D=λ/(2πr)는 같고 각 반경 구간에서 E=D/ε를 적분한다.","core":0},{"s":"평행판의 d/ε 대신 동축에서는 ln(반경비)/ε가 쌓인다.","core":0},{"s":"전계가 가장 큰 위치는 보통 작은 반지름 쪽이지만 ε가 바뀌는 경계 양쪽도 비교해야 한다.","core":0}]},{"t":"p","ss":[{"s":"유전체 경계의 맥스웰 응력은 E와 D의 연속 성분을 먼저 골라 계산한다.","core":0},{"s":"전계가 경계에 수직인 경우는 공통 D를, 경계에 평행한 경우는 공통 E를 쓰면 된다.","core":0},{"s":"아래 압력 차는 선형 매질, 평탄한 경계, 자유 표면전하 없음의 이상화다.","core":0},{"s":"실제 액체 압력·전기왜곡 등의 기계적 조건까지 자동으로 포함하는 식은 아니다.","core":0}]},{"t":"p","ss":[{"s":"높은 유전율 재료를 전극 사이로 끌어넣는 힘이 생기는 상황은 용량이 커지는 방향으로 설명할 수 있다.","core":0},{"s":"그러나 아무 경계에서 힘 방향을 재료의 유전율 숫자 하나로 정하지 않는다.","core":0},{"s":"경계 법선·전계 방향과 어느 매질에 대한 응력 차인지 함께 표시한다.","core":0}]},{"t":"fig","src":"figures/electromag/e-dielectric-boundary.svg","title":"유전체 경계의 접선·법선 성분","caption":"자유 표면전하가 없을 때 Et 연속, Dn 연속이고 각도는 법선 기준임을 보여 준다.","alt":"자유 표면전하가 없을 때 Et 연속, Dn 연속이고 각도는 법선 기준임을 보여 준다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-dielectric-layers.svg","title":"복합 유전체의 직렬·병렬 분해","caption":"전계 방향과 경계면 방향을 먼저 보고 전압과 전속 조건으로 회로 대응을 정한다.","alt":"전계 방향과 경계면 방향을 먼저 보고 전압과 전속 조건으로 회로 대응을 정한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-dielectric-sphere-stress.svg","title":"유전체 구·구형 공동과 경계 응력","caption":"유전체 구와 공기 공동을 혼동하지 않도록 매질을 바꿔 표시하고 내부장을 나타낸다.","alt":"유전체 구와 공기 공동을 혼동하지 않도록 매질을 바꿔 표시하고 내부장을 나타낸다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-dielectric-stress.svg","title":"복합 유전체의 경계 응력","caption":"원자료의 법선·접선 두 기하에서 동일한 D 또는 E와 힘 방향을 비교한다.","alt":"원자료의 법선·접선 두 기하에서 동일한 D 또는 E와 힘 방향을 비교한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-layered-coax.svg","title":"두 유전체를 가진 동축 콘덴서","caption":"내부 반지름 a, 매질 경계 b, 외부 전극 반지름 c와 반경 방향 직렬 관계를 그린다.","alt":"내부 반지름 a, 매질 경계 b, 외부 전극 반지름 c와 반경 방향 직렬 관계를 그린다.","width":960.0,"height":620.0},{"t":"m","tex":"C_{\\mathrm{series\\ layers}}=\\frac{A}{d_1/\\varepsilon_1+d_2/\\varepsilon_2}","note":"면적 A가 공통, 두께 d1+d2가 전극간격. 전계가 층 경계에 수직."},{"t":"m","tex":"E_1=\\frac{D}{\\varepsilon_1},\\quad E_2=\\frac{D}{\\varepsilon_2},\\quad\\frac{V_1}{V_2}=\\frac{d_1/\\varepsilon_1}{d_2/\\varepsilon_2}","note":"직렬층에서 층 사이 자유전하 없음. D=Q/A."},{"t":"m","tex":"C_{\\mathrm{parallel\\ regions}}=\\frac{\\varepsilon_1 A_1+\\varepsilon_2 A_2}{d}","note":"간격 d가 공통, 면적 A1+A2가 전체면적. 전계가 재료 경계와 평행."},{"t":"m","tex":"C'_{\\mathrm{layered\\ coax}}=\\frac{2\\pi}{\\ln(b/a)/\\varepsilon_1+\\ln(c/b)/\\varepsilon_2}","note":"내전극 반지름 a, 유전체 경계 b, 외전극 내반지름 c. a<b<c, F/m."},{"t":"m","tex":"\\Delta T_{nn}=\\frac{D^2}{2}\\left(\\frac{1}{\\varepsilon_1}-\\frac{1}{\\varepsilon_2}\\right)","note":"경계에 수직인 E. 두 매질의 전기적 법선응력 Tnn,1−Tnn,2. ΔTnn 단위 N/m², 전체 힘은 면적을 곱한다."},{"t":"m","tex":"\\Delta T_{nn}=\\frac{E^2}{2}(\\varepsilon_2-\\varepsilon_1)","note":"경계에 평행인 E. 동일하게 Tnn,1−Tnn,2. 응력의 일반식 Tnn=ε(En²−Et²)/2에서 얻는다."},{"t":"ex","q":"면적을 절반씩 나누어 비유전율 2와 4의 유전체가 같은 간격 d를 채운다. 진공일 때 C0와 비교하면?","steps":["병렬 영역이므로 C=(2ε0A/2+4ε0A/2)/d.","C=3ε0A/d=3C0."],"a":"3배. 직렬층의 8/3배와 구별한다."},{"t":"chk","q":"같은 두께 d/2의 ε1=2ε0, ε2=4ε0 층이 직렬로 전극 사이를 채운다. 유효 유전율은?","a":"ε효=d/[(d/2)/(2ε0)+(d/2)/(4ε0)]=8ε0/3이다. 단순 산술평균 3ε0가 아니다."}]},{"id":"E29","title":"영상법의 전계·유도 표면전하와 이동 일","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"X15의 영상전하 위치·크기는 실제 도체를 없애고 외부 전계를 같은 값으로 만드는 계산 장치다.","core":1},{"s":"실제 도체에는 유도 표면전하가 분포하며, 도체 물질 내부에 가상 영상전하가 박혀 있다는 뜻이 아니다.","core":0},{"s":"접지 무한 평면과 점전하 문제에서는 표면 전위가 0이 되도록 반대 부호의 영상을 둔다.","core":0}]},{"t":"p","ss":[{"s":"점전하 Q가 높이 d에 있고 평면상의 관측점이 수직 발 아래에서 수평거리 s에 있으면 접선 E는 상쇄되고 법선 E는 더해진다.","core":0},{"s":"표면전하밀도는 평면 바로 밖 법선 D와 같으며 Q>0이면 음의 전하가 유도된다.","core":0},{"s":"바로 아래 s=0에서 절댓값이 가장 크다.","core":0}]},{"t":"p","ss":[{"s":"실제 전하를 천천히 이동하면 영상의 위치와 크기도 함께 바뀐다.","core":0},{"s":"그러므로 실전하와 고정된 영상 두 개의 상호 에너지를 그대로 대입하면 2배가 된다.","core":0},{"s":"접지평면과 전하로 이루어진 계의 전기 위치에너지는 Q가 영상 전위에서 가지는 QV영상의 절반이다.","core":0},{"s":"무한대에서 d까지 접근하는 동안 전기장이 하는 일은 양수, 외력이 준 일은 음수다.","core":0}]},{"t":"p","ss":[{"s":"선전하와 접지평면에서도 대칭 영상을 쓴다.","core":0},{"s":"표면 전체에서 장이 일정한 것이 아니며 전선 바로 아래의 값과 다른 수평 위치의 값을 구별한다.","core":0},{"s":"실제 반지름 a인 전선의 전위·용량에는 h≫a인 가는 전선 근사가 필요하다.","core":0}]},{"t":"fig","src":"figures/electromag/e-image-plane.svg","title":"접지 평면과 점전하 영상","caption":"거리 d의 양전하를 대칭 위치의 가상 음전하로 치환하여 외부장과 인력을 구한다.","alt":"거리 d의 양전하를 대칭 위치의 가상 음전하로 치환하여 외부장과 인력을 구한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-image-sphere.svg","title":"접지 구의 영상 위치와 크기","caption":"실제 전하의 중심 거리 d, 구 반지름 a, 영상 위치 b를 서로 구분한다.","alt":"실제 전하의 중심 거리 d, 구 반지름 a, 영상 위치 b를 서로 구분한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-image-line.svg","title":"접지 평면 위 선전하","caption":"도선의 단면과 영상의 대칭 위치, 중심 높이를 표시한다.","alt":"도선의 단면과 영상의 대칭 위치, 중심 높이를 표시한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-conductor-shielding.svg","title":"도체 공동·유도전하와 차폐","caption":"금속 내부와 공동을 구분하고 공동 안 전하의 유무에 따른 차이를 보충한다.","alt":"금속 내부와 공동을 구분하고 공동 안 전하의 유무에 따른 차이를 보충한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\rho_s(s)=-\\frac{Qd}{2\\pi(d^2+s^2)^{3/2}}","note":"Q가 높이 d>0인 접지 무한 도체평면. s는 평면상 수직 발점으로부터 거리. C/m²."},{"t":"m","tex":"|E_n(s)|=\\frac{|Q|d}{2\\pi\\varepsilon(d^2+s^2)^{3/2}},\\quad |D_n(0)|=\\frac{|Q|}{2\\pi d^2}","note":"평면 바깥 장의 크기. Q>0이면 E는 평면 안쪽으로 향한다."},{"t":"m","tex":"U(d)=-\\frac{Q^2}{16\\pi\\varepsilon d},\\quad W_{\\mathrm{field},\\infty\\to d}=\\frac{Q^2}{16\\pi\\varepsilon d}","note":"접지평면과 점전하의 에너지, 무한대 기준. 천천히 옮기는 외력의 일은 U(d)−U(∞)."},{"t":"m","tex":"F_{\\mathrm{sphere}}=\\frac{a d Q^2}{4\\pi\\varepsilon(d^2-a^2)^2}","note":"반지름 a 접지구 중심에서 거리 d>a인 점전하의 흡인력 크기. 영상 크기 a|Q|/d, 두 전하 거리 d−a²/d를 사용."},{"t": =\\int_0^B H(B')\\,dB',\\qquad F_{\\mathrm{gap}}\\simeq\\frac{B^2A}{2\\mu_0}","note":"첫 식은 가역 단일값 관계의 자화 에너지밀도, 선형이면 B²/(2μ). 둘째는 공기/진공 균일 수직 공극, 누설·프린징 무시."},{"t":"m","tex":"NI=\\frac{B}{\\mu_0}\\left(\\frac{\\ell_i}{\\mu_r}+\\ell_g\\right)","note":"같은 단면의 철심 길이 ℓi·공극 길이 ℓg, 선형 철심, 누설 무시. E12의 자기저항 합산을 B로 쓴 식."},{"t":"trap","items":["자기장 에너지밀도가 모든 기계적 경계에서 그대로 압력이라는 일반화는 피한다.","공극 증가로 전류가 증가하는 배수는 철심 길이·투자율과 고정할 B 조건을 함께 정한다."]},{"t":"ex","q":"면적 10 cm² 공극에 B=0.2 T가 수직으로 걸린다. 이상 흡인력은?","steps":["면적은 10⁻³ m².","F=0.2²×10⁻³/(2×4π×10⁻⁷)."],"a":"약 15.9 N."},{"t":"chk","q":"선형 구형 자성체의 μr=4, 외부장 H0=300 A/m다. 내부 H는?","a":"300/[1+(4−1)/3]=150 A/m다. 감자계를 무시하여 300 A/m로 두지 않는다."}]},{"id":"E37","title":"자기인덕턴스: 쇄교수·자기저항·도체 형상","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"자기인덕턴스는 전류와 그 전류 자신이 만든 자속쇄교수의 비다.","core":1},{"s":"한 회의 자속 Φ와 전체 쇄교수 Ψ=NΦ를 구분한다.","core":0},{"s":"동일 선형 자기회로라면 Φ=NI/Rm이므로 L=N²/Rm이고, 단면 A·길이 ℓ가 균일하면 μAN²/ℓ가 된다.","core":0},{"s":"자로 형상과 투자율이 같을 때 권수 2배는 L 4배다.","core":0}]},{"t":"p","ss":[{"s":"원통 도선의 내부 인덕턴스는 도선 자체 내부의 장에 저장된 에너지다.","core":0},{"s":"내부의 모든 자속이 전체 전류와 똑같이 쇄교하는 것은 아니므로 포함 전류 비를 반영하거나 에너지법으로 계산한다.","core":0},{"s":"균일 직류 분포일 때 L′내부=μ/(8π) H/m이고 표피효과가 강하면 내부 자계에 저장되는 에너지가 줄어든다.","core":0}]},{"t":"p","ss":[{"s":"동축 케이블의 외부 인덕턴스라는 말은 케이블 전체 바깥이 아니라 내부 도체 바깥과 외부 도체 안쪽 사이 자속을 뜻한다.","core":0},{"s":"귀환 전류가 동축 외부도체로 완전히 돌아오면 케이블 전체 바깥 자계는 이상적으로 0이다.","core":0},{"s":"실제 외부도체 두께의 내부 인덕턴스는 별도 조건이 없으면 무시한다.","core":0}]},{"t":"p","ss":[{"s":"원자료의 원형 코일 L≈πμaN²/2는 중심 B를 원판 전체에 균일하다고 가정해 Φ≈B중심πa²로 계산한 근사다.","core":0},{"s":"실제 얇은 원형 도선의 정확한 L은 도선 굵기와 권선 배치에도 의존하므로 이 식을 보편적인 정확식으로 외우지 않는다.","core":0},{"s":"해당 근사를 요구하는 문맥에서만 사용하고, 중심 자계의 정확한 공식과 인덕턴스 근사를 구별한다.","core":0}]},{"t":"fig","src":"figures/electromag/e-solenoid-toroid.svg","title":"직선·환상 솔레노이드","caption":"권수 N, 자로 길이 ℓ, 토로이드 반지름 r의 의미를 표시한다.","alt":"권수 N, 자로 길이 ℓ, 토로이드 반지름 r의 의미를 표시한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-magnetic-circuit-gap.svg","title":"철심·공극과 자기저항 회로","caption":"철심과 공극의 형상을 등가 자기회로에 대응시키며 권수·공극 길이·자속을 표시한다.","alt":"철심과 공극의 형상을 등가 자기회로에 대응시키며 권수·공극 길이·자속을 표시한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-inductance-geometry.svg","title":"코일·동축·평행선의 자속 공간","caption":"인덕턴스 계산에서 포함하는 자기장 영역과 권수, 단위길이 조건을 나타낸다.","alt":"인덕턴스 계산에서 포함하는 자기장 영역과 권수, 단위길이 조건을 나타낸다.","width":960.0,"height":620.0},{"t":"m","tex":"L=\\frac{\\Psi}{I}=\\frac{N\\Phi}{I}=\\frac{N^2}{\\mathcal{R}_m}=\\frac{\\mu AN^2}{\\ell}","note":"선형 동일 자속 쇄교 회로. L: H=Wb/A. 비선형에서는 Ψ/I와 dΨ/dI가 서로 다를 수 있다."},{"t":"m","tex":"L_{\\mathrm{solenoid}}\\simeq\\mu n^2A\\ell,\\quad L'_{\\mathrm{solenoid}}\\simeq\\mu n^2A","note":"충분히 긴 솔레노이드, n=N/ℓ는 회/m. 첫 식 H, 두 번째 H/m."},{"t":"m","tex":"L_{\\mathrm{toroid}}\\simeq\\frac{\\mu AN^2}{2\\pi r_m}","note":"단면이 얇아 평균 자로 반지름 rm으로 근사한 환상 코일. 유한 두께는 H가 r에 따라 달라짐을 적분한다."},{"t":"m","tex":"L'_{\\mathrm{wire,int}}=\\frac{\\mu}{8\\pi},\\quad L'_{\\mathrm{coax,ext}}=\\frac{\\mu_d}{2\\pi}\\ln\\frac{b}{a}","note":"첫 식: 반지름 a 원통 도선 내부·균일 전류. 둘째: a<r<b 유전체층의 자속, μd는 그 층 투자율."},{"t":"m","tex":"L'_{\\mathrm{two\\ wires}}\\simeq\\frac{\\mu_d}{\\pi}\\ln\\frac{d}{a}+\\frac{\\mu_w}{4\\pi}","note":"같은 반지름 a, 중심거리 d≫a, 왕복 두 도선의 전체 루프 인덕턴스 H/m. μw는 도선, μd는 주변 매질. 두 도선 내부항을 합한 값이다."},{"t":"m","tex":"L_{\\mathrm{circular,approx}}\\simeq\\frac{\\pi\\mu aN^2}{2}","note":"원자료의 중심장-균일자속 근사. 실제 원형 도선 정확식이 아니며 도선 반지름·권선 분포 효과를 생략한다."},{"t":"m","tex":"L=\\frac{2W_m}{I^2}=\\frac{1}{I^2}\\int\\mathbf{B}\\cdot\\mathbf{H}\\,dv","note":"선형 자기장 에너지 Wm=LI²/2. 적분영역에 해당 회로의 모든 저장장을 포함한다."},{"t":"m","tex":"L=\\frac{1}{I^2}\\int\\mathbf{A}\\cdot\\mathbf{J}\\,dv","note":"선형 정자계·국소 전류분포에서 에너지법으로 얻는 자기인덕턴스 H. 경계항이 사라지는 전체 영역 조건. E39의 벡터퍼텐셜 A와 전류밀도 J."},{"t":"ex","q":"투자율·단면·길이가 같은 철심의 권수를 50에서 150으로 늘린다. L이 원래 2 mH이면?","steps":["권수 비가 3이고 L은 N²에 비례한다.","2×3²=18 mH."],"a":"18 mH. 포화로 μ가 달라지면 단순 비례가 깨질 수 있다."},{"t":"chk","q":"N=100, 자기저항 Rm=2×10⁶ A/Wb인 선형 자기회로의 L은?","a":"100²/(2×10⁶)=0.005 H=5 mH다."}]},{"id":"E38","title":"상호유도·결합 에너지와 병렬 가동·차동","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"C07의 자기·상호유도 전압과 직렬 가동·차동을 이어서, 자속 정의에서 M을 구한다.","core":1},{"s":"코일 1 전류가 코일 2와 쇄교시키는 자속을 Φ21이라고 정의하면 M21=N2Φ21/I1이다.","core":0},{"s":"선형 상호성이 있는 매질에서는 M12=M21이다.","core":0},{"s":"누설자속이 없고 같은 자기저항을 공유하면 M=N1N2/Rm이다.","core":0}]},{"t":"p","ss":[{"s":"결합계수 k는 일반적으로 양방향 자속 쇄교 비의 기하평균이다.","core":0},{"s":"원자료 부록의 k=0.9이면 누설자속 10%라는 문장은 두 코일의 결합 자속 비가 같은 특수모형에서만 맞는다.","core":0},{"s":"보통은 k²가 두 방향 결합률의 곱이며 한 코일의 누설률을 k만으로 유일하게 정할 수 없다.","core":0}]},{"t":"p","ss":[{"s":"전체 자기 에너지는 두 자기항과 하나의 상호항으로 이루어진다.","core":0},{"s":"두 전류가 점 표시로 모두 들어가는 기준이면 상호항은 +Mi1i2, 한 쪽 기준을 반대로 잡으면 음수다.","core":0},{"s":"수동 코일의 저장에너지가 음수가 될 수 없다는 조건이 M²≤L1L2를 준다.","core":0}]},{"t":"p","ss":[{"s":"병렬 접속은 두 코일의 단자전압이 같다는 조건으로 구한다.","core":0},{"s":"점끼리 같은 전압 극성을 갖도록 병렬 연결한 가동은 분모 L1+L2−2M, 반대 극성으로 연결한 차동은 L1+L2+2M이다.","core":0},{"s":"완전 결합된 동일 코일 등 분모와 분자가 함께 0인 퇴화조건에서는 0/0식을 그대로 넣지 말고 원래 전압·전류식과 접속 가능조건으로 돌아간다.","core":0}]},{"t":"fig","src":"figures/circuit/c-coupling-flux.svg","title":"공통 자속·누설·결합계수","caption":"철심을 따라 두 코일이 공유하는 자속과 1차 권선만 쇄교하는 누설 성분을 분리한 개념도다. 결합계수는 공통 쇄교 정도를 나타내며 점 표시와 회로의 전류 방향을 함께 해석한다.","alt":"철심을 따라 두 코일이 공유하는 자속과 1차 권선만 쇄교하는 누설 성분을 분리한 개념도다. 결합계수는 공통 쇄교 정도를 나타내며 점 표시와 회로의 전류 방향을 함께 해석한다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/electromag/e-mutual-dot.svg","title":"공유 자속·결합계수·점 표기","caption":"두 권선의 공통 자속과 점에 대한 전류 기준 방향을 동시에 나타낸다.","alt":"두 권선의 공통 자속과 점에 대한 전류 기준 방향을 동시에 나타낸다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-coupled-connections.svg","title":"가동·차동 코일 연결","caption":"직렬 전류 방향과 병렬 점 접속이 등가 인덕턴스의 상호 항 부호를 결정함을 보여 준다.","alt":"직렬 전류 방향과 병렬 점 접속이 등가 인덕턴스의 상호 항 부호를 결정함을 보여 준다.","width":960.0,"height":620.0},{"t":"m","tex":"M_{21}=\\frac{N_2\\Phi_{21}}{I_1},\\quad M_{12}=\\frac{N_1\\Phi_{12}}{I_2},\\quad M=\\frac{N_1N_2}{\\mathcal{R}_m}","note":"M: H. 마지막 식은 두 코일이 같은 자속을 완전히 공유하는 선형 자기회로."},{"t":"m","tex":"k=\\sqrt{\\frac{\\Phi_{21}}{\\Phi_1}\\frac{\\Phi_{12}}{\\Phi_2}}=\\frac{|M|}{\\sqrt{L_1L_2}}","note":"Φ1·Φ2는 각각의 전류로 생기는 자기 자속. 비음수 결합률 정의. 0≤k≤1."},{"t":"m","tex":"W_m=\\frac{1}{2}L_1i_1^2+\\frac{1}{2}L_2i_2^2\\pm M i_1i_2","note":"두 전류 기준·점 표시로 상호항 부호를 정한다. M은 결합 크기 H."},{"t":"m","tex":"L_{\\mathrm{parallel,aiding}}=\\frac{L_1L_2-M^2}{L_1+L_2-2M}","note":"같은 전압 극성이 두 점 단자에 걸리는 병렬 가동. 비퇴화 선형 이상 코일."},{"t":"m","tex":"L_{\\mathrm{parallel,opposing}}=\\frac{L_1L_2-M^2}{L_1+L_2+2M}","note":"한 점 단자와 다른 코일의 비점 단자가 같은 노드인 병렬 차동. 비퇴화 선형 이상 코일."},{"t":"ex","q":"L1=2 H, L2=8 H, M=2 H, i1=i2=1 A이고 두 전류가 점으로 들어간다. 에너지는?","steps":["자기항은 0.5×2+0.5×8=5 J.","상호항은 +2×1×1=2 J."],"a":"7 J. 한 코일의 실제 전류 방향만 반대로 하고 크기는 1 A를 유지하면 상호항은 −2 J로 3 J다. 단순히 좌표 기준만 바꾸는 것은 물리적 에너지를 바꾸지 않는다."},{"t":"chk","q":"L1=L2=10 mH, M=5 mH일 때 병렬 가동과 차동의 L은?","a":"분자는 75 mH². 가동 75/(20−10)=7.5 mH, 차동 75/(20+10)=2.5 mH다."}]},{"id":"E39","title":"벡터퍼텐셜·노이만 공식·시간변화 전위","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"자속밀도 B의 발산이 0이므로 정칙 영역에서 B=curl A인 자기 벡터퍼텐셜 A를 도입할 수 있다.","core":1},{"s":"A의 단위는 Wb/m이며 전기 스칼라전위 V와 다르다.","core":0},{"s":"A에 grad f를 더해도 curl grad f=0이어서 B가 같으므로 A는 유일하지 않다.","core":0},{"s":"이런 자유도를 게이지라고 부른다.","core":0}]},{"t":"p","ss":[{"s":"균일 선형 매질의 정자계에서 div A=0인 쿨롱 게이지를 선택하면 벡터 포아송식 ∇²A=−μJ가 된다.","core":0},{"s":"각 성분은 전기 스칼라 포아송식과 같은 적분 구조를 가진다.","core":0},{"s":"원자료의 전기 V 적분과 자기 A 적분 대응은 이 조건을 포함하여 이해한다.","core":0}]},{"t":"p","ss":[{"s":"한 코일을 쇄교하는 자속은 B의 면적분이며 스토크스 정리에 의해 경계선의 A 선적분과 같다.","core":0},{"s":"다른 코일이 만드는 A를 대입하면 두 전류 경로의 이중 선적분인 노이만 상호인덕턴스 공식이 나온다.","core":0},{"s":"두 미소 경로 사이 내적 때문에 코일 방향을 바꾸면 M의 부호도 바뀐다.","core":0}]},{"t":"p","ss":[{"s":"시간에 따라 B가 변하면 E 전체를 −grad V만으로 쓸 수 없다.","core":0},{"s":"패러데이 법칙에 B=curl A를 넣으면 E=−grad V−∂A/∂t가 된다.","core":0},{"s":"스칼라·벡터퍼텐셜 각각은 게이지에 따라 바뀔 수 있지만 실제 E와 B는 불변이다.","core":0}]},{"t":"m","tex":"\\mathbf{B}=\\nabla\\times\\mathbf{A},\\quad \\nabla\\cdot\\mathbf{A}=0\\ \\Rightarrow\\ \\nabla^2\\mathbf{A}=-\\mu\\mathbf{J}","note":"정자계, 공간적으로 일정한 μ, 쿨롱 게이지. A: Wb/m, J: A/m²."},{"t":"m","tex":"V(\\mathbf{r})=\\frac{1}{4\\pi\\varepsilon}\\int\\frac{\\rho_v(\\mathbf{r}')}{|\\mathbf{r}-\\mathbf{r}'|}\\,dv'","note":"무한대 0 V인 국소 정전하 분포, 균일 ε."},{"t":"m","tex":"\\mathbf{A}(\\mathbf{r})=\\frac{\\mu}{4\\pi}\\int\\frac{\\mathbf{J}(\\mathbf{r}')}{|\\mathbf{r}-\\mathbf{r}'|}\\,dv'","note":"국소 정상전류 분포, 균일 μ. 가는 선전류는 J dv′를 I dl′로 바꾼다."},{"t":"m","tex":"\\Phi=\\int_S\\mathbf{B}\\cdot d\\mathbf{S}=\\oint_{\\partial S}\\mathbf{A}\\cdot d\\mathbf{l}","note":"면 법선과 경계선 방향은 오른손 규칙으로 맞춘다."},{"t":"m","tex":"M=\\frac{\\mu}{4\\pi}\\oint_{C_1}\\oint_{C_2}\\frac{d\\mathbf{l}_1\\cdot d\\mathbf{l}_2}{r_{12}}","note":"가는 두 폐회로 사이, 균일 μ, 준정적 상호인덕턴스 H. 방향 선택으로 부호 결정. 자기회로의 다회 권선이면 각 회 기여를 합한다."},{"t":"m","tex":"\\mathbf{E}=-\\nabla V-\\frac{\\partial\\mathbf{A}}{\\partial t}","note":"시간변화 장의 일반 퍼텐셜 관계. 정전계이면 ∂A/∂t=0인 표현을 선택할 수 있다."},{"t":"ex","q":"시간변화 벡터퍼텐셜이 A=kt x방향이고 V=0이다. E는?","steps":["∂A/∂t=k x방향.","E=−∂A/∂t."],"a":"E=−k x방향. k의 단위는 V/m이다."},{"t":"chk","q":"벡터퍼텐셜 A에 grad f를 더했을 때 B가 변하지 않는 이유는?","a":"B=curl A이고 curl grad f=0이기 때문이다. A 자체의 숫자는 같을 필요가 없다."}]},{"id":"E40","title":"회전 코일·회전 원판과 유도기전력","pr":"B","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"E13의 패러데이 법칙은 자속이 변하는 이유가 장의 시간변화인지 회로 운동인지 구별해 적용한다.","core":1},{"s":"고정 회로는 ∮E·dl=−dΦ/dt, 움직이는 회로는 ∮(E+v×B)·dl=−dΦ/dt로 쓰며 우변의 면도 함께 움직인다.","core":0},{"s":"렌츠 부호는 전류가 원래 변화에 반대하는 장을 만드는 방향을 뜻한다.","core":0}]},{"t":"p","ss":[{"s":"균일 B에서 N회 코일이 일정 각속도로 돌면 Φ=BA cosωt이고 e=NBAω sinωt다.","core":0},{"s":"이때 각은 코일 면의 법선과 B 사이 각이다.","core":0},{"s":"코일이 직사각형이면 A=가로×세로, 원형이면 A=πa²다.","core":0},{"s":"rpm을 rad/s로 바꿀 때 2π/60을 곱한다.","core":0}]},{"t":"p","ss":[{"s":"원판 발전기는 균일 축방향 B 속 도체 원판이 회전할 때 중심과 테두리 사이에 전압이 생긴다.","core":0},{"s":"반지름 r의 속도는 ωr이므로 미소 길이 dr의 기전력 Bωr dr를 0부터 a까지 적분한다.","core":0},{"s":"전체 원판 속도를 테두리 속도 ωa로 잡아 BLv를 곧장 적용하면 2배 오차다.","core":0}]},{"t":"p","ss":[{"s":"기전력과 실제 전류는 다르다.","core":0},{"s":"회로가 닫혀 있고 전체 저항 R이 주어져야 I=e/R로 전류를 구할 수 있다.","core":0},{"s":"유도전류가 흐르면 반대 토크가 발생하여 기계적 일과 전기 에너지의 변환이 성립한다.","core":0},{"s":"발전방향 판정은 E13과 E35의 오른손 규칙을 함께 사용한다."," ote":"닫힌 면의 바깥 법선. Qfree는 면 안 총 자유전하."},{"t":"m","tex":"\\nabla^2\\mathbf{E}=\\mu\\varepsilon\\frac{\\partial^2\\mathbf{E}}{\\partial t^2},\\quad\\nabla^2\\mathbf{H}=\\mu\\varepsilon\\frac{\\partial^2\\mathbf{H}}{\\partial t^2}","note":"전하·전류원 없는 균일·등방성·무손실·비분산 선형 매질. μ와 ε는 공간·시간에 무관한 상수."},{"t":"m","tex":"\\beta=\\frac{2\\pi}{\\lambda}=\\frac{\\omega}{v_p}=\\omega\\sqrt{\\mu\\varepsilon}","note":"β: rad/m, ω: rad/s, vp: m/s. 마지막 등호는 무손실 매질."},{"t":"m","tex":"\\eta=\\sqrt{\\frac{j\\omega\\mu}{\\sigma+j\\omega\\varepsilon}},\\quad\\gamma=\\alpha+j\\beta=\\sqrt{j\\omega\\mu(\\sigma+j\\omega\\varepsilon)}","note":"균일 등방성 단순 손실매질·e^{jωt} 관례. 수동파는 α≥0 가지를 택한다. η: Ω, α: Np/m."},{"t":"m","tex":"\\frac{\\partial u}{\\partial t}+\\nabla\\cdot\\mathbf{S}+\\mathbf{J}_{\\mathrm{free}}\\cdot\\mathbf{E}=0","note":"포인팅 에너지 보존. 선형 비분산 매질에서 u=(E·D+B·H)/2, S=E×H."},{"t":"m","tex":"P=\\int_A\\mathbf{S}\\cdot d\\mathbf{A}","note":"전력 W. 균일 전력밀도가 면에 수직이면 P=SA, 기울면 법선 투영을 한다."},{"t":"ex","q":"진공 100 MHz 평면파의 파장과 위상정수는? c=3×10⁸ m/s.","steps":["λ=c/f=3 m.","β=2π/λ=2π/3."],"a":"파장 3 m, 위상정수 약 2.094 rad/m."},{"t":"chk","q":"비유전율 9, 비투자율 1인 무손실 매질에서 속도와 고유임피던스는 진공의 몇 배인가?","a":"속도 1/3, 고유임피던스 1/3이다. 주파수가 같으면 파장도 1/3이고 위상정수는 3배다."}]}]},{"num":"04","title":"전기기기·전기응용","acc":"#EA580C","day":4,"secs":[{"id":"M01","title":"변압기 권수비: 전압·전류·임피던스의 방향","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"이상적인 2권선 변압기는 전압이 권수에 비례하고 전류가 권수에 반비례한다.","core":1,"star":1},{"s":"1차·2차는 전원이 들어오는 쪽과 부하로 나가는 쪽을 뜻하며, 1차가 반드시 고압측인 것은 아니다.","core":0},{"s":"권수비 a를 1차 권수 나누기 2차 권수로 정의한 뒤 식을 쓰면 승압·강압에 관계없이 일관되게 풀린다.","core":0}]},{"t":"p","ss":[{"s":"변압기는 한쪽 권선의 교류가 만든 시간에 따라 변하는 자속을 다른 권선과 공유하여 전압을 전달한다.","core":0},{"s":"이상적인 경우 입력전력과 출력전력이 같으므로 전압을 낮추면 같은 전력을 전달하는 데 필요한 전류가 커진다.","core":0},{"s":"전압과 전류를 같은 비율로 줄이는 계산은 에너지 보존과 맞지 않는다.","core":0},{"s":"주파수는 변압 전후에 같으며, 직류의 전압을 그대로 바꾸는 장치는 아니다.","core":0}]},{"t":"p","ss":[{"s":"임피던스 환산은 실제 부하가 물리적으로 변했다는 뜻이 아니다.","core":0},{"s":"1차에서 전압을 a배, 전류를 1/a배로 보므로 전압/전류인 임피던스가 a²배 ,"core":0}]},{"t":"fig","src":"figures/supplement/m-transformer-equivalent.svg","title":"변압기의 1차 환산 등가회로","caption":"여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","alt":"변압기의 1차 환산 등가회로. 여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","width":960.0,"height":590.0},{"t":"m","tex":"R_{02}=R_2+\\frac{R_1}{a^2},\\qquad X_{02}=X_2+\\frac{X_1}{a^2}","note":"R02, X02는 2차 환산 등가저항·리액턴스 Ω. R1·X1과 R2·X2는 각각 원래 권선측의 값."},{"t":"m","tex":"V_L=\\frac{V_1}{a}\\frac{R_L}{R_L+R_{02}}","note":"순저항 부하 RL, 여자분과 누설리액턴스를 무시한 근사. VL은 실제 부하단자 실효전압 V."},{"t":"trap","items":["철손저항이 크다는 것은 같은 전압에서 철손이 작다는 뜻이다.","누설리액턴스는 Ω이고 자체가 유효전력을 소비하는 저항은 아니다."]},{"t":"ex","q":"권수비 2인 변압기에 220 V를 인가한다. R1=0.8 Ω, R2=0.3 Ω, 부하 10.5 Ω이며 여자전류·리액턴스는 무시한다. 2차 부하전압은?","steps":["2차 무부하 근사전압은 220/2=110 V다.","2차 환산저항 R02=0.3+0.8/4=0.5 Ω이다.","부하전압은 110×10.5/(10.5+0.5)=105 V다."],"a":"105 V."},{"t":"chk","q":"변압기의 무부하에서도 남는 전류를 모두 부하전류라고 해도 되는가?","a":"아니다. 무부하전류는 자속을 만드는 여자분과 철손을 공급하는 유효분 등을 포함한다."}]},{"id":"M03","title":"손실·효율: 철손은 거의 일정, 동손은 전류의 제곱","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"정격 전압·주파수에서 철손은 대체로 일정하고 동손은 전류의 제곱에 비례한다.","core":1,"star":1},{"s":"변압기의 최대효율은 그 부하에서의 동손과 철손이 같을 때 나타난다.","core":0},{"s":"정격용량 kVA는 피상전력이고 효율의 분자에 들어가는 출력 kW는 피상전력에 부하율과 역률을 곱한 값이다.","core":0}]},{"t":"p","ss":[{"s":"철손은 철심의 자화가 반복되며 생기는 히스테리시스손과 철심 내부 유도전류가 만드는 와류손으로 나뉜다.","core":0},{"s":"낮은 히스테리시스 손실의 재료를 쓰면 전자를 줄이고 얇게 절연한 강판을 겹치면 와류 전류경로를 끊어 후자를 줄인다.","core":0},{"s":"성층철심이 모든 손실을 없앤다는 표현은 틀리다.","core":0},{"s":"일반적인 변압기에는 회전자 마찰손·풍손이 없다.","core":0}]},{"t":"p","ss":[{"s":"부하율을 절반으로 낮추면 출력은 절반, 동손은 1/4이 되지만 철손은 그대로 남는다.","core":0},{"s":"따라서 가벼운 부하에서는 고정손의 비중이 커지고, 지나친 부하에서는 동손이 급증한다.","core":0},{"s":"최대효율 조건을 묻는 문제는 미분보다 현재 동손=고정손이라는 문장으로 푼다.","core":0},{"s":"전일효율은 순간 W가 아니라 하루 출력에너지와 입력에너지의 비다.","core":0}]},{"t":"fig","src":"figures/power/p-instrument-transformers.svg","title":"계기용 변성기의 접속 위치","caption":"계기용 변성기의 1차 접속과 2차 계기를 구별한 개념도다. CT 1차는 부하전류 경로에 놓이고 PT 1차는 측정 전압에 병렬로 연결된다.","alt":"계기용 변성기의 접속 위치 — 계기용 변성기의 1차 접속과 2차 계기를 구별한 개념도다. CT 1차는 부하전류 경로에 놓이고 PT 1차는 측정 전압에 병렬로 연결된다.","width":960.0,"height":550.0},{"t":"fig","src":"figures/supplement/m-transformer-equivalent.svg","title":"변압기의 1차 환산 등가회로","caption":"여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","alt":"변압기의 1차 환산 등가회로. 여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","width":960.0,"height":590.0},{"t":"m","tex":"\\eta=\\frac{xS_n\\cos\\phi}{xS_n\\cos\\phi+P_i+x^2P_{cu,n}}","note":"η는 0~1의 효율, x는 부하율, Sn은 정격 VA, Pi는 철손 W, Pcu,n은 전부하 동손 W. 백분율은 ×100."},{"t":"m","tex":"x_{\\max}=\\sqrt{\\frac{P_i}{P_{cu,n}}}","note":"전압·주파수·역률 일정, 철손 고정·동손 제곱모형에서 최대효율 부하율."},{"t":"m","tex":"P_e\\propto t^2f^2B_m^2","note":"와류손의 근사 비례식. t는 강판 두께 m, f는 Hz, Bm은 최대 자속밀도 T. 다른 조건을 일정하게 비교한다."},{"t":"trap","items":["부하율 50%에서 동손은 50%가 아니라 25%다.","최대효율에서 철손=전부하 동손이라고 쓰지 않는다. 최대효율이 발생한 부하의 동손이다."]},{"t":"ex","q":"철손 100 W, 전부하 동손 400 W인 변압기의 최대효율 부하율은? 그때 전체 손실은?","steps":["x=√(100/400)=0.5다.","현재 동손은 0.5²×400=100 W다.","철손 100 W와 합하면 총손실 200 W다."],"a":"부하율 50%, 총손실 200 W."},{"t":"chk","q":"철심의 강판 두께만 절반으로 하면 단순 와류손 모형에서 손실은 어떻게 되는가?","a":"1/4이 된다. 두께의 제곱에 비례하며 다른 조건은 같아야 한다."}]},{"id":"M04","title":"변압기 전압변동률: 분모와 진상 부호","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"전압변동률은 무부하 전압에서 정격부하 전압을 뺀 값을 정격부하 전압으로 나눈다.","core":1,"star":1},{"s":"같은 1차 전압과 주파수에서 부하를 제거했을 때 2차 전압이 얼마나 달라지는지 비교하는 지표다.","core":0},{"s":"입력과 출력 두 장소의 전압 차를 계산하는 선로 전압강하율과 비교하는 상황부터 다르다.","core":0}]},{"t":"p","ss":[{"s":"순저항 부하에서는 전류가 전압과 동상이라 저항강하가 단자전압 감소에 직접 나타난다.","core":0},{"s":"지상 부하에서는 리액턴스강하도 전압 감소에 보태지고, 진상 부하에서는 그 성분이 반대 작용을 하여 전압이 오를 수 있다.","core":0},{"s":"그러므로 변압기의 전압변동률이 항상 양수라는 주장은 틀리다.","core":0},{"s":"근사식을 사용할 때 역률 cosφ와 sinφ를 바꿔 넣지 않는다.","core":0}]},{"t":"p","ss":[{"s":"%저항강하 p와 %리액턴스강하 q가 주어지면 두 항의 가중합을 계산하면 된다.","core":0},{"s":"지상 영역의 최대값은 두 성분을 묶은 크기이고, 그때의 역률은 p를 그 크기로 나눈 값이다.","core":0},{"s":"정격 역률이 1이라고 해서 최대 전압변동률이 되는 것은 아니다.","core":0},{"s":"복잡한 벡터 유도보다 정의식·부호·최대조건을 먼저 확실히 외운다.","core":0}]},{"t":"fig","src":"figures/supplement/m-transformer-equivalent.svg","title":"변압기의 1차 환산 등가회로","caption":"여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","alt":"변압기의 1차 환산 등가회로. 여자 가지 Rc와 jXm은 병렬이다. 모든 2차 요소를 1차로 환산했으므로 이상 변압기 기호를 제거했다. 누설리액턴스는 직렬 경로에 남는다.","width":960.0,"height":590.0},{"t":"m","tex":"\\varepsilon=\\frac{V_{20}-V_{2n}}{V_{2n}}\\times100","note":"V20은 무부하 2차 전압 V, V2n은 정격부하 2차 전압 V, ε 단위 %. 1차 조건 일정."},{"t":"m","tex":"\\varepsilon\\simeq p\\cos\\phi\\pm q\\sin\\phi","note":"p와 q는 % 단위. 지상 부하는 +, 진상 부하는 −. 작은 내부 전압강하의 근사식."},{"t":"m","tex":"\\varepsilon_{\\max}=\\sqrt{p^2+q^2},\\qquad \\cos\\phi_{\\max}=\\frac{p}{\\sqrt{p^2+q^2}}","note":"p,q가 양수일 때 지상 영역의 최대 근사 전압변동률과 해당 역률."},{"t":"trap","items":["V20=210 V, V2n=200 V라면 분모는 200 V다.","진상이라고 변동률이 반드시 음수인 것은 아니다. 저항항과 리액턴스항의 크기를 비교한다."]},{"t":"ex","q":"p=3%, q=4%인 변압기의 역률 0.8 지상·진상 전압변동률과 최대값은?","steps":["sinφ=0.6이다.","지상은 3×0.8+4×0.6=4.8%, 진상은 2.4−2.4=0%다.","최대값은 √(3²+4²)=5%, 해당 역률은 3/5=0.6이다."],"a":"지상 4.8%, 진상 0%, 최대 5%."},{"t":"chk","q":"전압변동률 5%, 정격부하 2차전압 100 V라면 무부하 2차전압은?","a":"105 V. 정의식에서 무부하 전압=정격부하 전압×1.05다."}]},{"id":"M05","title":"단권변압기: 공통권선과 탭의 전압","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"단권변압기는 하나의 권선 일부를 1차와 2차가 공유하므로 작고 경제적이지만 두 회로가 전기적으로 절연되지 않는다.","core":1,"star":1},{"s":"공통권선과 직렬권선에 걸리는 전압을 구분해야 한다.","core":0},{"s":"전압비가 1에 가까워서 조금만 승압·강압할 때 전자유도로 처리해야 하는 용량이 작아 경제적인 장점이 크다.","core":0}]},{"t":"p","ss":[{"s":"무부하에서 탭 사이 전압은 해당 구간 권수에 비례한다.","core":0},{"s":"전체 권선에 240 V를 걸고 전체 권수의 3/4 지점에서 출력하면 180 V다.","core":0},{"s":"문제에 저항만 주어지면 권수가 아니라 저항 비를 무작정 쓰지 않는다.","core":0},{"s":"동일 굵기·재질이고 단위 권수당 저항이 같다는 조건이 명시되면 구간 저항비를 권수비로 쓸 수 있다.","core":0},{"s":"이 조건이 빠진 복기 메모는 단권변압기인지 저항분압기인지부터 재확인해야 한다.","core":0}]},{"t":"p","ss":[{"s":"승압기에서는 원래 전압과 추가 권선의 유도전압을 가동 접속하면 더하고 차동 접속하면 뺀다.","core":0},{"s":"자기용량은 변압작용으로 전달되는 부분이고 부하용량은 출력단 전체 피상전력이다.","core":0},{"s":"누설리액턴스가 비교적 작아 전압변동률이 작지만 단락전류가 커질 수 있다.","core":0},{"s":"원자료의 누설자속이 없다는 표현은 실제 기기에 대해 절대적인 사실이 아니므로 작다고 기억한다.","core":0}]},{"t":"fig","src":"figures/supplement/m-transformer-ratio.svg","title":"이상 변압기의 전압·전류·임피던스 비","caption":"점 표시 단자가 같은 순간 극성을 갖는다. I1은 점 단자로 들어가고 I2는 점 단자에서 부하로 나오는 방향으로 표시했다. 전류비 식은 크기 관계다.","alt":"이상 변압기의 전압·전류·임피던스 비. 점 표시 단자가 같은 순간 극성을 갖는다. I1은 점 단자로 들어가고 I2는 점 단자에서 부하로 나오는 방향으로 표시했다. 전류비 식은 크기 관계다.","width":960.0,"height":560.0},{"t":"m","tex":"\\frac{V_{BC}}{V_{AC}}=\\frac{N_{BC}}{N_{AC}}","note":"A-C 전체 권선과 B-C 탭 구간의 무부하 이상 전압비. 전압은 V, 권수는 회."},{"t":"m","tex":"S_{mag}=(V_H-V_L)I_H=S_{load}\\left(1-\\frac{V_L}{V_H}\\right)","note":"VH>VL인 이상 단권변압기에서 부하용량 Sload=VH IH 기준. VA. 단권 연결의 자기용량을 구하는 식이며 단자와 전류 기준을 먼저 확인한다."},{"t":"trap","items":["단권은 권선이 하나라는 뜻이지 단상이라는 뜻이 아니다.","두 구간의 선경이 다르면 저항비를 권수비로 사용할 수 없다.","실제 부하가 연결되면 내부 전압강하가 있으므로 무부하 탭 비율만으로 정밀한 단자전압을 구하지 않는다."]},{"t":"ex","q":"무부하 이상 단권변압기 A-C 전체에 240 V를 인가한다. A-B 저항 2 Ω, B-C 저항 6 Ω이며 단위 권수당 저항이 같다고 한다. B-C 출력은?","steps":["전체 저항에 대응하는 권수비는 (2+6):6=8:6이다.","VBC=240×6/8=180 V다.","저항분압 때문이 아니라 명시된 조건에서 저항비가 권수비를 알려주기 때문에 이 계산이 가능하다."],"a":"180 V."},{"t":"chk","q":"단권변압기에서 1차와 2차의 전기적 절연을 기대해도 되는가?","a":"안 된다. 두 회로가 공통권선을 공유하여 직접 전도 경로로 이어진다."}]},{"id":"M06","title":"3상 변압기 결선과 병렬운전의 최소 암기","pr":"B","min":20,"day":4,"b":[{"t":"p","ss":[{"s":"변압기 권수비는 각 권선의 상전압 비이므로 Y-Δ 또는 Δ-Y에서 선간전압비를 바로 권수비라고 하면 틀릴 수 있다.","core":1,"star":1},{"s":"Y결선의 선간전압은 상전압의 √3배이고 Δ결선은 두 값이 같다.","core":0},{"s":"결선 일반관계의 학습은 01권에서 하고 여기서는 변압기에 적용한다.","core":0},{"s":"주어진 전압이 선간인지 상전압인지 먼저 표시한다.","core":0}]},{"t":"p","ss":[{"s":"Δ결선은 제3고조파 전류가 내부를 순환할 수 있는 경로를 제공한다.","core":0},{"s":"3대 중 1대를 제거하여 V결선으로 운전하면 3상 공급을 유지할 수 있으나 원래 전체 용량을 유지하지는 못한다.","core":0},{"s":"동일한 단상 변압기 3대의 Δ결선 용량에 대한 V결선 용량은 약 57.7%이고, 남은 두 변압기 정격합에 대한 이용률은 약 86.6%다.","core":0},{"s":"분모가 달라서 두 숫자가 모두 등장한다.","core":0}]},{"t":"p","ss":[{"s":"병렬운전은 출력단을 연결하는 일이므로 극성·상순·위상변위가 맞아야 한다.","core":0},{"s":"전압비가 다르면 부하가 없어도 순환전류가 흐르고, %임피던스가 다르면 정격용량에 맞는 부하분담이 어려워진다.","core":0},{"s":"저항/리액턴스 비도 맞아야 각 기기의 역률과 분담이 비슷해진다.","core":0},{"s":"결선 이름이 같다는 이유만으로 모든 위상조건이 자동 충족된다고 가정하지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-delta-y-open-delta.svg","title":"임피던스 변환과 V결선","caption":"왼쪽 점선 Y와 실선 Δ는 같은 외부 단자 관계를 갖도록 소자값을 바꾸는 변환이다. 오른쪽은 세 변압기 중 한 대를 뺀 V결선으로 같은 변환과는 다른 개념이다.","alt":"왼쪽 점선 Y와 실선 Δ는 같은 외부 단자 관계를 갖도록 소자값을 바꾸는 변환이다. 오른쪽은 세 변압기 중 한 대를 뺀 V결선으로 같은 변환과는 다른 개념이다.","width":960.0,"height":600.0},{"t":"m","tex":"V_{L,Y}=\\sqrt{3}V_{\\phi,Y},\\quad I_{L,Y}=I_{\\phi,Y}","note":"평형 Y결선. L은 선간전압·선전류, φ는 권선 한 상의 전압·전류."},{"t":"m","tex":"V_{L,\\Delta}=V_{\\phi,\\Delta},\\quad I_{L,\\Delta}=\\sqrt{3}I_{\\phi,\\Delta}","note":"평형 Δ결선의 크기 관계. 각 양은 실효값."},{"t":"m","tex":"S_V=\\sqrt{3}S_u,\\qquad \\frac{S_V}{3S_u}=0.577","note":"Su는 단상 변압기 1대 정격 VA. 동일 2대로 구성한 V결선의 3상 용량."},{"t":"trap","items":["V결선 이용률 86.6%와 원래 Δ결선 대비 출력비 57.7%는 분모가 다르다.","각변위가 다른 결선을 병렬 연결할 수 있다는 단순 암기를 피한다."]},{"t":"ex","q":"한 대당 10 kVA인 단상 변압기 3대를 Δ결선으로 사용하다 2대로 V결선 운전한다. 공급 가능 용량은?","steps":["원래 3상 용량은 3×10=30 kVA다.","V결선 용량은 √3×10≈17.32 kVA다.","17.32/30≈57.7%이며 남은 두 대의 20 kVA 대비로는 86.6%다."],"a":"약 17.32 kVA."},{"t":"chk","q":"병렬 변압기의 권수비가 다르면 무부하에서도 무엇이 생길 수 있는가?","a":"출력전압 차에 의한 순환전류가 생길 수 있다."}]},{"id":"M07","title":"유도전동기 동기속도·슬립·2차 주파수","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"동기속도는 주파수에 비례하고 극수에 반비례하며, 유도전동기의 회전자는 전동기 운전에서 동기속도보다 조금 느리다.","core":1,"star":1},{"s":"회전자와 회전자계의 상대속도가 있어야 회전자에 유도기전력과 전류가 생겨 토크가 발생하기 때문이다.","core":0},{"s":"이상적으로 정확히 동기속도이면 유도토크가 사라져 부하를 돌릴 수 없다.","core":0}]},{"t":"p","ss":[{"s":"슬립은 동기속도에서 회전자 속도를 뺀 값을 동기속도로 나눈 무차원 값이다.","core":0},{"s":"회전자 속도를 분모로 쓰지 않는다.","core":0},{"s":"정지할 때 s=1, 동기속도일 때 s=0이고 일반 전동운전은 0<s<1이다.","core":0},{"s":"회전자계와 같은 방향으로 동기속도보다 빠르게 구동하면 s<0이 되어 발전영역이 된다.","core":0},{"s":"반대 방향 회전은 s>1로 제동영역 해석에 연결된다.","core":0}]},{"t":"p","ss":[{"s":"회전자에서 느끼는 교류의 주파수는 상대속도에 따라 결정되어 전동영역에서 f2=s f1이다.","core":0},{"s":"정지시 회전자 주파수는 전원주파수와 같고 정상운전에서는 수 Hz 수준이 될 수 있다.","core":0},{"s":"속도를 낮춰 슬립을 높이면 회전자 기전력과 리액턴스의 실제 주파수도 커진다.","core":0},{"s":"회전자 저항만 바꾸어 전원주파수·극수로 정해진 동기속도를 바꿀 수는 없다.","core":0}]},{"t":"fig","src":"figures/supplement/m-rotating-field-slip.svg","title":"회전자계와 슬립","caption":"세 그림은 대칭 3상 전류가 만드는 합성 자계 방향의 개념도다. P는 전체 극수이며 기계각과 전기각은 P/2배 관계다. 정상 유도전동 운전에서는 n<ns이다.","alt":"회전자계와 슬립. 세 그림은 대칭 3상 전류가 만드는 합성 자계 방향의 개념도다. P는 전체 극수이며 기계각과 전기각은 P/2배 관계다. 정상 유도전동 운전에서는 n<ns이다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/supplement/m-torque-slip.svg","title":"2차 저항 변화에 따른 토크-슬립 곡선","caption":"수치곡선은 T/Tmax=2(s/sm)/[1+(s/sm)²]로 계산했다. 같은 최대토크가 더 큰 슬립으로 이동하지만 모든 회로·운전 조건에서 단순 비례가 유지되는 것은 아니다.","alt":"2차 저항 변화에 따른 토크-슬립 곡선. 수치곡선은 T/Tmax=2(s/sm)/[1+(s/sm)²]로 계산했다. 같은 최대토크가 더 큰 슬립으로 이동하지만 모든 회로·운전 조건에서 단순 비례가 유지되는 것은 아니다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/supplement/m-induction-power-flow.svg","title":"유도전동기의 전력 배분","caption":"기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","alt":"유도전동기의 전력 배분. 기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","width":960.0,"height":530.0},{"t":"m","tex":"n_s=\\frac{120f_1}{p},\\quad s=\\frac{n_s-n}{n_s},\\quad n=(1-s)n_s","note":"ns와 n은 rpm, f1은 Hz, p는 극수(극쌍 수 아님), s는 소수로 대입한다."},{"t":"m","tex":"f_2=s f_1","note":"0≤s≤1의 일반 전동영역에서 회전자 전기 주파수 Hz. 발전영역에서 물리적 주파수 크기는 |s|f1로 읽는다."},{"t":"trap","items":["4%를 식에 4로 넣지 않고 0.04로 넣는다.","극수 p=4와 극쌍 수 2를 혼동하면 동기속도가 두 배로 틀린다."]},{"t":"ex","q":"60 Hz, 4극 유도전동기가 1728 rpm으로 돈다. 동기속도, 슬립, 2차 주파수는?","steps":["ns=120×60/4=1800 rpm이다.","s=(1800−1728)/1800=0.04다.","f2=0.04×60=2.4 Hz다."],"a":"1800 rpm, 4%, 2.4 Hz."},{"t":"chk","q":"전원주파수와 극수를 그대로 두고 2차 저항만 늘리면 동기속도는 바뀌는가?","a":"바뀌지 않는다. 실제 회전속도와 슬립이 달라질 수 있지만 동기속도는 120f/p로 정해진다."}]},{"id":"M08","title":"유도전동기 전력흐름: 2차 입력의 배분","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"회전자에 전달된 공극전력 중 s의 비율은 회전자 동손이고, 1−s의 비율은 기계적으로 변환된 전력이다.","core":1,"star":1},{"s":"여기서 1−s가 곧 전체 전동기의 효율은 아니다.","core":0},{"s":"고정자 동손·철손과 기계손 등이 별도로 있기 때문이다.","core":0},{"s":"처음에는 입력→고정자 손실→공극전력→회전자 동손→기계변환전력→기계손→축출력의 순서를 말로 외운다.","core":0}]},{"t":"p","ss":[{"s":"슬립이 커지면 동일한 공극전력에서 회전자 열손실의 비중이 커진다.","core":0},{"s":"권선형 전동기의 외부저항 제어가 간단하지만 효율에 불리한 이유도 여기에 있다.","core":0},{"s":"2차 입력이라는 용어는 이 문맥에서 공극전력을 뜻한다.","core":0},{"s":"문제에 출력이라고만 쓰였으면 기계손 무시 조건이 있는지 확인하여 내부 변환출력인지 실제 축출력인지 구별한다.","core":0}]},{"t":"p","ss":[{"s":"전자기 토크는 공극전력을 동기 각속도로 나누어도 되고, 변환된 기계전력을 실제 회전 각속도로 나누어도 같은 값을 얻는다.","core":0},{"s":"실제 축토크는 기계손을 뺀 축출력으로 계산한다.","core":0},{"s":"분자에 축출력을 쓰고 분모에는 동기속도를 쓰는 혼합 계산을 피한다.","core":0},{"s":"이 관계는 짧은 비율 문제로 출제되기 쉬운 기초이며 큰 수치 계산보다 전력의 위치가 핵심이다.","core":0}]},{"t":"fig","src":"figures/supplement/m-induction-power-flow.svg","title":"유도전동기의 전력 배분","caption":"기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","alt":"유도전동기의 전력 배분. 기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","width":960.0,"height":530.0},{"t":"m","tex":"P_{cu2}=sP_g,\\quad P_m=(1-s)P_g,\\quad P_{out}=P_m-P_{mech}","note":"Pg는 공극전력, Pcu2는 회전자 동손, Pm은 기계변환전력, Pmech는 마찰·풍손, Pout은 축출력. 모두 W."},{"t":"m","tex":"T_e=\\frac{P_g}{\\omega_s}=\\frac{P_m}{\\omega_m},\\qquad \\omega=\\frac{2\\pi n}{60}","note":"Te는 전자기 토크 N·m, 각속도는 rad/s, n은 rpm. 축토크는 Pout/ωm."},{"t":"trap","items":["2차 동손의 분모는 전체 입력이 아니라 2차 입력=공극전력이다.","1−s는 회전자 내부 변환효율에 해당하며 전체 효율을 뜻하지 않는다."]},{"t":"ex","q":"공극전력 10 kW, 슬립 0.04, 기계손 0.6 kW인 전동기의 회전자 동손과 축출력은?","steps":["회전자 동손은 0.04×10=0.4 kW다.","기계변환전력은 0.96×10=9.6 kW다.","축출력은 9.6−0.6=9.0 kW다."],"a":"회전자 동손 0.4 kW, 축출력 9.0 kW."},{"t":"chk","q":"공극전력 5 kW, 회전자 동손 0.25 kW일 때 슬립은?","a":"0.25/5=0.05, 즉 5%다."}]},{"id":"M09","title":"2차 저항기동과 비례추이: 같은 토크, 다른 슬립","pr":"A","min":30,"day":4,"b":[{"t":"p","ss":[{"s":"권선형 유도전동기는 2차 외부저항으로 기동전류를 줄이고 적절한 범위에서 기동토크를 높일 수 있다.","core":1,"star":1},{"s":"비례추이는 2차 저항과 슬립을 같은 비율로 바꾸어 저항/슬립을 유지하면 토크·전류 등의 특성이 같은 값으로 옮겨지는 성질이다.","core":0},{"s":"최대토크의 크기는 거의 같고 최대토크를 내는 슬립은 커진다.","core":0}]},{"t":"p","ss":[{"s":"중요한 조건은 저항을 무한히 늘린다고 기동토크가 계속 증가하지 않는다는 점이다.","core":0},{"s":"간단한 회전자 모형에서 기동시 저항과 정지 리액턴스가 같을 때 토크가 최대다.","core":0},{"s":"그 이전에는 저항 증가가 유리하고 그 이후에는 토크가 감소한다.","core":0},{"s":"실제 계산은 고정자 임피던스를 포함한 조건에 따라 달라질 수 있으나 조건 없이 항상 증가한다는 문장은 피한다.","core":0}]},{"t":"p","ss":[{"s":"비례추이에서 같은 토크라도 회전속도가 달라지므로 기계출력은 달라진다.","core":0},{"s":"슬립이 커지면 회전자 동손 비중이 커지므로 효율과 2차 동손도 같은 값으로 유지되지 않는다.","core":0},{"s":"동기속도는 전원주파수와 극수로 정해져 2차 저항으로 제어할 수 없다.","core":0},{"s":"농형은 회전자 바와 단락링이 내부에서 이어져 있어 일반 권선형처럼 외부저항을 직접 삽입할 수 없다.","core":0}]},{"t":"fig","src":"figures/supplement/m-torque-slip.svg","title":"2차 저항 변화에 따른 토크-슬립 곡선","caption":"수치곡선은 T/Tmax=2(s/sm)/[1+(s/sm)²]로 계산했다. 같은 최대토크가 더 큰 슬립으로 이동하지만 모든 회로·운전 조건에서 단순 비례가 유지되는 것은 아니다.","alt":"2차 저항 변화에 따른 토크-슬립 곡선. 수치곡선은 T/Tmax=2(s/sm)/[1+(s/sm)²]로 계산했다. 같은 최대토크가 더 큰 슬립으로 이동하지만 모든 회로·운전 조건에서 단순 비례가 유지되는 것은 아니다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/supplement/m-induction-power-flow.svg","title":"유도전동기의 전력 배분","caption":"기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","alt":"유도전동기의 전력 배분. 기계발생전력은 회전자 내부에서 전기적으로 변환된 전력이고 축출력은 그 뒤의 기계손까지 뺀 값이다. 전력흐름의 각 손실 위치를 구분한다.","width":960.0,"height":530.0},{"t":"m","tex":"\\frac{R_2^{\\prime}}{s}=\\mathrm{constant}\\quad\\Rightarrow\\quad s_b=k s_a\\ \\ (R_{2b}^{\\prime}=kR_{2a}^{\\prime})","note":"같은 전압·주파수, 같은 등가회로의 대응 운전점에서 쓰는 비례추이. s는 무차원, R2′는 Ω."},{"t":"m","tex":"T_{st}\\propto\\frac{R_2}{R_2^2+X_2^2}","note":"고정자 전압강하를 무시한 기동 s=1의 단순모형. 최대 기동토크 조건 R2=X2."},{"t":"trap","items":["동기속도 불변을 비례추이로 속도 제어 가능하다는 뜻으로 오해하지 않는다.","출력·효율·2차 동손은 전류나 토크처럼 같은 값으로 겹쳐지는 항목이 아니다."]},{"t":"ex","q":"같은 토크의 대응점에서 2차 총저항을 2배로 올린다. 초기 슬립이 0.04라면 새 슬립과 회전자 동손 비중은?","steps":["저항/슬립을 유지하므로 새 슬립은 2×0.04=0.08이다.","회전자 동손은 공극전력의 s배이므로 비중이 4%에서 8%로 커진다.","토크가 같아도 속도와 출력은 감소할 수 있다."],"a":"새 슬립 8%, 회전자 동손 비중 8%."},{"t":"chk","q":"비례추이에서 동일하게 대응되는 항목 두 가지와 아닌 항목 두 가지를 말하라.","a":"전류·토크는 동일한 값으로 대응된다. 기계출력·효율·2차 동손은 유지되지 않는다. 동기속도도 저항으로 조절할 수 없다."}]},{"id":"M10","title":"단상 유도전동기 기동법: 순서보다 구조부터","pr":"A","min":25,"day":4,"b":[{"t":"p","ss":[{"s":"단상 주권선의 교번자계만으로는 정지시 정·역방향 토크가 상쇄되어 자기기동 토크가 0이다.","
