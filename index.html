조건","caption":"출력을 개방하면 I2=0이 되어 Z11=V1/I1과 Z21=V2/I1을 얻는다. 출력을 단락하면 V2=0이 되어 Y11=I1/V1과 Y21=I2/V1을 얻으며 I2는 포트 유입 기준이다.","alt":"출력을 개방하면 I2=0이 되어 Z11=V1/I1과 Z21=V2/I1을 얻는다. 출력을 단락하면 V2=0이 되어 Y11=I1/V1과 Y21=I2/V1을 얻으며 I2는 포트 유입 기준이다.","width":960.0,"height":540.0},{"t":"m","tex":"Z_{11}=\\left.\\frac{V_1}{I_1}\\right|_{I_2=0},\\quad Z_{21}=\\left.\\frac{V_2}{I_1}\\right|_{I_2=0}","note":"출력 개방 측정의 입력 구동점·순방향 전달 임피던스 Ω. Z표현은 두 전류 모두 포트 유입."},{"t":"m","tex":"Z_{12}=\\left.\\frac{V_1}{I_2}\\right|_{I_1=0},\\quad Z_{22}=\\left.\\frac{V_2}{I_2}\\right|_{I_1=0}","note":"입력 개방 측정의 역방향 전달·출력 구동점 임피던스 Ω."},{"t":"m","tex":"Y_{11}=\\left.\\frac{I_1}{V_1}\\right|_{V_2=0},\\quad Y_{21}=\\left.\\frac{I_2}{V_1}\\right|_{V_2=0}","note":"출력 단락 측정의 입력 구동점·순방향 전달 어드미턴스 S."},{"t":"m","tex":"Y_{12}=\\left.\\frac{I_1}{V_2}\\right|_{V_1=0},\\quad Y_{22}=\\left.\\frac{I_2}{V_2}\\right|_{V_1=0}","note":"입력 단락 측정의 역방향 전달·출력 구동점 어드미턴스 S."},{"t":"m","tex":"A_T=1+\\frac{Z_l}{Z_m},\\quad B_T=Z_l+Z_r+\\frac{Z_lZ_r}{Z_m}","note":"T망 본문 마디 정의. AT 무차원, BT[Ω]. Zm≠0인 일반식."},{"t":"m","tex":"C_T=\\frac{1}{Z_m},\\quad D_T=1+\\frac{Z_r}{Z_m}","note":"CT[S], DT 무차원. Zl=Zr이면 A=D."},{"t":"m","tex":"A_{\\pi}=1+\\frac{Y_r}{Y_b},\\quad B_{\\pi}=\\frac{1}{Y_b}","note":"π망의 Yb는 입력-출력 사이 어드미턴스. Yl은 입력 병렬, Yr은 출력 병렬. Yb≠0."},{"t":"m","tex":"C_{\\pi}=Y_l+Y_r+\\frac{Y_lY_r}{Y_b},\\quad D_{\\pi}=1+\\frac{Y_l}{Y_b}","note":"Y[S]. A에는 출력측 Yr, D에는 입력측 Yl가 들어가는 순서를 유의."},{"t":"m","tex":"A=\\frac{Z_{11}}{Z_{21}},\\quad B=\\frac{Z_{11}Z_{22}-Z_{12}Z_{21}}{Z_{21}},\\quad C=\\frac{1}{Z_{21}},\\quad D=\\frac{Z_{22}}{Z_{21}}","note":"Z21≠0. Z행렬의 출력전류는 포트 유입, ABCD의 I2는 부하 유출이라 부호를 변환한 결과."},{"t":"m","tex":"Y_{11}=\\frac{Z_{22}}{\\Delta_Z},\\quad Y_{12}=-\\frac{Z_{12}}{\\Delta_Z},\\quad Y_{21}=-\\frac{Z_{21}}{\\Delta_Z},\\quad Y_{22}=\\frac{Z_{11}}{\\Delta_Z}","note":"ΔZ=Z11Z22-Z12Z21≠0일 때 2×2 역행렬. Y[S]."},{"t":"trap","items":["π망의 교차 Y항은 부호가 음수다.","Z12=1/Y12로 원소별 역수를 취하지 않는다.","회로도 Z1,Z2,Z3 위치를 확인하지 않은 채 다른 책의 첨자를 대입하지 않는다."]},{"t":"ex","q":"T망의 왼쪽 직렬 2 Ω, 오른쪽 직렬 3 Ω, 중앙 병렬 6 Ω이다. Z정수와 ABCD는?","steps":["Z11=8 Ω, Z22=9 Ω, Z12=Z21=6 Ω.","A=1+2/6=4/3, B=2+3+2×3/6=6 Ω.","C=1/6 S, D=1+3/6=3/2."],"a":"Z=(8,6,6,9) Ω; ABCD=(4/3,6 Ω,1/6 S,3/2)."},{"t":"chk","q":"π망에서 Yl=Yr이면 어떤 대칭 조건이 성립하는가?","a":"Y11=Y22이며 ABCD에서도 A=D이다. 가운데 Yb의 값과 관계없이 양쪽 구조가 같기 때문이다."}]},{"id":"C29","title":"영상 임피던스·전달상수·정K형 필터","pr":"B","min":35,"day":1,"b":[{"t":"p","ss":[{"s":"영상 임피던스 Z01,Z02는 출력에 Z02를 연결했을 때 입력에서 Z01이 보이고, 입력에 Z01을 연결했을 때 출력에서 Z02가 보이게 하는 한 쌍이다.","core":1},{"s":"어떤 부하를 달아도 같은 입력임피던스라는 뜻이 아니다.","core":0},{"s":"일반 비대칭망에서는 양쪽 값이 다르고, 대칭망 A=D에서는 두 값이 같아 특성 임피던스라고 부른다.","core":0}]},{"t":"p","ss":[{"s":"상호성 망의 영상 전달상수 θ=α+jβ에서 α는 1구간의 진폭 감쇠, β는 그 구간의 위상변화다.","core":0},{"s":"분포선로의 단위 길이 전파정수 γ와 혼동하지 않는다.","core":0},{"s":"포트 전력파 또는 임피던스 정규화 진폭에 e⁻ᶿ의 관계가 성립하도록 정의한다.","core":0},{"s":"복소 제곱근과 역쌍곡선 함수는 수동성과 주파수 연속성에 맞는 가지를 선택한다.","core":0}]},{"t":"p","ss":[{"s":"정K형 필터는 T형을 기준으로 양쪽 직렬 팔이 각각 Zs/2, 중앙 병렬 팔이 Zp일 때 ZsZp=K²을 만족한다.","core":0},{"s":"대응 π형은 중앙 직렬 Zs, 양쪽 병렬 팔 각각 2Zp다.","core":0},{"s":"저역통과에서는 Zs=jωL, Zp=1/(jωC)이므로 K=√(L/C)이다.","core":0},{"s":"K는 명목 임피던스이며 실제 영상 임피던스는 주파수에 따라 달라져 정저항 회로와 같지 않다.","core":0},{"s":"고역·대역통과·대역저지는 통과 영역 정의를 C18과 연결한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-image-impedance.svg","title":"영상 임피던스 종단 정의","caption":"반대 포트를 짝 영상 임피던스로 종단했을 때 보이는 입력값을 정의한다. 비대칭 2포트는 Z01과 Z02가 서로 다르며 임의 부하에서 성립하는 조건이 아니다.","alt":"반대 포트를 짝 영상 임피던스로 종단했을 때 보이는 입력값을 정의한다. 비대칭 2포트는 Z01과 Z02가 서로 다르며 임의 부하에서 성립하는 조건이 아니다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/circuit/c-constant-k-filter.svg","title":"정K형 저역필터 실제 소자값","caption":"T의 직렬팔은 L/2씩, 중앙 C다. 대응 π의 중앙은 L, 양끝은 C/2씩이다. π의 병렬 임피던스 2Zp를 커패시턴스 2C로 잘못 옮기지 않는다.","alt":"T의 직렬팔은 L/2씩, 중앙 C다. 대응 π의 중앙은 L, 양끝은 C/2씩이다. π의 병렬 임피던스 2Zp를 커패시턴스 2C로 잘못 옮기지 않는다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/circuit/c-filter-bands.svg","title":"저역·고역·대역통과·대역저지","caption":"주파수에 대한 전달크기의 개념 곡선이며 실제 차수·리플·차단주파수는 해당 회로에 따라 정한다.","alt":"주파수에 대한 전달크기의 개념 곡선이며 실제 차수·리플·차단주파수는 해당 회로에 따라 정한다.","width":960.0,"height":580.0},{"t":"m","tex":"Z_{01}=\\sqrt{\\frac{AB}{CD}},\\quad Z_{02}=\\sqrt{\\frac{BD}{AC}}","note":"상호성 4단자망의 영상 임피던스 Ω. 정의 가능한 비영 분모와 적절한 복소 제곱근 가지. 대칭망이면 Z01=Z02=√(B/C)."},{"t":"m","tex":"\\cosh\\theta=\\sqrt{AD},\\quad \\sinh\\theta=\\sqrt{BC},\\quad \\tanh\\theta=\\sqrt{\\frac{BC}{AD}}","note":"AD-BC=1, θ=α+jβ. 부호·가지 선택은 양의 수동 감쇠와 연속 조건을 따른다. 항별 임의 부호 선택 금지."},{"t":"m","tex":"\\theta=\\ln(\\sqrt{AD}+\\sqrt{BC}),\\quad \\frac{Z_{01}}{Z_{02}}=\\frac{A}{D},\\quad Z_{01}Z_{02}=\\frac{B}{C}","note":"위 영상 관계와 일관된 가지를 선택한 식. θ는 arcosh(√AD), arsinh(√BC), artanh(√(BC/AD))로도 쓸 수 있다. A,D 또는 C가 0인 특이망은 극한으로 해석."},{"t":"m","tex":"A=\\sqrt{\\frac{Z_{01}}{Z_{02}}}\\cosh\\theta,\\quad D=\\sqrt{\\frac{Z_{02}}{Z_{01}}}\\cosh\\theta","note":"영상 임피던스와 전송정수 관계. A,D 무차원."},{"t":"m","tex":"B=\\sqrt{Z_{01}Z_{02}}\\sinh\\theta,\\quad C=\\frac{\\sinh\\theta}{\\sqrt{Z_{01}Z_{02}}}","note":"B[Ω], C[S]. C는 이 식에서 정전용량이 아니라 전송정수."},{"t":"m","tex":"Z_sZ_p=K^2,\\quad K=\\sqrt{\\frac{L}{C}}","note":"정K 저역통과의 Zs=jωL, Zp=1/(jωC). K[Ω], L[H], C[F]."},{"t":"m","tex":"Z_{0T}=\\sqrt{Z_sZ_p+\\frac{Z_s^2}{4}},\\quad Z_{0\\pi}=\\sqrt{\\frac{Z_sZ_p}{1+Z_s/(4Z_p)}}","note":"보완 유도식. 대칭 T 팔 Zs/2,Zm=Zp; 대응 π 양쪽 팔 2Zp,중앙 Zs. 통과·저지 구간에 따라 복소값이 될 수 있다."},{"t":"trap","items":["영상 임피던스의 0첨자는 영상분(대칭좌표법)과 다른 의미다.","Z01/Z02=A/D이지만 일반적으로 두 값이 같지 않다.","명목 K가 일정하다고 입력임피던스가 모든 주파수에서 일정하지는 않다."]},{"t":"ex","q":"상호성 망 A=D=1.25, B=3 Ω, C=0.1875 S이다. 양쪽 영상 임피던스는?","steps":["AD-BC=1.5625-0.5625=1.","대칭이므로 Z0=√(B/C)=√16=4 Ω."],"a":"Z01=Z02=4 Ω. 수동 양의 제곱근."},{"t":"ex","q":"C28의 비대칭 T망 A=4/3,B=6 Ω,C=1/6 S,D=3/2의 양쪽 영상 임피던스는?","steps":["Z01²=AB/(CD)=8/0.25=32 Ω².","Z02²=BD/(AC)=9/(2/9)=40.5 Ω².","Z01/Z02=8/9=A/D도 확인한다."],"a":"Z01≈5.657 Ω, Z02≈6.364 Ω. 비대칭이므로 서로 다르다."},{"t":"chk","q":"정K형 저역필터에서 L=4 mH, C=1 μF이면 K는?","a":"√(0.004/0.000001)=√4000≈63.25 Ω. L/C의 단위가 Ω²이다."}]},{"id":"C30","title":"분포정수 선로의 전송·진행파·반사","pr":"B","min":40,"day":1,"b":[{"t":"p","ss":[{"s":"긴 선로에서는 전압과 전류가 위치마다 달라지므로 전선 전체를 저항 한 개로 볼 수 없다.","core":1},{"s":"작은 길이 dx마다 직렬 Rdx,Ldx와 병렬 Gdx,Cdx가 반복된다고 모델링한다.","core":0},{"s":"이 절의 R,L,G,C는 단위 길이값이다.","core":0},{"s":"X06의 기본 정의에 이어 선로 길이 ℓ의 ABCD까지 연결한다.","core":0}]},{"t":"p","ss":[{"s":"진행파는 e⁻ᵞˣ=e⁻ᵅˣe⁻ʲᵝˣ 형태로 전달된다.","core":0},{"s":"α는 진폭 감쇠 Np/m, β는 위상정수 rad/m이다.","core":0},{"s":"v=ω/β, λ=2π/β가 일반식이다.","core":0},{"s":"무손실 R=G=0에서는 α=0이고 β=ω√LC이다.","core":0},{"s":"무왜형 R/L=G/C에서는 α=√RG이고 같은 β식을 얻는다.","core":0},{"s":"L,C가 주파수에 무관하다는 가정까지 있어야 v=1/√LC가 주파수와 무관하다.","core":0},{"s":"일반 손실선로에서는 v가 주파수에 따라 달라질 수 있다.","core":0}]},{"t":"p","ss":[{"s":"특성 임피던스 Z0는 한 방향 진행파의 V/I 비다.","core":0},{"s":"부하가 Z0와 같으면 반사 없이 진행파 에너지가 부하로 전달된다.","core":0},{"s":"부하 ZL에서 전압 반사계수 Γ=(ZL-Z0)/(ZL+Z0), 전압 투과계수 τv=1+Γ이다.","core":0},{"s":"개방은 Γ=+1로 부하전압이 입사파의 2배, 단락은 Γ=-1로 부하전압 0이다.","core":0},{"s":"전류 반사파의 부호는 전압 반사파와 반대다.","core":0}]},{"t":"p","ss":[{"s":"실수 Z0인 무손실 선로의 수동부하에서 정재파비는 (1+|Γ|)/(1-|Γ|)이다.","core":0},{"s":"정합이면 1, 완전반사면 무한대다.","core":0},{"s":"전압 투과계수 2가 전력 4배 생성을 뜻하지 않는다.","core":0},{"s":"예를 들어 개방에는 부하전류가 0이어서 평균전력이 전달되지 않는다.","core":0},{"s":"다른 선로 Z2로 이어지는 경계는 ZL=Z2로 해석한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-distributed-line.svg","title":"분포정수의 작은 구간","caption":"전선 길이를 Δx로 잘라 각 구간에 직렬 저항·인덕턴스와 분로 정전용량·누설을 놓는다. G는 저항이 아니라 컨덕턴스이므로 저항기 표시에는 1/(G′Δx)를 붙였다.","alt":"전선 길이를 Δx로 잘라 각 구간에 직렬 저항·인덕턴스와 분로 정전용량·누설을 놓는다. G는 저항이 아니라 컨덕턴스이므로 저항기 표시에는 1/(G′Δx)를 붙였다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/circuit/c-line-reflection.svg","title":"반사·투과·정재파","caption":"접속점에서 전압은 Vi+Vr=Vt다. 아래는 반사계수 크기 0.4인 무손실 선로의 전압 크기 포락선이며 위상에 따라 공간적 최대·최소가 반복된다.","alt":"접속점에서 전압은 Vi+Vr=Vt다. 아래는 반사계수 크기 0.4인 무손실 선로의 전압 크기 포락선이며 위상에 따라 공간적 최대·최소가 반복된다.","width":960.0,"height":600.0},{"t":"m","tex":"z=R+j\\omega L,\\quad y=G+j\\omega C,\\quad Z_0=\\sqrt{\\frac{z}{y}},\\quad \\gamma=\\sqrt{zy}=\\alpha+j\\beta","note":"R[Ω/m], L[H/m], G[S/m], C[F/m], z[Ω/m], y[S/m], Z0[Ω], γ[m⁻¹]. 수동성을 만족하는 가지 선택."},{"t":"m","tex":"A=D=\\cosh(\\gamma\\ell),\\quad B=Z_0\\sinh(\\gamma\\ell),\\quad C_{ABCD}=\\frac{\\sinh(\\gamma\\ell)}{Z_0}","note":"길이 ℓ[m]의 균일선로 전송정수. 출력전류 부하 유출 기준. CABCD는 분포 정전용량 C와 다른 기호."},{"t":"m","tex":"v_p=\\frac{\\omega}{\\beta},\\quad \\lambda=\\frac{2\\pi}{\\beta},\\quad Z_0=\\sqrt{\\frac{L}{C}}\\quad(R=G=0\\ \\mathrm{or}\\ RC=LG)","note":"v[m/s], λ[m]. 마지막 Z0 단순식은 무손실 또는 무왜형 선로. 무왜형은 R/L=G/C와 동치."},{"t":"m","tex":"\\Gamma=\\frac{Z_L-Z_0}{Z_L+Z_0},\\quad \\tau_v=1+\\Gamma=\\frac{2Z_L}{Z_L+Z_0},\\quad \\mathrm{SWR}=\\frac{1+|\\Gamma|}{1-|\\Gamma|}","note":"부하 경계 전압계수. SWR은 실수 Z0의 무손실 선로 표준식이며 |Γ|<1; |Γ|=1이면 무한대."},{"t":"trap","items":["길이 ℓ의 전체 L,C를 단위 길이식에 혼용하지 않는다.","무왜형은 무손실이 아니다. α가 양수일 수 있다.","반사계수의 복소 부호·위상과 크기를 구분한다."]},{"t":"ex","q":"무손실 선로 L=0.25 μH/m, C=100 pF/m이다. Z0와 속도는?","steps":["Z0=√(0.25×10⁻⁶/(100×10⁻¹²))=50 Ω.","√LC=5×10⁻⁹ s/m이므로 v=2×10⁸ m/s."],"a":"50 Ω, 2×10⁸ m/s."},{"t":"ex","q":"50 Ω 무손실 선로에 100 Ω 부하를 연결한다. Γ와 SWR은?","steps":["Γ=(100-50)/(100+50)=1/3.","SWR=(1+1/3)/(1-1/3)=2."],"a":"Γ=1/3, SWR=2."},{"t":"chk","q":"무왜형 조건에서 주파수와 무관한 속도를 쓰려면 어떤 가정을 확인해야 하는가?","a":"RC=LG와 함께 L,C가 주파수에 따라 변하지 않는다는 가정이 필요하다. 일반식은 v=ω/β다."}]},{"id":"C31","title":"RLC 세 감쇠 경우와 LC 자유진동·계단응답","pr":"B","min":40,"day":1,"b":[{"t":"p","ss":[{"s":"직렬 RLC에서 전하 q를 상태로 잡으면 Lq″+Rq′+q/C=E(t)이고 i=q′이다.","core":1},{"s":"상수 전원 이후의 정상 충전값을 뺀 자연응답은 두 특성근으로 결정된다.","core":0},{"s":"α=R/(2L)는 감쇠율, ωn=1/√LC는 무감쇠 고유각주파수, ζ=α/ωn은 무차원 감쇠비다.","core":0},{"s":"부족제동의 실제 진동각주파수 ωd는 ωn보다 작다.","core":0}]},{"t":"p","ss":[{"s":"부족제동은 α<ωn으로 복소근 -α±jωd가 생겨 지수 포락선 안에서 진동한다.","core":0},{"s":"임계제동은 중근 -α로 (A+Bt)e⁻ᵅᵗ, 과제동은 서로 다른 음의 실근 s1,s2로 A eˢ¹ᵗ+B eˢ²ᵗ 형태다.","core":0},{"s":"상수 A,B는 초기 전압과 전류 두 조건으로 정한다.","core":0},{"s":"R>0이면 모두 감쇠하며 부족제동을 불안정으로 부르지 않는다.","core":0}]},{"t":"p","ss":[{"s":"초기에 i=0, vC=0인 직렬 RLC에 E의 직류 계단을 넣으면 최종 i=0, vC=E이다.","core":0},{"s":"원본의 감쇠 모양 그림을 전류가 E/R로 수렴하는 그래프로 읽으면 안 된다.","core":0},{"s":"E/R은 RL 계단 전류의 최종값이고 직렬 RLC의 C는 직류 정상상태에서 개방이다.","core":0},{"s":"이 책은 vC의 최종값과 i의 최종값을 분리한다.","core":0}]},{"t":"p","ss":[{"s":"R=0의 이상 LC는 손실이 없어 진동이 멈추지 않는다.","core":0},{"s":"전원 없이 초기 C전압 V0만 있는 자유진동에서는 vC의 최대 크기가 |V0|이다.","core":0},{"s":"반대로 처음 무충전인 LC 직렬회로에 직류 E를 계속 연결하면 vC=E(1-cosωnt)이므로 순간 최대 2E가 된다.","core":0},{"s":"'LC이면 vC=2E'라고 조건 없이 외우지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-rlc-damping.svg","title":"세 감쇠의 RLC 실제 응답","caption":"영 초기조건의 직렬 RLC에 전압계단을 인가한 정확한 정규화 해를 그렸다. 왼쪽 콘덴서 전압은 최종 1, 오른쪽 전류는 최종 0이며 원문의 전류 최종값 혼동을 교정한다.","alt":"영 초기조건의 직렬 RLC에 전압계단을 인가한 정확한 정규화 해를 그렸다. 왼쪽 콘덴서 전압은 최종 1, 오른쪽 전류는 최종 0이며 원문의 전류 최종값 혼동을 교정한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-lc-free-step.svg","title":"LC 자유진동과 계단응답","caption":"전원 없는 초기 충전 LC는 ±V0 사이에서 진동한다. 초기 무충전 LC에 직류계단 E를 계속 가하는 경우에만 vC=E(1-cosω0t)로 2E 최대가 나온다.","alt":"전원 없는 초기 충전 LC는 ±V0 사이에서 진동한다. 초기 무충전 LC에 직류계단 E를 계속 가하는 경우에만 vC=E(1-cosω0t)로 2E 최대가 나온다.","width":960.0,"height":600.0},{"t":"m","tex":"\\alpha=\\frac{R}{2L},\\quad \\omega_n=\\frac{1}{\\sqrt{LC}},\\quad \\zeta=\\frac{R}{2}\\sqrt{\\frac{C}{L}},\\quad \\omega_d=\\sqrt{\\omega_n^2-\\alpha^2}","note":"직렬 RLC. α[s⁻¹], ωn,ωd[rad/s], ζ 무차원. ωd는 α<ωn일 때 실수."},{"t":"m","tex":"s_{1,2}=-\\alpha\\pm\\sqrt{\\alpha^2-\\omega_n^2}","note":"직렬 RLC 자연 특성근. R²<4L/C 부족, = 임계, > 과제동. s[s⁻¹]."},{"t":"m","tex":"i(t)=\\frac{E}{L\\omega_d}e^{-\\alpha t}\\sin\\omega_dt","note":"영 초기조건, E[V] 계단, 부족제동, t≥0. i[A]. 전류 최종값 0."},{"t":"m","tex":"v_C(t)=E\\left[1-e^{-\\alpha t}\\left(\\cos\\omega_dt+\\frac{\\alpha}{\\omega_d}\\sin\\omega_dt\\right)\\right]","note":"위 부족제동 계단 응답의 콘덴서 전압 V. 최종값 E, 초기값과 초기기울기는 0."},{"t":"m","tex":"i_{\\mathrm{crit}}(t)=\\frac{E}{L}te^{-\\alpha t},\\quad v_{C,\\mathrm{crit}}(t)=E[1-(1+\\alpha t)e^{-\\alpha t}]","note":"영 초기조건의 임계제동 계단. α=ωn."},{"t":"m","tex":"i_{\\mathrm{over}}(t)=\\frac{E}{L(s_1-s_2)}(e^{s_1t}-e^{s_2t})","note":"영 초기조건의 과제동 계단. s1≠s2이며 두 근은 음의 실수. vC는 i/C를 적분해 얻는다."},{"t":"m","tex":"v_{C,\\mathrm{LC}}=E(1-\\cos\\omega_nt),\\quad i_{\\mathrm{LC}}=E\\sqrt{\\frac{C}{L}}\\sin\\omega_nt","note":"R=0, 초기 무충전·무전류, t=0부터 E를 계속 연결한 이상 계단. vC 최대 2E. 자유진동 조건에는 이 식을 그대로 쓰지 않는다."},{"t":"m","tex":"v_C=V_0\\cos\\omega_nt,\\quad i=-V_0\\sqrt{\\frac{C}{L}}\\sin\\omega_nt","note":"전원 없는 LC의 초기 vC=V0,i=0. i는 C의 +단자로 들어가는 방향. 에너지는 L과 C 사이에서 보존된다."},{"t":"trap","items":["ωn과 ωd의 첨자를 혼동하지 않는다.","계단전압을 미분한 전류방정식에는 t=0 충격항이 생긴다. t>0 자연식만으로 초기조건을 잊지 않는다.","실제 LC에도 저항이 있어 진동은 감쇠한다."]},{"t":"ex","q":"R=2 Ω,L=1 H,C=0.25 F인 직렬 RLC의 α,ωn,ζ,ωd와 감쇠 종류를 구하라.","steps":["α=2/(2×1)=1 s⁻¹, ωn=1/√0.25=2 rad/s.","ζ=1/2=0.5, ωd=√(4-1)=√3 rad/s."],"a":"부족제동. α=1,ωn=2,ζ=0.5,ωd≈1.732."},{"t":"chk","q":"10 V로 충전된 C를 전원에서 떼어 이상 L과만 연결했다. C전압의 최대 크기가 20 V인가?","a":"아니다. 초기 에너지만 교환하는 자유진동이므로 최대 크기는 10 V이다. 2E는 무충전 LC에 E 계단전원을 유지하는 별도 조건이다."}]},{"id":"C32","title":"RL·RC 투입과 차단: 전류·소자전압 전체표","pr":"B","min":30,"day":1,"b":[{"t":"p","ss":[{"s":"C15의 일반해는 상태 하나를 구하는 틀이고, 이 절은 모든 소자량을 연결한다.","core":1},{"s":"투입 회로는 이상 직류 E, 저항 R, 저장소자 L 또는 C가 직렬이며 초기 저장에너지가 0이다.","core":0},{"s":"전류는 전원 +에서 저항을 지나 저장소자로 들어가는 방향, 각 소자전압은 그 전류가 들어가는 단자를 +로 잡는다.","core":0}]},{"t":"p","ss":[{"s":"RL 투입에서 i는 0에서 E/R로 증가하고 vL는 E에서 0으로 감소한다.","core":0},{"s":"RC 투입에서는 i와 vR가 최대에서 감소하고 vC가 0에서 E로 증가한다.","core":0},{"s":"전원이 제거된 뒤에도 방전 경로 R가 닫혀 있다고 가정한다.","core":0},{"s":"RL 전류는 원래 방향을 유지하면서 줄기 때문에 vL=L di/dt가 음수다.","core":0},{"s":"RC는 기존 충전 전류 방향으로 정의한 i가 음수가 되어 C에서 전하가 빠져나간다.","core":0}]},{"t":"p","ss":[{"s":"차단이라고 해서 인덕터 전류를 흐를 곳 없이 이상적으로 갑자기 끊는 상황은 아래 방전식과 다르다.","core":0},{"s":"그런 경우 스위치에 높은 전압이 생기며 기생용량·아크·보호회로가 실제 경로를 만든다.","core":0},{"s":"시정수에서 접선이 초기값으로부터 최종값에 닿는 시간이 τ이며, 실제 파형은 그때 전체 변화의 63.2%만 진행한다.","core":0},{"s":"약 5τ 뒤 남은 오차는 0.67%다.","core":0}]},{"t":"fig","src":"figures/circuit/c-rl-switching.svg","title":"RL 스위칭 회로·전류","caption":"왼쪽 위 스위치를 닫아 RL에 직류를 인가한다. 아래는 전원을 분리한 뒤 R-L 폐회로로 재접속한 방전 상태를 표시하며 실제 스위치의 절체를 개념화했다. 차단 때도 전류가 흐를 폐회로가 있어야 이 지수감쇠식이 적용된다.","alt":"왼쪽 위 스위치를 닫아 RL에 직류를 인가한다. 아래는 전원을 분리한 뒤 R-L 폐회로로 재접속한 방전 상태를 표시하며 실제 스위치의 절체를 개념화했다. 차단 때도 전류가 흐를 폐회로가 있어야 이 지수감쇠식이 적용된다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-rc-switching.svg","title":"RC 스위칭 회로·전압","caption":"충전에서는 콘덴서 전압이 올라가는 동안 전류는 감소한다. 아래는 전원을 분리하고 R-C 폐회로로 재접속한 방전 상태이며 전압의 극성과 전류 기준에 따라 방전 전류 부호가 달라진다.","alt":"충전에서는 콘덴서 전압이 올라가는 동안 전류는 감소한다. 아래는 전원을 분리하고 R-C 폐회로로 재접속한 방전 상태이며 전압의 극성과 전류 기준에 따라 방전 전류 부호가 달라진다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/circuit/c-initial-final.svg","title":"영 초기상태의 순간·최종 등가","caption":"무전류 L은 투입 직후 전류가 0이라 개방처럼, 무충전 C는 전압이 0이라 단락처럼 보인다. 초기 에너지가 있으면 독립적인 전류/전압 초기조건을 포함해야 하며 이 단순 치환을 그대로 쓰지 않는다.","alt":"무전류 L은 투입 직후 전류가 0이라 개방처럼, 무충전 C는 전압이 0이라 단락처럼 보인다. 초기 에너지가 있으면 독립적인 전류/전압 초기조건을 포함해야 하며 이 단순 치환을 그대로 쓰지 않는다.","width":960.0,"height":560.0},{"t":"m","tex":"i_{RL}=\\frac{E}{R}(1-e^{-tR/L}),\\quad v_R=E(1-e^{-tR/L}),\\quad v_L=Ee^{-tR/L}","note":"RL 영 초기조건 투입. τ=L/R[s], i[A], v[V]. t≥0."},{"t":"m","tex":"i_{RL,\\mathrm{off}}=I_0e^{-tR/L},\\quad v_L=-RI_0e^{-tR/L}","note":"전원 제거 후 R-L 폐루프 방전. I0는 차단 직전 전류. vL는 기존 전류 유입 단자 + 기준."},{"t":"m","tex":"i_{RC}=\\frac{E}{R}e^{-t/(RC)},\\quad v_R=Ee^{-t/(RC)},\\quad v_C=E(1-e^{-t/(RC)})","note":"RC 영 초기조건 투입. τ=RC[s]."},{"t":"m","tex":"v_{C,\\mathrm{off}}=V_0e^{-t/(RC)},\\quad i_{RC,\\mathrm{off}}=-\\frac{V_0}{R}e^{-t/(RC)}","note":"충전 C가 R로 방전하며 i는 C의 +단자 유입 기준. 전압 V0[V], 전류 A."},{"t":"tb","h":["회로","0+ 상태","∞ 상태","연속인 양"],"r":[["RL 투입","i=0,vL=E","i=E/R,vL=0","iL"],["RL 방전","i=I0,vL=-RI0","i=0,vL=0","iL"],["RC 투입","vC=0,i=E/R","vC=E,i=0","vC"],["RC 방전","vC=V0,i=-V0/R","vC=0,i=0","vC"]]},{"t":"trap","items":["방전 전류의 음수는 기준 방향과 반대라는 의미다.","인덕터 전압은 연속일 필요가 없고 콘덴서 전류도 연속일 필요가 없다.","R이 변하면 RL과 RC의 속도 변화 방향이 반대다."]},{"t":"ex","q":"충전전압 8 V, C=100 μF, 방전저항 2 kΩ이다. t=τ에서 vC와 C+단자 유입 기준 i는?","steps":["τ=2000×100×10⁻⁶=0.2 s.","vC=8e⁻¹≈2.943 V.","i=-vC/R≈-1.472 mA."],"a":"약 2.94 V, -1.47 mA."},{"t":"chk","q":"직전 2 A가 흐르던 L=1 H를 R=5 Ω 폐루프로 방전한다. 직후 인덕터 전압은?","a":"기존 전류의 유입 단자를 +로 잡으면 vL(0+)=-RI0=-10 V다. 전류는 바로 0이 되지 않는다."}]},{"id":"C33","title":"회로 전달함수와 RC 진상·지상 보상 접속","pr":"B","min":40,"day":1,"b":[{"t":"p","ss":[{"s":"라플라스 변환의 정의·기본표·이동·미분·적분·역변환은 T01·T18에서 학습한다.","core":1},{"s":"여기서는 초기조건을 모두 0으로 놓은 입력 대비 출력의 비를 회로에서 만든다.","core":0},{"s":"같은 R,C라도 전압을 어느 소자에서 읽는지, 입력이 전압인지 전류인지에 따라 식과 단위가 바뀐다.","core":0},{"s":"출력에 별도 부하가 없거나 측정기 임피던스가 무한대라는 조건을 기본으로 한다.","core":0}]},{"t":"p","ss":[{"s":"입력에서 R을 지나 출력 마디로 가고 출력-C-기준 마디로 이어지면 RC 저역통과다.","core":0},{"s":"C와 R의 위치를 바꾸어 R 양단을 읽으면 고역통과다.","core":0},{"s":"저주파에서 ωRC≪1인 RC 고역통과는 미분 근사, 고주파에서 ωRC≫1인 RC 저역통과는 적분 근사가 된다.","core":0},{"s":"전 주파수에서 이상 미분기·적분기인 것은 아니다.","core":0}]},{"t":"p","ss":[{"s":"진상 보상은 입력1-출력2 사이에 R1과 C를 병렬로 놓고, 출력2-기준0 사이에 R2를 놓는다.","core":0},{"s":"C가 고주파에서 R1을 우회하므로 고주파 전달은 1, 직류 전달은 R2/(R1+R2)다.","core":0},{"s":"영점 -b보다 극점 -a가 더 왼쪽(a>b>0)이어서 출력 위상이 앞선다.","core":0},{"s":"지상 보상은 입력1-출력2 사이에 R1, 출력2-중간m 사이에 R2, m-기준0 사이에 C를 직렬로 놓는다.","core":0},{"s":"직류 전달 1에서 고주파 전달 R2/(R1+R2)로 내려가며 위상이 뒤진다.","core":0}]},{"t":"p","ss":[{"s":"이상 전류원이 R과 C의 병렬망에 전류를 주입하면 출력전압/입력전류는 그 병렬 임피던스다.","core":0},{"s":"전류원에 직렬로 놓인 다른 이상 저항은 전류원 전압 부담에는 영향을 주어도 이 병렬망 전압비에는 나타나지 않는다.","core":0},{"s":"제어의 일반 비례·미분·적분·1차·2차·부동작 요소는 T02·T19와 연결한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-transfer-outputs.svg","title":"RC 저역·고역·분압·전류입력","caption":"같은 소자라도 어느 마디의 전압을 출력으로 읽는지, 입력이 전압인지 전류인지에 따라 전달함수와 단위가 달라진다. 모든 출력은 별도 부하가 없는 조건이다.","alt":"같은 소자라도 어느 마디의 전압을 출력으로 읽는지, 입력이 전압인지 전류인지에 따라 전달함수와 단위가 달라진다. 모든 출력은 별도 부하가 없는 조건이다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/circuit/c-lead-lag-circuits.svg","title":"진상·지상 보상 실제 결선","caption":"진상은 입력-출력 사이 R1∥C와 출력-기준 R2다. 지상은 입력-출력 R1과 출력에서 R2-C 직렬로 기준까지 이어진다. 원문 노드와 본문 식의 대응을 분명히 했다.","alt":"진상은 입력-출력 사이 R1∥C와 출력-기준 R2다. 지상은 입력-출력 R1과 출력에서 R2-C 직렬로 기준까지 이어진다. 원문 노드와 본문 식의 대응을 분명히 했다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/control/t-rc-block.svg","title":"RC 회로와 폐루프 블록의 대응","caption":"커패시터 전압을 되먹임하여 저항 전압을 구한다. 전달함수는 초기조건이 0일 때 정의한다.","alt":"RC 회로와 폐루프 블록의 대응. 커패시터 전압을 되먹임하여 저항 전압을 구한다. 전달함수는 초기조건이 0일 때 정의한다.","width":960.0,"height":470.0},{"t":"fig","src":"figures/control/t-physical-model.svg","title":"질량·스프링·감쇠계와 전기 요소","caption":"기준 방향은 오른쪽이다. 스프링과 감쇠기는 질량과 벽 사이에 병렬 연결된다. 기계·전기 대응은 선택한 비유 체계를 먼저 고정해야 한다.","alt":"질량·스프링·감쇠계와 전기 요소. 기준 방향은 오른쪽이다. 스프링과 감쇠기는 질량과 벽 사이에 병렬 연결된다. 기계·전기 대응은 선택한 비유 체계를 먼저 고정해야 한다.","width":960.0,"height":590.0},{"t":"fig","src":"figures/control/t-electrical-blocks.svg","title":"전기 요소의 임피던스 블록","caption":"전압을 출력, 전류를 입력으로 잡은 블록이다. 커패시터 초기전압이나 인덕터 초기전류가 있으면 별도 초기조건 항을 포함한다.","alt":"전기 요소의 임피던스 블록. 전압을 출력, 전류를 입력으로 잡은 블록이다. 커패시터 초기전압이나 인덕터 초기전류가 있으면 별도 초기조건 항을 포함한다.","width":960.0,"height":550.0},{"t":"m","tex":"G_{\\mathrm{div}}=\\frac{R_2}{R_1+R_2},\\quad G_{LP}=\\frac{1}{1+sRC},\\quad G_{HP}=\\frac{sRC}{1+sRC}","note":"전압입력/전압출력이라 무차원. 저항분압은 R2출력, RC 직렬 저역은 C출력, 고역은 R출력. 무부하·영 초기조건."},{"t":"m","tex":"\\frac{V_o}{I_i}=\\frac{R}{1+sRC},\\quad \\frac{V_L}{I_L}=sL,\\quad \\frac{V_C}{I_C}=\\frac{1}{sC}","note":"전류입력-전압출력 전달비의 단위는 Ω. 초기조건 0. 단순 전압이득과 단위가 다르다."},{"t":"m","tex":"G_{RLC,C}=\\frac{1}{LCs^2+RCs+1},\\quad G_{RLC,R}=\\frac{RCs}{LCs^2+RCs+1}","note":"직렬 R-L-C에 전압입력, 각각 C 또는 R의 전압을 출력. 무부하, 영 초기조건. 분모 정규화는 C31의 ωn,ζ와 연결."},{"t":"m","tex":"G_{\\mathrm{lead}}=\\frac{R_2+sCR_1R_2}{R_1+R_2+sCR_1R_2}=\\frac{s+b}{s+a}","note":"본문 진상 접속. b=1/(CR1), a=(R1+R2)/(CR1R2), a>b>0. R[Ω], C[F], a,b[s⁻¹]."},{"t":"m","tex":"G_{\\mathrm{lag}}=\\frac{1+sCR_2}{1+sC(R_1+R_2)}=\\frac{1+sT_z}{1+sT_p}","note":"본문 지상 접속. Tz=CR2, Tp=C(R1+R2), Tp>Tz>0. T[s]. K(s+b)/(s+a)로 바꾸면 b>a이고 K=R2/(R1+R2)를 빠뜨리지 않는다."},{"t":"trap","items":["G(s)를 구할 때 입력의 계단 1/s를 다시 곱하지 않는다. 출력 Y(s)를 구할 때만 입력과 곱한다.","지상 회로를 (s+b)/(s+a)로 정규화할 때 이득 상수를 버리지 않는다.","C가 입력에 있으면 언제나 진상이라는 말 대신 전체 접속과 출력 위치를 확인한다."]},{"t":"ex","q":"진상 회로 R1=10 kΩ,R2=10 kΩ,C=10 μF이다. G(s)의 영점·극점과 직류·고주파 이득은?","steps":["b=1/(CR1)=10 s⁻¹.","a=(R1+R2)/(CR1R2)=20 s⁻¹.","G=(s+10)/(s+20), G(0)=1/2, G(∞)=1."],"a":"영점 -10, 극점 -20, 직류 0.5, 고주파 1의 진상."},{"t":"chk","q":"지상 회로의 R1=R2이면 직류와 고주파 전달은 각각 얼마인가?","a":"직류 1, 고주파 1/2. 낮은 주파수에서 C가 개방이고 높은 주파수에서 C가 단락처럼 되어 R1-R2 분압이 된다."}]}]},{"num":"02","title":"제어공학","acc":"#7C3AED","day":2,"secs":[{"id":"T01","title":"라플라스 변환: 미분방정식을 계산 가능한 식으로","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"라플라스 변환은 시간함수를 s의 함수로 바꾸어 미분·적분 관계를 대수식처럼 계산하게 해준다.","core":1,"star":1},{"s":"s는 단순한 실수 주파수가 아니라 실수부와 허수부를 가진 복소변수다.","core":0},{"s":"주파수응답을 구할 때 s=jω로 놓는 것과 일반적인 라플라스 영역을 구별한다.","core":0}]},{"t":"p","ss":[{"s":"필수 변환은 단위계단 1/s, 단위램프 1/s², 감쇠지수 1/(s+a), 임펄스 1이다.","core":0},{"s":"입력이 갑자기 일정값으로 바뀌면 계단, 일정한 기울기로 커지면 램프다.","core":0},{"s":"같은 시스템이어도 입력이 달라지면 출력과 정상편차가 달라지므로 입력의 이름을 먼저 확인한다.","core":0}]},{"t":"p","ss":[{"s":"초기조건이 0일 때 미분은 s를 곱하는 연산이 되어 편리하다.","core":0},{"s":"그러나 초기값이 존재하면 그 항을 빼야 한다.","core":0},{"s":"전달함수에서 초기조건을 0으로 두는 이유가 여기에 있다.","core":0},{"s":"표를 외울 때 시간함수와 변환함수를 거꾸로 적지 말고, 지수의 부호도 함께 묶는다.","core":0},{"s":"e^(-at)는 s+a와 연결된다.","core":0}]},{"t":"p","ss":[{"s":"단측 변환은 t=0 이후의 인과적 응답을 다룬다.","core":0},{"s":"적분이 수렴하는 s의 영역이 필요하며, 지수함수의 경우 수렴영역은 지수 성장률보다 실수부가 큰 쪽이다.","core":0},{"s":"계단 u(t)는 0 이전에 0, 이후에 1이고, 단위임펄스 δ(t)는 폭이 0으로 줄어도 면적이 1인 이상 입력이다.","core":0},{"s":"임펄스의 높이를 보통 함수의 유한값처럼 취급하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"단위 포물선은 t²/2이므로 변환이 1/s³이다.","core":0},{"s":"일반 tⁿ은 n!/sⁿ⁺¹이고 상수 A의 변환은 A/s다.","core":0},{"s":"쌍곡선 함수는 sinh(bt)=(e^(bt)-e^(-bt))/2, cosh(bt)=(e^(bt)+e^(-bt))/2로 나누면 지수함수 표에서 유도할 수 있다.","core":0},{"s":"사인·코사인의 분모는 s²+b², 쌍곡선 함수의 분모는 s²-b²다.","core":0}]},{"t":"p","ss":[{"s":"시간 지연, 지수 곱, 미분·적분, 부분분수와 완전제곱을 이용한 역변환은 T18에서 계속한다.","core":0},{"s":"s-영역 식만 암기하지 말고 시간함수로 되돌려 검산한다.","core":0}]},{"t":"fig","src":"figures/control/t-standard-inputs.svg","title":"표준 입력 네 가지","caption":"계단·램프·포물선은 t≥0의 인과 신호다. 임펄스의 화살표 높이는 실제 유한 높이가 아니라 단위 면적을 뜻한다.","alt":"표준 입력 네 가지. 계단·램프·포물선은 t≥0의 인과 신호다. 임펄스의 화살표 높이는 실제 유한 높이가 아니라 단위 면적을 뜻한다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/control/t-laplace-shift-convolution.svg","title":"이동 정리와 계단함수 합성","caption":"시간지연은 e⁻ᵃˢ를 곱하고 e⁻ᵃᵗ의 곱은 F(s+a)로 바꾼다. 유한 펄스는 서로 다른 시각의 계단을 빼서 만든다. 회로 원본 41~42쪽 유형도 연결한다.","alt":"이동 정리와 계단함수 합성. 시간지연은 e⁻ᵃˢ를 곱하고 e⁻ᵃᵗ의 곱은 F(s+a)로 바꾼다. 유한 펄스는 서로 다른 시각의 계단을 빼서 만든다. 회로 원본 41~42쪽 유형도 연결한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-piecewise-steps.svg","title":"구간별 파형의 계단 합성","caption":"회로 원본 42쪽의 계단 합성 유형을 새 수치로 재구성했다. 각 계단 항을 변환하면 계수×e⁻ᵃˢ/s가 된다.","alt":"구간별 파형의 계단 합성. 회로 원본 42쪽의 계단 합성 유형을 새 수치로 재구성했다. 각 계단 항을 변환하면 계수×e⁻ᵃˢ/s가 된다.","width":960.0,"height":510.0},{"t":"fig","src":"figures/power/p-hydro-governor.svg","title":"조속기와 수차 유량 제어","caption":"부하가 변하면 속도 편차를 검출하고 물의 흐름을 조절한다. 급격한 밸브 조작은 수격 작용과도 관련되므로 조속·수로 동특성을 함께 고려한다.","alt":"조속기와 수차 유량 제어 — 부하가 변하면 속도 편차를 검출하고 물의 흐름을 조절한다. 급격한 밸브 조작은 수격 작용과도 관련되므로 조속·수로 동특성을 함께 고려한다.","width":960.0,"height":540.0},{"t":"m","tex":"\\mathcal{L}\\{1\\}=\\frac{1}{s},\\quad \\mathcal{L}\\{t\\}=\\frac{1}{s^2},\\quad \\mathcal{L}\\{\\delta(t)\\}=1","note":"t≥0에서 단위계단·단위램프·단위임펄스. 실제 물리 입력의 진폭이 A이면 변환에도 A를 곱한다."},{"t":"m","tex":"\\mathcal{L}\\{e^{-at}\\}=\\frac{1}{s+a},\\quad \\mathcal{L}\\{\\sin\\omega t\\}=\\frac{\\omega}{s^2+\\omega^2}","note":"a>0이면 감쇠지수. a와 ω의 단위는 s⁻¹ 또는 rad/s에 해당한다."},{"t":"m","tex":"\\mathcal{L}\\left\\{\\frac{df}{dt}\\right\\}=sF(s)-f(0^-),\\quad \\mathcal{L}\\{\\cos\\omega t\\}=\\frac{s}{s^2+\\omega^2}","note":"단측 라플라스의 통상 초기조건 표기. 교재에 따라 0 또는 0-로 쓴다."},{"t":"m","tex":"F(s)=\\int_{0^-}^{\\infty}f(t)e^{-st}\\,dt","note":"단측 라플라스의 정의. 원점 충격을 포함하도록 0- 표기를 사용한다."},{"t":"m","tex":"\\mathcal{L}\\{t^n\\}=\\frac{n!}{s^{n+1}},\\quad\\mathcal{L}\\{e^{at}\\}=\\frac{1}{s-a}","note":"n은 0 이상의 정수. t≥0인 인과함수이며 각각의 수렴영역에서 성립."},{"t":"m","tex":"\\mathcal{L}\\{\\sinh bt\\}=\\frac{b}{s^2-b^2},\\quad\\mathcal{L}\\{\\cosh bt\\}=\\frac{s}{s^2-b^2}","note":"sinh는 지수함수의 차, cosh는 합에서 얻는다."},{"t":"tb","h":["입력","시간함수","라플라스 변환"],"r":[["계단","A u(t)","A/s"],["임펄스","A δ(t)","A"],["램프","A t u(t)","A/s²"],["단위 포물선","t²u(t)/2","1/s³"],["다항식","tⁿu(t)","n!/sⁿ⁺¹"],["감쇠지수","e^(-at)u(t)","1/(s+a)"],["사인 / 코사인","sin(bt) / cos(bt)","b/(s²+b²) / s/(s²+b²)"]]},{"t":"trap","items":["상수 1의 변환과 임펄스의 변환을 바꾸지 않는다.","1/(s+a)의 역변환을 e^(+at)로 쓰지 않는다."]},{"t":"e  대응. 커패시터 전압을 되먹임하여 저항 전압을 구한다. 전달함수는 초기조건이 0일 때 정의한다.","width":960.0,"height":470.0},{"t":"m","tex":"G_{\\mathrm{series}}=G_1G_2,\\quad G_{\\mathrm{parallel}}=G_1\\pm G_2","note":"병렬은 두 경로의 입력·출력 마디가 같은 경우. 합산점 부호를 반영."},{"t":"m","tex":"T(s)=\\frac{Y(s)}{R(s)}=\\frac{G(s)}{1+G(s)H(s)}","note":"음의 피드백. G: 전향 경로, H: 피드백 경로, L=GH: 루프 전달함수."},{"t":"m","tex":"\\frac{E(s)}{R(s)}=\\frac{1}{1+G(s)H(s)}","note":"E=R-HY인 비교점 편차. H≠1이면 이것은 일반적으로 R-Y와 같지 않다."},{"t":"trap","items":["폐루프 분모를 구할 때 1+G가 아니라 1+GH인지 확인한다.","직렬 블록의 이득을 더하거나 병렬 블록의 이득을 곱하지 않는다."]},{"t":"ex","q":"G(s)=4/(s+2), H(s)=0.5인 음의 피드백계의 폐루프 전달함수는?","steps":["GH=2/(s+2).","T=[4/(s+2)]/[1+2/(s+2)]=4/(s+4)."],"a":"T(s)=4/(s+4)."},{"t":"chk","q":"전향이득 3, 피드백이득 2인 음의 피드백의 전체 이득은?","a":"3/7. G/(1+GH)=3/(1+6)."}]},{"id":"T04","title":"신호흐름선도와 Mason 공식: 비접촉 루프까지","pr":"B","min":15,"day":2,"b":[{"t":"p","ss":[{"s":"신호흐름선도는 신호를 마디로, 전달관계를 방향 있는 가지로 나타낸다.","core":1,"star":1},{"s":"입력에서 출력까지 같은 마디를 다시 지나지 않고 가는 길이 전향경로이고, 출발 마디로 돌아오는 닫힌 길이 루프다.","core":0},{"s":"루프이득에는 가지에 표시된 음수도 포함한다.","core":0}]},{"t":"p","ss":[{"s":"Mason 공식은 여러 전향경로와 루프를 묶어 전체 전달함수를 계산한다.","core":0},{"s":"서로 접촉하지 않는 루프란 공통 마디가 하나도 없는 루프다.","core":0},{"s":"그림에서 선이 교차해 보여도 그곳이 마디가 아니면 접촉 여부가 달라질 수 있다.","core":0},{"s":"실제 연결 관계를 읽어야 한다.","core":0}]},{"t":"p","ss":[{"s":"계산 순서는 모든 전향경로와 이득을 적고, 모든 단일 루프를 찾고, 서로 마디를 공유하지 않는 루프의 쌍·세 쌍 조합을 만든 다음 Δ를 구하는 것이다.","core":0},{"s":"그 뒤 각 전향경로와 닿는 루프를 전부 지워 Δk를 다시 계산한다.","core":0},{"s":"분모의 루프합은 빼고, 비접촉 두 루프 곱은 더하고, 세 루프 곱은 빼는 식으로 부호가 번갈아 바뀐다.","core":0}]},{"t":"p","ss":[{"s":"예를 들어 서로 비접촉인 루프 L1,L2,L3은 Δ=(1-L1)(1-L2)(1-L3)로 전개된다.","core":0},{"s":"이 중 L1만 전향경로와 접촉하면 Δ1=(1-L2)(1-L3)이다.","core":0},{"s":"반면 L2와 L3가 서로 접촉한다면 L2L3 항을 넣으면 안 된다.","core":0},{"s":"단순한 도형 모양보다 마디의 공통 여부가 기준이다.","core":0}]},{"t":"fig","src":"figures/control/t-signal-flow.svg","title":"신호흐름도와 비접촉 루프","caption":"반환 가지에는 피드백 부호가 포함된다. 아래 세 원은 서로 노드를 공유하지 않는 독립 루프의 개념도다.","alt":"신호흐름도와 비접촉 루프. 반환 가지에는 피드백 부호가 포함된다. 아래 세 원은 서로 노드를 공유하지 않는 독립 루프의 개념도다.","width":960.0,"height":560.0},{"t":"m","tex":"T=\\frac{\\sum_k P_k\\Delta_k}{\\Delta}","note":"Pk: k번째 전향경로 이득, Δk: 그 경로와 접촉하는 루프를 제외한 여인수."},{"t":"m","tex":"\\Delta=1-\\sum L_i+\\sum L_iL_j-\\cdots","note":"곱 항은 서로 접촉하지 않는 루프만 포함. 단일 루프에서는 Δ=1-L1."},{"t":"trap","items":["음의 피드백 루프이득은 GH가 아니라 -GH다. 단순 블록식의 L=GH 표기와 구분한다.","서로 접촉하는 루프를 비접촉 루프 곱 항에 넣지 않는다."]},{"t":"ex","q":"전향경로 이득이 5이고, 그 경로와 접촉하는 유일한 루프이득이 -2이다. 전체 전달이득은?","steps":["Δ=1-(-2)=3.","전향경로와 접촉하는 루프를 지우면 Δ1=1.","T=5×1/3."],"a":"5/3."},{"t":"ex","q":"전향경로 P1=2, 서로 비접촉인 루프 L1=-0.5,L2=-0.25가 있다. P1은 L1에만 닿는다. 전체 이득은?","steps":["Δ=1-(-0.5-0.25)+(-0.5)(-0.25)=1.875.","P1에 닿는 L1을 지우면 Δ1=1-(-0.25)=1.25.","T=2×1.25/1.875."],"a":"4/3. 전향경로와 독립인 루프 L2의 인자는 약분된다."},{"t":"chk","q":"루프이득이 -ab 하나뿐이면 Mason 분모는?","a":"1+ab. 1-(-ab)로 계산한다."}]},{"id":"T05","title":"1차계 응답: 최종값과 속도를 따로 읽기","pr":"A","min":20,"day":2,"b":[{"t":"p","ss":[{"s":"1차계 K/(τs+1)에서 K는 최종 크기, τ는 응답 속도를 정한다.","core":1,"star":1},{"s":"τ가 작을수록 빨리 반응하고, K가 커진다고 같은 형태의 응답이 반드시 빨라지는 것은 아니다.","core":0},{"s":"분모를 τs+1 형태로 정규화한 뒤 두 값을 읽는다.","core":0}]},{"t":"p","ss":[{"s":"초기값 0에서 크기 A의 계단입력을 넣으면 출력은 최종값 AK를 향해 지수적으로 접근한다.","core":0},{"s":"τ 뒤에는 변화량의 약 63.2%를 진행한다.","core":0},{"s":"여기서 63.2%는 입력의 크기 자체가 아니라 출력의 전체 변화량에 대한 비율이다.","core":0},{"s":"이득이 2라면 단위계단 최종 출력은 2다.","core":0}]},{"t":"p","ss":[{"s":"계단응답은 G(s)/s의 역변환이고 임펄스응답은 G(s) 자체의 역변환이다.","core":0},{"s":"전달함수만 보고 곧바로 계단응답이라고 읽지 않는다.","core":0},{"s":"RC·RL 회로의 같은 지수식은 회로이론에서 이미 배웠으므로 여기서는 시스템 이득과 시정수 해석에 집중한다.","core":0}]},{"t":"p","ss":[{"s":"1차계는 임펄스에 감쇠지수로 응답하고, 램프에 대해서는 충분한 시간이 지나면 기울기 AK의 직선으로 접근한다.","core":0},{"s":"입력과 출력의 이득이 1일 때 램프의 지연 거리는 Aτ다.","core":0},{"s":"계단의 10~90% 상승시간은 τ ln9≈2.197τ, 50% 지연시간은 τ ln2≈0.693τ이며, 2%와 5% 정정시간은 각각 -τ ln0.02≈3.912τ와 -τ ln0.05≈2.996τ다.","core":0}]},{"t":"fig","src":"figures/control/t-first-order.svg","title":"1차계의 단위계단 응답","caption":"정규화된 축 t/T를 사용했다. T가 작으면 같은 최종값에 더 빨리 접근한다.","alt":"1차계의 단위계단 응답. 정규화된 축 t/T를 사용했다. T가 작으면 같은 최종값에 더 빨리 접근한다.","width":960.0,"height":500.0},{"t":"m","tex":"G(s)=\\frac{K}{\\tau s+1},\\quad y(t)=AK\\left(1-e^{-t/\\tau}\\right)","note":"τ>0, 초기값 0, 입력 r(t)=A인 계단. K: 출력/입력 이득, τ: s."},{"t":"m","tex":"p=-\\frac{1}{\\tau},\\quad y(\\tau)\\simeq0.632AK","note":"p는 1차계 극점. τ가 작으면 극점이 실수축에서 더 왼쪽에 위치."},{"t":"m","tex":"g(t)=\\frac{K}{\\tau}e^{-t/\\tau},\\quad y_{\\mathrm{ramp}}(t)=AK\\left[t-\\tau+\\tau e^{-t/\\tau}\\right]","note":"g는 단위임펄스 응답, 두 번째는 r(t)=At인 램프 응답. 초기상태 0, τ>0."},{"t":"trap","items":["G=6/(2s+3)에서 K를 6, τ를 2로 읽지 않는다. 상수항 3으로 나눈다.","출력이 63.2%에 도달하는 기준은 초기값에서 최종값까지의 변화량이다."]},{"t":"ex","q":"G(s)=6/(2s+3)에 단위계단을 인가한다. K, τ, 최종값은?","steps":["분자·분모를 3으로 나누면 G=2/[(2/3)s+1].","K=2, τ=2/3 s, 최종 출력=2.","τ 뒤 출력은 2×0.632≈1.264."],"a":"K=2, τ=2/3 s, 최종값 2."},{"t":"chk","q":"G(s)=1/(0.2s+1)의 극점은 어디인가?","a":"s=-5. 극점은 -1/τ이다."}]},{"id":"T06","title":"2차계 감쇠비와 고유주파수","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"2차 분모의 최고차항을 1로 만든 뒤 상수항에서 고유주파수, s항에서 감쇠비를 읽는다.","core":1,"star":1},{"s":"표준형은 s²+2ζωn s+ωn²다.","core":0},{"s":"상수항은 ωn이 아니라 ωn²이므로 먼저 제곱근을 취해야 한다.","core":0}]},{"t":"p","ss":[{"s":"ζ는 무차원인 감쇠비다.","core":0},{"s":"0<ζ<1이면 감쇠진동, ζ=1이면 임계감쇠, ζ>1이면 과감쇠다.","core":0},{"s":"ζ=0이면 감쇠가 없는 이상적인 지속진동이며, ζ<0에서는 진폭이 커지는 불안정 응답이 생긴다.","core":0},{"s":"양의 감쇠비에서 부족감쇠라는 말은 안정성이 부족하다는 뜻이 아니다.","core":0}]},{"t":"p","ss":[{"s":"ωn은 비감쇠 고유각주파수이며 실제 감쇠진동의 각주파수는 ωd다.","core":0},{"s":"제어기나 영점이 추가된 일반적인 고차 시스템에 표준 2차 공식이 정확히 성립하는 것은 아니다.","core":0},{"s":"시험에서 표준 2차계 또는 우세한 두 극점 근사라는 조건이 있을 때 응답지표 공식을 사용한다.","core":0}]},{"t":"p","ss":[{"s":"응답식은 Y(s)=T(s)/s를 부분분수로 나누어 얻는다.","core":0},{"s":"부족감쇠는 두 복소극점의 지수·사인 합, 임계감쇠는 중근에 따른 t 지수항, 과감쇠는 서로 다른 두 감쇠지수의 합이다.","core":0},{"s":"ζ=0이면 y(t)=1-cos(ωnt)로 영원히 진동한다.","core":0},{"s":"감쇠진동 주파수 ωd와 주파수응답에서 이득이 가장 큰 공진주파수 ωr는 다르며 T21에서 비교한다.","core":0}]},{"t":"fig","src":"figures/control/t-poles-response.svg","title":"극점과 시간응답의 대응","caption":"그림은 대표적인 자연모드 또는 단위계단 출력의 형태다. 순허수 단순극은 지속진동하며 BIBO 안정과 같은 뜻이 아니다. 허수축 중복극은 일반적으로 발산한다.","alt":"극점과 시간응답의 대응. 그림은 대표적인 자연모드 또는 단위계단 출력의 형태다. 순허수 단순극은 지속진동하며 BIBO 안정과 같은 뜻이 아니다. 허수축 중복극은 일반적으로 발산한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-second-order.svg","title":"2차계 감쇠비별 응답","caption":"같은 고유주파수·단위 DC 이득에서 비교한다. 0<ζ<1은 부족감쇠, ζ=1은 임계감쇠, ζ>1은 과감쇠다.","alt":"2차계 감쇠비별 응답. 같은 고유주파수·단위 DC 이득에서 비교한다. 0<ζ<1은 부족감쇠, ζ=1은 임계감쇠, ζ>1은 과감쇠다.","width":960.0,"height":560.0},{"t":"m","tex":"T(s)=\\frac{\\omega_n^2}{s^2+2\\zeta\\omega_ns+\\omega_n^2}","note":"정상상태 이득 1인 표준 2차계. ζ 무차원, ωn rad/s."},{"t":"m","tex":"\\omega_d=\\omega_n\\sqrt{1-\\zeta^2}","note":"0<ζ<1인 부족감쇠에서 실제 감쇠진동 각주파수."},{"t":"m","tex":"s_{1,2}=-\\zeta\\omega_n\\pm j\\omega_d","note":"부족감쇠 극점. 실수부가 음수면 진폭이 시간에 따라 감소."},{"t":"m","tex":"y(t)=1-\\frac{e^{-\\zeta\\omega_nt}}{\\sqrt{1-\\zeta^2}}\\sin(\\omega_dt+\\theta),\\quad\\theta=\\cos^{-1}\\zeta","note":"표준 2차계의 단위계단 응답, 0<ζ<1, 초기상태 0."},{"t":"m","tex":"y(t)=1-(1+\\omega_nt)e^{-\\omega_nt}","note":"ζ=1인 임계감쇠 단위계단 응답. 중근 때문에 t e^(-ωnt) 항이 생긴다."},{"t":"m","tex":"y(t)=1-\\frac{\\beta e^{-\\alpha t}-\\alpha e^{-\\beta t}}{\\beta-\\alpha}","note":"ζ>1. α=ωn(ζ-√(ζ²-1)), β=ωn(ζ+√(ζ²-1)), 0<α<β."},{"t":"trap","items":["감쇠비 ζ를 마찰·감쇠계수 그 자체와 같은 단위량으로 외우지 않는다.","계수가 모두 양수라는 이유만으로 임의의 고차 시스템 안정성을 단정하지 않는다."]},{"t":"ex","q":"특성다항식이 2s²+8s+8이다. ωn과 ζ, 제동상태는?","steps":["2로 나누면 s²+4s+4.","ωn²=4에서 ωn=2 rad/s. 2ζωn=4에서 ζ=1.","임계감쇠이다."],"a":"ωn=2 rad/s, ζ=1, 임계감쇠."},{"t":"chk","q":"분모가 s²+4s+16이면 감쇠비는?","a":"ωn=4, 2ζ×4=4이므로 ζ=0.5. 부족감쇠다."}]},{"id":"T07","title":"상승·지연·정정·최대오버슈트","pr":"A","min":20,"day":2,"b":[{"t":"p","ss":[{"s":"지연시간은 최종값의 50%에 처음 도달하는 시간, 정정시간은 정해진 오차띠 안에 들어가 계속 머무는 시간이다.","core":1,"star":1},{"s":"상승시간은 문항이 정한 두 수준 사이를 지나는 시간이다.","core":0},{"s":"10~90% 정의와 부족감쇠계의 첫 0~100% 정의가 함께 쓰이므로 제시 조건을 따른다.","core":0}]},{"t":"p","ss":[{"s":"최대오버슈트는 최종값을 얼마나 초과하는지 나타낸다.","core":0},{"s":"최고점의 출력값 자체와 초과량, 초과 비율을 구별한다.","core":0},{"s":"최종값이 10이고 최고점이 12라면 최고 출력은 12, 초과량은 2, 백분율 오버슈트는 20%다.","core":0},{"s":"최종값 0처럼 비율 정의가 곤란한 경우에는 다른 지표가 필요하다.","core":0}]},{"t":"p","ss":[{"s":"표준 부족감쇠 2차계에서는 ζ가 커지면 오버슈트가 줄고, ζωn이 커지면 대체로 정정시간이 짧아진다.","core":0},{"s":"그러나 ζ가 1을 넘어가는 과감쇠 영역까지 이 근사식을 무작정 연장하거나, 영점이 큰 영향을 주는 시스템에 그대로 적용하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"감쇠비 ζ와 두 봉우리의 비를 같은 기호로 부르는 관례가 있으므로 정의를 확인한다.","core":0},{"s":"ζ는 표준 분모의 무차원 damping ratio이고, 제2의 양의 오버슈트를 제1의 양의 오버슈트로 나눈 값은 한 진동주기 동안의 진폭 감소비다.","core":0},{"s":"최고 출력 자체의 비가 아니라 최종값에서 떨어진 편차의 비를 쓴다.","core":0}]},{"t":"p","ss":[{"s":"첫 봉우리 시간은 응답을 미분하여 y′(t)=0으로 두면 sin(ωdt)=0에서 처음 양의 극대인 ωdt=π가 되어 얻는다.","core":0},{"s":"지연시간과 10~90% 상승시간은 해당 레벨 방정식을 풀어 구한다.","core":0},{"s":"일반 2차계에서 모든 레벨에 대한 단순 정확식이 있는 것은 아니다.","core":0}]},{"t":"fig","src":"figures/control/t-response-indices.svg","title":"과도응답의 측정 위치","caption":"표준 부족감쇠 응답을 계산해 그렸다. 정정시간은 마지막으로 허용띠를 벗어난 뒤의 시각이며 상승시간의 정의는 문제 기준을 따른다.","alt":"과도응답의 측정 위치. 표준 부족감쇠 응답을 계산해 그렸다. 정정시간은 마지막으로 허용띠를 벗어난 뒤의 시각이며 상승시간의 정의는 문제 기준을 따른다.","width":960.0,"height":600.0},{"t":"m","tex":"M_p=e^{-\\pi\\zeta/\\sqrt{1-\\zeta^2}}","note":"표준 2차계 단위계단의 오버슈트 비율. 백분율은 100Mp. 0<ζ<1."},{"t":"m","tex":"t_p=\\frac{\\pi}{\\omega_d},\\quad t_s\\simeq\\frac{4}{\\zeta\\omega_n}","note":"tp: 첫 최대값 시간 s. ts: 2% 정정시간의 통상 근사. 표준 부족감쇠 2차계 조건."},{"t":"m","tex":"M_p(\\%)=\\frac{y_{\\max}-y_\\infty}{y_\\infty}\\times100","note":"양의 비영 최종값에 대한 통상 정의. 실제 그래프 문제에서는 제시 기준을 우선."},{"t":"m","tex":"t_{r,0\\to100}=\\frac{\\pi-\\cos^{-1}\\zeta}{\\omega_d}","note":"표준 부족감쇠 2차계에서 처음으로 최종값에 도달하는 0~100% 상승시간. 10~90% 정의에는 그대로 쓰지 않는다."},{"t":"m","tex":"t_s\\leq\\frac{-\\ln(\\varepsilon\\sqrt{1-\\zeta^2})}{\\zeta\\omega_n}","note":"오차 진동의 포락선을 사용한 보장 시간. 0<ζ<1, 최종값 1, 허용띠 ±ε. 실제 정정시간은 이 값 이하이며 등호로 계산한 값을 보수적 추정치로 쓴다."},{"t":"m","tex":"\\frac{A_{k+1}}{A_k}=e^{-2\\pi\\zeta/\\sqrt{1-\\zeta^2}},\\quad\\delta=\\ln\\frac{A_k}{A_{k+1}}=\\frac{2\\pi\\zeta}{\\sqrt{1-\\zeta^2}}","note":"최종값을 기준으로 같은 방향의 연속 두 봉우리 편차 Ak를 비교. δ는 로그감쇠율이다."},{"t":"trap","items":["2%와 5% 정정시간을 같은 숫자로 계산하지 않는다. 5%에는 흔히 3/(ζωn) 근사를 쓴다.","정정시간은 오차띠에 처음 스치고 나오는 시간이 아니다."]},{"t":"ex","q":"표준 2차계의 ζ=0.5, ωn=4 rad/s이다. 2% 정정시간 근삿값은? 별도의 그래프에서 최종값 5, 최고점 6이면 오버슈트는?","steps":["ts≈4/(0.5×4)=2 s.","그래프의 오버슈트는 (6-5)/5×100=20%."],"a":"정정시간 약 2 s, 그래프 오버슈트 20%."},{"t":"chk","q":"응답이 최종값 10의 9.8~10.2 범위에 들어가 계속 머무르게 되는 시간을 무엇이라 하는가?","a":"2% 정정시간. ±0.2가 최종값 10의 ±2%다."}]},{"id":"T08","title":"초기값·최종값 정리와 적용 불가 사례","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"최종값 정리는 역라플라스 없이 충분히 지난 값을 구하지만, 먼저 실제로 수렴할 조건을 확인해야 한다.","core":1,"star":1},{"s":"유리함수에서는 약분한 sF(s)의 모든 극점이 열린 좌반평면에 있으면 최종값 정리를 적용할 수 있다.","core":0},{"s":"F(s) 자체는 원점에 단순극을 가질 수 있다.","core":0}]},{"t":"p","ss":[{"s":"공식에 s=0을 대입해 숫자가 나왔다고 실제 최종값이 존재하는 것은 아니다.","core":0},{"s":"f(t)=sin t는 계속 진동하여 최종값이 없지만 s/(s²+1)에 s→0을 넣으면 0처럼 보인다.","core":0},{"s":"허수축 극점 때문에 정리의 조건이 성립하지 않는 것이다.","core":0}]},{"t":"p","ss":[{"s":"전달함수 G(s)만 주어졌다면 원하는 출력 F(s) 또는 Y(s)를 먼저 만들어야 한다.","core":0},{"s":"단위계단 출력은 G(s)/s다.","core":0},{"s":"초기값 정리는 보통 유한한 초기값을 갖고 원점에서 충격성 성분이 없는 응답에 적용한다.","core":0},{"s":"직접 전달항이나 이상 미분 때문에 임펄스가 생기는 경우에는 단순한 초기값 해석에 주의한다.","core":0}]},{"t":"fig","src":"figures/control/t-steady-error.svg","title":"계단·램프 정상편차의 기하적 의미","caption":"왼쪽은 출력 DC 이득 0.8인 예, 오른쪽은 단위 시간상수 1차 지연의 램프 추종 예이다. 세로 간격이 오차다.","alt":"계단·램프 정상편차의 기하적 의미. 왼쪽은 출력 DC 이득 0.8인 예, 오른쪽은 단위 시간상수 1차 지연의 램프 추종 예이다. 세로 간격이 오차다.","width":960.0,"height":520.0},{"t":"m","tex":"f(\\infty)=\\lim_{s\\to0}sF(s)","note":"약분한 sF(s)의 극점이 모두 Re(s)<0인 등 수렴 조건이 만족되는 유리함수에 적용."},{"t":"m","tex":"f(0^+)=\\lim_{s\\to\\infty}sF(s)","note":"초기값이 유한하고 0 부근에서 통상 초기값 정리의 조건이 성립할 때. 충격성 응답은 별도 처리."},{"t":"trap","items":["원점극이 하나 있다는 이유만으로 최종값 정리를 무조건 금지하지 않는다. sF(s)를 검사한다.","우반평면·허수축 극점이 남아 있는데 대입한 숫자를 최종값이라고 쓰지 않는다."]},{"t":"ex","q":"F(s)=10/[s(s+2)]의 초기값과 최종값을 구하라.","steps":["sF=10/(s+2)의 극점은 -2이므로 최종값 정리 사용 가능.","최종값은 10/2=5.","초기값은 s→∞에서 10/(s+2)→0."],"a":"초기값 0, 최종값 5."},{"t":"chk","q":"F(s)=1/(s²+4)에 최종값 정리를 적용해 0이라고 해도 되는가?","a":"안 된다. sF(s)에 ±j2 극점이 남고 시간응답은 지속진동하므로 최종값이 없다."}]},{"id":"T09","title":"정상위치편차: 단위계단 문제의 한 줄 계산","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"정상위치편차는 계단입력에 대한 충분히 지난 오차다.
