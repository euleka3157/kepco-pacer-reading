","core":0},{"s":"SRAM은 상태 유지에 주기적인 refresh가 필요 없고 빠르지만 비싸며, DRAM은 커패시터 전하를 이용하여 refresh가 필요하고 집적도가 높다.","core":0},{"s":"캐시는 보통 SRAM, 주기억장치는 보통 DRAM으로 구현한다.","core":0}]},{"t":"p","ss":[{"s":"ROM 계열과 플래시 메모리는 전원이 없어도 내용을 유지하는 비휘발성 저장이다.","core":0},{"s":"ROM이라는 분류를 ‘어떠한 방식으로도 다시 기록할 수 없다’고 일반화하면 안 된다.","core":0},{"s":"EPROM, EEPROM, 플래시는 각자의 방법으로 지우거나 다시 쓸 수 있다.","core":0}]},{"t":"tb","h":["기억장치","refresh","보통의 특징"],"r":[["SRAM","불필요","휘발성, 빠름, 캐시에 사용"],["DRAM","필요","휘발성, 주기억장치에 사용"],["ROM 계열","DRAM식 refresh 불필요","비휘발성, 종류별 기록·소거 방식 다름"],["플래시","DRAM식 refresh 불필요","비휘발성, 블록 단위 소거"]]},{"t":"trap","items":["정적 RAM의 정적은 비휘발성이라는 뜻이 아니다.","캐시와 가상기억장치는 다른 개념이다."]},{"t":"ex","q":"전원을 끄면 사라지지만 refresh는 필요 없는 메모리는?","steps":["휘발성이므로 ROM·플래시를 제외한다.","DRAM은 refresh가 필요하다."],"a":"SRAM"},{"t":"chk","q":"DRAM이 refresh를 필요로 하는 이유는?","a":"저장된 전하가 누설되어 정보를 잃을 수 있어 주기적으로 복원해야 하기 때문이다."}]},{"id":"D18","title":"캐시: 지역성·적중률·쓰기 정책","pr":"A","min":20,"day":5,"b":[{"t":"p","ss":[{"s":"캐시는 CPU가 최근 사용했거나 곧 사용할 가능성이 큰 명령·데이터를 가까운 빠른 기억장치에 보관한다.","core":1},{"s":"같은 것을 곧 다시 쓰는 성질은 시간적 지역성, 가까운 주소를 이어 쓰는 성질은 공간적 지역성이다.","core":0},{"s":"반복문 변수 재사용과 배열 순회로 각각 기억한다.","core":0}]},{"t":"p","ss":[{"s":"원하는 데이터가 캐시에 있으면 hit, 없으면 miss다.","core":0},{"s":"적중률은 hit 횟수/전체 접근 횟수다.","core":0},{"s":"평균 접근시간은 보통 hit 시간에 miss율×추가 miss penalty를 더한다.","core":0},{"s":"문제에서 miss 시간이 총시간인지 추가 지연인지에 따라 같은 숫자를 두 번 더하지 않아야 한다.","core":0}]},{"t":"p","ss":[{"s":"직접 사상은 메모리 블록이 들어갈 캐시 위치가 하나로 정해지고, 완전 연관은 어느 위치에도 들어갈 수 있다.","core":0},{"s":"집합 연관은 지정된 집합 안 여러 위치 중 하나에 들어간다.","core":0},{"s":"write-through는 하위 기억장치에도 함께 쓰고, write-back은 바뀐 블록을 표시한 뒤 교체 시 내려보낸다.","core":0}]},{"t":"m","tex":"h=\\frac{N_{\\mathrm{hit}}}{N_{\\mathrm{access}}},\\qquad r_{\\mathrm{miss}}=1-h","note":"h와 r은 0~1의 비율. 퍼센트를 계산에 넣을 때 100으로 나눈다."},{"t":"m","tex":"\\mathrm{AMAT}=t_{\\mathrm{hit}}+(1-h)t_{\\mathrm{penalty}}","note":"penalty는 miss 때 추가되는 시간으로 정의했을 때의 식."},{"t":"tb","h":["개념","핵심 구분","대표 예"],"r":[["시간적 지역성","같은 주소를 곧 재사용","반복문 안 같은 변수"],["공간적 지역성","인접 주소를 연속 사용","배열을 순서대로 읽기"],["write-through","하위 저장에도 즉시 반영","일관성 관리가 비교적 단순"],["write-back","교체 등 때 나중에 반영","dirty 표시 필요"]]},{"t":"trap","items":["캐시 용량을 늘리면 언제나 hit 시간이 줄어든다는 보장은 없다.","miss penalty가 총 miss 시간인지 추가 시간인지 반드시 구별한다."]},{"t":"ex","q":"hit 1ns, 적중률 90%, 추가 miss penalty 20ns이면 평균 시간은?","steps":["miss율은 0.1이다.","AMAT=1+0.1×20이다."],"a":"3ns"},{"t":"chk","q":"같은 명령어가 반복문에서 계속 사용되는 것은 어떤 지역성인가?","a":"시간적 지역성이다."}]},{"id":"D19","title":"인터럽트·DMA·입출력 방식","pr":"B","min":15,"day":5,"b":[{"t":"p","ss":[{"s":"폴링은 CPU가 장치 상태를 반복 확인하는 방식이다.","core":1},{"s":"인터럽트는 장치나 사건이 CPU에 처리가 필요함을 알리는 방식이다.","core":0},{"s":"인터럽트가 발생하면 필요한 실행 상태를 보존하고 처리 루틴으로 이동한 뒤 복귀한다.","core":0}]},{"t":"p","ss":[{"s":"DMA는 대량 데이터 전송의 각 바이트를 CPU가 일일이 처리하지 않도록 별도 제어기가 메모리와 장치 사이 전송을 수행하는 방식이다.","core":0},{"s":"CPU는 초기 설정이나 완료 처리에 관여할 수 있다.","core":0},{"s":"따라서 DMA는 CPU가 전혀 관여하지 않는 모든 작업이라는 뜻이 아니다.","core":0}]},{"t":"p","ss":[{"s":"인터럽트는 예외·우선순위·마스크 가능 여부 등의 분류가 있지만, 5일 학습에서는 폴링과의 차이 및 DMA의 목적을 먼저 외운다.","core":0},{"s":"전기 계측 데이터 취득을 컴퓨터가 처리한다는 맥락에서 각 역할을 연결한다.","core":0}]},{"t":"tb","h":["방식","누가 언제 확인하는가","주요 특징"],"r":[["폴링","CPU가 반복 확인","구조 단순, 확인하는 시간 소요"],["인터럽트","필요한 사건이 CPU에 통지","상태 보존·처리·복귀"],["DMA","전송 제어기가 대량 전송","CPU의 반복 데이터 이동 부담 감소"]]},{"t":"trap","items":["인터럽트가 오면 무조건 모든 현재 상태를 잃는 것이 아니다.","DMA도 초기 주소·길이 설정 등에는 CPU가 관여할 수 있다."]},{"t":"ex","q":"CPU가 장치 완료 비트를 계속 읽는 방식은?","steps":["장치가 먼저 통지하는 형태가 아니라 CPU가 반복 확인한다."],"a":"폴링"},{"t":"chk","q":"DMA의 주요 목적은?","a":"대량 전송에서 CPU의 데이터 이동 부담을 줄이는 것이다."}]},{"id":"D20","title":"ADC·DAC·표본화의 최소 개념","pr":"B","min":15,"day":5,"b":[{"t":"p","ss":[{"s":"ADC는 아날로그 입력을 디지털 코드로, DAC는 디지털 코드를 아날로그 출력으로 바꾼다.","core":1},{"s":"ADC의 비트 수가 커지면 같은 입력 범위를 더 많은 구간으로 나누어 양자화 간격을 줄일 수 있다.","core":0},{"s":"분해능 증가와 변환 속도 증가는 같은 말이 아니다.","core":0}]},{"t":"p","ss":[{"s":"이상적인 n비트 ADC에는 2^n개 코드가 있다.","core":0},{"s":"입력 범위를 균등 구간으로 나눈 ADC의 1LSB는 범위/2^n으로 정의한다.","core":0},{"s":"DAC에서 최댓값 코드를 정확히 정격 최대전압에 맞추는 끝점 정의를 쓰면 분모가 2^n-1인 식도 있으므로 장치와 문제 정의를 확인한다.","core":0}]},{"t":"p","ss":[{"s":"대역 제한 신호를 복원하려면 표본화 주파수를 신호 최고 주파수의 두 배보다 크게 잡는 기본 조건이 필요하다.","core":0},{"s":"조건을 만족하지 못하면 고주파가 다른 낮은 주파수처럼 보이는 aliasing이 생길 수 있다.","core":0},{"s":"실제 설계에서는 경계와 필터 여유가 필요하다.","core":0}]},{"t":"m","tex":"\\Delta=\\frac{V_{\\max}-V_{\\min}}{2^n}","note":"이상적인 균등 양자화 ADC의 구간 폭. 과부하·포화가 없는 유효 입력 범위의 이상적인 반올림 모델에서는 양자화 오차가 ±Δ/2 이내다."},{"t":"m","tex":"f_s>2f_{\\max}","note":"대역 제한 신호의 기본 표본화 조건. 등호 경계에서 모든 신호가 항상 안전하다고 외우지 않는다."},{"t":"trap","items":["ADC와 DAC의 변환 방향을 바꾸지 않는다.","2^n과 2^n-1은 정의에 따라 구별해야 한다."]},{"t":"ex","q":"입력 범위가 0~8V인 이상적인 3비트 균등 ADC의 1LSB는?","steps":["코드는 8개다.","범위 8V를 8구간으로 나눈다."],"a":"1V"},{"t":"chk","q":"샘플링 전에 신호의 고주파 성분을 제한하는 필터의 목적은?","a":"aliasing을 줄이기 위해서다."}]}]},{"num":"06","title":"누락 보충","acc":"#DB2777","day":0,"secs":[{"id":"X01","title":"Y↔Δ 부하 등가 변환","pr":"A","min":12,"day":1,"b":[{"t":"p","ss":[{"s":"평형 부하라면 Δ 한 변의 임피던스는 Y 한 상 임피던스의 3배다.","core":1,"star":1},{"s":"Y를 Δ로 바꾸면 3배, Δ를 Y로 바꾸면 1/3이다.","core":0},{"s":"단자 밖에서 본 전압·전류·전력이 같도록 바꾸는 것이므로, 변환 뒤에도 선전류와 소비전력은 그대로다.","core":0}]},{"t":"p","ss":[{"s":"불평형일 때 Δ→Y는 '구하려는 단자에 붙은 두 변의 곱 / 세 변의 합'이다.","core":0},{"s":"반대로 Y→Δ는 '두 개씩 곱한 세 항의 합 / 마주 보는 Y 임피던스'다.","core":0},{"s":"이름이 헷갈리면 평형 조건을 넣어 3배 또는 1/3이 나오는지 확인한다.","core":0}]},{"t":"p","ss":[{"s":"3상 문제에서 부하 임피던스는 항상 상 기준으로 해석한다.","core":0},{"s":"Δ 부하에 선간전압이 그대로 걸리고, Y 부하에는 선간전압/√3이 걸린다는 점을 C14와 연결한다.","core":0}]},{"t":"m","tex":"Z_{\\Delta}=3Z_{Y},\\qquad Z_{Y}=\\frac{Z_{\\Delta}}{3}","note":"평형 부하에서만 성립. 저항·리액턴스 모두 같은 비율."},{"t":"m","tex":"Z_a=\\frac{Z_{ab}Z_{ca}}{Z_{ab}+Z_{bc}+Z_{ca}}","note":"Δ→Y. a 단자에 붙은 두 변 Z_ab, Z_ca의 곱을 세 변의 합으로 나눈다."},{"t":"m","tex":"Z_{ab}=\\frac{Z_aZ_b+Z_bZ_c+Z_cZ_a}{Z_c}","note":"Y→Δ. 분모는 변 ab와 마주 보는 Y 임피던스 Z_c."},{"t":"trap","items":["Δ→Y로 바꿀 때 3배로 키우는 실수가 가장 흔하다. Δ가 더 크다.","변환 뒤 상전압이 바뀌므로 상전류를 다시 계산해야 한다. 선전류와 전력만 같다."]},{"t":"ex","q":"평형 Δ 부하의 한 변이 30 Ω이다. 등가 Y 부하 한 상의 저항과, 선간전압 300 V일 때 선전류는?","steps":["Z_Y=30/3=10 Ω.","Y 상전압=300/√3≈173.2 V, 선전류=173.2/10≈17.3 A."],"a":"10 Ω, 약 17.3 A (Δ로 직접 계산해도 300/30×√3≈17.3 A)."},{"t":"chk","q":"평형 Y 부하 한 상이 8 Ω일 때 등가 Δ 한 변은?","a":"24 Ω. Y→Δ는 3배다."}]},{"id":"X02","title":"전력 측정: 3전압계법·3전류계법·2전력계법","pr":"A","min":15,"day":1,"b":[{"t":"p","ss":[{"s":"3전압계법은 저항 R을 부하와 직렬로, 3전류계법은 R을 부하와 병렬로 둔다.","core":1,"star":1},{"s":"둘 다 '전체 값의 제곱에서 나머지 두 값의 제곱을 뺀다'는 같은 모양이다.","core":0},{"s":"다만 3전압계법은 2R로 나누고, 3전류계법은 R/2를 곱한다.","core":0}]},{"t":"p","ss":[{"s":"3전압계법에서 V1은 전원 전체, V2는 R 양단, V3은 부하 양단 전압이다.","core":0},{"s":"3전류계법에서 A1은 전체 전류, A2·A3은 각 가지 전류다.","core":0},{"s":"역률은 같은 분자를 '두 나머지 값의 곱의 2배'로 나눈다.","core":0}]},{"t":"p","ss":[{"s":"2전력계법은 3상 3선식 전력을 전력계 두 개로 재는 방법이다.","core":0},{"s":"두 지시값의 합이 3상 유효전력이고, 차에 √3을 곱하면 무효전력이다.","core":0},{"s":"한쪽 지시가 0이면 역률 0.5, 두 지시가 같으면 역률 1이다.","core":0}]},{"t":"m","tex":"P=\\frac{V_1^2-V_2^2-V_3^2}{2R},\\qquad \\cos\\theta=\\frac{V_1^2-V_2^2-V_3^2}{2V_2V_3}","note":"3전압계법. R은 부하와 직렬. V1 전체, V2 저항, V3 부하 전압."},{"t":"m","tex":"P=\\frac{R}{2}\\left(A_1^2-A_2^2-A_3^2\\right),\\qquad \\cos\\theta=\\frac{A_1^2-A_2^2-A_3^2}{2A_2A_3}","note":"3전류계법. R은 부하와 병렬. A1 전체 전류."},{"t":"m","tex":"P=W_1+W_2,\\quad Q=\\sqrt{3}\\,(W_1-W_2),\\quad \\cos\\theta=\\frac{W_1+W_2}{2\\sqrt{W_1^2+W_2^2-W_1W_2}}","note":"2전력계법(3상 3선식, 평형 부하 기준)."},{"t":"tb","h":["방법","R 연결","전력식 계수"],"r":[["3전압계법","부하와 직렬","1/(2R)"],["3전류계법","부하와 병렬","R/2"],["2전력계법","전력계 2대","합=P, 차×√3=Q"]]},{"t":"trap","items":["3전압계에서 R/2를 곱하거나 3전류계에서 2R로 나누는 혼동. 직렬은 전압, 병렬은 전류로 짝지어 기억한다.","2전력계법에서 W1-W2에 √3을 빠뜨리면 무효전력이 틀린다."]},{"t":"ex","q":"2전력계법으로 W1=6 kW, W2=3 kW를 읽었다. 3상 유효전력과 역률은?","steps":["P=6+3=9 kW.","√(36+9-18)=√27≈5.196, cosθ=9/(2×5.196)≈0.866."],"a":"9 kW, 역률 약 0.866."},{"t":"chk","q":"2전력계법에서 한 전력계 지시가 0이었다. 부하 역률은?","a":"0.5. W2=0이면 cosθ=W1/(2W1)=0.5."}]},{"id":"X03","title":"정저항 회로와 줄의 법칙(kcal 환산)","pr":"A","min":10,"day":1,"b":[{"t":"p","ss":[{"s":"정저항 회로는 L과 C가 섞여 있어도 주파수와 상관없이 입력 임피던스가 순저항 R이 되는 회로다.","core":1,"star":1},{"s":"조건은 R²=L/C, 즉 R=√(L/C)다.","core":0},{"s":"문제에서 R과 C가 주어지고 L을 물으면 L=R²C로 바로 구한다.","core":0}]},{"t":"p","ss":[{"s":"줄의 법칙은 저항에서 나는 열량이 I²Rt에 비례한다는 법칙이다.","core":0},{"s":"1 J=0.24 cal이므로 H=0.24I²Rt [cal]이고, 전력량으로는 1 kWh=860 kcal이다.","core":0},{"s":"전열기 계산(X11)과 같은 860을 쓴다.","core":0}]},{"t":"m","tex":"R^2=\\frac{L}{C},\\qquad R=\\sqrt{\\frac{L}{C}}","note":"정저항 회로 조건. 이때 입력 임피던스는 주파수에 무관하게 R."},{"t":"m","tex":"H=0.24I^2Rt\\ \\mathrm{[cal]},\\qquad 1\\ \\mathrm{kWh}=860\\ \\mathrm{kcal}","note":"t는 초. 1 kWh=3.6×10⁶ J, 3.6×10⁶×0.24=864≈860 kcal."},{"t":"trap","items":["0.24는 J→cal, 860은 kWh→kcal. 단위가 시간(h)인지 초(s)인지 먼저 본다.","정저항 조건을 R=L/C로 쓰면 단위가 맞지 않는다. 제곱근이 필요하다."]},{"t":"ex","q":"L=4 mH, C=10 μF로 정저항 회로를 만들 R은? 또 2 kW 전열기를 3시간 쓰면 열량은?","steps":["R=√(4×10⁻³/10×10⁻⁶)=√400=20 Ω.","2×3=6 kWh, 6×860=5160 kcal."],"a":"20 Ω, 5160 kcal."},{"t":"chk","q":"R=10 Ω, C=20 μF인 정저항 회로의 L은?","a":"L=R²C=100×20×10⁻⁶=2 mH."}]},{"id":"X04","title":"파고율·파형률과 푸리에 대칭성","pr":"B","min":10,"day":1,"b":[{"t":"p","ss":[{"s":"파고율=최댓값/실효값, 파형률=실효값/평균값이다.","core":1,"star":1},{"s":"'고'는 꼭대기(최댓값)를 위에, '형'은 실효값을 위에 둔다.","core":0},{"s":"정현파는 파고율 √2≈1.414, 파형률 1.11이고, 구형파는 둘 다 1이다.","core":0}]},{"t":"p","ss":[{"s":"비정현 주기파의 푸리에 급수에서 우함수(y축 대칭)는 직류와 cos항만, 기함수(원점 대칭)는 sin항만 남는다.","core":0},{"s":"반파대칭(반주기 이동 시 부호 반전)이면 홀수차 고조파만 남고 직류는 0이다.","core":0}]},{"t":"m","tex":"\\mathrm{crest}=\\frac{X_m}{X_{rms}},\\qquad \\mathrm{form}=\\frac{X_{rms}}{X_{avg}}","note":"crest=파고율, form=파형률."},{"t":"tb","h":["파형","파고율","파형률"],"r":[["정현파","√2 ≈ 1.414","π/(2√2) ≈ 1.111"],["정현반파","2","π/2 ≈ 1.571"],["구형파","1","1"],["삼각파·톱니파","√3 ≈ 1.732","2/√3 ≈ 1.155"]]},{"t":"trap","items":["파형률 분모는 '반주기 평균'이다. 정현파 한 주기 평균 0을 넣으면 무한대가 된다.","구형파는 파고율·파형률 모두 1로 가장 작다."]},{"t":"ex","q":"삼각파의 최댓값이 30 V다. 실효값은?","steps":["파고율 √3이므로 실효값=30/√3."],"a":"약 17.3 V."},{"t":"chk","q":"반파대칭 파형에 포함될 수 없는 성분 두 가지는?","a":"직류 성분과 짝수차 고조파."}]},{"id":"X05","title":"임피던스(Z)·어드미턴스(Y) 파라미터","pr":"A","min":15,"day":1,"b":[{"t":"p","ss":[{"s":"Z 파라미터는 전류를 넣어 전압을 보는 표현이고 T형 회로에서 읽기 쉽다.","core":1,"star":1},{"s":"Y 파라미터는 전압을 넣어 전류를 보는 표현이고 π형 회로에서 읽기 쉽다.","core":0},{"s":"C18의 ABCD(4단자 정수)와 다른 표현이지만 같은 2단자쌍망을 나타낸다.","core":0}]},{"t":"p","ss":[{"s":"T형 회로에서 왼쪽 직렬 Z1, 오른쪽 직렬 Z2, 가운데 병렬 Z3이라면 Z11=Z1+Z3, Z22=Z2+Z3, Z12=Z21=Z3이다.","core":0},{"s":"공통으로 지나는 가운데 가지가 상호 임피던스가 된다.","core":0}]},{"t":"p","ss":[{"s":"π형 회로에서 양쪽 병렬 어드미턴스 Y1, Y2, 가운데 직렬 Y3이라면 Y11=Y1+Y3, Y22=Y2+Y3, Y12=Y21=-Y3이다.","core":0},{"s":"상호 항에 음수가 붙는 점이 Z 파라미터와 다르다.","core":0}]},{"t":"m","tex":"V_1=Z_{11}I_1+Z_{12}I_2,\\qquad V_2=Z_{21}I_1+Z_{22}I_2","note":"두 포트 모두 전류가 들어가는 방향을 +로 둔 표준 정의."},{"t":"m","tex":"Z_{11}=Z_1+Z_3,\\quad Z_{22}=Z_2+Z_3,\\quad Z_{12}=Z_{21}=Z_3","note":"T형 회로."},{"t":"m","tex":"Y_{11}=Y_1+Y_3,\\quad Y_{22}=Y_2+Y_3,\\quad Y_{12}=Y_{21}=-Y_3","note":"π형 회로. 가로 직렬 소자 Y3이 상호 어드미턴스(음수)."},{"t":"trap","items":["Y 파라미터의 상호 항 부호(-)를 빠뜨리기 쉽다.","Z12=Z21은 수동 선형(가역) 회로의 성질이다. 종속전원이 있으면 다를 수 있다."]},{"t":"ex","q":"T형 회로에서 Z1=2 Ω, Z2=3 Ω, Z3=5 Ω이다. Z11, Z12, Z22는?","steps":["Z11=2+5=7 Ω, Z22=3+5=8 Ω.","Z12=Z21=5 Ω."],"a":"7 Ω, 5 Ω, 8 Ω."},{"t":"chk","q":"π형 회로에서 가운데 직렬 어드미턴스가 0.2 S이면 Y12는?","a":"-0.2 S."}]},{"id":"X06","title":"분포정수 회로: 특성임피던스·전파속도·반사","pr":"A","min":20,"day":1,"b":[{"t":"p","ss":[{"s":"선로를 단위길이당 R, L, G, C로 보면 특성임피던스 Z0=√(Z/Y), 전파정수 γ=√(ZY)=α+jβ다.","core":1,"star":1},{"s":"α는 감쇠정수, β는 위상정수다.","core":0},{"s":"전파속도는 v=ω/β이고, 파장은 λ=2π/β다.","core":0}]},{"t":"p","ss":[{"s":"무손실 선로는 R=G=0인 선로다.","core":0},{"s":"이때 α=0, Z0=√(L/C), β=ω√(LC), v=1/√(LC)이다.","core":0},{"s":"무왜형 선로는 RC=LG를 만족하는 선로로, 감쇠는 있지만 α=√(RG)가 주파수와 무관해 파형이 찌그러지지 않는다.","core":0},{"s":"무왜형에서도 Z0=√(L/C)=√(R/G)다.","core":0}]},{"t":"p","ss":[{"s":"선로 끝에서 부하 ZL이 Z0와 다르면 반사가 생긴다.","core":0},{"s":"반사계수 Γ=(ZL-Z0)/(ZL+Z0), 정재파비 S=(1+|Γ|)/(1-|Γ|)다.","core":0},{"s":"ZL=Z0(정합)이면 Γ=0, S=1이다.","core":0}]},{"t":"m","tex":"Z_0=\\sqrt{\\frac{R+j\\omega L}{G+j\\omega C}},\\qquad \\gamma=\\sqrt{(R+j\\omega L)(G+j\\omega C)}=\\alpha+j\\beta","note":"α: 감쇠정수 [Np/m], β: 위상정수 [rad/m]."},{"t":"m","tex":"v=\\frac{\\omega}{\\beta}=f\\lambda,\\qquad \\lambda=\\frac{2\\pi}{\\beta}","note":"β와 v가 주어지면 f=vβ/(2π)."},{"t":"m","tex":"\\mathrm{lossless}:\\ Z_0=\\sqrt{\\frac{L}{C}},\\ \\beta=\\omega\\sqrt{LC},\\ v=\\frac{1}{\\sqrt{LC}}","note":"무손실(R=G=0)."},{"t":"m","tex":"\\mathrm{distortionless}:\\ RC=LG,\\quad \\alpha=\\sqrt{RG}","note":"무왜형. 감쇠는 있지만 주파수 무관."},{"t":"m","tex":"\\Gamma=\\frac{Z_L-Z_0}{Z_L+Z_0},\\qquad S=\\frac{1+|\\Gamma|}{1-|\\Gamma|}","note":"반사계수와 정재파비."},{"t":"tb","h":["구분","조건","특징"],"r":[["무손실","R=G=0","α=0, Z0=√(L/C)"],["무왜형","RC=LG","α=√(RG), 파형 일그러짐 없음"],["정합","ZL=Z0","Γ=0, S=1, 반사 없음"]]},{"t":"trap","items":["무왜형 조건을 RL=CG로 쓰는 실수. R·C 곱 = L·G 곱이다.","전파속도는 매질(L, C)로 정해지고 주파수와 무관하다. 주파수가 바뀌면 파장이 바뀐다."]},{"t":"ex","q":"위상정수 β=π/50 rad/m, 전파속도 3×10⁸ m/s인 선로의 주파수는?","steps":["f=vβ/(2π)=3×10⁸×(π/50)/(2π)=3×10⁸/100."],"a":"3×10⁶ Hz=3 MHz."},{"t":"chk","q":"ZL=3Z0인 부하의 반사계수와 정재파비는?","a":"Γ=(3-1)/(3+1)=0.5, S=(1+0.5)/(1-0.5)=3."}]},{"id":"X07","title":"대칭좌표법: 정상·역상·영상분과 불평형률","pr":"A","min":15,"day":1,"b":[{"t":"p","ss":[{"s":"불평형 3상은 영상분(V0), 정상분(V1), 역상분(V2)의 합으로 나눌 수 있다.","core":1,"star":1},{"s":"a=1∠120°를 쓰며, 정상분은 b에 a, c에 a²을 곱하고, 역상분은 그 순서를 바꾼다.","core":0},{"s":"영상분은 C14에서 본 세 상의 단순 평균이다.","core":0}]},{"t":"p","ss":[{"s":"불평형률은 역상분을 정상분으로 나눈 비율이다.","core":0},{"s":"전압이든 전류든 같은 정의를 쓴다.","core":0},{"s":"평형 3상이면 역상분과 영상분이 모두 0이므로 불평형률 0%다.","core":0}]},{"t":"p","ss":[{"s":"참고로 1선 지락 같은 고장 해석에서는 세 대칭분이 모두 같은 전류로 흐르고 지락전류는 영상전류의 3배다.","core":0},{"s":"이 부분은 전력공학 영역이라 여기서는 이름과 관계만 기억한다.","core":0}]},{"t":"m","tex":"V_0=\\frac{V_a+V_b+V_c}{3}","note":"영상분."},{"t":"m","tex":"V_1=\\frac{V_a+aV_b+a^2V_c}{3},\\qquad V_2=\\frac{V_a+a^2V_b+aV_c}{3}","note":"정상분·역상분. a=1∠120°=-1/2+j√3/2, a³=1, 1+a+a²=0."},{"t":"m","tex":"\\mathrm{unbalance}=\\frac{V_2}{V_1}\\times100\\ [\\%]","note":"불평형률=역상분/정상분."},{"t":"trap","items":["불평형률 분모를 영상분이나 상전압으로 쓰지 않는다. 정상분이다.","정상분과 역상분에서 a와 a²의 위치가 서로 바뀐다."]},{"t":"ex","q":"정상전압 200 V, 역상전압 100 V인 3상 전원의 불평형률은?","steps":["100/200×100."],"a":"50%."},{"t":"chk","q":"평형 3상 전압의 영상분과 역상분은?","a":"둘 다 0. 평형이면 정상분만 남는다."}]},{"id":"X08","title":"제어계의 구성과 분류","pr":"A","min":12,"day":2,"b":[{"t":"p","ss":[{"s":"목표값 → 기준입력요소 → 비교부 → 조절부 → 조작부 → (조작량) → 제어대상 → 제어량, 그리고 검출부가 제어량을 비교부로 되돌린다.","core":1,"star":1},{"s":"조절부와 조작부를 합쳐 제어요소라 하고, 제어대상을 뺀 나머지(기준입력요소·비교부·제어요소·검출부)를 제어장치라 한다.","core":0}]},{"t":"p","ss":[{"s":"제어량 종류로는 서보제어(위치·방위·각도·자세), 프로세스제어(온도·압력·유량·액위·농도), 자동조정(전압·전류·주파수·회전속도)으로 나눈다.","core":0},{"s":"목표값의 성질로는 정치제어(일정), 추종제어(임의 변화), 프로그램제어(미리 정한 순서), 비율제어(다른 양과 일정 비율)로 나눈다.","core":0}]},{"t":"p","ss":[{"s":"조작량은 제어요소가 제어대상에 가하는 신호이고, 외란은 제어량을 목표에서 벗어나게 하는 외부 입력이다.","core":0},{"s":"동작신호(편차)는 비교부의 출력이다.","core":0}]},{"t":"tb","h":["분류 기준","종류","예"],"r":[["제어량","서보 / 프로세스 / 자동조정","위치·각도 / 온도·유량 / 전압·속도"],["목표값","정치 / 추종 / 프로그램 / 비율","일정 유지 / 레이더 추적 / 엘리베이터 / 보일러 공연비"],["구성","제어요소=조절부+조작부","제어장치=제어대상 제외 전체"]]},{"t":"trap","items":["제어대상은 제어장치에 포함되지 않는다.","서보제어는 '추종'의 대표지만 분류 기준이 다르다. 제어량 기준이면 서보, 목표값 기준이면 추종."]},{"t":"ex","q":"비교부·조절부·조작부·검출부·제어대상 중 제어장치에 포함되지 않는 것은?","steps":["제어장치는 제어대상을 제외한 나머지."],"a":"제어대상."},{"t":"chk","q":"제어요소는 무엇과 무엇으로 이루어지는가?","a":"조절부와 조작부."}]},{"id":"X09","title":"이상적 연산증폭기와 기본 회로","pr":"A","min":15,"day":2,"b":[{"t":"p","ss":[{"s":"이상적인 연산증폭기는 전압이득 ∞, 입력임피던스 ∞, 출력임피던스 0이다.","core":1,"star":1},{"s":"그래서 입력단자로 전류가 들어가지 않고, 부귀환이 걸려 있으면 두 입력단자 전압이 같아진다(가상단락).","core":0}]},{"t":"p","ss":[{"s":"반전 증폭기는 출력이 -Rf/R1배, 비반전 증폭기는 1+Rf/R1배다.","core":0},{"s":"가산기는 각 입력을 저항으로 나눈 전류를 더한 뒤 -Rf를 곱한다.","core":0},{"s":"귀환 소자를 C로 바꾸면 적분기, 입력 소자를 C로 바꾸면 미분기가 된다.","core":0}]},{"t":"p","ss":[{"s":"계측에서는 센서 신호 증폭, 차동 증폭, 필터에 그대로 쓰이므로 출력식의 부호와 1+ 유무를 정확히 구별한다.","core":0}]},{"t":"m","tex":"A_v=\\infty,\\quad Z_{in}=\\infty,\\quad Z_{out}=0,\\quad v_+=v_-","note":"이상 특성과 가상단락(부귀환 조건)."},{"t":"m","tex":"v_o=-\\frac{R_f}{R_1}v_i,\\qquad v_o=\\left(1+\\frac{R_f}{R_1}\\right)v_i","note":"반전 / 비반전 증폭."},{"t":"m","tex":"v_o=-R_f\\left(\\frac{v_1}{R_1}+\\frac{v_2}{R_2}\\right)","note":"반전 가산기."},{"t":"m","tex":"v_o=-\\frac{1}{RC}\\int v_i\\,dt,\\qquad v_o=-RC\\frac{dv_i}{dt}","note":"적분기(귀환 C) / 미분기(입력 C)."},{"t":"trap","items":["비반전 증폭기 이득에 1+를 빠뜨리지 않는다. 이득은 최소 1이다.","가상단락은 전압만 같다는 뜻이고 두 단자를 실제로 연결한 것이 아니다. 전류는 흐르지 않는다."]},{"t":"ex","q":"R1=10 kΩ, Rf=100 kΩ 반전 증폭기에 0.2 V를 넣으면 출력은? 같은 저항으로 비반전이면?","steps":["반전: -10×0.2=-2 V.","비반전: (1+10)×0.2=2.2 V."],"a":"-2 V, 2.2 V."},{"t":"chk","q":"이상 연산증폭기의 출력임피던스는?","a":"0. 입력임피던스와 전압이득은 ∞."}]},{"id":"X10","title":"축전지: 공칭전압·방전율·충전기 전류","pr":"A","min":15,"day":2,"b":[{"t":"p","ss":[{"s":"연(납)축전지 공칭전압 2.0 V/cell, 정격방전율 10 h.","core":1,"star":1},{"s":"알칼리축전지 공칭전압 1.2 V/cell, 정격방전율 5 h.","core":0},{"s":"한국전력기술에서 두 회차 연속으로 나온 숫자다.","core":0}]},{"t":"p","ss":[{"s":"연축전지는 양극 PbO₂, 음극 Pb, 전해액 묽은 황산이다.","core":0},{"s":"알칼리축전지는 전해액으로 수산화칼륨을 쓰며 수명이 길고 진동·과방전에 강하지만 셀당 전압이 낮다.","core":0}]},{"t":"p","ss":[{"s":"부동충전 방식에서 충전기는 축전지를 충전하는 동시에 상시부하에도 전류를 공급한다.","core":0},{"s":"그래서 충전기 2차 전류는 '축전지 용량/정격방전율'과 '상시부하/표준전압'의 합이다.","core":0},{"s":"균등충전은 셀 사이 전압 차를 없애려고 주기적으로 조금 높게 충전하는 것이고, 세류충전은 자기방전량만 보충하는 것이다.","core":0}]},{"t":"m","tex":"I_2=\\frac{C\\ \\mathrm{[Ah]}}{T\\ \\mathrm{[h]}}+\\frac{P\\ \\mathrm{[W]}}{V\\ \\mathrm{[V]}}","note":"충전기 2차 전류. C 축전지 용량, T 정격방전율(연 10 h, 알칼리 5 h), P 상시부하, V 표준전압."},{"t":"m","tex":"C=\\frac{1}{L}KI\\ \\mathrm{[Ah]}","note":"축전지 용량. L 보수율(보통 0.8), K 용량환산시간계수, I 방전전류."},{"t":"tb","h":["구분","연축전지","알칼리축전지"],"r":[["공칭전압","2.0 V/cell","1.2 V/cell"],["정격방전율","10 h","5 h"],["전해액","묽은 황산","수산화칼륨"],["특징","셀 전압 높음, 경제적","수명 길고 과방전·진동에 강함"]]},{"t":"trap","items":["방전율 10 h와 5 h를 바꿔 쓰기 쉽다. '연(鉛)이 십'으로 묶는다.","충전기 전류에 상시부하 항을 빠뜨리지 않는다(부동충전)."]},{"t":"ex","q":"용량 200 Ah 연축전지, 상시부하 2 kW, 표준전압 100 V일 때 충전기 2차 전류는?","steps":["200/10=20 A.","2000/100=20 A, 합계 40 A."],"a":"40 A."},{"t":"chk","q":"알칼리축전지의 공칭전압과 정격방전율은?","a":"1.2 V/cell, 5 h."}]},{"id":"X11","title":"전열 계산·발열체·펌프와 권상기 동력","pr":"A","min":15,"day":2,"b":[{"t":"p","ss":[{"s":"전열기가 낸 열 860ηPt [kcal]이 물이 받은 열 mcΔT [kcal]와 같다.","core":1,"star":1},{"s":"P는 kW, t는 시간(h), 물의 비열은 1 kcal/kg·℃, 물 1 L≈1 kg이다.","core":0},{"s":"출력 P를 물으면 P=mcΔT/(860ηt), 시간을 물으면 t=mcΔT/(860ηP)다.","core":0}]},{"t":"p","ss":[{"s":"발열체 구비조건: 내열성·내식성이 클 것, 가공이 쉬울 것, 적당한 고유저항을 가질 것, 저항의 온도계수가 양(+)이고 작을 것, 선팽창계수가 작을 것.","core":0},{"s":"선팽창계수가 '커야 한다'는 오답 선지로 나왔다.","core":0}]},{"t":"p","ss":[{"s":"펌프용 전동기 출력은 P=9.8QH/η [kW] (Q: m³/s, H: m), 권상기는 P=WV/(6.12η) [kW] (W: ton, V: m/min)다.","core":0},{"s":"여유계수 K가 주어지면 곱한다.","core":0}]},{"t":"m","tex":"860\\,\\eta P t=mc\\,(T_2-T_1)\\ \\mathrm{[kcal]}","note":"P [kW], t [h], m [kg], c [kcal/kg·℃], η 효율. 물 c=1."},{"t":"m","tex":"P_{pump}=\\frac{9.8\\,QH}{\\eta}K\\ \\mathrm{[kW]}","note":"Q 양수량 [m³/s], H 양정 [m], K 여유계수."},{"t":"m","tex":"P_{hoist}=\\frac{WV}{6.12\\,\\eta}\\ \\mathrm{[kW]}","note":"W 하중 [ton], V 속도 [m/min]."},{"t":"trap","items":["펌프식의 Q가 m³/min으로 주어지면 60으로 나눠 m³/s로 바꾼다.","860ηPt에서 효율 위치: 전기 → 열 변환이므로 공급 쪽(왼쪽)에 곱한다."]},{"t":"ex","q":"물 10 L를 15℃에서 95℃로 1시간에 데우려 한다. 효율 80%인 전열기 출력은?","steps":["mcΔT=10×1×80=800 kcal.","P=800/(860×0.8×1)≈1.16 kW."],"a":"약 1.16 kW."},{"t":"chk","q":"양수량 0.1 m³/s, 양정 20 m, 효율 0.8인 펌프 전동기 출력은?","a":"9.8×0.1×20/0.8=24.5 kW."}]},{"id":"X12","title":"절연물 종별 허용온도와 절연유","pr":"A","min":10,"day":2,"b":[{"t":"p","ss":[{"s":"Y 90, A 105, E 120, B 130, F 155, H 180, C 180 초과 [℃].","core":1,"star":1},{"s":"'YAE BFH C'의 순서와 숫자를 통째로 외운다.","core":0},{"s":"한국전력기술에서 24.06과 24.11 두 번 나왔다(Y·A 값, B와 H 사이의 F=155).","core":0}]},{"t":"p","ss":[{"s":"변압기 절연유는 절연내력이 크고, 점도가 낮아 냉각이 잘 되며, 인화점은 높고 응고점은 낮고, 비열·열전도율이 크고, 화학적으로 안정해 산화·석출물이 없어야 한다.","core":0}]},{"t":"p","ss":[{"s":"절연유 열화(산화·흡습)를 막기 위해 콘서베이터, 질소 봉입, 흡착제를 넣은 브리더를 쓴다.","core":0}]},{"t":"tb","h":["종별","최고허용온도 [℃]","암기 묶음"],"r":[["Y","90","YAE"],["A","105",""],["E","120",""],["B","130","BFH"],["F","155",""],["H","180",""],["C","180 초과","C"]]},{"t":"trap","items":["점도는 낮아야 한다(높으면 대류 냉각이 나빠짐).","인화점은 높게, 응고점은 낮게. 반대로 쓰기 쉽다."]},{"t":"ex","q":"B종과 H종 사이 절연물의 최고허용온도는?","steps":["B 130, F 155, H 180."],"a":"F종, 155℃."},{"t":"chk","q":"E종의 최고허용온도는?","a":"120℃."}]},{"id":"X13","title":"신유형 응용: BLDC 센서리스·서보모터·플라즈마·용접","pr":"A","min":12,"day":2,"b":[{"t":"p","ss":[{"s":"BLDC 센서리스 제어는 홀센서 없이 역기전력으로 회전자 위치·속도를 추정한다.","core":1},{"s":"홀센서·인코더·배선이 없어 비용이 줄지만, 저속에서는 역기전력이 작아 제어가 어렵고 고속에서 안정적이다.","core":0},{"s":"정밀 위치·속도 제어나 부하 변동이 심하면 서보 방식이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"서보모터 시스템은 드라이버(전압·전류·주파수 공급), 컨트롤러(토크·속도·위치 명령), 피드백 센서(엔코더 등), 전원공급장치로 구성된다.","core":0},{"s":"회전관성은 용도에 맞게 조정하는 설계 요소이지 필수 구성요소가 아니다.","core":0},{"s":"서보모터는 기동토크가 크고 관성이 작아 응답이 빨라야 한다.","core":0}]},{"t":"p","ss":[{"s":"플라즈마는 이온화된 전도성 기체로 국부적으로는 전하를 띠지만 전체적으로는 중성이다.","core":0},{"s":"온도가 높을수록 이온화가 커진다.","core":0},{"s":"MIG 용접은 소모성 용접 와이어가 전극이고 자동·반자동으로 빠르다.","core":0},{"s":"TIG 용접은 비소모성 텅스텐 전극을 쓰고 수동 정밀 용접에 쓰인다.","core":0},{"s":"둘 다 보호가스로 아르곤·헬륨을 쓴다.","core":0}]},{"t":"tb","h":["구분","MIG","TIG"],"r":[["전극","용접 와이어(소모성)","텅스텐(비소모성)"],["보호가스","아르곤·헬륨","아르곤·헬륨"],["방식·속도","자동/반자동, 빠름","수동, 느림·정밀"]]},{"t":"trap","items":["BLDC 센서리스는 고속에서 유리하고 저속에서 불리하다. 반대로 외우지 않는다.","MIG의 M은 Metal(소모성 와이어), TIG의 T는 Tungsten(비소모성)."]},{"t":"ex","q":"비소모성 전극을 쓰는 불활성가스 아크용접은?","steps":["텅스텐 전극은 녹지 않는다."],"a":"TIG 용접."},{"t":"chk","q":"BLDC 센서리스 제어가 회전자 위치를 알아내는 근거는?","a":"권선에 나타나는 역기전력."}]},{"id":"X14","title":"도체 형태별 정전용량","pr":"B","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"고립 구 C=4πεa, 동심구 C=4πεab/(b-a), 동축 케이블 C=2πε/ln(b/a) [F/m], 평행 왕복도선 C=πε/ln(d/a) [F/m], 평행판 C=εA/d.","core":1,"star":1},{"s":"구는 [F], 무한히 긴 도체는 단위길이당 [F/m]다.","core":0}]},{"t":"p","ss":[{"s":"E05에서 말한 대로 평행판 식을 다른 모양에 그대로 대입하지 않는다.","core":0},{"s":"각 식은 가우스 법칙으로 전계를 구하고 전위차를 적분해 C=Q/V로 얻은 결과다.","core":0},{"s":"반지름이 분모·분자·로그 중 어디에 들어가는지가 출제 포인트다.","core":0}]},{"t":"p","ss":[{"s":"공기 중 반지름 1 m 구의 정전용량은 약 111 pF(=1/9×10⁻⁹ F)로, 4πε0=1/(9×10⁹)를 쓰면 빠르다.","core":0}]},{"t":"m","tex":"C_{sphere}=4\\pi\\varepsilon a,\\qquad C_{concentric}=\\frac{4\\pi\\varepsilon ab}{b-a}","note":"a 내구 반지름, b 외구 내반지름 [F]."},{"t":"m","tex":"C_{coax}=\\frac{2\\pi\\varepsilon}{\\ln(b/a)},\\qquad C_{parallel\\ wires}=\\frac{\\pi\\varepsilon}{\\ln(d/a)}","note":"[F/m]. 평행도선은 d≫a 근사, d 중심 간 거리."},{"t":"trap","items":["동축 케이블은 단위길이당 값이다. 전체 용량은 길이를 곱한다.","동심구에서 외구를 접지했는지에 따라 문제가 달라질 수 있다. 기본식은 내구-외구 사이 용량이다."]},{"t":"ex","q":"공기 중 반지름 9 cm인 고립 도체구의 정전용량은?","steps":["C=4πε0a=a/(9×10⁹)=0.09/(9×10⁹)."],"a":"1×10⁻¹¹ F=10 pF."},{"t":"chk","q":"동축 케이블의 정전용량은 b/a가 커질수록 어떻게 되는가?","a":"ln(b/a)가 커지므로 감소한다."}]},{"id":"X15","title":"전기 영상법: 접지 평면과 접지구","pr":"B","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"무한 접지 도체평면에서 거리 d에 있는 점전하 Q는, 평면 반대쪽 같은 거리에 -Q를 둔 것과 같다.","core":1,"star":1},{"s":"두 전하 거리가 2d이므로 힘은 Q²/(16πεd²)이고 항상 흡인력이다.","core":0}]},{"t":"p","ss":[{"s":"접지된 도체구(반지름 a)에서 중심으로부터 d 떨어진 점전하 Q의 영상전하는 크기 -aQ/d, 위치는 중심에서 a²/d다.","core":0},{"s":"선전하 λ가 접지 평면 위 높이 h에 있으면 영상 -λ가 아래 h에 생기고 단위길이당 힘은 λ²/(4πεh)다.","core":0}]},{"t":"p","ss":[{"s":"영상법은 '도체 표면 전위 0'이라는 경계조건을 만족시키는 가상 전하를 두는 방법이다.","core":0},{"s":"도체 바깥 영역의 전계만 같고 도체 내부에는 전하가 없다.","core":0}]},{"t":"m","tex":"F=\\frac{Q^2}{4\\pi\\varepsilon(2d)^2}=\\frac{Q^2}{16\\pi\\varepsilon d^2}","note":"접지 무한평면과 점전하 사이 흡인력 [N]."},{"t":"m","tex":"Q'=-\\frac{a}{d}Q,\\qquad x=\\frac{a^2}{d}","note":"접지구의 영상전하 크기와 중심으로부터의 위치."},{"t":"m","tex":"f=\\frac{\\lambda^2}{4\\pi\\varepsilon h}\\ \\mathrm{[N/m]}","note":"접지 평면 위 높이 h의 선전하가 받는 단위길이당 힘."},{"t":"trap","items":["힘 계산에서 거리를 d로 넣는 실수. 실전하와 영상전하 거리는 2d다.","영상전하 크기는 평면에서는 -Q 그대로, 구에서는 a/d배로 줄어든다."]},{"t":"ex","q":"접지 무한평면에서 0.3 m 떨어진 1 μC 점전하가 받는 힘은?","steps":["F=9×10⁹×(10⁻⁶)²/(0.6)²=9×10⁻³/0.36."],"a":"0.025 N, 흡인력."},{"t":"chk","q":"반지름 0.1 m 접지구 중심에서 0.5 m 떨어진 Q의 영상전하는?","a":"-0.2Q, 중심에서 0.02 m 위치."}]},{"id":"X16","title":"전위계수·용량계수와 쌍극자","pr":"B","min":12,"day":3,"b":[{"t":"p","ss":[{"s":"여러 도체가 있으면 각 도체 전위는 모든 전하의 일차결합이다.","core":1},{"s":"V1=p11Q1+p12Q2처럼 쓰고 p를 전위계수라 한다.","core":0},{"s":"성질: p_rr>0, p_rs=p_sr≥0, p_rr≥p_rs.","core":0},{"s":"반대로 Q=qV로 쓰면 q_rr(용량계수)>0, q_rs(유도계수)≤0, q_rs=q_sr이다.","core":0}]},{"t":"p","ss":[{"s":"전기 쌍극자(모멘트 M=Qδ)의 전위는 1/r², 전계는 1/r³에 비례한다.","core":1,"star":1},{"s":"점전하(전위 1/r, 전계 1/r²)보다 한 차수씩 빨리 줄어든다.","core":0},{"s":"θ=0°(축 방향)에서 최대, θ=90°에서 전위는 0이지만 전계는 0이 아니다.","core":0}]},{"t":"p","ss":[{"s":"자기 쌍극자도 같은 모양이며 ε 대신 μ0, 전하 대신 자극을 쓴다.","core":0}]},{"t":"m","tex":"V=\\frac{M\\cos\\theta}{4\\pi\\varepsilon_0 r^2},\\qquad E=\\frac{M\\sqrt{1+3\\cos^2\\theta}}{4\\pi\\varepsilon_0 r^3}","note":"M=Qδ [C·m]. 전위 ∝1/r², 전계 ∝1/r³."},{"t":"m","tex":"p_{rr}>0,\\quad p_{rs}=p_{sr}\\geq0,\\quad q_{rr}>0,\\quad q_{rs}\\leq0","note":"전위계수 p, 용량계수 q_rr, 유도계수 q_rs."},{"t":"trap","items":["유도계수는 0 이하(음수 가능)다. 전위계수와 부호가 다르다.","쌍극자 전계를 1/r²로 쓰는 실수. 점전하가 아니다."]},{"t":"ex","q":"전기 쌍극자에서 거리를 2배로 하면 전위와 전계는?","steps":["V∝1/r² → 1/4.","E∝1/r³ → 1/8."],"a":"전위 1/4, 전계 1/8."},{"t":"chk","q":"유도계수 q_12의 부호는?","a":"0 이하(q_12≤0)."}]},{"id":"X17","title":"자성체 분류와 자화의 세기","pr":"A","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"강자성체(μs≫1) 철·니켈·코발트, 상자성체(μs가 1보다 약간 큼) 알루미늄·백금·텅스텐·산소·공기, 반자성체(μs<1) 금·은·구리·비스무트·안티몬·아연.","core":1,"star":1},{"s":"24.06 기출에서 알루미늄·산소=상자성, 구리=반자성, 코발트=강자성을 골랐다.","core":0}]},{"t":"p","ss":[{"s":"강자성체는 자구가 있어 외부 자계 방향으로 강하게 자화되고, 자계를 없애도 자화가 남아 영구자석 재료가 된다.","core":0},{"s":"상자성체는 약하게 같은 방향으로, 반자성체는 반대 방향으로 자화된다.","core":0}]},{"t":"p","ss":[{"s":"자화의 세기 J는 단위체적당 자기모멘트이며 B=μ0H+J이다.","core":0},{"s":"따라서 J=μ0(μs-1)H=χH이고 χ=μ0(μs-1)을 자화율이라 한다.","core":0},{"s":"영구자석은 잔류자기와 보자력이 모두 크고, 전자석은 잔류자기는 크되 보자력과 히스테리시스 면적이 작아야 한다.","core":0}]},{"t":"m","tex":"J=B-\\mu_0H=\\mu_0(\\mu_s-1)H=\\chi H\\ \\mathrm{[Wb/m^2]}","note":"χ=μ0(μs-1) 자화율, μs-1 비자화율."},{"t":"tb","h":["구분","비투자율","대표 물질"],"r":[["강자성체","μs ≫ 1","철, 니켈, 코발트"],["상자성체","μs > 1 (≈1)","알루미늄, 백금, 텅스텐, 산소"],["반자성체","μs < 1","금, 은, 구리, 비스무트, 아연"]]},{"t":"trap","items":["구리는 반자성체다. 전기 잘 통한다고 강자성으로 고르지 않는다.","영구자석은 보자력이 커야 하고 전자석은 보자력이 작아야 한다."]},{"t":"ex","q":"비투자율 101인 자성체에 H=1000 A/m를 가했다. 자화의 세기는?","steps":["J=4π×10⁻⁷×(101-1)×1000."],"a":"약 0.126 Wb/m²."},{"t":"chk","q":"산소는 어떤 자성체인가?","a":"상자성체(비투자율이 1보다 약간 큼)."}]},{"id":"X18","title":"평행 도선 간 힘과 전기·자기 특수효과","pr":"B","min":12,"day":3,"b":[{"t":"p","ss":[{"s":"평행한 두 도선 사이 단위길이당 힘은 F=2I1I2×10⁻⁷/r [N/m]다.","core":1,"star":1},{"s":"전류가 같은 방향이면 흡인, 반대 방향이면 반발이다.","core":0},{"s":"E11의 로렌츠 힘 IL×B에 직선도선 자계 μ0I/(2πr)를 넣은 결과다.","core":0}]},{"t":"p","ss":[{"s":"홀 효과: 전류가 흐르는 도체·반도체에 수직으로 자계를 걸면 두 방향 모두에 수직으로 기전력이 생긴다(홀센서, 캐리어 판별).","core":0},{"s":"핀치 효과: 액체 도체에 큰 직류를 흘리면 전자력으로 단면이 수축했다 복귀하기를 반복한다.","core":0},{"s":"스트레치 효과: 구부러진 도선에 대전류를 흘리면 반발력으로 원 모양으로 펴진다.","core":0}]},{"t":"p","ss":[{"s":"압전 효과: 수정·로셸염·티탄산바륨에 압력을 가하면 표면에 분극 전하가 생기고, 반대로 전압을 걸면 변형된다.","core":0},{"s":"파이로(초전) 전기: 결정을 가열·냉각하면 분극이 생긴다.","core":0},{"s":"열전 효과(제벡·펠티에·톰슨)는 M16에 있다.","core":0}]},{"t":"m","tex":"F=\\frac{\\mu_0I_1I_2}{2\\pi r}=\\frac{2I_1I_2}{r}\\times10^{-7}\\ \\mathrm{[N/m]}","note":"같은 방향 흡인, 반대 방향 반발."},{"t":"tb","h":["효과","원인","결과"],"r":[["홀","전류 ⊥ 자계","두 방향에 수직인 기전력"],["핀치","액체 도체에 직류","단면 수축·복귀 반복"],["스트레치","구부러진 도선에 대전류","원형으로 펴짐"],["압전","기계적 압력","표면 분극 전하(역효과: 변형)"],["파이로","가열·냉각","분극 발생"]]},{"t":"trap","items":["평행 도선 힘은 r에 반비례(1/r)이지 1/r²이 아니다.","핀치는 '액체 도체·직류', 스트레치는 '구부러진 도선'. 이름만 보고 섞지 않는다."]},{"t":"ex","q":"10 cm 떨어진 두 평행 도선에 같은 방향으로 10 A씩 흐른다. 단위길이당 힘은?","steps":["F=2×10×10×10⁻⁷/0.1."],"a":"2×10⁻⁴ N/m, 흡인력."},{"t":"chk","q":"도체에 전류를 흘리고 수직으로 자계를 가했을 때 생기는 기전력 현상은?","a":"홀 효과."}]},{"id":"X19","title":"저항의 온도계수","pr":"B","min":8,"day":3,"b":[{"t":"p","ss":[{"s":"기준온도 t에서 저항 R_t, 온도계수 α_t이면 T℃에서 R_T=R_t[1+α_t(T-t)]이다.","core":1,"star":1},{"s":"구리는 0℃ 기준 α0=1/234.5, t℃ 기준 α_t=1/(234.5+t)이며 20℃에서 약 0.00393이다.","core":0}]},{"t":"p","ss":[{"s":"구리선의 저항비는 R_T/R_t=(234.5+T)/(234.5+t)로 바로 계산할 수 있다.","core":0},{"s":"저항 두 개를 직렬로 이은 합성 온도계수는 저항으로 가중평균한 (R1α1+R2α2)/(R1+R2)다.","core":0}]},{"t":"m","tex":"R_T=R_t\\left[1+\\alpha_t(T-t)\\right],\\qquad \\alpha_t=\\frac{1}{234.5+t}","note":"구리 기준. 20℃에서 α≈0.00393."},{"t":"m","tex":"\\alpha_{series}=\\frac{R_1\\alpha_1+R_2\\alpha_2}{R_1+R_2}","note":"직렬 합성 온도계수."},{"t":"trap","items":["온도계수는 기준온도마다 다르다. 20℃ 값을 0℃ 기준식에 넣지 않는다."]},{"t":"ex","q":"20℃에서 10 Ω인 구리선은 70℃에서 몇 Ω인가?","steps":["10×(234.5+70)/(234.5+20)=10×304.5/254.5."],"a":"약 11.96 Ω."},{"t":"chk","q":"구리의 0℃ 기준 온도계수는?","a":"1/234.5≈0.00427."}]},{"id":"X20","title":"직류기 유기기전력·토크와 권선법(중권·파권)","pr":"A","min":18,"day":4,"b":[{"t":"p","ss":[{"s":"직류기 유기기전력 E=pZφN/(60a) [V].","core":1,"star":1},{"s":"p 극수, Z 총도체수, φ 극당 자속, N 회전수[rpm], a 병렬회로수다.","core":0},{"s":"중권은 a=p(극수와 같음), 파권은 a=2다.","core":0},{"s":"한국전력기술 24.06과 24.11에서 연달아 계산으로 나왔다.","core":0}]},{"t":"p","ss":[{"s":"토크는 T=pZφI_a/(2πa) [N·m]이고, 출력으로 쓰면 T=9.55P/N이다(M11).","core":0},{"s":"같은 기계라도 a가 바뀌면 E와 T가 함께 바뀐다.","core":0}]},{"t":"p","ss":[{"s":"중권은 병렬회로가 많아 저전압·대전류에 쓰고, 4극 이상에서는 전압 불균형으로 인한 순환전류를 막는 균압환이 필요하다.","core":0},{"s":"파권은 병렬회로가 2개뿐이라 고전압·소전류에 쓰며 균압환이 필요 없다.","core":0}]},{"t":"m","tex":"E=\\frac{pZ\\phi N}{60a}=K\\phi N\\ \\mathrm{[V]}","note":"중권 a=p, 파권 a=2."},{"t":"m","tex":"T=\\frac{pZ\\phi I_a}{2\\pi a}\\ \\mathrm{[N\\cdot m]}","note":"I_a 전기자전류."},{"t":"tb","h":["구분","중권(병렬권)","파권(직렬권)"],"r":[["병렬회로수 a","a = p","a = 2"],["용도","저전압·대전류","고전압·소전류"],["균압환","필요(4극 이상)","불필요"]]},{"t":"trap","items":["파권의 a를 극수로 넣는 실수. 파권은 항상 2.","N이 rpm인지 rps인지 확인한다. 식의 60은 rpm용이다."]},{"t":"ex","q":"4극, 도체수 500, 극당 자속 0.01 Wb, 1200 rpm 직류발전기의 유기기전력은? (파권, 중권 각각)","steps":["파권 a=2: 4×500×0.01×1200/(60×2)=200 V.","중권 a=4: 24000/240=100 V."],"a":"파권 200 V, 중권 100 V."},{"t":"chk","q":"6극 중권 직류기의 병렬회로수는?","a":"6 (중권 a=p)."}]},{"id":"X21","title":"동기기 권선법: 단절권·분포권과 4.44 공식","pr":"A","min":15,"day":4,"b":[{"t":"p","ss":[{"s":"단절권 계수 k_p=sin(βπ/2), β=코일간격/극간격(<1).","core":1,"star":1},{"s":"n차 고조파는 sin(nβπ/2)다.","core":0},{"s":"분포권 계수 k_d=sin(π/2m)/[q·sin(π/2mq)], m 상수, q 매극매상 슬롯수다.","core":0},{"s":"권선계수 k_w=k_p·k_d<1.","core":0}]},{"t":"p","ss":[{"s":"단절권과 분포권은 모두 고조파를 줄여 기전력 파형을 좋게 하는 대신 합성 기전력이 조금 줄어든다.","core":0},{"s":"단절권은 코일 끝이 짧아 동량이 줄고, 분포권은 누설리액턴스가 작고 열 발산이 쉽다.","core":0}]},{"t":"p","ss":[{"s":"동기발전기 1상 유기기전력은 E=4.44fNφk_w [V]다.","core":0},{"s":"변압기의 4.44fNφ에 권선계수가 곱해진 형태다.","core":0},{"s":"특정 n차 고조파를 없애려면 sin(nβπ/2)=0이 되도록 β를 고른다(예: β=4/5이면 5고조파 제거).","core":0}]},{"t":"m","tex":"k_p=\\sin\\frac{\\beta\\pi}{2},\\qquad k_{pn}=\\sin\\frac{n\\beta\\pi}{2}","note":"β=코일간격/극간격."},{"t":"m","tex":"k_d=\\frac{\\sin\\frac{\\pi}{2m}}{q\\sin\\frac{\\pi}{2mq}}","note":"m 상수, q 매극매상 슬롯수=슬롯수/(극수×상수)."},{"t":"m","tex":"E=4.44fN\\phi k_w,\\qquad k_w=k_pk_d","note":"1상 유기기전력 [V]."},{"t":"trap","items":["단절권 계수를 cos로 쓰지 않는다. sin(βπ/2)다.","권선계수는 1보다 작다. 기전력이 커지는 방향이 아니다."]},{"t":"ex","q":"β=5/6인 단절권의 기본파 단절계수와, 3상 q=2인 분포계수는?","steps":["k_p=sin(75°)≈0.966.","k_d=sin30°/(2 sin15°)=0.5/0.518≈0.966."],"a":"둘 다 약 0.966."},{"t":"chk","q":"5고조파를 없애려면 β를 얼마로 하는가?","a":"β=4/5 (sin(5×0.8×90°)=sin360°=0)."}]},{"id":"X22","title":"동기기 전기자 반작용과 병렬운전 조건","pr":"A","min":15,"day":4,"b":[{"t":"p","ss":[{"s":"핵심암기(발전기): 기전력과 동상 전류 → 교차자화(횡축), 90° 뒤진 전류 → 감자(직축), 90° 앞선 전류 → 증자(직축).","core":1},{"s":"전동기는 감자·증자가 반대다(뒤진 전류가 증자, 앞선 전류가 감자).","core":0},{"s":"감자면 기전력이 줄고 증자면 커진다.","core":0}]},{"t":"p","ss":[{"s":"동기발전기 병렬운전 조건: 기전력의 크기, 위상, 주파수, 파형이 같을 것(3상은 상회전 방향도).","core":0},{"s":"크기가 다르면 무효순환전류(무효횡류), 위상이 다르면 동기화전류(유효횡류), 주파수가 다르면 난조, 파형이 다르면 고조파 순환전류가 흐른다.","core":0}]},{"t":"p","ss":[{"s":"직류기의 전기자 반작용(중성축 이동, 주자속 감소, 보상권선·보극)은 M12에 있다.","core":0},{"s":"여기서는 교류 동기기 쪽만 정리한다.","core":0}]},{"t":"m","tex":"I_c=\\frac{E_a-E_b}{2Z_s}","note":"기전력 크기 차에 의한 무효순환전류(두 기의 동기임피던스가 같을 때)."},{"t":"tb","h":["전류 위상(기전력 기준)","발전기","전동기"],"r":[["동상","교차자화","교차자화"],["90° 뒤짐(지상)","감자","증자"],["90° 앞섬(진상)","증자","감자"]]},{"t":"trap","items":["전동기에서 감자·증자가 뒤바뀐다는 점이 함정 선지로 나온다.","병렬운전 조건에 '용량이 같을 것'은 없다."]},{"t":"ex","q":"동기발전기가 지상 역률 0 부하에 전류를 공급한다. 전기자 반작용과 단자전압 변화는?","steps":["90° 뒤진 전류 → 감자작용."],"a":"감자작용, 기전력·단자전압 감소."},{"t":"chk","q":"병렬운전 중 두 발전기의 기전력 위상이 다르면 흐르는 전류는?","a":"동기화전류(유효횡류)."}]},{"id":"X23","title":"수차·터빈 발전기와 동기기 안정도 대책","pr":"A","min":15,"day":4,"b":[{"t":"p","ss":[{"s":"수차 발전기는 저속(50~1200 rpm)·다극(6~48극)·돌극형·단락비 큼(1.0~1.2)·주로 수직형이다.","core":1,"star":1},{"s":"터빈 발전기는 고속(1800~3600 rpm)·2극 또는 4극·원통형(비돌극)·단락비 작음(0.6~0.8)·횡축형이며, 원심력 때문에 지름은 작고 축 방향으로 길다.","core":0}]},{"t":"p","ss":[{"s":"동기발전기가 회전계자형인 이유: 전기자를 고정자로 두면 고전압 절연과 대전류 인출이 쉽고, 계자는 저압 직류라 슬립링 2개로 충분하며 기계적으로 튼튼하다.","core":0}]},{"t":"p","ss":[{"s":"안정도 향상 대책: 단락비를 크게, 동기임피던스를 작게, 플라이휠로 관성모멘트를 크게, 속응 여자방식 채용, 영상·역상 임피던스를 크게, 조속기를 신속하게, AVR 속응성을 높이고, 탈조 시 탈조계전기로 분리한다.","core":0}]},{"t":"tb","h":["구분","수차 발전기","터빈 발전기"],"r":[["회전수","저속 50~1200 rpm","고속 1800~3600 rpm"],["극수","6~48극","2극 또는 4극"],["회전자","돌극형","원통형(비돌극)"],["단락비","크다 1.0~1.2","작다 0.6~0.8"]]},{"t":"trap","items":["안정도 향상은 동기임피던스를 '작게', 영상·역상 임피던스는 '크게'. 방향이 서로 다르다.","관성모멘트는 크게 해야 한다(플라이휠)."]},{"t":"ex","q":"화력발전소 동기발전기의 회전자 구조와 단락비 경향은?","steps":["화력은 터빈 발전기, 고속기."],"a":"원통형, 단락비 작음(0.6~0.8)."},{"t":"chk","q":"안정도 향상을 위해 동기임피던스는 어떻게 하는가?","a":"작게 한다."}]},{"id":"X24","title":"상수 변환: 3상→2상, 3상→6상","pr":"A","min":8,"day":4,"b":[{"t":"p","ss":[{"s":"3상을 2상으로 바꾸는 결선은 스코트(T) 결선, 메이어 결선, 우드브리지 결선이다.","core":1,"star":1},{"s":"전기철도처럼 단상 부하 두 개를 3상에 고르게 걸 때 쓴다.","core":0}]},{"t":"p","ss":[{"s":"스코트 결선은 주좌 변압기의 중앙 탭에 T좌 변압기를 연결하며, T좌 1차 권수를 주좌의 √3/2(약 86.6%)로 한다.","core":0},{"s":"3상을 6상으로 바꾸는 결선은 2중 성형(Y), 2중 Δ, 환상, 대각, 포크 결선이다(정류기용).","core":0}]},{"t":"tb","h":["변환","결선 방식"],"r":[["3상 → 2상","스코트(T), 메이어, 우드브리지"],["3상 → 6상","2중 Y, 2중 Δ, 환상, 대각, 포크"]]},{"t":"trap","items":["2중 Y·포크는 6상용이다. 2상 변환 선지에 섞여 나온다."]},{"t":"ex","q":"스코트 결선 T좌 변압기 1차 탭은 주좌의 몇 %인가?","steps":["√3/2≈0.866."],"a":"86.6%."},{"t":"chk","q":"3상→2상 변환 결선 세 가지는?","a":"스코트(T), 메이어, 우드브리지."}]},{"id":"X25","title":"유도전동기 기동법·크로우링·게르게스","pr":"A","min":15,"day":4,"b":[{"t":"p","ss":[{"s":"농형 기동법: 전전압 직입기동(약 5 kW 이하), Y-Δ 기동(5~15 kW, 기동전류·기동토크 모두 1/3), 기동보상기법(단권변압기로 전압을 낮춤, 15 kW 이상), 리액터 기동, 콘도르퍼 기동.","core":1},{"s":"권선형 기동법: 2차 저항 기동(비례추이, M09), 게르게스법.","core":0}]},{"t":"p","ss":[{"s":"크로우링은 3상 농형 유도전동기에서 고조파나 고르지 않은 공극 때문에 정격속도에 못 미치는 낮은 속도에서 안정되어 더 가속하지 못하는 현상이다.","core":1,"star":1},{"s":"슬롯수가 적고 용량이 작은 농형에서 잘 생기며, 사슬롯(스큐), 슬롯수 조합 조정, 분포·단절권으로 방지한다.","core":0}]},{"t":"p","ss":[{"s":"게르게스 현상은 권선형 유도전동기 2차 회로의 한 상이 단선되었을 때 정격속도의 약 1/2 근처에서 더 가속하지 못하는 현상이다.","core":0},{"s":"'농형·고조파'는 크로우링, '권선형·2차 1상 단선'은 게르게스로 짝짓는다.","core":0}]},{"t":"tb","h":["기동법","대상","특징"],"r     if (st.tts) {
      populateVoices();
      if (!speech || !speech.supported()) toast('이 브라우저는 음성 읽기를 지원하지 않습니다. 크롬에서 열어 주세요.');
      else toast('음성 읽기: ▶를 누르면 읽기 시작합니다. 배속은 아래 막대로 바꿉니다.', 3500);
    }
    if (was) play();
  });
  $('#mathTg').addEventListener('click', () => { st.mathSpeak = !st.mathSpeak; applySettings(); saveSettings(); restartSoon(); });
  $('#voiceSel').addEventListener('change', (e) => { st.voice = e.target.value; if (speech) speech.setVoice(st.voice); saveSettings(); restartSoon(); });
  document.querySelectorAll('#chunkSeg button').forEach((b) => b.addEventListener('click', () => { st.chunk = +b.dataset.v; applySettings(); saveSettings(); paint(false); }));
  $('#fsDown').addEventListener('click', () => { st.fs = Math.max(15, st.fs - 1); applySettings(); saveSettings(); paint(true); });
  $('#fsUp').addEventListener('click', () => { st.fs = Math.min(34, st.fs + 1); applySettings(); saveSettings(); paint(true); });
  $('#coreOnly').addEventListener('click', () => {
    const keep = act[pos] ?? 0; st.coreOnly = !st.coreOnly; applySettings(); saveSettings();
    buildActive(keep); refreshRead(); clearTimeout(timer); paint(true);
    if (playing) { if (st.tts && speech) speech.play(pos); else step(); }
  });
  $('#dimTg').addEventListener('click', () => { st.dim = !st.dim; applySettings(); saveSettings(); });
  $('#pauseTg').addEventListener('click', () => { st.sentPause = !st.sentPause; applySettings(); saveSettings(); });
  function closeToc() { $('#toc').classList.remove('open'); $('#backdrop').classList.remove('show'); $('#tocBtn').setAttribute('aria-expanded', 'false'); }
  $('#tocBtn').addEventListener('click', () => {
    const o = $('#toc').classList.toggle('open'); $('#backdrop').classList.toggle('show', o);
    $('#tocBtn').setAttribute('aria-expanded', o ? 'true' : 'false');
  });
  $('#backdrop').addEventListener('click', closeToc);
  const root = document.documentElement;
  const fsOk = !!(root.requestFullscreen || root.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (fsOk) {
    $('#fsTg').hidden = false;
    $('#fsTg').addEventListener('click', () => {
      const inFs = document.fullscreenElement || document.webkitFullscreenElement;
      try {
        const r = inFs ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                       : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        if (r && r.catch) r.catch(() => {});
      } catch (e) { /* fullscreen refused */ }
    });
    const syncFs = () => $('#fsTg').setAttribute('aria-pressed', !!(document.fullscreenElement || document.webkitFullscreenElement));
    document.addEventListener('fullscreenchange', syncFs);
    document.addEventListener('webkitfullscreenchange', syncFs);
  }
  let rzT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => { if (window.innerWidth >= 1024) closeToc(); paint(true); }, 180);
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
    else if (e.key === 'ArrowRight') sentJump(1);
    else if (e.key === 'ArrowLeft') sentJump(-1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const d = e.key === 'ArrowUp' ? 1 : -1;
      if (st.tts) { st.rate = Math.max(0.5, Math.min(3, Math.round((st.rate + d * 0.1) * 100) / 100)); restartSoon(); }
      else st.wpm = Math.max(60, Math.min(600, st.wpm + d * 10));
      applySettings(); saveSettings();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && playing) lockScreen();
    if (document.visibilityState === 'hidden') {
      store.set('pos:' + BOOKS[st.book].num, act[pos]);
      if (playing && st.tts) stop();
    }
  });
  window.typesetMath = typesetMath;

  applySettings();
  renderBook();
  refreshRead();
  if (st.tts) populateVoices();
})();
</script>

</body>
</html>
