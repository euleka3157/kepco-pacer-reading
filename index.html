바로 위 첫 칸×두 행 위 둘째 칸-두 행 위 첫 칸×바로 위 둘째 칸)/(바로 위 첫 칸)이다.","core":0},{"s":"같은 방식으로 오른쪽 칸들을 계산하며 빠진 항은 0을 채운다.","core":0},{"s":"첫 칸만 0이거나 행 전체가 0인 특수 절차와 실제 표는 T23에서 다룬다.","core":0}]},{"t":"fig","src":"figures/control/t-routh-table.svg","title":"Routh 표 구성의 실제 예","caption":"실수계수 다항식의 첫 열 부호 변화는 우반평면 근의 개수다. 0이 생기는 특수 경우에는 보완 절차를 적용한다.","alt":"Routh 표 구성의 실제 예. 실수계수 다항식의 첫 열 부호 변화는 우반평면 근의 개수다. 0이 생기는 특수 경우에는 보완 절차를 적용한다.","width":960.0,"height":540.0},{"t":"m","tex":"a_3s^3+a_2s^2+a_1s+a_0=0","note":"실수 계수, a3>0. 엄격한 안정의 간단 조건은 모든 ai>0 및 a2a1>a3a0."},{"t":"m","tex":"b_1=\\frac{a_2a_1-a_3a_0}{a_2}","note":"3차 Routh 표 s¹행 첫 값. a2≠0인 일반 경우."},{"t":"tb","h":["행","첫 열","둘째 열"],"r":[["s³","a3","a1"],["s²","a2","a0"],["s¹","(a2a1-a3a0)/a2","0"],["s⁰","a0","0"]]},{"t":"trap","items":["첫 열 값의 크기가 아니라 부호 변화 수를 센다.","부호 변화가 2번이면 불안정한 근이 2개라는 뜻이지, 안정한 근이 2개라는 뜻이 아니다."]},{"t":"ex","q":"특성식 s³+4s²+3s+K=0이 안정하기 위한 K 범위는?","steps":["계수 양수 조건에서 K>0.","곱 조건 4×3>1×K이므로 K<12.","두 조건을 합쳐 0<K<12."],"a":"0<K<12."},{"t":"ex","q":"특성다항식 s⁴+3s³+5s²+6s+2의 안정성을 Routh 표로 확인하라.","steps":["첫 두 행은 [1,5,2], [3,6,0].","s²행은 [(15-6)/3,2]=[3,2].","s¹행 첫 칸은 (3×6-3×2)/3=4. s⁰행은 2.","첫 열 1,3,3,4,2는 모두 양수."],"a":"모든 근은 열린 좌반평면에 있어 안정하다."},{"t":"chk","q":"s³+2s²+3s+8은 안정한가?","a":"불안정. 계수는 양수지만 2×3=6<8이므로 3차 안정조건을 만족하지 않는다."}]},{"id":"T14","title":"근궤적과 점근선의 교점","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"근궤적은 개루프 이득 K를 변화시킬 때 폐루프 특성방정식의 근이 움직이는 경로다.","core":1,"star":1},{"s":"보통 K≥0 범위를 다루며, K=0에서 개루프 극점에서 시작하고 K가 커지면 개루프 영점 또는 무한대로 간다.","core":0},{"s":"계수의 변화 경로가 아니라 극점의 위치 경로다.","core":0}]},{"t":"p","ss":[{"s":"개루프 극점이 n개, 유한 영점이 m개이고 n>m이면 n-m개 가지가 무한대로 간다.","core":0},{"s":"이 가지의 먼 거리 방향을 점근선으로 설명한다.","core":0},{"s":"점근선들이 만나는 실수축의 중심은 극점의 대수합에서 영점의 대수합을 빼고 n-m으로 나눈 값이다.","core":0}]},{"t":"p","ss":[{"s":"점근선의 실수축 중심, 실수축 이탈점, 허수축 교점은 서로 다른 값이다.","core":0},{"s":"실수축 이탈점은 K=-D/N을 s로 미분한 후보를 궤적 조건으로 걸러 구하고, 허수축 교점은 Routh 경계 이득을 특성식에 대입해 구한다.","core":0},{"s":"복소극점의 출발각과 실제 그리는 순서까지 T24에 이어서 정리했다.","core":0}]},{"t":"fig","src":"figures/control/t-root-locus-basic.svg","title":"두 극점의 근궤적","caption":"음의 피드백, K≥0에서 특성방정식 s²+2s+K=0의 실제 근을 계산했다. 화살표는 K 증가 방향이다.","alt":"두 극점의 근궤적. 음의 피드백, K≥0에서 특성방정식 s²+2s+K=0의 실제 근을 계산했다. 화살표는 K 증가 방향이다.","width":960.0,"height":520.0},{"t":"fig","src":"figures/control/t-root-locus-asymptote.svg","title":"실수축 구간과 점근선","caption":"실수축에서 오른쪽의 실수 극점·영점 수가 홀수인 구간에 궤적이 있다. 이 그림은 K≥0 특성방정식 근을 직접 계산한 것이다.","alt":"실수축 구간과 점근선. 실수축에서 오른쪽의 실수 극점·영점 수가 홀수인 구간에 궤적이 있다. 이 그림은 K≥0 특성방정식 근을 직접 계산한 것이다.","width":960.0,"height":570.0},{"t":"m","tex":"\\sigma_a=\\frac{\\sum p_i-\\sum z_i}{n-m}","note":"pi,zi는 개루프 극점·영점의 실제 좌표. 개수가 아니라 값의 합. n>m."},{"t":"m","tex":"\\theta_k=\\frac{(2k+1)180^\\circ}{n-m},\\quad k=0,\\ldots,n-m-1","note":"양의 K에 대한 통상 음의 피드백 근궤적 점근선 각도."},{"t":"m","tex":"1+KL_0(s)=0","note":"개루프 L=K L0. 근궤적은 이 식의 근을 K 변화에 따라 추적한다."},{"t":"trap","items":["음수 극점을 합할 때 절댓값으로 바꾸지 않는다.","실수축에서 오른쪽에 있는 실수 극점·영점의 총수가 홀수인 구간이 양의 K 근궤적에 속한다."]},{"t":"ex","q":"개루프가 K/[s(s+2)(s+4)]이다. 점근선 수, 중심, 각도는?","steps":["극점은 0,-2,-4로 3개, 유한 영점은 0개.","중심은 (0-2-4)/3=-2.","각도는 60°,180°,300°."],"a":"3개, 중심 -2, 각도 60°·180°·300°."},{"t":"chk","q":"개루프 극점 4개, 유한 영점 1개이면 무한대로 가는 가지와 점근선 수는?","a":"3개. n-m=4-1=3이다."}]},{"id":"T15","title":"주파수응답과 Bode 선도","pr":"B","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"주파수응답은 정현파 입력의 주파수를 바꿔가며 출력 크기와 위상이 어떻게 달라지는지 보는 방법이다.","core":1,"star":1},{"s":"전달함수에 s=jω를 대입한다.","core":0},{"s":"안정한 시스템의 정상상태에서는 같은 주파수의 출력이 나오고, 크기는 |G(jω)|배, 위상은 argG(jω)만큼 변한다.","core":0}]},{"t":"p","ss":[{"s":"Bode 선도는 가로축을 주파수의 로그, 세로축을 이득 dB와 위상으로 나누어 그린다.","core":0},{"s":"진폭 이득은 20log10|G|다.","core":0},{"s":"크기가 10배이면 +20 dB, 0.1배이면 -20 dB다.","core":0},{"s":"전력비의 10log와 혼동하지 않는다.","core":0},{"s":"같은 dB 덧셈이 실제 이득의 곱셈을 표현한다.","core":0}]},{"t":"p","ss":[{"s":"1차 극점은 절점주파수 이후 근사 기울기를 -20 dB/dec씩 바꾸고, 1차 영점은 +20 dB/dec씩 바꾼다.","core":0},{"s":"원점 적분기는 처음부터 -20 dB/dec와 -90° 위상을 가진다.","core":0},{"s":"절점에서 정확한 크기는 직선 근사와 다르며 1차 지연의 정규화 이득은 약 -3 dB다.","core":0}]},{"t":"p","ss":[{"s":"복합 전달함수는 K, 원점극·영점, 1차 요소, 2차 요소로 인수분해하고 각 요소의 dB와 위상을 더한다.","core":0},{"s":"절점주파수를 작은 순으로 배치하고, 시작 기울기에 각 절점의 변화량을 누적한다.","core":0},{"s":"1차 영점은 극점과 크기·위상의 부호가 반대다.","core":0},{"s":"2차 극점쌍은 충분히 높은 주파수에서 -40 dB/dec, -180°로 접근하며, 감쇠가 작으면 절점 근처 공진 봉우리를 별도로 계산해야 한다.","core":0}]},{"t":"p","ss":[{"s":"예를 들어 L(s)=10/[s(1+s/2)(1+s/20)]이면 절점은 2,20 rad/s다.","core":0},{"s":"처음 기울기 -20, 2 이후 -40, 20 이후 -60 dB/dec이다.","core":0},{"s":"정확한 위상은 -90°-atan(ω/2)-atan(ω/20)이고, 정확한 크기는 10/[ω√(1+(ω/2)²)√(1+(ω/20)²)]다.","core":0},{"s":"근사 직선을 그린 뒤 이득교차·위상교차 부근은 정확식으로 확인한다.","core":0}]},{"t":"p","ss":[{"s":"우반평면 영점 1-τs는 좌반평면 영점 1+τs와 크기는 같지만 위상이 -atan(ωτ)다.","core":0},{"s":"순수 지연 e^(-Ls)는 크기 1, 위상 -ωL rad이므로 이득선도를 바꾸지 않고 위상여유를 줄인다.","core":0},{"s":"크기선도만 보고 최소위상계라고 단정하지 않는다.","core":0}]},{"t":"fig","src":"figures/control/t-sinusoidal-response.svg","title":"주파수응답의 크기와 위상","caption":"안정 LTI계의 정현파 정상상태 예시다. 출력 봉우리가 오른쪽으로 이동하면 위상이 지연된다.","alt":"주파수응답의 크기와 위상. 안정 LTI계의 정현파 정상상태 예시다. 출력 봉우리가 오른쪽으로 이동하면 위상이 지연된다.","width":960.0,"height":510.0},{"t":"fig","src":"figures/control/t-bode-basic.svg","title":"비례·미분·적분의 보드선도","caption":"가로 눈금 위치는 log10ω지만 표시 숫자는 실제 주파수다. 상수 K는 양수인 경우다.","alt":"비례·미분·적분의 보드선도. 가로 눈금 위치는 log10ω지만 표시 숫자는 실제 주파수다. 상수 K는 양수인 경우다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-bode-first-order.svg","title":"1차 지연 보드선도와 절점","caption":"크기 회색 선은 점근선, 파란 선은 실제 계산값이다. 주파수 단위는 rad/s이며 ωT는 무차원이다.","alt":"1차 지연 보드선도와 절점. 크기 회색 선은 점근선, 파란 선은 실제 계산값이다. 주파수 단위는 rad/s이며 ωT는 무차원이다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-frequency-phasor.svg","title":"주파수 전달함수의 복소수 표현","caption":"정현파의 크기비는 복소수의 길이, 위상차는 복소수의 각도이다. atan(Im/Re)만으로는 사분면을 구별할 수 없다.","alt":"주파수 전달함수의 복소수 표현. 정현파의 크기비는 복소수의 길이, 위상차는 복소수의 각도이다. atan(Im/Re)만으로는 사분면을 구별할 수 없다.","width":960.0,"height":500.0},{"t":"m","tex":"G(j\\omega)=G(s)|_{s=j\\omega},\\quad A_{\\mathrm{dB}}=20\\log_{10}|G(j\\omega)|","note":"ω: rad/s, 이득 dB는 무차원 비를 로그로 표현. 복소수 크기·위상은 01권 C03 참조."},{"t":"m","tex":"G(s)=\\frac{1}{1+\\tau s},\\quad \\omega_b=\\frac{1}{\\tau}","note":"1차 지연의 절점각주파수. 주파수 Hz로 묻으면 2π로 나눈다."},{"t":"m","tex":"|G(j\\omega)|=\\frac{1}{\\sqrt{1+(\\omega\\tau)^2}},\\quad \\phi=-\\tan^{-1}(\\omega\\tau)","note":"양의 τ를 가진 1차 지연. ωτ=1이면 크기 1/√2, 위상 -45°."},{"t":"tb","h":["요소","크기선도","위상"],"r":[["K>0","20log10 K","0°"],["s / 1/s","+20 / -20 dB/dec","+90° / -90°"],["1+τs","절점 뒤 +20 dB/dec","0→+90°, 절점 +45°"],["1/(1+τs)","절점 뒤 -20 dB/dec","0→-90°, 절점 -45°"],["표준 2차 극점","고주파 -40 dB/dec","0→-180°"],["e^(-Ls)","0 dB","-ωL rad"]]},{"t":"trap","items":["주파수 10배 증가가 1 decade다. 1 Hz 증가와 다르다.","고주파에서 위상 -90°라는 것은 시간 지연이 항상 같은 초라는 뜻이 아니다."]},{"t":"ex","q":"G(s)=1/(1+0.5s)의 절점각주파수와 그때 이득·위상은?","steps":["ωb=1/0.5=2 rad/s.","ωτ=1이므로 |G|=1/√2, 이득 약 -3 dB, 위상 -45°."],"a":"2 rad/s, 약 -3 dB, -45°."},{"t":"chk","q":"진폭이득이 10이면 dB 이득은?","a":"20 dB. 20log10(10)=20."}]},{"id":"T16","title":"Nyquist와 이득·위상여유: -1점을 보는 이유","pr":"A","min":25,"day":2,"b":[{"t":"p","ss":[{"s":"Nyquist 안정판별은 개루프 주파수응답이 -1+j0점을 어떻게 감싸는지와 개루프의 불안정 극점 수를 함께 사용해 폐루프 안정성을 판단한다.","core":1,"star":1},{"s":"음의 피드백 특성식이 1+L=0이기 때문에 기준점이 -1이다.","core":0},{"s":"표본화 주파수를 말하는 Nyquist 샘플링 정리와는 다른 내용이다.","core":0}]},{"t":"p","ss":[{"s":"이 책에서는 -1점의 반시계방향 순감쌈 횟수를 N으로 정의한다.","core":0},{"s":"개루프 우반평면 극점 수를 P, 폐루프 우반평면 극점 수를 Z라 하면 N=P-Z다.","core":0},{"s":"다른 교재가 시계방향을 양수로 정의하면 식의 부호가 바뀌므로 회전 규약을 먼저 읽는다.","core":0},{"s":"양의 주파수 가지 하나만 보고 전체 감쌈 횟수를 세지 않는다.","core":0}]},{"t":"p","ss":[{"s":"개루프에 우반평면 극점이 없고 경로 위의 특이점도 없는 통상 사례에서는 -1점을 감싸지 않으면 폐루프가 안정이다.","core":0},{"s":"개루프가 불안정하면 ‘안 감싸면 안정’이 성립하지 않는다.","core":0},{"s":"이득여유는 위상이 -180°인 주파수에서 크기가 1까지 얼마나 남는지, 위상여유는 크기가 1인 주파수에서 위상이 -180°까지 얼마나 남는지다.","core":0}]},{"t":"p","ss":[{"s":"실제 판별 순서는 L=GH를 정리하고, 우반평면 극점 수 P를 센 뒤, ω=0+와 ∞의 시작·끝 방향 및 실수축 교점을 구하는 것이다.","core":0},{"s":"양의 주파수 궤적에 방향 화살표를 붙이고 실수계수계에서는 실수축 대칭으로 음의 주파수 가지를 완성한다.","core":0},{"s":"전체 Nyquist 경로의 -1점 순감쌈 N을 세어 Z=P-N을 계산한다.","core":0},{"s":"경로가 -1을 통과하면 허수축 폐루프 극점이 있으므로 엄격한 안정으로 판정하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"L의 원점극 등 허수축 극점은 Nyquist 경로를 작은 반원으로 우회하여 처리해야 한다.","core":0},{"s":"0→∞ 가지에 보이는 단순한 좌우 위치만으로 전체 감쌈을 판정하면 안 된다.","core":0},{"s":"이득을 바꿀 때 궤적은 양의 K에 대해 원점으로부터 같은 방향으로 확대·축소된다.","core":0}]},{"t":"p","ss":[{"s":"이득여유는 위상교차 주파수 ωpc에서 GM=1/|L(jωpc)|이며 dB로는 -20log10|L|다.","core":0},{"s":"위상여유는 이득교차 ωgc에서 PM=180°+argL이다.","core":0},{"s":"일반적인 설계 예로 GM 4~12 dB, PM 30~60°가 소개되지만 이는 필수 안정 정리나 모든 시스템의 최적 범위가 아니다.","core":0},{"s":"실제 요구는 잡음·지연·응답속도에 따라 달라진다.","core":0}]},{"t":"fig","src":"figures/control/t-nyquist-count.svg","title":"Nyquist의 감쌈 수와 안정성","caption":"두 패널의 축척은 다르며 전체 궤적을 보여준다. 오른쪽은 −1을 시계방향 두 번 감싼다. 원점·허수축 극점은 별도의 우회 경로가 필요하다.","alt":"Nyquist의 감쌈 수와 안정성. 두 패널의 축척은 다르며 전체 궤적을 보여준다. 오른쪽은 −1을 시계방향 두 번 감싼다. 원점·허수축 극점은 별도의 우회 경로가 필요하다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/control/t-stability-margins.svg","title":"보드선도에서 여유 읽기","caption":"이득여유는 위상교차 주파수에서 0dB까지, 위상여유는 이득교차 주파수에서 −180°까지의 간격이다. 여러 교차점·우반평면 극점은 전체 Nyquist 판정이 필요하다.","alt":"보드선도에서 여유 읽기. 이득여유는 위상교차 주파수에서 0dB까지, 위상여유는 이득교차 주파수에서 −180°까지의 간격이다. 여러 교차점·우반평면 극점은 전체 Nyquist 판정이 필요하다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-nyquist-margin-geometry.svg","title":"Nyquist 여유의 기하적 정의","caption":"회색은 단위원의 아래 반원이다. 개념 궤적에 대한 여유 정의를 보여주며 이 그림 자체로 안정 여부를 판정하지 않는다. GM의 dB값은 20log10(GM)이다.","alt":"Nyquist 여유의 기하적 정의. 회색은 단위원의 아래 반원이다. 개념 궤적에 대한 여유 정의를 보여주며 이 그림 자체로 안정 여부를 판정하지 않는다. GM의 dB값은 20log10(GM)이다.","width":960.0,"height":580.0},{"t":"m","tex":"N=P-Z,\\quad Z=P-N","note":"N은 -1점 반시계방향 순감쌈 수라는 이 책의 규약. 폐루프 안정에는 Z=0과 허수축 특이점 배제가 필요."},{"t":"m","tex":"\\mathrm{GM}=\\frac{1}{|L(j\\omega_{pc})|},\\quad \\mathrm{GM}_{\\mathrm{dB}}=-20\\log_{10}|L(j\\omega_{pc})|","note":"위상교차주파수 ωpc에서 ∠L=-180°. 단순한 통상 교차를 가정."},{"t":"m","tex":"\\mathrm{PM}=180^\\circ+\\angle L(j\\omega_{gc})","note":"이득교차주파수 ωgc에서 |L|=1. 위상은 -180° 부근의 연속 위상 기준."},{"t":"trap","items":["개루프 불안정 극점이 있는데 P=0 공식을 적용하지 않는다.","이득여유·위상여유가 양수라는 간단 판정은 통상적인 단일 교차계에서 사용한다. 다중 교차·특이한 궤적은 전체 Nyquist로 판단한다."]},{"t":"ex","q":"개루프 우반평면 극점이 0개인 통상 시스템에서 전체 Nyquist 궤적이 -1점을 감싸지 않는다. 폐루프 우반평면 극점 수는? 크기 교차점 위상이 -140°라면 위상여유는?","steps":["P=0,N=0이므로 Z=0.","PM=180-140=40°."],"a":"Z=0, 위상여유 40°."},{"t":"ex","q":"L(s)=4/[(s+1)(s+2)(s+3)]의 위상교차와 이득여유를 구하라.","steps":["분모에 s=jω를 넣으면 실수부는 6-6ω², 허수부는 11ω-ω³이다.","ω>0에서 허수부 0은 ω=√11. 이때 분모 실수부 -60이므로 L=-4/60=-1/15.","GM=15, GMdB=20log10 15≈23.52 dB."],"a":"ωpc=√11 rad/s, GM=15≈23.52 dB. P=0이며 K=4는 안정 경계 K=60보다 작다."},{"t":"chk","q":"위상교차주파수에서 |L|=0.5이면 이득여유는 몇 배인가?","a":"2배, 약 6.02 dB. GM=1/0.5이다."}]},{"id":"T17","title":"상태공간 고유값과 s·z 안정영역","pr":"A","min":30,"day":2,"b":[{"t":"p","ss":[{"s":"상태공간은 내부 상태 x가 어떻게 변하는지 나타내며, 연속시간 선형 시불변계의 점근안정은 A의 모든 고유값 실수부가 음수인지로 판단한다.","core":1,"star":1},{"s":"A의 원소가 전부 음수라는 조건이 아니다.","core":0},{"s":"대각 또는 삼각행렬이면 고유값은 대각 원소이므로 간단히 읽을 수 있다.","core":0}]},{"t":"p","ss":[{"s":"특성방정식은 det(sI-A)=0이다.","core":0},{"s":"여기서 I는 단위행렬이지 전류가 아니다.","core":0},{"s":"상태방정식은 입력과 내부 상태의 변화를, 출력방정식은 상태와 입력으로부터 측정 출력이 나오는 관계를 설명한다.","core":0},{"s":"전달함수만 약분해서 보면 내부의 불안정 모드가 숨는 경우가 있으므로 내부안정은 A를 기준으로 확인한다.","core":0}]},{"t":"p","ss":[{"s":"이산시간에서는 한 단계마다 상태가 A_d배 되므로 고유값의 절댓값이 1보다 작아야 반복할수록 줄어든다.","core":0},{"s":"z평면의 안정영역은 단위원 내부, s평면은 열린 좌반평면이다.","core":0},{"s":"샘플링 주기 Ts>0에서 z=e^(sTs)로 대응시키면 실수부가 음수일 때 |z|<1이 된다.","core":0},{"s":"단위원 위는 엄격한 점근안정 영역에 포함하지 않는다.","core":0}]},{"t":"fig","src":"figures/control/t-poles-response.svg","title":"극점과 시간응답의 대응","caption":"그림은 대표적인 자연모드 또는 단위계단 출력의 형태다. 순허수 단순극은 지속진동하며 BIBO 안정과 같은 뜻이 아니다. 허수축 중복극은 일반적으로 발산한다.","alt":"극점과 시간응답의 대응. 그림은 대표적인 자연모드 또는 단위계단 출력의 형태다. 순허수 단순극은 지속진동하며 BIBO 안정과 같은 뜻이 아니다. 허수축 중복극은 일반적으로 발산한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-state-space.svg","title":"상태공간의 적분기 구성","caption":"상태 x는 적분기 출력, D는 입력에서 출력으로의 직접 경로다. 초기값이 0인 전달함수는 C(sI−A)⁻¹B+D이다.","alt":"상태공간의 적분기 구성. 상태 x는 적분기 출력, D는 입력에서 출력으로의 직접 경로다. 초기값이 0인 전달함수는 C(sI−A)⁻¹B+D이다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/control/t-s-z-map.svg","title":"연속·이산 시스템의 안정 영역","caption":"실수부는 z의 반지름, 허수부는 각도로 변환된다. 허수축 전체가 단위원으로 반복해서 감기므로 서로 다른 주파수가 같은 z에 대응할 수 있다.","alt":"연속·이산 시스템의 안정 영역. 실수부는 z의 반지름, 허수부는 각도로 변환된다. 허수축 전체가 단위원으로 반복해서 감기므로 서로 다른 주파수가 같은 z에 대응할 수 있다.","width":960.0,"height":540.0},{"t":"m","tex":"\\dot{x}=Ax+Bu,\\quad y=Cx+Du","note":"x: 상태벡터, u: 입력, y: 출력. A는 상태, B는 입력, C는 출력, D는 직접 전달 행렬. 상태마다 단위가 다를 수 있다."},{"t":"m","tex":"\\det(sI-A)=0,\\quad \\mathrm{Re}(\\lambda_i)<0","note":"연속시간 선형 시불변계의 모든 고유값에 대한 점근안정 조건."},{"t":"m","tex":"x[k+1]=A_dx[k]+B_du[k],\\quad |\\lambda_i(A_d)|<1","note":"이산시간 선형 시불변계의 점근안정 조건."},{"t":"m","tex":"z=e^{sT_s},\\quad |z|=e^{\\mathrm{Re}(s)T_s}","note":"Ts: 양의 샘플링 주기 s. 연속시간 모드의 샘플링 대응."},{"t":"trap","items":["고유값 -2와 -3은 안정이지만 행렬 원소가 -1,-2로만 구성되었다는 사실만으로는 판단할 수 없다.","z=-0.8은 음수라는 이유가 아니라 절댓값 0.8<1이어서 안정 모드다. z=-1.2는 불안정하다."]},{"t":"ex","q":"A가 대각 원소 -2,-5이고 나머지가 0인 2×2 행렬이다. 연속시간 점근안정인가? 별도의 이산시간 계의 고유값이 0.6,-0.8이면?","steps":["대각행렬 고유값은 -2,-5이며 실수부가 모두 음수이므로 연속시간 점근안정.","이산시간 고유값의 크기는 0.6,0.8로 모두 1보다 작으므로 점근안정."],"a":"두 시스템 모두 점근안정."},{"t":"chk","q":"연속시간 고유값이 -1+j2, -1-j2인 경우와 이산시간 고유값이 1.1인 경우를 판정하라.","a":"연속시간은 감쇠진동하며 점근안정. 이산시간은 |1.1|>1이므로 불안정."}]},{"id":"T18","title":"라플라스 성질·시간 이동·역변환의 전 과정","pr":"B","min":55,"day":2,"b":[{"t":"p","ss":[{"s":"선형성은 합과 상수배를 항별로 바꾸는 성질이다.","core":1},{"s":"지수 e^(-at)를 곱하면 F(s+a)로, e^(at)를 곱하면 F(s-a)로 옮긴다.","core":0},{"s":"시간 지연은 f(t-a)u(t-a) 전체를 지연시켜 e^(-as)F(s)로 변환한다.","core":0},{"s":"f(t)u(t-a)처럼 함수 안의 시간이 이동하지 않은 식은 먼저 t-a 형태로 고쳐야 한다.","core":0}]},{"t":"p","ss":[{"s":"시간축에서 일정값이 바뀌는 파형은 각 변경 시점의 변화량을 계단함수로 더한다.","core":0},{"s":"예를 들어 t=1에서 2가 되고 t=3에서 0이 되는 직사각형은 2[u(t-1)-u(t-3)]이다.","core":0},{"s":"이 방법은 여러 구간의 펄스·램프를 변환할 때도 사용한다.","core":0}]},{"t":"p","ss":[{"s":"t를 곱하면 s에 대해 미분하고 부호를 바꾼다.","core":0},{"s":"시간 미분은 초기값 항을 뺀다.","core":0},{"s":"시간 적분 g(t)=g(0-)+∫0ᵗf(τ)dτ은 G=F/s+g(0-)/s이다.","core":0},{"s":"초기 축적량을 나타내는 상수항도 반드시 1/s를 곱해 변환한다.","core":0},{"s":"회로에서 초기 콘덴서 전압이나 코일 전류를 없다고 가정하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"역변환은 분모를 먼저 인수분해한다.","core":0},{"s":"서로 다른 1차 인수에는 상수 분자, 중복인수 (s+a)^m에는 1차부터 m차까지 모든 항, 실수로 인수분해되지 않는 2차 인수에는 As+B를 놓는다.","core":0},{"s":"분자 차수가 높거나 같으면 먼저 나눗셈을 해서 다항식 부분과 진분수를 나눈다.","core":0},{"s":"상수 1의 역변환은 계단이 아니라 임펄스다.","core":0}]},{"t":"p","ss":[{"s":"복소근 쌍은 완전제곱으로 (s+a)²+b² 형태를 만든 뒤 분자를 s+a와 상수로 분리한다.","core":0},{"s":"부분분수의 계수는 양변에 분모를 곱하고 계수를 비교하거나 서로 다른 단순극에서 잔여값을 계산한다.","core":0},{"s":"마지막에는 다시 합쳐 원래 유리함수가 되는지 검산한다.","core":0}]},{"t":"p","ss":[{"s":"입력 r와 임펄스응답 g의 컨볼루션은 y(t)=∫0ᵗg(t-τ)r(τ)dτ이며 변환하면 Y=GR이다.","core":0},{"s":"곱 GR을 시간함수 g(t)r(t)의 단순 곱으로 착각하지 않는다.","core":0},{"s":"초기값·최종값 정리는 T08의 조건을 적용한다.","core":0}]},{"t":"fig","src":"figures/control/t-standard-inputs.svg","title":"표준 입력 네 가지","caption":"계단·램프·포물선은 t≥0의 인과 신호다. 임펄스의 화살표 높이는 실제 유한 높이가 아니라 단위 면적을 뜻한다.","alt":"표준 입력 네 가지. 계단·램프·포물선은 t≥0의 인과 신호다. 임펄스의 화살표 높이는 실제 유한 높이가 아니라 단위 면적을 뜻한다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/control/t-delay-locus.svg","title":"순수 시간지연의 원형 벡터궤적","caption":"지연은 이득을 바꾸지 않고 주파수에 비례하는 위상 지연을 더한다.","alt":"순수 시간지연의 원형 벡터궤적. 지연은 이득을 바꾸지 않고 주파수에 비례하는 위상 지연을 더한다.","width":960.0,"height":480.0},{"t":"fig","src":"figures/control/t-laplace-shift-convolution.svg","title":"이동 정리와 계단함수 합성","caption":"시간지연은 e⁻ᵃˢ를 곱하고 e⁻ᵃᵗ의 곱은 F(s+a)로 바꾼다. 유한 펄스는 서로 다른 시각의 계단을 빼서 만든다. 회로 원본 41~42쪽 유형도 연결한다.","alt":"이동 정리와 계단함수 합성. 시간지연은 e⁻ᵃˢ를 곱하고 e⁻ᵃᵗ의 곱은 F(s+a)로 바꾼다. 유한 펄스는 서로 다른 시각의 계단을 빼서 만든다. 회로 원본 41~42쪽 유형도 연결한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-convolution.svg","title":"컨벌루션의 겹침 면적","caption":"두 단위 사각펄스의 컨벌루션은 폭 2·최대높이 1인 삼각펄스다. 왼쪽은 g(t−τ)를 t=1.5로 이동한 순간이다.","alt":"컨벌루션의 겹침 면적. 두 단위 사각펄스의 컨벌루션은 폭 2·최대높이 1인 삼각펄스다. 왼쪽은 g(t−τ)를 t=1.5로 이동한 순간이다.","width":960.0,"height":480.0},{"t":"fig","src":"figures/control/t-piecewise-steps.svg","title":"구간별 파형의 계단 합성","caption":"회로 원본 42쪽의 계단 합성 유형을 새 수치로 재구성했다. 각 계단 항을 변환하면 계수×e⁻ᵃˢ/s가 된다.","alt":"구간별 파형의 계단 합성. 회로 원본 42쪽의 계단 합성 유형을 새 수치로 재구성했다. 각 계단 항을 변환하면 계수×e⁻ᵃˢ/s가 된다.","width":960.0,"height":510.0},{"t":"m","tex":"\\mathcal{L}\\{af+bg\\}=aF+bG,\\quad\\mathcal{L}\\{e^{-at}f(t)\\}=F(s+a)","note":"a,b가 상수인 선형성; 지수 곱에서는 a의 부호를 확인."},{"t":"m","tex":"\\mathcal{L}\\{f(t-a)u(t-a)\\}=e^{-as}F(s)","note":"a≥0인 인과적 시간 지연."},{"t":"m","tex":"\\mathcal{L}\\{t^nf(t)\\}=(-1)^n\\frac{d^nF}{ds^n}","note":"변환 적분을 미분할 수 있는 수렴 조건에서 n은 0 이상의 정수."},{"t":"m","tex":"\\mathcal{L}\\{f^{(n)}\\}=s^nF(s)-\\sum_{k=0}^{n-1}s^{n-1-k}f^{(k)}(0^-)","note":"시간 미분은 초기값들을 차례대로 뺀다."},{"t":"m","tex":"\\mathcal{L}\\left\\{\\int_0^t f(\\tau)d\\tau\\right\\}=\\frac{F(s)}{s},\\quad\\mathcal{L}\\{f*g\\}=F(s)G(s)","note":"적분 초기값 0. 별도 적분 초기값 g0가 있으면 g0/s를 더한다."},{"t":"m","tex":"\\mathcal{L}^{-1}\\left\\{\\frac{1}{(s+a)^m}\\right\\}=\\frac{t^{m-1}}{(m-1)!}e^{-at}","note":"m≥1인 정수, t≥0."},{"t":"m","tex":"\\mathcal{L}^{-1}\\left\\{\\frac{s}{(s+a)^2+b^2}\\right\\}=e^{-at}\\left(\\cos bt-\\frac{a}{b}\\sin bt\\right)","note":"b≠0. 분자를 (s+a)-a로 나누어 읽는다."},{"t":"trap","items":["지연된 계단과 원래 함수의 곱을 무조건 e^(-as)F(s)로 변환하지 않는다.","실적분의 초기 축적량에는 1/s가 필요하다.","시간곱과 컨볼루션을 구별한다."]},{"t":"ex","q":"f(t)=t u(t-2)의 변환은?","steps":["t=(t-2)+2로 쓴다.","f=[(t-2)+2]u(t-2)이므로 먼저 t+2의 변환 1/s²+2/s를 구한다.","2초 지연 인자 e^(-2s)를 곱한다."],"a":"F(s)=e^(-2s)(1/s²+2/s)."},{"t":"ex","q":"F(s)=(3s+5)/[(s+1)(s+2)]의 역변환은?","steps":["A/(s+1)+B/(s+2)로 둔다.","A+B=3, 2A+B=5이므로 A=2,B=1."],"a":"f(t)=2e^(-t)+e^(-2t)."},{"t":"ex","q":"y″+4y=0, y(0)=2, y′(0)=6의 해는?","steps":["(s²+4)Y-2s-6=0.","Y=2s/(s²+4)+3×2/(s²+4)."],"a":"y(t)=2cos2t+3sin2t. 초기값과 초기미분을 대입해 확인한다."},{"t":"ex","q":"초기전압 0인 2 F 콘덴서에 면적 4 C인 전류임펄스 4δ(t)를 가하면 전압은?","steps":["I(s)=4, V=I/(sC)=2/s.","전압변화는 주입 전하/용량과도 일치한다."],"a":"v(t)=2u(t) V."},{"t":"chk","q":"s/(s+3)의 역변환을 구하라.","a":"1-3/(s+3)로 나누므로 δ(t)-3e^(-3t)u(t). 상수항 1은 임펄스다."}]},{"id":"T19","title":"전달요소와 물리계 모델을 만드는 순서","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"비례·적분·미분·1차지연·2차지연·순수시간지연을 기본 요소로 분해하면 식과 응답을 연결하기 쉽다.","core":1},{"s":"미분요소는 입력이 빨리 변할수록 크게 반응하고 적분요소는 작은 입력이 계속되어도 상태가 누적된다.","core":0},{"s":"순수시간지연은 파형 모양을 바꾸지 않고 시간만 늦춘다.","core":0}]},{"t":"p","ss":[{"s":"물리계의 전달함수는 먼저 출력변수를 정하고 물리법칙으로 미분방정식을 세운 뒤 초기조건 0에서 변환한다.","core":0},{"s":"힘 입력 F에 대한 질량 m, 점성계수 b, 스프링 k의 변위 x는 mx″+bx′+kx=F이므로 X/F=1/(ms²+bs+k)다.","core":0},{"s":"속도를 출력으로 바꾸면 V/F=s/(ms²+bs+k)가 되어 영점도 달라진다.","core":0}]},{"t":"p","ss":[{"s":"전기계에서 전류를 입력·전압을 출력으로 두면 저항 R, 코일 sL, 콘덴서 1/(sC)가 블록이 된다.","core":0},{"s":"RC 직렬회로에서 콘덴서 전압을 출력으로 정하면 저역통과, 저항 전압을 출력으로 정하면 고역통과다.","core":0},{"s":"해당 실회로 유도와 진상·지상 보상은 C33, RLC 및 RL·RC의 전체 응답은 C31~C32에서 이어서 읽는다.","core":0}]},{"t":"p","ss":[{"s":"연산증폭기는 이런 비례·적분·미분 블록을 구현한다.","core":0},{"s":"이상 입력전류 0과 선형 음의 피드백의 가상단락으로 반전입력 마디의 KCL을 쓰면 이득이 나온다.","core":0},{"s":"실제 반전·적분·미분 회로와 출력식은 X09에 통합했다.","core":0}]},{"t":"fig","src":"figures/circuit/c-transfer-outputs.svg","title":"RC 저역·고역·분압·전류입력","caption":"같은 소자라도 어느 마디의 전압을 출력으로 읽는지, 입력이 전압인지 전류인지에 따라 전달함수와 단위가 달라진다. 모든 출력은 별도 부하가 없는 조건이다.","alt":"같은 소자라도 어느 마디의 전압을 출력으로 읽는지, 입력이 전압인지 전류인지에 따라 전달함수와 단위가 달라진다. 모든 출력은 별도 부하가 없는 조건이다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/circuit/c-lead-lag-circuits.svg","title":"진상·지상 보상 실제 결선","caption":"진상은 입력-출력 사이 R1∥C와 출력-기준 R2다. 지상은 입력-출력 R1과 출력에서 R2-C 직렬로 기준까지 이어진다. 원문 노드와 본문 식의 대응을 분명히 했다.","alt":"진상은 입력-출력 사이 R1∥C와 출력-기준 R2다. 지상은 입력-출력 R1과 출력에서 R2-C 직렬로 기준까지 이어진다. 원문 노드와 본문 식의 대응을 분명히 했다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/control/t-rc-block.svg","title":"RC 회로와 폐루프 블록의 대응","caption":"커패시터 전압을 되먹임하여 저항 전압을 구한다. 전달함수는 초기조건이 0일 때 정의한다.","alt":"RC 회로와 폐루프 블록의 대응. 커패시터 전압을 되먹임하여 저항 전압을 구한다. 전달함수는 초기조건이 0일 때 정의한다.","width":960.0,"height":470.0},{"t":"fig","src":"figures/control/t-opamp-circuits.svg","title":"연산증폭기 기본 세 회로","caption":"비반전 입력은 접지된다. 적분기는 피드백에 C, 미분기는 입력에 C가 있다. 이상 모델의 입출력 저항과 이득 조건은 X09에서 함께 읽는다.","alt":"연산증폭기 기본 세 회로. 비반전 입력은 접지된다. 적분기는 피드백에 C, 미분기는 입력에 C가 있다. 이상 모델의 입출력 저항과 이득 조건은 X09에서 함께 읽는다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-physical-model.svg","title":"질량·스프링·감쇠계와 전기 요소","caption":"기준 방향은 오른쪽이다. 스프링과 감쇠기는 질량과 벽 사이에 병렬 연결된다. 기계·전기 대응은 선택한 비유 체계를 먼저 고정해야 한다.","alt":"질량·스프링·감쇠계와 전기 요소. 기준 방향은 오른쪽이다. 스프링과 감쇠기는 질량과 벽 사이에 병렬 연결된다. 기계·전기 대응은 선택한 비유 체계를 먼저 고정해야 한다.","width":960.0,"height":590.0},{"t":"fig","src":"figures/control/t-electrical-blocks.svg","title":"전기 요소의 임피던스 블록","caption":"전압을 출력, 전류를 입력으로 잡은 블록이다. 커패시터 초기전압이나 인덕터 초기전류가 있으면 별도 초기조건 항을 포함한다.","alt":"전기 요소의 임피던스 블록. 전압을 출력, 전류를 입력으로 잡은 블록이다. 커패시터 초기전압이나 인덕터 초기전류가 있으면 별도 초기조건 항을 포함한다.","width":960.0,"height":550.0},{"t":"m","tex":"G_P=K,\\quad G_I=\\frac{K}{s},\\quad G_D=Ks","note":"초기상태 0에서의 이상 비례·적분·미분 요소."},{"t":"m","tex":"G_1=\\frac{K}{1+\\tau s},\\quad G_2=\\frac{K\\omega_n^2}{s^2+2\\zeta\\omega_ns+\\omega_n^2},\\quad G_L=e^{-Ls}","note":"1차지연·2차지연·순수시간지연. L≥0 s."},{"t":"m","tex":"\\frac{X(s)}{F(s)}=\\frac{1}{ms^2+bs+k},\\quad\\omega_n=\\sqrt{k/m},\\quad\\zeta=\\frac{b}{2\\sqrt{mk}}","note":"m,k>0인 질량-스프링-댐퍼의 변위 전달함수. 물리 단위를 유지한다."},{"t":"trap","items":["질량·감쇠·스프링 모델은 어떤 변위를 출력으로 삼았는지 먼저 정한다. 같은 부품이어도 입출력 위치가 바뀌면 전달함수가 달라진다.","수송지연 e^(-Ls)는 시간 이동이며 1차 지연 1/(1+Ts)와 같지 않다."]},{"t":"ex","q":"m=1 kg, b=4 N·s/m, k=4 N/m 계에 힘을 가한다. 변위 전달함수와 제동상태는?","steps":["X/F=1/(s²+4s+4).","ωn=2 rad/s, ζ=4/(2×2)=1."],"a":"X/F=1/(s+2)² m/N, 임계감쇠."},{"t":"chk","q":"시간지연 e^(-2s)는 정현파의 크기와 위상을 어떻게 바꾸는가?","a":"크기비 1, 위상 -2ω rad. 시간은 2초 늦어진다."}]},{"id":"T20","title":"감도: 매개변수 변화가 전체 응답에 미치는 비율","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"정규화 감도는 매개변수 k의 상대 변화에 대한 전달함수 T의 상대 변화다.","core":1},{"s":"단순 미분 dT/dk와 달리 k/T를 곱하므로 작은 변화에 대해 ΔT/T≈S·Δk/k로 읽는다.","core":0},{"s":"감도가 0.1이면 k가 1% 변할 때 T는 약 0.1% 변한다.","core":0}]},{"t":"p","ss":[{"s":"음의 피드백 T=G/(1+GH)에서 G에 대한 감도는 1/(1+GH), H에 대한 감도는 -GH/(1+GH)다.","core":0},{"s":"루프이득을 크게 하면 전향경로 G의 변화 영향은 작아지지만 피드백 H의 변화 영향까지 함께 작아지는 것은 아니다.","core":0},{"s":"센서 정확도가 중요한 이유다.","core":0}]},{"t":"p","ss":[{"s":"기호 G,H는 s 또는 jω에 따른 복소함수일 수 있다.","core":0},{"s":"감도를 상수 하나로 읽는 예제는 특정 주파수나 정적 이득을 평가한 경우다.","core":0},{"s":"실제 설계에서는 안정도·노이즈·위상여유 때문에 GH를 모든 주파수에서 무한히 크게 만들 수 없다.","core":0}]},{"t":"p","ss":[{"s":"한 매개변수가 G와 H 양쪽을 바꾸면 연쇄법칙으로 각 경로의 영향을 더한다.","core":0},{"s":"감도함수 S=1/(1+L)와 보완감도 L/(1+L)는 합이 1이며, 출력 잡음과 외란의 경로별 영향 해석에도 쓰인다.","core":0}]},{"t":"fig","src":"figures/control/t-loop-structure.svg","title":"개루프와 폐루프 구성","caption":"피드백 선은 센서 출력 Hy를 비교점의 음 입력으로 돌린다. u는 조작량, y는 제어량이다.","alt":"개루프와 폐루프 구성. 피드백 선은 센서 출력 Hy를 비교점의 음 입력으로 돌린다. u는 조작량, y는 제어량이다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/control/t-sensitivity.svg","title":"폐루프 감도의 수치적 의미","caption":"이 예는 양의 정적 이득과 단위 음의 피드백이다. 미소변화 감도 S_G^T=1/(1+GH)와 유한 변화율을 구분한다.","alt":"폐루프 감도의 수치적 의미. 이 예는 양의 정적 이득과 단위 음의 피드백이다. 미소변화 감도 S_G^T=1/(1+GH)와 유한 변화율을 구분한다.","width":960.0,"height":460.0},{"t":"m","tex":"S_k^T=\\frac{k}{T}\\frac{\\partial T}{\\partial k}=\\frac{\\partial\\ln T}{\\partial\\ln k}","note":"정의에서 다른 독립 매개변수는 고정. 로그 미분은 국소 변화 해석."},{"t":"m","tex":"S_G^T=\\frac{1}{1+GH},\\quad S_H^T=-\\frac{GH}{1+GH}","note":"T=G/(1+GH), 서로 독립인 G,H 변화."},{"t":"m","tex":"S=\\frac{1}{1+L},\\quad T_c=\\frac{L}{1+L},\\quad S+T_c=1","note":"L=GH. Tc는 보완감도이며 일반 폐루프 출력 T=G/(1+GH)와 구분."},{"t":"trap","items":["감도는 절대 변화량이 아니라 상대 변화율의 비다. G에 대한 감도와 H에 대한 감도의 부호를 구별한다.","루프 이득을 키우면 감도는 줄어들 수 있지만, 안정성과 모든 주파수에서의 성능까지 자동으로 좋아지지는 않는다."]},{"t":"ex","q":"G=9,H=1인 정적 음의 피드백에서 G가 2% 증가하면 T의 상대 변화는 약 얼마인가?","steps":["SG=1/(1+9)=0.1.","ΔT/T≈0.1×2%=0.2%."],"a":"약 +0.2%. H가 2% 증가했다면 약 -1.8%다."},{"t":"chk","q":"GH가 매우 커지면 G와 H에 대한 감도는 각각 어디로 가는가?","a":"SG→0, SH→-1. 검출기 변화는 제거되지 않는다."}]},{"id":"T21","title":"공진정점·공진주파수·대역폭·분리도","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"주파수응답의 영주파수 이득 M0=|T(0)|는 정적 이득이다.","core":1},{"s":"단위계단의 최종값은 안정성과 최종값 조건 아래 T(0)이고, 1-M0를 추종오차로 읽으려면 양의 DC 이득·단위 입력·동일 단위라는 조건이 필요하다.","core":0},{"s":"복소 크기 M0와 부호를 가진 T(0)를 무조건 같은 것으로 취급하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"공진정점 Mr는 주파수에 따른 크기의 최댓값이며 시간영역 최대오버슈트 Mp와 다른 값이다.","core":0},{"s":"DC 이득 1인 표준 2차계에서 0<ζ<1/√2일 때 0보다 큰 공진주파수가 존재한다.","core":0},{"s":"ζ≥1/√2이면 최대 크기는 ω=0의 1이며 별도의 양의 공진 봉우리는 없다.","core":0},{"s":"ζ=0인 이상 무감쇠계는 ωn에서 발산하므로 유한 Mr 식을 적용하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"대역폭은 저역통과형에서 DC 크기 M0의 1/√2, 즉 약 -3 dB로 떨어지는 양의 주파수를 기준으로 정한다.","core":0},{"s":"정규화되지 않은 시스템에서 절대 크기 0.707을 찾으면 틀린다.","core":0},{"s":"주파수가 Hz인지 rad/s인지도 확인한다.","core":0}]},{"t":"p","ss":[{"s":"비슷한 표준 저역통과 응답끼리는 넓은 대역폭이 빠른 응답과 연결된다.","core":0},{"s":"그러나 잡음을 더 통과시킬 수 있으며, 큰 공진정점은 작은 감쇠와 큰 오버슈트를 동반하는 경향이 있다.","core":0},{"s":"신호와 다른 주파수의 외란을 구별하는 성질을 분리도라 하며, 날카로운 주파수 선택과 과도진동 사이의 절충을 함께 살핀다.","core":0}]},{"t":"fig","src":"figures/control/t-resonance-bandwidth.svg","title":"공진과 −3 dB 대역폭","caption":"공진정점은 주파수응답의 최대 크기, 대역폭은 DC 크기의 1/√2로 떨어지는 주파수다. 시간영역 최대오버슈트와 혼동하지 않는다.","alt":"공진과 −3 dB 대역폭. 공진정점은 주파수응답의 최대 크기, 대역폭은 DC 크기의 1/√2로 떨어지는 주파수다. 시간영역 최대오버슈트와 혼동하지 않는다.","width":960.0,"height":550.0},{"t":"m","tex":"|T(j\\omega)|=\\frac{1}{\\sqrt{(1-r^2)^2+(2\\zeta r)^2}},\\quad r=\\omega/\\omega_n","note":"DC 이득 1인 표준 2차계."},{"t":"m","tex":"\\omega_r=\\omega_n\\sqrt{1-2\\zeta^2},\\quad M_r=\\frac{1}{2\\zeta\\sqrt{1-\\zeta^2}}","note":"0<ζ<1/√2일 때. ωr<ωd<ωn."},{"t":"m","tex":"\\omega_{BW}=\\omega_n\\sqrt{1-2\\zeta^2+\\sqrt{2-4\\zeta^2+4\\zeta^4}}","note":"안정 표준 2차 저역통과의 DC 대비 -3 dB 대역폭, ζ>0."},{"t":"m","tex":"|T(j\\omega_{BW})|=\\frac{|T(0)|}{\\sqrt{2}},\\quad f_{BW}=\\omega_{BW}/(2\\pi)","note":"일반적인 저역통과 크기 기준과 Hz 변환."},{"t":"trap","items":["공진주파수 ωr의 식은 0<ζ<1/√2에서만 양의 공진점을 뜻한다. ζ≥1/√2에는 별도의 양의 공진봉우리가 없다.","-3 dB 대역폭의 기준은 DC 이득이다. DC 이득이 1이 아니면 절대 크기 1/√2와 같지 않다."]},{"t":"ex","q":"ζ=0.5, ωn=10 rad/s인 표준 2차계의 공진주파수와 공진정점은?","steps":["ωr=10√(1-0.5)=5√2≈7.071.","Mr=1/[1×√0.75]=2/√3≈1.155.","ωd=5√3≈8.660으로 공진주파수보다 크다."],"a":"ωr≈7.071 rad/s, Mr≈1.155."},{"t":"chk","q":"DC 이득 4인 저역통과계의 -3 dB 크기 기준은?","a":"4/√2≈2.828. 0.707 자체가 아니다."}]},{"id":"T22","title":"벡터궤적: 시작점·끝점·회전·교점을 계산하기","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"벡터궤적은 G(jω)의 실수부를 가로축, 허수부를 세로축으로 두고 ω=0+에서 ∞까지 움직인 점의 경로다.","core":1},{"s":"크기는 원점에서의 거리, 위상은 양의 실수축에서의 각도다.","core":0},{"s":"atan(Im/Re)만 쓰면 사분면을 잃으므로 Re와 Im의 부호를 함께 보거나 atan2를 사용한다.","core":0}]},{"t":"p","ss":[{"s":"K>0인 비례요소는 실수축의 점 K, 미분 s는 양의 허수축을 원점에서 위로, 적분 1/s는 음의 허수축의 무한대에서 원점으로 움직인다.","core":0},{"s":"1+τs는 실수부 1인 수직선이고, 1/(1+τs)는 중심 1/2·반지름 1/2인 원의 아래 반원을 1에서 0으로 지난다.","core":0}]},{"t":"p","ss":[{"s":"K/[s^ℓ∏(s+aᵢ)]에서 ai>0이면 저주파 크기와 방향은 s^ℓ가 정한다.","core":0},{"s":"ℓ=0은 양의 유한 실수에서, ℓ=1은 위상 -90°의 무한대에서, ℓ=2는 -180°, ℓ=3은 -270°의 무한대에서 출발한다.","core":0},{"s":"고주파는 전체 극점·영점 차수 차에 -90°를 곱한 방향으로 원점에 접근한다.","core":0},{"s":"감겨 보이는 곡선은 이 극한만으로 완성되지 않으므로 교점도 계산한다.","core":0}]},{"t":"p","ss":[{"s":"정확한 작도는 분모의 켤레를 곱해 Re(ω),Im(ω)를 분리하고, Im=0인 양의 ω에서 실수축 교점, Re=0에서 허수축 교점을 구한다.","core":0},{"s":"1차·2차 절점과 교점 사이의 대표 주파수 한두 개를 찍어 진행 방향을 확인한다.","core":0},{"s":"실수계수계의 음의 주파수 가지는 양의 가지의 실수축 대칭이다.","core":0}]},{"t":"p","ss":[{"s":"순수시간지연 e^(-jωL)=cosωL-j sinωL은 반지름 1인 원을 시계방향으로 계속 돈다.","core":0},{"s":"따라서 지연은 크기가 같은 다른 요소와도 위상 안정성이 다를 수 있다.","core":0},{"s":"표준 2차 지연은 ω=0에서 1, ω=ωn에서 -j/(2ζ), 고주파에서 0∠-180°를 지난다.","core":0}]},{"t":"fig","src":"figures/control/t-vector-elements.svg","title":"여섯 기본 전달요소의 벡터궤적","caption":"원점이나 무한대에서 출발하는 요소는 표시 범위 바깥까지 이어진다. 1차 지연은 중심 (1/2,0), 반지름 1/2인 아래 반원이다.","alt":"여섯 기본 전달요소의 벡터궤적. 원점이나 무한대에서 출발하는 요소는 표시 범위 바깥까지 이어진다. 1차 지연은 중심 (1/2,0), 반지름 1/2인 아래 반원이다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-vector-type-0.svg","title":"0형 계 벡터궤적 세 가지","caption":"K=1, 0개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","alt":"0형 계 벡터궤적 세 가지. K=1, 0개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","width":960.0,"height":500.0},{"t":"fig","src":"figures/control/t-vector-type-1.svg","title":"1형 계 벡터궤적 세 가지","caption":"K=1, 1개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","alt":"1형 계 벡터궤적 세 가지. K=1, 1개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","width":960.0,"height":500.0},{"t":"fig","src":"figures/control/t-vector-type-2.svg","title":"2형 계 벡터궤적 세 가지","caption":"K=1, 2개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","alt":"2형 계 벡터궤적 세 가지. K=1, 2개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","width":960.0,"height":500.0},{"t":"fig","src":"figures/control/t-vector-type-3.svg","title":"3형 계 벡터궤적 세 가지","caption":"K=1, 3개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","alt":"3형 계 벡터궤적 세 가지. K=1, 3개의 원점 극점과 −1·−2·−3의 실수 극점을 조합한 실제 계산 곡선이다. 각 패널은 독립 축척이며 원점 극점이 있으면 ω→0에서 발산한다.","width":960.0,"height":500.0},{"t":"fig","src":"figures/control/t-delay-locus.svg","title":"순수 시간지연의 원형 벡터궤적","caption":"지연은 이득을 바꾸지 않고 주파수에 비례하는 위상 지연을 더한다.","alt":"순수 시간지연의 원형 벡터궤적. 지연은 이득을 바꾸지 않고 주파수에 비례하는 위상 지연을 더한다.","width":960.0,"height":480.0},{"t":"m","tex":"\\frac{1}{1+j\\omega\\tau}=\\frac{1}{1+(\\omega\\tau)^2}-j\\frac{\\omega\\tau}{1+(\\omega\\tau)^2}","note":"1차 지연의 실수·허수 분리."},{"t":"m","tex":"\\left(\\operatorname{Re}G-\\frac{1}{2}\\right)^2+(\\operatorname{Im}G)^2=\\frac{1}{4}","note":"정규화 1차 지연의 원 방정식. 양의 주파수는 아래 반원."},{"t":"m","tex":"\\arg G(j\\omega)\\to-(n-m)90^\\circ\\quad(\\omega\\to\\infty)","note":"양의 최고차계수 이득을 가진 실수 유리함수의 연속 위상 기준. 차수차가 n-m."},{"t":"trap","items":["지연요소 e^(-jωL)는 크기 1, 위상 -ωL이다. 위상 식의 단위는 rad이며 도 단위에 그대로 더하면 안 된다.","여러 위상교차점이 있으면 하나만 골라 전체 안정성을 단정하지 않는다."]},{"t":"ex","q":"G(s)=1/[(s+1)(s+3)]의 시작점, 끝방향, 허수축 교점은?","steps":["분모는 3-ω²+j4ω.","ReG=(3-ω²)/[(3-ω²)²+16ω²], ImG=-4ω/같은분모.","ω=0에서 1/3, ω=√3에서 -j/(4√3), ∞에서 위상 -180°로 원점에 접근."],"a":"양의 실수 1/3에서 출발해 하반평면을 지나고, -j/(4√3)에서 허수축을 건넌다."},{"t":"chk","q":"G(jω)의 실수부가 음수이고 허수부가 음수인데 atan(Im/Re)가 +30°라면 실제 주값 위상은?","a":"제3사분면이므로 -150°이다. 단순 atan의 +30°만 쓰면 안 된다."}]},{"id":"T23","title":"Routh 특수 경우: 첫 열 0·영행·안정 경계","pr":"B","min":40,"day":2,"b":[{"t":"p","ss":[{"s":"첫 열의 한 원소만 0이고 같은 행의 다른 값은 0이 아니면 그 첫 원소를 작은 양수 ε로 바꾼다.","core":1},{"s":"표를 끝까지 계산하고 ε→0+에서 첫 열 부호를 센다.","core":0},{"s":"0으로 나눠 계산을 멈추거나 0을 양수로 간주해서는 안 된다.","core":0}]},{"t":"p","ss":[{"s":"한 행 전체가 0이면 바로 위 행의 계수와 해당 s 차수로 보조다항식 A(s)를 만든다.","core":0},{"s":"A′(s)의 계수를 영행에 채워 표 계산을 계속한다.","core":0},{"s":"보조다항식의 근은 원점에 대해 대칭인 근 군을 나타낸다.","core":0},{"s":"영행이 생겼다는 이유만으로 항상 단순 허수축 한 쌍이라고 단정하지 말고 A(s)의 근을 확인한다.","core":0}]},{"t":"p","ss":[{"s":"매개변수 안정 범위의 경계에서 s¹행이 0이 되면 바로 위 s²행으로 허수축 교점의 ω를 구하는 경우가 많다.","core":0},{"s":"그 경계에서는 단순 허수축 근이면 자유응답의 한계안정일 수 있으나, 반복근 여부와 다른 우반평면 근이 없는지 확인해야 한다.","core":0}]},{"t":"p","ss":[{"s":"표의 한 행을 양의 상수로 나누어 계산을 단순화해도 첫 열 부호는 같다.","core":0},{"s":"음수로 나누면 부호가 바뀌므로 원래 부호 정보를 잃지 않아야 한다.","core":0},{"s":"근 개수는 중복도를 포함하며, 표는 약분 전 실제 특성다항식으로 작성한다.","core":0}]},{"t":"fig","src":"figures/control/t-routh-table.svg","title":"Routh 표 구성의 실제 예","caption":"실수계수 다항식의 첫 열 부호 변화는 우반평면 근의 개수다. 0이 생기는 특수 경우에는 보완 절차를 적용한다.","alt":"Routh 표 구성의 실제 예. 실수계수 다항식의 첫 열 부호 변화는 우반평면 근의 개수다. 0이 생기는 특수 경우에는 보완 절차를 적용한다.","width":960.0,"height":540.0},{"t":"fig","src":"figures/control/t-routh-zero.svg","title":"Routh 특수 상황의 분기 절차","caption":"그림은 계산 절차를 분리한 보충 도식이다. 허수축 근은 최종값 정리와 BIBO 안정에도 영향을 준다.","alt":"Routh 특수 상황의 분기 절차. 그림은 계산 절차를 분리한 보충 도식이다. 허수축 근은 최종값 정리와 BIBO 안정에도 영향을 준다.","width":960.0,"height":520.0},{"t":"trap","items":["Routh 표의 첫 원소만 0인 경우와 한 행 전체가 0인 경우는 처리법이 다르다.","안정구간의 등호 경계는 별도로 검사한다. 허수축 극점이 있는 상태를 점근안정으로 포함하지 않는다."]},{"t":"ex","q":"s³+2s²+s+2=0의 Routh 표에서 영행을 처리하라.","steps":["s³행 [1,1], s²행 [2,2]. s¹행은 [0,0].","A(s)=2s²+2, A′(s)=4s이므로 s¹행을 [4,0]으로 대체한다.","A=0에서 ±j, 나머지는 -2. 원식=(s+2)(s²+1)."],"a":"우반평면 근은 없지만 ±j 때문에 점근안정·BIBO 안정은 아니다."},{"t":"ex","q":"s⁴+2s³+2s²+4s+1=0에서 첫 열 0을 처리하라.","steps":["첫 두 행 [1,2,1], [2,4,0].","s²행 [0,1]을 [ε,1]로 둔다.","s¹행 첫 값은 (4ε-2)/ε이며 ε→0+에서 음수다.","첫 열 +,+,+,-,+이므로 부호가 두 번 바뀐다."],"a":"우반평면 근 2개로 불안정."},{"t":"chk","q":"한 행 전체가 0일 때 임의의 작은 수들을 행 전체에 넣어도 되는가?","a":"아니다. 바로 위 행에서 보조다항식을 만들고 그 미분계수로 영행을 대체한다."}]},{"id":"T24","title":"근궤적 작도: 각도조건·이탈점·출발각·허수축 교점","pr":"B","min":45,"day":2,"b":[{"t":"p","ss":[{"s":"L(s)=K N(s)/D(s), K≥0인 음의 피드백에서 1+L=0이므로 궤적 위 점은 arg(N/D)=(2q+1)180°와 K|N/D|=1을 만족한다.","core":1},{"s":"먼저 개루프 극점을 ×, 영점을 ○로 표시하고 중복도까지 센다.","core":0},{"s":"실수축 대칭과 오른쪽 실수 극점·영점 개수가 홀수인 실수축 구간을 정한다.","core":0}]},{"t":"p","ss":[{"s":"K=0에서는 극점에서 출발하고 K→∞에서는 유한 영점 또는 무한대로 간다.","core":0},{"s":"보통 proper 유리함수 n≥m에서는 가지 수가 n이며 n-m개가 무한대로 향한다.","core":0},{"s":"점근선의 각도·중심은 T14의 식을 적용한다.","core":0},{"s":"복소극점·영점의 켤레성 때문에 위·아래 가지는 대칭이다.","core":0}]},{"t":"p","ss":[{"s":"실수축 분기 후보는 K(s)=-D(s)/N(s)의 dK/ds=0을 풀어 찾는다.","core":0},{"s":"후보가 실수인지, 해당 실수축 근궤적 구간에 있는지, K≥0인지 모두 확인해야 한다.","core":0},{"s":"미분식의 모든 근이 실제 이탈점은 아니다.","core":0}]},{"t":"p","ss":[{"s":"복소극점 pi의 출발각은 각도조건에서 해당 극점의 각도만 미지수로 두어 구한다.","core":0},{"s":"pi에서 각 영점으로의 벡터가 아니라 영점에서 pi로 향한 벡터 pi-zj의 각도 합을 쓰고, 다른 극점들의 pi-pj 각도를 뺀다.","core":0},{"s":"복소영점 도착각도 같은 방식으로 전체 각도조건에서 구한다.","core":0}]},{"t":"p","ss":[{"s":"허수축 교점은 특성다항식 D+KN에 Routh를 적용해 안정 경계 K를 얻고, 그때 보조다항식 또는 s=jω 대입으로 ω를 구한다.","core":0},{"s":"최종 작도에는 K가 증가하는 화살표를 넣고, 필요하면 대표 이득의 근을 계산해 어느 가지가 어느 영점으로 연결되는지 확인한다.","core":0}]},{"t":"fig","src":"figures/control/t-root-locus-asymptote.svg","title":"실수축 구간과 점근선","caption":"실수축에서 오른쪽의 실수 극점·영점 수가 홀수인 구간에 궤적이 있다. 이 그림은 K≥0 특성방정식 근을 직접 계산한 것이다.","alt":"실수축 구간과 점근선. 실수축에서 오른쪽의 실수 극점·영점 수가 홀수인 구간에 궤적이 있다. 이 그림은 K≥0 특성방정식 근을 직접 계산한 것이다.","width":960.0,"height":570.0},{"t":"fig","src":"figures/control/t-root-locus-boundary.svg","title":"허수축 교점과 이탈점","caption":"왼쪽은 Routh 영행의 보조방정식으로 얻은 안정 경계, 오른쪽은 두 후보 중 실제 양의 K 궤적에 있는 이탈점만 표시했다.","alt":"허수축 교점과 이탈점. 왼쪽은 Routh 영행의 보조방정식으로 얻은 안정 경계, 오른쪽은 두 후보 중 실제 양의 K 궤적에 있는 이탈점만 표시했다.","width":960.0,"height":540.0},{"t":"m","tex":"\\sum_j\\arg(s-z_j)-\\sum_i\\arg(s-p_i)=(2q+1)180^\\circ","note":"양의 K, 음의 피드백의 각도조건."},{"t":"m","tex":"K=-\\frac{D(s)}{N(s)},\\quad\\frac{dK}{ds}=0","note":"분기 후보. 실제 궤적·K≥0 조건을 별도로 검사."},{"t":"m","tex":"\\theta_d=180^\\circ+\\sum_j\\arg(p_i-z_j)-\\sum_{k\\ne i}\\arg(p_i-p_k)","note":"복소극점 pi의 출발각, 360° 차이는 같은 방향."},{"t":"m","tex":"\\theta_a=180^\\circ-\\sum_{j\\ne i}\\arg(z_i-z_j)+\\sum_k\\arg(z_i-p_k)","note":"영점 zi 부근에서 그 영점으로부터 궤적 점을 향한 반경의 각도. 진행 방향은 영점 쪽이다."},{"t":"trap","items":["양의 이득 근궤적의 실수축 조건은 해당 점 오른쪽의 실수 극점·영점 개수가 홀수인 것이다.","dK/ds=0의 모든 해가 실제 이탈점은 아니다. 실수축 궤적 위인지와 K≥0 조건을 다시 확인한다."]},{"t":"ex","q":"L=K/[s(s+2)(s+5)]의 실수축 분기 후보와 실제 이탈점을 구하라.","steps":["K=-s(s+2)(s+5), dK/ds=-(3s²+14s+10).","후보 s=(-7±√19)/3≈-0.880,-3.786.","실수축 궤적은 (-∞,-5),(-2,0). -0.880만 해당 구간이며 K≈4.06>0."],"a":"실제 이탈점은 (-7+√19)/3≈-0.880."},{"t":"ex","q":"L=K/[s(s+2)(s+5)]가 허수축과 만나는 K와 s는?","steps":["특성식 s³+7s²+10s+K=0. Routh s¹행은 (70-K)/7.","안정 범위는 0<K<70, 경계 K=70.","보조다항식 7s²+70=0."],"a":"K=70, s=±j√10. 나머지 근 -7."},{"t":"ex","q":"L=K/[(s+1-j)(s+1+j)]의 위쪽 극점 출발각은?","steps":["위쪽 극점 pi=-1+j에서 다른 극점까지의 차는 2j, 각도 90°.","유한 영점은 없으므로 θd=180°-90°."],"a":"90°. 위쪽 가지는 위로, 아래쪽은 아래로 출발한다."},{"t":"chk","q":"dK/ds=0의 실근이 실수축 궤적 밖이면 어떻게 처리하는가?","a":"양의 이득 근궤적 이탈점에서 제외한다. K 부호도 함께 확인한다."}]},{"id":"T25","title":"상태방정식에서 전달함수·초기상태 응답 구하기","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"n차 미분방정식은 상태를 n개 정해 n개의 1차 미분방정식으로 바꾼다.","core":1},{"s":"상태는 미래 응답을 결정하는 데 필요한 내부 정보이며, 물리적으로는 콘덴서 전압·코일 전류·위치·속도 등을 선택할 수 있다.","core":0},{"s":"상태변수를 바꾸면 A,B,C,D의 숫자는 달라져도 같은 입출력 전달함수를 표현할 수 있다.","core":0}]},{"t":"p","ss":[{"s":"x′=Ax+Bu를 변환하면 (sI-A)X=x(0-)+BU이다.","core":0},{"s":"이 식을 출력 Y=CX+DU에 넣으면 초기상태 응답과 입력 응답이 분리된다.","core":0},{"s":"전달함수는 정의상 x(0-)=0에서 얻는다.","core":0},{"s":"D는 입력이 상태를 거치지 않고 즉시 출력에 나타나는 직접 전달항이며 0이라는 조건이 없으면 버리지 않는다.","core":0}]},{"t":"p","ss":[{"s":"A는 n×n, B는 n×m, C는 p×n, D는 p×m이다.","core":0},{"s":"따라서 다입출력 전달행렬은 p×m이다.","core":0},{"s":"한 입력·한 출력에서는 스칼라 유리함수지만 모든 경우에 스칼라라고 생각하지 않는다.","core":0}]},{"t":"p","ss":[{"s":"det(sI-A)=0의 근은 내부 고유값이다.","core":0},{"s":"전달함수에서 극영점 약분이 생기면 일부 고유모드가 입출력식에 나타나지 않을 수 있다.","core":0},{"s":"상태공간의 내부 안정성은 A로, 약분한 입출력 전달함수의 BIBO 안정은 남은 극점으로 구별한다.","core":0},{"s":"가제어·가관측의 판정은 T27에서 연결한다.","core":0}]},{"t":"fig","src":"figures/control/t-state-space.svg","title":"상태공간의 적분기 구성","caption":"상태 x는 적분기 출력, D는 입력에서 출력으로의 직접 경로다. 초기값이 0인 전달함수는 C(sI−A)⁻¹B+D이다.","alt":"상태공간의 적분기 구성. 상태 x는 적분기 출력, D는 입력에서 출력으로의 직접 경로다. 초기값이 0인 전달함수는 C(sI−A)⁻¹B+D이다.","width":960.0,"height":560.0},{"t":"m","tex":"X(s)=(sI-A)^{-1}x(0^-)+(sI-A)^{-1}BU(s)","note":"연속시간 선형 시불변계의 상태 변환."},{"t":"m","tex":"G(s)=C(sI-A)^{-1}B+D","note":"초기상태 0에서 정의한 전달함수 또는 전달행렬."},{"t":"m","tex":"(sI-A)^{-1}=\\frac{\\operatorname{adj}(sI-A)}{\\det(sI-A)}","note":"역행렬이 존재하는 s에서 성립. 극점 근처에서는 유리함수로 해석."},{"t":"trap","items":["G(s)=C(sI-A)^(-1)B+D는 초기상태가 0인 입출력 전달함수다. 비영 초기상태 응답을 버리지 않는다.","행렬 곱은 순서를 바꾸지 않는다. 스칼라 분수처럼 C·B를 임의로 약분할 수 없다."]},{"t":"ex","q":"A=[[-2,0],[0,-3]], B=[1,1]ᵀ, C=[1,2], D=0.5의 전달함수는?","steps":["(sI-A)^(-1)=diag(1/(s+2),1/(s+3)).","C(sI-A)^(-1)B=1/(s+2)+2/(s+3).","D=0.5를 마지막에 더한다."],"a":"G(s)=1/(s+2)+2/(s+3)+0.5."},{"t":"ex","q":"y″+3y′+2y=u에서 x1=y,x2=y′로 상태식을 쓰라.","steps":["x1′=x2.","x2′=-2x1-3x2+u.","y=x1."],"a":"A=[[0,1],[-2,-3]], B=[0,1]ᵀ, C=[1,0], D=0."},{"t":"chk","q":"D가 0이 아닌데 C(sI-A)^(-1)B만 쓰면 무엇이 빠지는가?","a":"입력에서 출력으로 바로 전달되는 직접 전달항 D가 빠진다."}]},{"id":"T26","title":"상태천이행렬: e^(At)·자유응답·강제응답","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"상태천이행렬 Φ(t)=e^(At)는 입력이 0일 때 초기상태가 t초 뒤 어떻게 바뀌는지를 나타낸다.","core":1},{"s":"스칼라 지수처럼 A의 각 원소에 지수를 따로 취하는 연산이 아니다.","core":0},{"s":"행렬 멱급수, 대각화, Jordan 형식 또는 (sI-A)^(-1)의 역라플라스로 구한다.","core":0}]},{"t":"p","ss":[{"s":"상태 해는 Φ(t)x0인 자유응답과 ∫0ᵗΦ(t-τ)Bu(τ)dτ인 강제응답의 합이다.","core":0},{"s":"초기시간이 t0이면 Φ(t-t0)x(t0)와 t0부터의 적분으로 바꾼다.","core":0},{"s":"상수 A인 시불변계에서는 두 시간의 차만 필요하지만 시변계에서는 일반적으로 Φ(t,t0)로 써야 한다.","core":0}]},{"t":"p","ss":[{"s":"Φ(0)=I, Φ(t1)Φ(t2)=Φ(t1+t2), Φ(t)^(-1)=Φ(-t), dΦ/dt=AΦ=ΦA가 성립한다.","core":0},{"s":"Φ(t)^k=Φ(kt)도 상수 A일 때 따른다.","core":0},{"s":"서로 다른 임의 행렬 A,B에 대해서 e^(A+B)=e^A e^B가 항상 성립하는 것은 아니며 AB=BA 같은 조건이 필요하다.","core":0}]},{"t":"p","ss":[{"s":"대각행렬의 지수는 대각 원소의 스칼라 지수를 취한다.","core":0},{"s":"A=PΛP^(-1)로 대각화되면 e^(At)=P e^(Λt)P^(-1)이다.","core":0},{"s":"중복고유값으로 대각화되지 않는 Jordan 블록에서는 nilpotent 부분의 멱급수가 유한항으로 끝나 t e^(λt) 같은 항이 나온다.","core":0}]},{"t":"fig","src":"figures/control/t-state-transition.svg","title":"상태천이의 자유응답과 강제응답","caption":"LTI 상태방정식의 해를 두 경로로 나눈다. Φ(t₂−t₁)Φ(t₁−t₀)=Φ(t₂−t₀)로 시간 구간을 이어 계산할 수 있다.","alt":"상태천이의 자유응답과 강제응답. LTI 상태방정식의 해를 두 경로로 나눈다. Φ(t₂−t₁)Φ(t₁−t₀)=Φ(t₂−t₀)로 시간 구간을 이어 계산할 수 있다.","width":960.0,"height":480.0},{"t":"m","tex":"\\Phi(t)=e^{At}=I+At+\\frac{A^2t^2}{2!}+\\cdots=\\mathcal{L}^{-1}\\{(sI-A)^{-1}\\}","note":"상수 행렬 A인 연속시간 시불변계."},{"t":"m","tex":"x(t)=\\Phi(t)x_0+\\int_0^t\\Phi(t-\\tau)Bu(\\tau)\\,d\\tau","note":"초기시간 0. 첫 항은 초기상태 응답, 둘째 항은 입력 응답."},{"t":"m","tex":"\\Phi(0)=I,\\quad\\Phi(t_1+t_2)=\\Phi(t_1)\\Phi(t_2),\\quad\\Phi^{-1}(t)=\\Phi(-t)","note":"상수 A의 상태천이 성질."},{"t":"trap","items":["e^(At)는 각 행렬 원소에 따로 지수를 취한 행렬이 아니다. 행렬 거듭제곱 급수 또는 상태천이행렬로 계산한다.","자유응답 Φ(t)x(0)와 입력에 의한 적분 응답을 더해야 비영 초기상태의 전체 응답이다."]},{"t":"ex","q":"A=[[-2,1],[0,-2]]의 상태천이행렬은?","steps":["A=-2I+N, N=[[0,1],[0,0]], N²=0.","I와 N은 교환하므로 e^(At)=e^(-2t)(I+tN)."],"a":"Φ(t)=e^(-2t)[[1,t],[0,1]]."},{"t":"ex","q":"x′=-2x+u, x(0)=3에 일정 입력 u=4를 가할 때 x(t)는?","steps":["자유응답은 3e^(-2t).","강제응답은 ∫0ᵗ4e^(-2(t-τ))dτ=2(1-e^(-2t))."],"a":"x(t)=2+e^(-2t). 초기값 3, 최종값 2."},{"t":"chk","q":"행렬 A의 각 원소에 exp를 적용한 결과가 e^(At)인가?","a":"아니다. e^(At)는 행렬 멱급수다. 대각행렬 등 특별한 구조를 제외하면 원소별 지수와 다르다."}]},{"id":"T27","title":"가제어성·가관측성: 의미와 rank 판정","pr":"B","min":35,"day":2,"b":[{"t":"p","ss":[{"s":"가제어성은 적절한 입력을 사용해 유한 시간 안에 상태를 원하는 상태로 옮길 수 있는 성질이다.","core":1},{"s":"가관측성은 입력과 출력을 일정 시간 관측하여 초기상태를 유일하게 알아낼 수 있는 성질이다.","core":0},{"s":"출력을 크게 바꿀 수 있다는 것과 모든 내부상태를 제어·관측할 수 있다는 것은 다르다.","core":0}]},{"t":"p","ss":[{"s":"n차 연속시간 선형 시불변계에서 가제어행렬은 B,AB,…,A^(n-1)B를 가로로 붙이고 가관측행렬은 C,CA,…,CA^(n-1)을 세로로 붙인다.","core":0},{"s":"각 행렬의 rank가 n이면 완전 가제어·가관측이다.","core":0},{"s":"입력과 출력이 여러 개인 경우 행렬이 직사각형이므로 det 대신 rank가 일반 조건이다.","core":0}]},{"t":"p","ss":[{"s":"한 입력·한 출력의 경우 해당 행렬이 n×n이므로 determinant가 0이 아닌지로 판정할 수 있다.","core":0},{"s":"2차에서는 서로 독립인 두 열 또는 두 행이 있는지를 보면 된다.","core":0},{"s":"D는 직접 전달항이라 이 상태의 rank 판정 행렬에는 들어가지 않는다.","core":0}]},{"t":"p","ss":[{"s":"최소 실현은 가제어성과 가관측성을 모두 갖는 상태공간 표현이다.","core":0},{"s":"제어되지 않거나 관측되지 않는 모드는 입출력 전달함수에서 약분되어 숨을 수 있으므로, 전달함수가 안정이라고 내부 상태까지 항상 안정인 것은 아니다.","core":0}]},{"t":"fig","src":"figures/control/t-controllability-observability.svg","title":"가제어성과 가관측성의 기하적 구별","caption":"왼쪽 독립 방향이 상태공간을 펼치면 완전 가제어다. 오른쪽 출력 기록으로 모든 초기상태를 구별할 수 있으면 완전 가관측이다. 일반 판정은 행렬의 rank로 한다.","alt":"가제어성과 가관측성의 기하적 구별. 왼쪽 독립 방향이 상태공간을 펼치면 완전 가제어다. 오른쪽 출력 기록으로 모든 초기상태를 구별할 수 있으면 완전 가관측이다. 일반 판정은 행렬의 rank로 한다.","width":960.0,"height":500.0},{"t":"m","tex":"\\mathcal{C}=[B\\ AB\\ A^2B\\ \\cdots\\ A^{n-1}B],\\quad\\operatorname{rank}\\mathcal{C}=n","note":"완전 가제어의 필요충분조건."},{"t":"m","tex":"\\mathcal{O}=[C^{\\mathsf{T}}\\ (CA)^{\\mathsf{T}}\\ \\cdots\\ (CA^{n-1})^{\\mathsf{T}}]^{\\mathsf{T}},\\quad\\operatorname{rank}\\mathcal{O}=n","note":"완전 가관측의 필요충분조건."},{"t":"trap","items":["가제어성과 가관측성은 서로 다른 조건이다. 한쪽 rank가 n이라고 다른 쪽도 만족하지는 않는다.","다입력·다출력의 직사각형 행렬은 행렬식 하나로 판정하지 않는다. rank가 상태 차수 n인지 확인한다."]},{"t":"ex","q":"A=diag(-1,-2), B=[1,0]ᵀ, C=[1,1]의 가제어·가관측성을 판정하라.","steps":["가제어행렬 [[1,-1],[0,0]]의 rank는 1<2.","가관측행렬 [[1,1],[-1,-2]]의 determinant는 -1≠0."],"a":"완전 가제어가 아니지만 완전 가관측이다."},{"t":"ex","q":"같은 A에서 B=[1,1]ᵀ, C=[1,0]이면?","steps":["가제어행렬 [[1,-1],[1,-2]]의 determinant -1이므로 rank 2.","가관측행렬 [[1,0],[-1,0]]는 rank 1."],"a":"완전 가제어이지만 완전 가관측은 아니다."},{"t":"chk","q":"가제어행렬이 3×6인데 det를 구하라고 하면 어떻게 해야 하는가?","a":"직사각행렬에는 보통 determinant가 정의되지 않는다. rank가 상태차수 3인지 검사한다."}]},{"id":"T28","title":"Z변환·샘플링·차분식·초기값과 최종값","pr":"B","min":50,"day":2,"b":[{"t":"p","ss":[{"s":"샘플링 주기 Ts마다 f(kTs)를 취하면 이산 수열 x[k]가 된다.","core":1},{"s":"단측 Z변환은 X(z)=Σk≥0 x[k]z^(-k)다.","core":0},{"s":"라플라스 적분을 단순히 기호만 z로 바꾸는 것이 아니라 연속시간 적분에서 이산시간 합으로 바뀐다.","core":0},{"s":"단위임펄스 δ[k]는 k=0에서 1, 나머지에서 0이며 연속시간 δ(t)와 구별한다.","core":0}]},{"t":"p","ss":[{"s":"상수 수열의 변환은 등비급수로 1/(1-z^(-1))=z/(z-1)이 된다.","core":0},{"s":"a^k는 z/(z-a)이고, e^(-αkTs)에서는 a=e^(-αTs)다.","core":0},{"s":"연속 램프를 샘플링한 kTs의 변환에는 Ts가 붙는다.","core":0},{"s":"k와 kTs를 같은 것으로 읽으면 단위가 틀린다.","core":0}]},{"t":"p","ss":[{"s":"수열을 m칸 늦추고 앞을 0으로 채우면 z^(-m)을 곱한다.","core":0},{"s":"한 칸 앞으로 이동할 때는 Z{x[k+1]}=z[X-x[0]]로 초기값 항을 빼야 한다.","core":0},{"s":"따라서 차분방정식도 초기값을 포함한 대수식으로 바꾸어 풀 수 있다.","core":0},{"s":"수열의 컨볼루션은 Z영역의 곱으로 바뀐다.","core":0}]},{"t":"p","ss":[{"s":"연속시간 모드 s=σ+jω를 샘플링하면 z=e^(sTs)이므로 반지름은 e^(σTs), 각도는 ωTs다.","core":0},{"s":"좌반평면은 단위원 안, 허수축은 단위원 위, 우반평면은 밖으로 대응된다.","core":0},{"s":"각도는 2π 주기로 같아져 서로 다른 연속 주파수가 같은 이산 주파수로 보이는 aliasing이 생긴다.","core":0}]},{"t":"p","ss":[{"s":"대역이 fmax Hz 이하인 신호를 이상적으로 복원하려면 샘플링 주파수 fs>2fmax로 잡고 샘플링 전에 아날로그 저역통과 필터로 높은 주파수를 억제한다.","core":0},{"s":"등호에서는 위상에 따라 샘플이 모두 0이 되는 등 문제가 생겨 일반적인 충분조건으로 쓰지 않는다.","core":0},{"s":"실제 설계는 여유를 둔다.","core":0}]},{"t":"p","ss":[{"s":"초기값은 z→∞에서 X(z)를 취한다.","core":0},{"s":"최종값은 (1-z^(-1))X(z)의 모든 극점이 단위원 내부에 있는 등 수렴 조건을 확인한 뒤 z→1을 취한다.","core":0},{"s":"X 자체는 z=1에 단순극을 가질 수 있다.","core":0},{"s":"x[k]=(-1)^k처럼 진동하는 수열에 대입만 해서 최종값이 0이라고 말하면 안 된다.","core":0}]},{"t":"p","ss":[{"s":"영차홀드는 샘플 값을 다음 샘플 때까지 일정하게 유지한다.","core":0},{"s":"연속 모델에서 입력 u[k]가 구간 동안 일정하면 Ad=e^(ATs), Bd=∫0^Ts e^(Aτ)B dτ로 이산 상태식을 만든다.","core":0},{"s":"이는 상태천이행렬과 이산 제어의 연결이다.","core":0}]},{"t":"fig","src":"figures/control/t-sampling-hold.svg","title":"샘플링과 0차 홀드","caption":"회색 연속 신호에서 일정 간격으로 표본을 취한다. Nyquist 조건에는 대역제한과 앨리어싱 방지 필터가 전제된다.","alt":"샘플링과 0차 홀드. 회색 연속 신호에서 일정 간격으로 표본을 취한다. Nyquist 조건에는 대역제한과 앨리어싱 방지 필터가 전제된다.","width":960.0,"height":570.0},{"t":"fig","src":"figures/control/t-s-z-map.svg","title":"연속·이산 시스템의 안정 영역","caption":"실수부는 z의 반지름, 허수부는 각도로 변환된다. 허수축 전체가 단위원으로 반복해서 감기므로 서로 다른 주파수가 같은 z에 대응할 수 있다.","alt":"연속·이산 시스템의 안정 영역. 실수부는 z의 반지름, 허수부는 각도로 변환된다. 허수축 전체가 단위원으로 반복해서 감기므로 서로 다른 주파수가 같은 z에 대응할 수 있다.","width":960.0,"height":540.0},{"t":"m","tex":"X(z)=\\sum_{k=0}^{\\infty}x[k]z^{-k}","note":"합이 수렴하는 z의 영역에서 정의되는 단측 Z변환."},{"t":"m","tex":"\\mathcal{Z}\\{\\delta[k]\\}=1,\\quad\\mathcal{Z}\\{kx[k]\\}=-z\\frac{dX(z)}{dz}","note":"단위임펄스 수열과 인덱스 곱의 변환. 미분 가능한 수렴영역에서 성립."},{"t":"m","tex":"\\mathcal{Z}\\{u[k]\\}=\\frac{z}{z-1},\\quad\\mathcal{Z}\\{a^k\\}=\\frac{z}{z-a},\\quad\\mathcal{Z}\\{kT_s\\}=\\frac{T_sz}{(z-1)^2}","note":"인과수열. 각각 수렴영역 |z|>1, |z|>|a|, |z|>1."},{"t":"m","tex":"\\mathcal{Z}\\{x[k-m]u[k-m]\\}=z^{-m}X(z),\\quad\\mathcal{Z}\\{x[k+1]\\}=z(X-x[0])","note":"지연식은 음의 인덱스가 0인 인과수열, m≥0."},{"t":"m","tex":"x[0]=\\lim_{z\\to\\infty}X(z),\\quad x[\\infty]=\\lim_{z\\to1}(1-z^{-1})X(z)","note":"최종값은 수렴 조건을 먼저 확인. 원점의 유한 지연 인자는 문제가 되지 않는다."},{"t":"m","tex":"\\mathcal{Z}\\{\\sin(k\\theta)\\}=\\frac{z\\sin\\theta}{z^2-2z\\cos\\theta+1},\\quad\\mathcal{Z}\\{\\cos(k\\theta)\\}=\\frac{z(z-\\cos\\theta)}{z^2-2z\\cos\\theta+1}","note":"인과 사인·코사인 수열, |z|>1. θ는 샘플당 rad."},{"t":"m","tex":"A_d=e^{AT_s},\\quad B_d=\\int_0^{T_s}e^{A\\tau}B\\,d\\tau","note":"영차홀드 입력에 대한 정확한 선형 시불변 상태 이산화."},{"t":"trap","items":["Z변환의 지연 공식에는 단측·양측 변환 구분과 초기값이 중요하다. 앞으로 이동시키는 식에는 초기항이 생긴다.","최종값 정리는 극점 조건을 만족할 때만 쓴다. 단위원 위의 진동극이나 밖의 불안정극이 있으면 기계적으로 대입하지 않는다."]},{"t":"ex","q":"x[k+1]=0.5x[k]+1, x[0]=0의 수열과 최종값은?","steps":["zX=0.5X+z/(z-1).","X=z/[(z-1)(z-0.5)]=2z/(z-1)-2z/(z-0.5).","역변환하면 x[k]=2-2(0.5)^k."],"a":"x[k]=2(1-0.5^k), 최종값 2."},{"t":"ex","q":"Ts=0.1 s인 연속 모드 s=-2+j10의 z평면 반지름과 각도는?","steps":["|z|=e^(-0.2)≈0.8187.","argz=10×0.1=1 rad."],"a":"반지름 약 0.8187, 각도 1 rad. 단위원 내부의 안정 모드."},{"t":"chk","q":"X(z)=z/(z+1)에 최종값 정리를 적용해 0이라 해도 되는가?","a":"안 된다. 수열 (-1)^k가 계속 진동하며 (1-z^(-1))X에 z=-1 극점이 남는다."}]},{"id":"T29","title":"시퀀스 제어·a/b/c 접점·자기유지·인터록","pr":"B","min":45,"day":2,"b":[{"t":"p","ss":[{"s":"시퀀스 제어는 미리 정한 조건과 순서에 따라 각 동작을 진행한다.","core":1},{"s":"입력기구에는 누름버튼·선택스위치·리미트스위치·센서가 있고, 출력기구에는 전자접촉기·램프·부저·모터 구동부가 있으며, 보조기구에는 릴레이·타이머가 있다.","core":0},{"s":"순서제어가 항상 센서 없는 제어라는 뜻은 아니다.","core":0}]},{"t":"p","ss":[{"s":"a접점은 코일 무여자 또는 기준 평상상태에서 열리고 동작하면 닫히는 NO 접점이다.","core":0},{"s":"b접점은 평상시 닫히고 동작하면 열리는 NC 접점이다.","core":0},{"s":"c접점은 공통단자가 a/b 쪽을 전환하는 접점이다.","core":0},{"s":"입력이 0인가 1인가보다 평상상태와 작동상태를 먼저 정의한다.","core":0}]},{"t":"p","ss":[{"s":"복귀형 스위치는 누르는 동안만 상태가 변하고 놓으면 돌아온다.","core":0},{"s":"유지형은 선택한 상태를 사용자가 다시 바꾸기 전까지 유지한다.","core":0},{"s":"릴레이의 코일이 여자되면 같은 기호로 표시한 모든 a/b 접점이 그에 맞춰 동작한다.","core":0},{"s":"코일과 접점은 기계적으로 연동되어도 전기적으로 같은 선은 아니다.","core":0}]},{"t":"p","ss":[{"s":"유접점 AND는 a접점 A와 B를 직렬, OR는 병렬, NOT는 해당 입력의 b접점으로 구현한다.","core":0},{"s":"NAND는 A·B 조건을 만든 릴레이의 b접점, NOR는 A+B 조건을 만든 릴레이의 b접점으로 얻는다.","core":0},{"s":"XOR는 A의 a접점과 B의 b접점을 직렬로 묶은 가지, A의 b접점과 B의 a접점을 묶은 가지를 병렬로 놓는다.","core":0},{"s":"진리표·불대수·드모르간·기본 논리기호는 D04~D06에 통합했다.","core":0}]},{"t":"p","ss":[{"s":"자기유지는 정지 b접점 STOP을 전원과 코일 K 사이에 직렬로 두고, 그 뒤에 기동 a접점 START와 K의 보조 a접점을 병렬로 둔다.","core":0},{"s":"START를 눌러 K가 여자되면 보조접점이 닫혀 START에서 손을 떼도 코일 전원이 유지된다.","core":0},{"s":"STOP을 누르면 직렬 경로가 끊어져 K가 떨어지고 보조접점도 열린다.","core":0},{"s":"정전 뒤 자동 재기동을 막는 동작도 이 구조에서 설명된다.","core":0}]},{"t":"p","ss":[{"s":"정·역회전 인터록은 정회전 코일 F 경로에 역회전 코일 R의 b접점을 직렬로, R 경로에는 F의 b접점을 직렬로 둔다.","core":0},{"s":"한쪽이 켜지면 다른 쪽의 경로를 끊는다.","core":0},{"s":"두 명령이 동시에 들어오는 조건까지 막으려면 명령 접점의 상호차단이나 우선순위 논리, 실제 접촉기의 기계적 인터록을 함께 적용한다.","core":0},{"s":"단순 논리식만으로 실제 안전회로가 완성되는 것은 아니다.","core":0}]},{"t":"p","ss":[{"s":"무접점 논리는 반도체로 접점 기능을 구현한다.","core":0},{"s":"양논리 다이오드 AND는 출력에 풀업저항을 두고 출력 쪽에 공통 애노드, 입력 쪽에 캐소드가 연결되어 입력 하나가 LOW이면 출력을 끌어내린다.","core":0},{"s":"OR는 입력 쪽 애노드에서 출력의 공통 캐소드로 모으고 풀다운저항을 두어 입력 하나가 HIGH이면 출력이 높아진다.","core":0},{"s":"실제 다이오드 전압강하와 논리레벨 여유를 고려한다.","core":0}]},{"t":"p","ss":[{"s":"트랜지스터 NOT는 이미터 공통단의 컬렉터에 풀업저항을 둔다.","core":0},{"s":"입력이 HIGH라 트랜지스터가 켜지면 출력은 LOW, 입력이 LOW라 꺼지면 출력은 HIGH다.","core":0},{"s":"다이오드 논리의 뒤에 반전기를 붙이면 NAND·NOR를 구성할 수 있다.","core":0},{"s":"무접점은 기계접점의 마모·바운스가 없지만 누설전류·전압강하·전원 요구 등 특성은 따로 확인한다.","core":0}]},{"t":"fig","src":"figures/control/t-contacts.svg","title":"접점 종류와 유접점 논리","caption":"c접점은 공통 단자가 평상시 b쪽에 연결되고 동작하면 a쪽으로 전환된다. 아래 회로는 논리 경로를 보여주는 개념 결선이다.","alt":"접점 종류와 유접점 논리. c접점은 공통 단자가 평상시 b쪽에 연결되고 동작하면 a쪽으로 전환된다. 아래 회로는 논리 경로를 보여주는 개념 결선이다.","width":960.0,"height":600.0},{"t":"fig","src":"figures/control/t-latch-interlock.svg","title":"자기유지와 상호 인터록","caption":"위 회로는 START를 놓아도 K의 a접점이 유지한다. 아래는 전기적 인터록 부분이며 실제 모터 정역 운전은 기계적 인터록과 보호장치도 갖춰야 한다.","alt":"자기유지와 상호 인터록. 위 회로는 START를 놓아도 K의 a접점이 유지한다. 아래는 전기적 인터록 부분이며 실제 모터 정역 운전은 기계적 인터록과 보호장치도 갖춰야 한다.","width":960.0,"height":640.0},{"t":"fig","src":"figures/control/t-logic-timing.svg","title":"여섯 논리함수의 타  누르면 해제된다."},{"t":"ex","q":"A는 동작, B는 비동작일 때만 출력이 켜지는 접점 연결은?","steps":["A 동작에는 A의 a접점, B 비동작에는 B의 b접점을 쓴다.","두 조건이 동시에 필요하므로 직렬로 연결한다."],"a":"A a접점과 B b접점의 직렬, X=A·B̅."},{"t":"chk","q":"c접점과 자기유지용 a접점의 차이는?","a":"c접점은 공통단자가 두 경로 사이를 전환하는 접점 형식이다. 자기유지용 a접점은 코일 여자 때 닫혀 기동버튼을 우회하는 회로 역할이다."}]}]},{"num":"03","title":"전자기학","acc":"#0D9488","day":3,"secs":[{"id":"E01","title":"네 가지 장과 단위: E·D·H·B부터 분리하기","pr":"A","min":15,"day":3,"b":[{"t":"p","ss":[{"s":"전계 E는 그 지점에 양의 시험전하 1 C를 놓았을 때 받는 힘을 나타낸다.","core":1},{"s":"그래서 단위는 N/C이고, 전위차를 길이로 나눈 V/m와 같다.","core":0},{"s":"전속밀도 D는 면을 통과하는 전기적 흐름을 전하량 기준으로 나타내는 양이며 단위는 C/m²이다.","core":0},{"s":"E와 D는 같은 기호의 다른 표현이 아니다.","core":0},{"s":"매질이 선형·등방성일 때 D=εE로 연결된다.","core":0}]},{"t":"p","ss":[{"s":"자계 H의 단위는 A/m이고, 자속밀도 B의 단위는 T 또는 Wb/m²이다.","core":0},{"s":"B=μH라는 식에서 μ는 투자율이다.","core":0},{"s":"원형 코일 문제에서 H를 요구하면 NI/(2r)를 쓰고, B를 요구하면 여기에 μ를 곱한다.","core":0},{"s":"단위가 A/m인지 T인지 확인하는 습관만으로도 두 식을 혼동하는 실수를 크게 줄일 수 있다.","core":0}]},{"t":"p","ss":[{"s":"ε=εrε0, μ=μrμ0에서 εr와 μr는 비유전율과 비투자율로 단위가 없다.","core":0},{"s":"진공 유전율 ε0는 약 8.85×10⁻¹² F/m, 진공 투자율 μ0는 기사 수준 계산에서 약 4π×10⁻⁷ H/m로 사용한다.","core":0},{"s":"공기 문제에서 별도 조건이 없다면 진공값으로 근사하는 경우가 많다.","core":0},{"s":"유전율의 단위를 정전용량 단위인 F만으로 쓰면 안 된다.","core":0}]},{"t":"p","ss":[{"s":"전계·자계·힘은 크기와 방향이 함께 있는 벡터다.","core":0},{"s":"내적은 두 벡터의 나란한 성분을 곱해 스칼라를 만들고 cosθ가 붙는다.","core":0},{"s":"외적은 두 벡터에 수직인 새 벡터를 만들고 크기에 sinθ가 붙는다.","core":0},{"s":"자속은 B와 면의 법선 사이 내적, 로렌츠 자기력과 포인팅 벡터는 외적이다.","core":0},{"s":"외적 순서를 바꾸면 부호가 반대가 된다.","core":0}]},{"t":"fig","src":"figures/electromag/e-coordinates.svg","title":"직교·원통·구좌표","caption":"직교성분과 두 종류의 반지름, 극각과 방위각의 기준을 비교한다.","alt":"직교성분과 두 종류의 반지름, 극각과 방위각의 기준을 비교한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\mathbf{D}=\\varepsilon\\mathbf{E},\\qquad \\mathbf{B}=\\mu\\mathbf{H}","note":"선형·등방성 매질. ε: 유전율 F/m, μ: 투자율 H/m. E: V/m, D: C/m², H: A/m, B: T."},{"t":"m","tex":"\\mathbf{A}\\cdot\\mathbf{B}=AB\\cos\\theta,\\qquad |\\mathbf{A}\\times\\mathbf{B}|=AB\\sin\\theta","note":"θ는 두 벡터 사이 각. 내적은 스칼라, 외적은 벡터다. 같은 방향이면 외적은 0, 서로 수직이면 내적은 0."},{"t":"tb","h":["물리량","기호","단위","연결"],"r":[["전계","E","V/m = N/C","전하에 작용하는 힘"],["전속밀도","D","C/m²","D=εE"],["자계","H","A/m","전류·기자력과 연결"],["자속밀도","B","T = Wb/m²","B=μH"]]},{"t":"trap","items":["문제에서 H를 주었는데 qvH를 바로 자기력으로 쓰지 않는다. 자기력 식은 B를 사용한다.","εr=4라는 말은 ε=4 F/m라는 뜻이 아니다. ε=4ε0이다.","도체의 도전율 σ는 S/m이며, 표면전하밀도와 기호가 겹칠 수 있다. 이 권에서는 표면전하밀도를 ρs로 표시한다."]},{"t":"ex","q":"선형 매질의 투자율이 2μ0이고 H=100 A/m이다. 같은 H에서 진공의 B에 비해 이 매질의 B는 몇 배인가?","steps":["B=μH에서 H가 같으므로 B는 μ에 비례한다.","투자율 비가 2이므로 B의 비도 2다."],"a":"2배. H 자체가 2배가 되는 것은 아니다."},{"t":"chk","q":"자속밀도의 단위와 자계의 단위를 각각 쓰고, 둘을 연결하는 물성을 적어라.","a":"자속밀도 B는 T 또는 Wb/m², 자계 H는 A/m이다. 선형·등방성 매질에서 B=μH이며 μ는 투자율 H/m이다."}]},{"id":"E02","title":"쿨롱 법칙과 점전하 전계: 거리의 제곱을 기억하기","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"쿨롱 법칙은 정지한 두 점전하 사이의 힘을 설명한다.","core":1},{"s":"같은 부호끼리는 밀어내고 다른 부호끼리는 끌어당긴다.","core":0},{"s":"두 전하의 크기가 커질수록 힘이 커지며 거리가 2배가 되면 힘은 1/4이 된다.","core":0},{"s":"전하가 놓인 균일한 매질의 유전율이 커지면 같은 전하·거리에서 힘은 작아진다.","core":0}]},{"t":"p","ss":[{"s":"점전하 Q가 만드는 전계는 시험전하 q가 받는 힘을 q로 나눈 것이다.","core":0},{"s":"따라서 전계 식에는 원인 전하 Q 하나만 남는다.","core":0},{"s":"Q가 양수면 Q에서 바깥쪽, 음수면 Q를 향한 안쪽이다.","core":0},{"s":"시험전하가 음수일 때 받는 힘은 전계 방향과 반대다.","core":0},{"s":"장을 만드는 전하의 부호와 그 장 안에서 움직이는 전하의 부호를 분리해 읽는다.","core":0}]},{"t":"p","ss":[{"s":"여러 점전하가 있으면 각 전계의 벡터합으로 전체 전계를 구한다.","core":0},{"s":"같은 크기의 양전하 두 개의 정확한 중점에서는 서로 반대 방향의 전계가 상쇄된다.","core":0},{"s":"크기가 같은 양전하와 음전하의 중점에서는 전계가 같은 방향이므로 더해진다.","core":0},{"s":"전계가 0인 곳과 전위가 0인 곳은 다르므로 중점이라는 말만으로 두 양을 함께 0으로 두면 안 된다.","core":0}]},{"t":"p","ss":[{"s":"처음에는 큰 지수 계산보다 배수 문제를 먼저 푼다.","core":0},{"s":"원인 전하를 3배로 하고 거리를 2배로 하면 전계는 3/4배다.","core":0},{"s":"비유전율을 2배로 하면 전계는 1/2배다.","core":0},{"s":"수치를 넣어야 할 때에는 cm를 m로, μC를 C로 바꾼 뒤 제곱한다.","core":0},{"s":"10 cm를 0.1 m로 바꾸는 것과 그 제곱을 0.01 m²로 바꾸는 과정은 별개다.","core":0}]},{"t":"fig","src":"figures/electromag/e-point-charge.svg","title":"점전하에서 힘과 전계 구별","caption":"같은 부호의 반발력과 양전하의 방사형 전계, 거리 의존성을 나타낸다.","alt":"같은 부호의 반발력과 양전하의 방사형 전계, 거리 의존성을 나타낸다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-electric-field-lines.svg","title":"양·음전하의 전기력선","caption":"부호에 따른 출발·도착과 대칭적인 전기력선의 방향을 개념도로 보여 준다.","alt":"부호에 따른 출발·도착과 대칭적인 전기력선의 방향을 개념도로 보여 준다.","width":960.0,"height":620.0},{"t":"m","tex":"F=\\frac{|Qq|}{4\\pi\\varepsilon r^2},\\qquad E=\\frac{|Q|}{4\\pi\\varepsilon r^2}","note":"힘의 크기 F: N, 전계 크기 E: V/m, Q·q: C, 거리 r: m. 균일하고 등방성인 매질의 점전하 모델이다."},{"t":"m","tex":"\\mathbf{F}=q\\mathbf{E},\\qquad \\frac{1}{4\\pi\\varepsilon_0}\\simeq9\\times10^9","note":"벡터식의 q에는 부호를 포함한다. 진공의 쿨롱 상수 단위는 N·m²/C²이다."},{"t":"trap","items":["전계 E의 분자에는 Q 하나, 두 전하 사이 힘 F의 분자에는 Qq가 들어간다.","거리 2배는 E가 1/2배가 아니라 1/4배다. 전위의 거리 법칙과 섞지 않는다.","절댓값 공식은 힘의 크기만 준다. 방향은 전하 부호나 벡터 방향으로 따로 정한다."]},{"t":"ex","q":"진공에서 +2 nC 점전하로부터 3 m 떨어진 지점의 전계 크기와 방향은? 쿨롱 상수는 9×10⁹로 한다.","steps":["2 nC=2×10⁻⁹ C, 거리 제곱은 9 m²이다.","E=(9×10⁹)(2×10⁻⁹)/9=2 V/m이다.","원인 전하가 양수이므로 바깥 방향이다."],"a":"2 V/m, 점전하에서 멀어지는 방향."},{"t":"chk","q":"같은 점전하에서 거리를 3배로 하면 전계 크기는 몇 배인가?","a":"1/9배다. 점전하의 전계는 거리의 제곱에 반비례한다."}]},{"id":"E03","title":"전위와 정전계: 전계 0과 전위 0은 다르다","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"전위 V는 단위 양전하가 가지는 위치에너지다.","core":1},{"s":"높이에 비유하면 전위는 높이 자체이고 전계는 높이가 가장 가파르게 낮아지는 방향에 해당한다.","core":0},{"s":"특정 지점을 0 V로 정하는 기준은 선택할 수 있으므로 전위 0이라는 사실만으로 전계 0을 결론 내릴 수 없다.","core":0},{"s":"반대로 공간에서 전위가 일정하면 그곳의 기울기가 0이므로 전계가 0이다.","core":0}]},{"t":"p","ss":[{"s":"점전하의 전위는 거리 r에 반비례한다.","core":0},{"s":"전계가 거리의 제곱에 반비례하는 것과 구별한다.","core":0},{"s":"전위는 스칼라이므로 여러 전하의 전위를 부호와 함께 그냥 더한다.","core":0},{"s":"크기가 같은 +Q와 -Q의 중점은 전위가 0이지만, 전계는 +Q에서 -Q로 향하며 0이 아니다.","core":0},{"s":"같은 부호의 같은 전하 두 개의 중점은 반대로 전계가 0이어도 전위가 일반적으로 0이 아니다.","core":0}]},{"t":"p","ss":[{"s":"정전계는 시간에 따라 변하는 자기장으로 유도된 전계가 없는 정적인 전기장이다.","core":0},{"s":"한 바퀴 돌아 원래 위치로 오면 전계가 한 일은 0이며, 두 지점 사이 전위차는 이동 경로와 무관하다.","core":0},{"s":"수식으로는 폐곡선 적분이 0, 회전 curl E가 0이라고 표현한다.","core":0},{"s":"정전계의 힘선은 서로 교차하지 않고, 양전하에서 시작해 음전하에서 끝나거나 무한대로 이어진다.","cor ,{"s":"좁은 단면의 환상 철심을 간단히 계산할 때 평균 반지름 또는 평균 자로 길이를 사용한다.","core":0},{"s":"원형 한 바퀴 코일 중심의 NI/(2r)와 다르다.","core":0},{"s":"두 모양 모두 둥글다고 해서 분모의 π를 마음대로 붙이거나 없애지 않는다.","core":0}]},{"t":"fig","src":"figures/circuit/c-magnetic-directions.svg","title":"자기·운동·유도 방향","caption":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","alt":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","width":960.0,"height":600.0},{"t":"fig","src":"figures/electromag/e-wire-field.svg","title":"직선 전류의 자계 방향과 분포","caption":"종이 밖 전류의 반시계 자계와 균일 전류 원통의 안팎 분포를 결합한다.","alt":"종이 밖 전류의 반시계 자계와 균일 전류 원통의 안팎 분포를 결합한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-solenoid-toroid.svg","title":"직선·환상 솔레노이드","caption":"권수 N, 자로 길이 ℓ, 토로이드 반지름 r의 의미를 표시한다.","alt":"권수 N, 자로 길이 ℓ, 토로이드 반지름 r의 의미를 표시한다.","width":960.0,"height":620.0},{"t":"m","tex":"\\oint\\mathbf{H}\\cdot d\\mathbf{l}=I_{\\mathrm{enc}}","note":"정자계의 앙페르 법칙. H: A/m, dl: m, 오른쪽 순포함 전류: A. N회 관통하는 코일이면 NI."},{"t":"m","tex":"H_{\\mathrm{wire}}=\\frac{I}{2\\pi r},\\quad H_{\\mathrm{solenoid}}\\simeq\\frac{NI}{\\ell},\\quad H_{\\mathrm{toroid}}=\\frac{NI}{2\\pi r}","note":"직선도선은 도체 외부, 솔레노이드는 충분히 긴 코일 내부, 환상은 이상적인 코일 내부이다. 모든 길이는 m."},{"t":"trap","items":["긴 솔레노이드 식의 ℓ에 감은 전선 총길이를 넣지 않는다.","시간변화 전기장이 중요한 문제에서는 앙페르-맥스웰식의 변위전류 항을 포함한다.","원형 코일 중심의 분모 2r와 환상 코일 내부의 2πr는 다른 식이다."]},{"t":"ex","q":"길이 0.5 m에 200회 감은 충분히 긴 솔레노이드에 2 A가 흐른다. 내부 H는?","steps":["내부 H=NI/ℓ를 쓴다.","200×2/0.5=800 A/m이다."],"a":"800 A/m. B를 구하라고 하면 매질의 μ를 추가로 곱한다."},{"t":"chk","q":"무한 직선도선의 전류를 2배로 하고 관측 거리도 2배로 하면 H는?","a":"변하지 않는다. H=I/(2πr)에서 전류와 거리의 변화가 상쇄된다."}]},{"id":"E10","title":"원형 코일 중심 자계와 권수비: 무엇을 고정했나","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"비오-사바르 법칙은 작은 전류 조각이 만드는 자계를 더하는 방법이다.","core":1},{"s":"원형 코일 중심에서는 모든 전류 조각이 만드는 자계가 같은 축방향으로 향한다.","core":0},{"s":"한 바퀴 둘레 2πr를 따라 적분하면 분모의 4πr²와 정리되어 H=I/(2r)가 된다.","core":0},{"s":"원형 코일 중심 공식에 π가 없다는 점을 따로 암기할 가치가 있다.","core":0}]},{"t":"p","ss":[{"s":"같은 반지름 r인 코일을 N회 감고 각 회에 같은 전류 I가 흐르면 중심 자계는 N배가 된다.","core":0},{"s":"그래서 H=NI/(2r), B=μNI/(2r)이다.","core":0},{"s":"얇게 모인 원형 권선으로 각 회의 반지름과 중심이 같다고 보는 근사다.","core":0},{"s":"코일 중심에서 떨어진 축상점은 E34의 식을 적용하고, 두꺼운 권선 전체의 장은 각 회의 위치와 반지름에 따른 기여를 합한다.","core":0}]},{"t":"p","ss":[{"s":"권수비 문제는 고정한 조건을 확인해야 한다.","core":0},{"s":"반지름과 전류가 그대로이면 권수 2배에 H도 2배다.","core":0},{"s":"그러나 같은 길이의 전선을 풀어 더 많이 감는다면 한 바퀴 둘레가 줄어 반지름도 줄어든다.","core":0},{"s":"얇은 원형 권선·리드선 무시 조건에서 전선 길이 Lwire=2πrN이므로 r는 N에 반비례하고, 전류를 일정하게 유지하면 H는 N²에 비례한다.","core":0}]},{"t":"p","ss":[{"s":"같은 전선을 다시 감는 문제에서 ‘전압 일정’이 주어지면 저항 변화 여부도 확인해야 한다.","core":0},{"s":"같은 재료·단면·총길이를 유지하면 저항이 같아 전류도 같은 것으로 볼 수 있다.","core":0},{"s":"하지만 전선 길이가 늘어나거나 전원 내부저항·교류 리액턴스가 중요하면 권수만으로 결론 내릴 수 없다.","core":0},{"s":"5일 학습에서는 문제의 일정 조건을 공식 옆에 꼭 적는다.","core":0}]},{"t":"p","ss":[{"s":"두 코일 자계가 같은 방향인지 반대 방향인지도 중요하다.","core":0},{"s":"같은 축에 놓인 두 코일의 중심이 같고 방향이 같으면 크기를 더하고, 반대면 뺀다.","core":0},{"s":"힘처럼 자계도 벡터이므로 권수의 숫자만 더하지 않는다.","core":0},{"s":"관측하는 면에서 전류가 반시계 방향이면 중심 자계는 관측자 쪽, 시계 방향이면 종이 안쪽이다.","core":0}]},{"t":"fig","src":"figures/electromag/e-loop-arc-field.svg","title":"원형 고리 축상과 원호 중심","caption":"고리 반지름 a, 축상 거리 z, 원호 각 α와 자계 방향을 표시한다.","alt":"고리 반지름 a, 축상 거리 z, 원호 각 α와 자계 방향을 표시한다.","width":960.0,"height":620.0},{"t":"m","tex":"d\\mathbf{H}=\\frac{I\\,d\\mathbf{l}\\times\\hat{\\mathbf{r}}}{4\\pi r^2},\\qquad H_{\\mathrm{center}}=\\frac{NI}{2r}","note":"첫 식은 비오-사바르 법칙. 오른쪽 r는 원형 코일 반지름 m, N은 권수, I는 A, H는 A/m이다."},{"t":"m","tex":"B_{\\mathrm{center}}=\\frac{\\mu NI}{2r},\\qquad \\frac{H_2}{H_1}=\\frac{N_2I_2r_1}{N_1I_1r_2}","note":"동일 중심의 얇은 원형 권선. B의 비를 비교할 때 매질이 바뀌면 μ 비도 포함한다."},{"t":"m","tex":"L_{\\mathrm{wire}}=2\\pi rN,\\qquad H=\\frac{\\pi I N^2}{L_{\\mathrm{wire}}}","note":"리드선 길이와 권선 두께를 무시한 같은 길이 전선 모델. H∝N²는 총길이와 전류가 일정할 때만 성립한다."},{"t":"trap","items":["원형 코일 중심 H=NI/(2r)에는 π가 없다.","같은 반지름의 권수 2배와 같은 전선 길이로 재권선한 권수 2배는 다른 문제다.","중심 자계와 솔레노이드 내부 자계를 같은 공식으로 처리하지 않는다."]},{"t":"ex","q":"같은 전선을 1회 원형으로 감았을 때와 3회 원형으로 감았을 때를 비교한다. 전류는 같고 리드선·권선 두께는 무시한다. 중심 H의 비는?","steps":["총길이가 같으므로 3회 코일의 반지름은 1회 코일의 1/3이다.","H∝N/r이므로 3÷(1/3)=9다."],"a":"3회 코일의 H가 9배다."},{"t":"chk","q":"반지름을 고정한 원형 코일의 권수만 4배, 전류는 그대로이면 중심 B는 몇 배인가? 같은 매질이다.","a":"4배다. 이 문제는 반지름 고정이므로 N² 비례를 적용하지 않는다."}]},{"id":"E11","title":"로렌츠 힘: 전기력은 qE, 자기력은 qv×B","pr":"A","min":25,"day":3,"b":[{"t":"p","ss":[{"s":"로렌츠 힘은 전하가 전기장과 자기장으로부터 받는 힘을 합친 것이다.","core":1},{"s":"전기력 qE는 전하가 멈춰 있어도 생길 수 있다.","core":0},{"s":"자기력 q(v×B)는 전하가 움직이고 속도에 자기장과 수직인 성분이 있을 때 생긴다.","core":0},{"s":"정지 전하가 자기장만 있는 곳에 놓이면 자기력은 0이다.","core":0},{"s":"자기장이 크다는 이유만으로 힘이 반드시 큰 것은 아니다.","core":0}]},{"t":"p","ss":[{"s":"자기력 크기는 |q|vB sinθ이며 θ는 속도 v와 B 사이 각이다.","core":0},{"s":"평행 또는 반평행이면 0, 수직이면 최대다.","core":0},{"s":"방향은 양전하에 대해 v에서 B로 오른손을 돌려 정하고, 음전하이면 그 반대다.","core":0},{"s":"전자는 q가 음수이므로 부호를 마지막에 한 번 더 확인한다.","core":0},{"s":"E와 B가 함께 주어지면 각각 힘을 구한 뒤 벡터합을 한다.","core":0}]},{"t":"p","ss":[{"s":"자기력은 순간 속도에 수직이어서 자기력만으로 입자의 운동에너지를 바꾸지 않는다.","core":0},{"s":"균일한 B에 속도가 수직인 비상대론적 입자는 속력은 유지하면서 방향만 계속 바뀌어 원운동한다.","core":0},{"s":"속도에 B와 평행한 성분도 있으면 그 성분은 유지되고 수직 성분은 회전하므로 나선운동이 된다.","core":0},{"s":"전기력은 속도와 나란한 성분이 있으면 일을 하여 속력을 바꿀 수 있다.","core":0}]},{"t":"p","ss":[{"s":"전류가 흐르는 직선도선도 움직이는 전하를 포함하므로 자기장에서 힘을 받는다.","core":0},{"s":"균일한 자계 속 도선의 힘은 Iℓ×B로 나타낸다.","core":0},{"s":"각도는 관습적 전류 방향과 B 사이 각이다.","core":0},{"s":"도선이 B와 수직이면 F=BIℓ, 평행이면 0이다.","core":0},{"s":"전동기는 이 힘을 회전력으로 이용하며, 자세한 토크·운전특성은 전기기기 권으로 연결한다.","core":0}]},{"t":"p","ss":[{"s":"자기장 문제에서 H가 주어졌으면 먼저 B=μH로 바꾼다.","core":0},{"s":"qvH는 단위부터 힘 N이 되지 않는다.","core":0},{"s":"원운동 반지름을 구할 때는 전하의 절댓값을 사용하므로 전자가 음전하라고 반지름이 음수가 되지 않는다.","core":0},{"s":"전하 부호는 회전 방향을 결정하고, 반지름의 크기는 |q|로 계산한다.","core":0}]},{"t":"fig","src":"figures/circuit/c-magnetic-directions.svg","title":"자기·운동·유도 방향","caption":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","alt":"⊙는 화면 밖, ×는 화면 안이다. 양전하 운동 v와 자기장 B의 외적이 힘이며 유도전류는 원래 자속 자체가 아니라 자속의 변화를 방해한다. 모터와 발전기 방향판정의 공통 좌표 도식.","width":960.0,"height":600.0},{"t":"fig","src":"figures/circuit/c-generator-motor.svg","title":"발전기·전동기 방향 비교","caption":"두 그림의 자기장은 모두 화면 안쪽이다. 도체가 오른쪽으로 움직이면 양전하가 위로 밀려 위쪽이 +극성이 되고, 위로 흐르는 도체 전류는 왼쪽 힘을 받는다.","alt":"두 그림의 자기장은 모두 화면 안쪽이다. 도체가 오른쪽으로 움직이면 양전하가 위로 밀려 위쪽이 +극성이 되고, 위로 흐르는 도체 전류는 왼쪽 힘을 받는다.","width":960.0,"height":560.0},{"t":"fig","src":"figures/electromag/e-lorentz-parallel.svg","title":"로렌츠 힘과 평행 전류의 힘","caption":"외적의 부호와 두 도선 사이 힘을 구별한다.","alt":"외적의 부호와 두 도선 사이 힘을 구별한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-charge-motion-zero.svg","title":"전자 가속과 전계 영점","caption":"전자가 전계 반대로 가속되는 이유와 두 전하 전계의 상쇄 위치를 그린다.","alt":"전자가 전계 반대로 가속되는 이유와 두 전하 전계의 상쇄 위치를 그린다.","width":960.0,"height":620.0},{"t":"m","tex":"\\mathbf{F}=q\\left(\\mathbf{E}+\\mathbf{v}\\times\\mathbf{B}\\right),\\qquad F_m=|q|vB\\sin\\theta","note":"F: N, q: C, v: m/s, B: T, E: V/m. θ는 v와 B 사이 각이다."},{"t":"m","tex":"\\mathbf{F}=I\\mathbf{\\ell}\\times\\mathbf{B},\\qquad r=\\frac{mv}{|q|B}","note":"도선식의 ℓ은 전류 방향의 길이벡터 m. 원운동 반지름 r는 균일 B, E=0, v⊥B, 비상대론 조건이다."},{"t":"trap","items":["전자 힘의 방향은 양전하 오른손 결과의 반대다.","자기력은 속력 자체를 증가시키지 않는다. 전기장이 함께 있으면 전체 힘은 다르게 작용할 수 있다.","H를 주었다고 자기력 식에 H를 그대로 넣지 않는다."]},{"t":"ex","q":"+2 μC 전하가 3 m/s로 균일한 B=0.5 T에 수직으로 움직인다. 전기장은 없다. 자기력 크기는?","steps":["수직이므로 sinθ=1이다.","F=2×10⁻⁶×3×0.5=3×10⁻⁶ N이다."],"a":"3 μN. 전하가 -2 μC라면 크기는 같고 방향만 반대다."},{"t":"chk","q":"균일한 자기장과 정확히 평행하게 움직이는 전하의 자기력은?","a":"0이다. v×B=0이며, 속력이 크더라도 평행 성분만으로 자기력은 생기지 않는다."}]},{"id":"E12","title":"자기회로와 공극: 기자력·자기저항·자속","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"전기회로에서 전압이 전류를 흐르게 하고 저항이 흐름을 제한하듯, 자기회로에서는 기자력 NI가 자속을 만들고 자기저항이 자속의 크기를 제한한다.","core":1},{"s":"기자력은 전류와 권수의 곱이다.","core":0},{"s":"이름에 ‘력’이 들어가지만 물리적 힘 N이 아니며 단위를 A·turn 또는 관례상 AT로 쓴다.","core":0},{"s":"자속 Φ는 Wb이고 자기저항은 A·turn/Wb다.","core":0}]},{"t":"p","ss":[{"s":"균일한 자로의 자기저항은 길이에 비례하고 투자율과 단면적에 반비례한다.","core":0},{"s":"자로가 길수록 같은 자속을 만들기 어렵고, 단면적이 넓거나 0,"height":560.0},{"t":"fig","src":"figures/electromag/e-faraday-moving-rod.svg","title":"렌츠 법칙과 이동 막대의 극성","caption":"자속 변화에 저항하는 유도장과 운동하는 도체의 전하 분리를 구별한다.","alt":"자속 변화에 저항하는 유도장과 운동하는 도체의 전하 분리를 구별한다.","width":960.0,"height":620.0},{"t":"fig","src":"figures/electromag/e-flux-angle.svg","title":"면의 법선과 자속의 각도","caption":"면 자체의 각도와 법선 각도의 혼동을 막는 보충 그림이다.","alt":"면 자체의 각도와 법선 각도의 혼동을 막는 보충 그림이다.","width":960.0,"height":620.0},{"t":"m","tex":"e=-N\\frac{d\\Phi}{dt},\\qquad |e_{\\mathrm{avg}}|=N\\frac{|\\Delta\\Phi|}{\\Delta t}","note":"e: V, Φ: 한 회를 지나는 자속 Wb, N: 권수, t: s. 모든 회가 같은 Φ를 쇄교하고 N이 일정한 모델이다."},{"t":"m","tex":"\\nabla\\times\\mathbf{E}=-\\frac{\\partial\\mathbf{B}}{\\partial t},\\qquad e_{\\mathrm{motion}}=\\int(\\mathbf{v}\\times\\mathbf{B})\\cdot d\\mathbf{l}","note":"앞 식은 패러데이 법칙의 국소 형태. 뒤 식은 도체 운동에 따른 기전력 기여다."},{"t":"m","tex":"|e|=B\\ell v","note":"B·v·도선 방향이 서로 수직인 기본 운동기전력 배치. B: T, ℓ: m, v: m/s, e: V."},{"t":"trap","items":["렌츠 법칙은 원래 자속이 아니라 자속의 변화를 방해한다.","NΦ와 Φ를 혼동하여 권수를 두 번 곱하지 않는다.","자속 단위 mWb를 Wb로 바꾸지 않으면 기전력이 1000배 틀어진다."]},{"t":"ex","q":"100회 코일에서 각 회의 자속이 0.02 s 동안 3 mWb에서 1 mWb로 일정하게 줄었다. 유도기전력 크기는?","steps":["자속 변화량의 크기는 2 mWb=0.002 Wb다.","|e|=100×0.002/0.02=10 V다."],"a":"10 V. 유도전류의 자속은 감소하던 원래 자속을 유지하는 방향이다."},{"t":"chk","q":"정지 코일의 자속이 일정한 큰 값이면 유도기전력도 반드시 큰가?","a":"아니다. dΦ/dt=0이면 유도기전력은 0이다. 자속의 값보다 시간 변화율이 중요하다."}]},{"id":"E14","title":"맥스웰 방정식 네 줄: 회전 둘·발산 둘","pr":"A","min":20,"day":3,"b":[{"t":"p","ss":[{"s":"맥스웰 방정식은 지금까지 공부한 전하·전류·유도를 네 줄로 묶는다.","core":1},{"s":"회전 형태 두 개는 장이 주변을 도는 성질과 시간변화를 연결하고, 발산 형태 두 개는 장의 원천을 설명한다.","core":0},{"s":"식만 네 줄 통째로 외우기 전에 E의 회전은 B의 시간변화, H의 회전은 전도전류와 D의 시간변화라는 짝을 만든다.","core":0}]},{"t":"p","ss":[{"s":"패러데이 식에는 음수가 붙는다.","core":0},{"s":"이것이 렌츠 방향과 연결된다.","core":0},{"s":"앙페르-맥스웰식에는 전도전류 J와 변위전류 ∂D/∂t가 더해진다.","core":0},{"s":"J를 단순한 회로 전류 I로 바꾸면 단위가 맞지 않는다.","core":0},{"s":"미분형 오른쪽은 전류밀도 A/m²이고, 적분형에서 면적을 적분해야 전류 A가 된다.","core":0}]},{"t":"p","ss":[{"s":"전기 가우스식은 div D=ρv이고, 자기 가우스식은 div B=0이다.","cor
